var MATERIALS = {"M01-K01":{"title":"开工前的四项设置","anchor":"是先把设置固定下来，不是边拍边试","source":"参考：自编讲义（坐标：《美国摄影教程》人像与纪实章节） · 人像上手（按目录对应）","sections":[{"h":"为什么是这样","p":"四项必设：光圈优先或手动、光圈 f2 到 f2.8、对焦改单点加人眼识别、记录改 RAW（手机用 ProRAW 或专业模式）。同时把白平衡设自动并记住事后可改。设置固定后就把注意力放在人身上，这是出片率的分水岭。人像的核心不是把人拍清楚，而是让被摄者看起来像他自己、而且状态松弛。技术上要控制三件事：焦段带来的透视（35mm 带环境、50mm 接近观感、85mm 起压缩背景）、光圈带来的景深（f/2 前后能分离背景，f/5.6 交代环境）、光线带来的皮肤质感（大面积柔光最讨喜，硬光强调结构但会放大瑕疵）。人像的成败一半在沟通：让对方有事可做、有处可看，僵硬感就会消失。"},{"h":"操作路径","p":"今天的练习：把相机设为光圈优先、f2.8、单点对焦、人眼识别、RAW，拍五张确认。拍摄流程：先定环境与机位，让背景干净或有明确层次；再定光——窗光让被摄者侧对窗口 45 度，室内用白墙补暗部；然后对焦到近侧眼睛，用单点对焦并确认对焦点真的落在眼睛上。光圈从 f/2.8 起试，太虚就往回收。沟通上给具体指令而非抽象要求：不要说「自然一点」，要说「手扶一下领口，看我这边，呼气」。连拍抓状态，但每十张停下来给对方看一张，反馈会让后半段明显更好。"},{"h":"边界与代价","p":"典型翻车：现场还在翻菜单找设置，模特站着等。人像的代价集中在「过」与「假」。磨皮过度会抹掉皮肤纹理与年龄特征，人物变成塑料；瘦脸液化过度会让背景线条弯曲穿帮；大光圈全开会让近侧眼睛在焦而远侧眼睛糊掉，正面拍尤其明显。逆光人像不补光就只剩剪影，补光过强又失去氛围。还要尊重边界：未经同意不发布、不修图改人、不拍让人不适的角度，这既是伦理也是专业底线。"},{"h":"怎么判断到位","p":"今天的判据：是先把设置固定下来，不是边拍边试。先问：近侧眼睛在焦内吗，放大到 100% 看还锐吗？再问：被摄者的姿态和视线是有意的还是僵的？最后问：背景是在交代环境还是在抢主体？三问过后再看肤色与整体，人像的合格线是「自然、有神、不假」。"}],"points":["是先把设置固定下来，不是边拍边试","今天只验证这一个变量：能在三分钟内把相机调成拍人像状态"],"pitfalls":["现场还在翻菜单找设置，模特站着等"],"quiz":[{"q":"「开工前的四项设置」的判断要点是什么？先说结论再谈理由。","a":"是先把设置固定下来，不是边拍边试","why":"四项必设：光圈优先或手动、光圈 f2 到 f2.8、对焦改单点加人眼识别、记录改 RAW（手机用 ProRAW 或专业模式）"},{"q":"有人说：现场还在翻菜单找设置，模特站着等。这样对吗？","a":"不对。是先把设置固定下来，不是边拍边试","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"把相机设为光圈优先、f2.8、单点对焦、人眼识别、RAW，拍五张确认｜定焦 35/50/85 任一，f/2–2.8，对焦人眼，窗光 45 度侧对","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 35%：近侧眼睛在焦内、肤色自然、无红眼（每项 5 分制，任一不达标记 3 分以下）","表达 45%：姿态不僵硬、视线有意、背景不抢","规范 20%：未过度磨皮、未拉伸变形"]}},"M01-K02":{"title":"一扇窗就是最好的灯","anchor":"是四十五度侧对窗，不是正对","source":"参考：自编讲义（坐标：《美国摄影教程》人像与纪实章节） · 人像上手（按目录对应）","sections":[{"h":"为什么是这样","p":"让模特与窗成四十五度，亮面朝窗，暗面由室内白墙反射补一点，脸就有体积。退后让光更柔，靠近让对比更强。背景选暗一点的角落，轮廓更清楚。窗框别切头，站位比调试更重要。人像的核心不是把人拍清楚，而是让被摄者看起来像他自己、而且状态松弛。技术上要控制三件事：焦段带来的透视（35mm 带环境、50mm 接近观感、85mm 起压缩背景）、光圈带来的景深（f/2 前后能分离背景，f/5.6 交代环境）、光线带来的皮肤质感（大面积柔光最讨喜，硬光强调结构但会放大瑕疵）。人像的成败一半在沟通：让对方有事可做、有处可看，僵硬感就会消失。"},{"h":"操作路径","p":"今天的练习：同一个人正对窗与侧对窗四十五度各拍一张对比。拍摄流程：先定环境与机位，让背景干净或有明确层次；再定光——窗光让被摄者侧对窗口 45 度，室内用白墙补暗部；然后对焦到近侧眼睛，用单点对焦并确认对焦点真的落在眼睛上。光圈从 f/2.8 起试，太虚就往回收。沟通上给具体指令而非抽象要求：不要说「自然一点」，要说「手扶一下领口，看我这边，呼气」。连拍抓状态，但每十张停下来给对方看一张，反馈会让后半段明显更好。"},{"h":"边界与代价","p":"典型翻车：正对窗拍，脸平如证件照。人像的代价集中在「过」与「假」。磨皮过度会抹掉皮肤纹理与年龄特征，人物变成塑料；瘦脸液化过度会让背景线条弯曲穿帮；大光圈全开会让近侧眼睛在焦而远侧眼睛糊掉，正面拍尤其明显。逆光人像不补光就只剩剪影，补光过强又失去氛围。还要尊重边界：未经同意不发布、不修图改人、不拍让人不适的角度，这既是伦理也是专业底线。"},{"h":"怎么判断到位","p":"今天的判据：是四十五度侧对窗，不是正对。先问：近侧眼睛在焦内吗，放大到 100% 看还锐吗？再问：被摄者的姿态和视线是有意的还是僵的？最后问：背景是在交代环境还是在抢主体？三问过后再看肤色与整体，人像的合格线是「自然、有神、不假」。"}],"points":["是四十五度侧对窗，不是正对","今天只验证这一个变量：能只靠窗光拍出立体人像"],"pitfalls":["正对窗拍，脸平如证件照"],"quiz":[{"q":"「一扇窗就是最好的灯」的判断要点是什么？先说结论再谈理由。","a":"是四十五度侧对窗，不是正对","why":"让模特与窗成四十五度，亮面朝窗，暗面由室内白墙反射补一点，脸就有体积"},{"q":"有人说：正对窗拍，脸平如证件照。这样对吗？","a":"不对。是四十五度侧对窗，不是正对","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"同一个人正对窗与侧对窗四十五度各拍一张对比｜定焦 35/50/85 任一，f/2–2.8，对焦人眼，窗光 45 度侧对","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 35%：近侧眼睛在焦内、肤色自然、无红眼（每项 5 分制，任一不达标记 3 分以下）","表达 45%：姿态不僵硬、视线有意、背景不抢","规范 20%：未过度磨皮、未拉伸变形"]}},"M01-K03":{"title":"三个万能口令","anchor":"是给动作不给姿势","source":"参考：自编讲义（坐标：《美国摄影教程》人像与纪实章节） · 人像上手（按目录对应）","sections":[{"h":"为什么是这样","p":"重心移到一条腿（胯自然有高低）、肩膀一高一低、手臂与身体留一道缝（避免贴紧显粗）、下巴略往前伸（消双下巴）、手找件事做（扶帽、拨发、拿杯、插兜）。人一动就自然，静态摆姿必僵。人像的核心不是把人拍清楚，而是让被摄者看起来像他自己、而且状态松弛。技术上要控制三件事：焦段带来的透视（35mm 带环境、50mm 接近观感、85mm 起压缩背景）、光圈带来的景深（f/2 前后能分离背景，f/5.6 交代环境）、光线带来的皮肤质感（大面积柔光最讨喜，硬光强调结构但会放大瑕疵）。人像的成败一半在沟通：让对方有事可做、有处可看，僵硬感就会消失。"},{"h":"操作路径","p":"今天的练习：对同一个人只用三句口令拍十张：重心移一侧、手找事做、下巴前伸。拍摄流程：先定环境与机位，让背景干净或有明确层次；再定光——窗光让被摄者侧对窗口 45 度，室内用白墙补暗部；然后对焦到近侧眼睛，用单点对焦并确认对焦点真的落在眼睛上。光圈从 f/2.8 起试，太虚就往回收。沟通上给具体指令而非抽象要求：不要说「自然一点」，要说「手扶一下领口，看我这边，呼气」。连拍抓状态，但每十张停下来给对方看一张，反馈会让后半段明显更好。"},{"h":"边界与代价","p":"典型翻车：一直说看镜头笑一个，得到假笑。人像的代价集中在「过」与「假」。磨皮过度会抹掉皮肤纹理与年龄特征，人物变成塑料；瘦脸液化过度会让背景线条弯曲穿帮；大光圈全开会让近侧眼睛在焦而远侧眼睛糊掉，正面拍尤其明显。逆光人像不补光就只剩剪影，补光过强又失去氛围。还要尊重边界：未经同意不发布、不修图改人、不拍让人不适的角度，这既是伦理也是专业底线。"},{"h":"怎么判断到位","p":"今天的判据：是给动作不给姿势。先问：近侧眼睛在焦内吗，放大到 100% 看还锐吗？再问：被摄者的姿态和视线是有意的还是僵的？最后问：背景是在交代环境还是在抢主体？三问过后再看肤色与整体，人像的合格线是「自然、有神、不假」。"}],"points":["是给动作不给姿势","今天只验证这一个变量：能用三句话让模特不再僵硬"],"pitfalls":["一直说看镜头笑一个，得到假笑"],"quiz":[{"q":"「三个万能口令」的判断要点是什么？先说结论再谈理由。","a":"是给动作不给姿势","why":"重心移到一条腿（胯自然有高低）、肩膀一高一低、手臂与身体留一道缝（避免贴紧显粗）、下巴略往前伸（消双下巴）、手找件事做（扶帽、拨发、拿杯、插兜）"},{"q":"有人说：一直说看镜头笑一个，得到假笑。这样对吗？","a":"不对。是给动作不给姿势","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"对同一个人只用三句口令拍十张：重心移一侧、手找事做、下巴前伸｜定焦 35/50/85 任一，f/2–2.8，对焦人眼，窗光 45 度侧对","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 35%：近侧眼睛在焦内、肤色自然、无红眼（每项 5 分制，任一不达标记 3 分以下）","表达 45%：姿态不僵硬、视线有意、背景不抢","规范 20%：未过度磨皮、未拉伸变形"]}},"M01-K04":{"title":"把背景拍干净","anchor":"是背景不抢主体，不是一定要虚化","source":"参考：自编讲义（坐标：《美国摄影教程》人像与纪实章节） · 人像上手（按目录对应）","sections":[{"h":"为什么是这样","p":"看三件事：有没有亮块（比脸还亮就抢）、有没有穿头线（电线、灯杆、树杈）、有没有可识别杂物（垃圾桶、广告字）。处理办法是换个角度、走两步、蹲下把背景换成天空或墙面。虚化只是手段之一。人像的核心不是把人拍清楚，而是让被摄者看起来像他自己、而且状态松弛。技术上要控制三件事：焦段带来的透视（35mm 带环境、50mm 接近观感、85mm 起压缩背景）、光圈带来的景深（f/2 前后能分离背景，f/5.6 交代环境）、光线带来的皮肤质感（大面积柔光最讨喜，硬光强调结构但会放大瑕疵）。人像的成败一半在沟通：让对方有事可做、有处可看，僵硬感就会消失。"},{"h":"操作路径","p":"今天的练习：同一人在杂乱与干净背景各拍一张比较。拍摄流程：先定环境与机位，让背景干净或有明确层次；再定光——窗光让被摄者侧对窗口 45 度，室内用白墙补暗部；然后对焦到近侧眼睛，用单点对焦并确认对焦点真的落在眼睛上。光圈从 f/2.8 起试，太虚就往回收。沟通上给具体指令而非抽象要求：不要说「自然一点」，要说「手扶一下领口，看我这边，呼气」。连拍抓状态，但每十张停下来给对方看一张，反馈会让后半段明显更好。"},{"h":"边界与代价","p":"典型翻车：背景有电线穿过头部或亮块抢视线。人像的代价集中在「过」与「假」。磨皮过度会抹掉皮肤纹理与年龄特征，人物变成塑料；瘦脸液化过度会让背景线条弯曲穿帮；大光圈全开会让近侧眼睛在焦而远侧眼睛糊掉，正面拍尤其明显。逆光人像不补光就只剩剪影，补光过强又失去氛围。还要尊重边界：未经同意不发布、不修图改人、不拍让人不适的角度，这既是伦理也是专业底线。"},{"h":"怎么判断到位","p":"今天的判据：是背景不抢主体，不是一定要虚化。先问：近侧眼睛在焦内吗，放大到 100% 看还锐吗？再问：被摄者的姿态和视线是有意的还是僵的？最后问：背景是在交代环境还是在抢主体？三问过后再看肤色与整体，人像的合格线是「自然、有神、不假」。"}],"points":["是背景不抢主体，不是一定要虚化","今天只验证这一个变量：能三秒内判断背景能不能用"],"pitfalls":["背景有电线穿过头部或亮块抢视线"],"quiz":[{"q":"「把背景拍干净」的判断要点是什么？先说结论再谈理由。","a":"是背景不抢主体，不是一定要虚化","why":"看三件事：有没有亮块（比脸还亮就抢）、有没有穿头线（电线、灯杆、树杈）、有没有可识别杂物（垃圾桶、广告字）"},{"q":"有人说：背景有电线穿过头部或亮块抢视线。这样对吗？","a":"不对。是背景不抢主体，不是一定要虚化","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"同一人在杂乱与干净背景各拍一张比较｜定焦 35/50/85 任一，f/2–2.8，对焦人眼，窗光 45 度侧对","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 35%：近侧眼睛在焦内、肤色自然、无红眼（每项 5 分制，任一不达标记 3 分以下）","表达 45%：姿态不僵硬、视线有意、背景不抢","规范 20%：未过度磨皮、未拉伸变形"]}},"M01-K05":{"title":"逆光也能拍","anchor":"是先保高光再补脸","source":"参考：自编讲义（坐标：《美国摄影教程》人像与纪实章节） · 人像上手（按目录对应）","sections":[{"h":"为什么是这样","p":"先按背景高光曝光（或减三分之二档）保住头发轮廓，再想办法给脸补一到两档：白墙、浅色地面、反光板、白纸、手机屏幕都行。补光从相机侧四十五度打，别从正前方平打，否则又平又假。人像的核心不是把人拍清楚，而是让被摄者看起来像他自己、而且状态松弛。技术上要控制三件事：焦段带来的透视（35mm 带环境、50mm 接近观感、85mm 起压缩背景）、光圈带来的景深（f/2 前后能分离背景，f/5.6 交代环境）、光线带来的皮肤质感（大面积柔光最讨喜，硬光强调结构但会放大瑕疵）。人像的成败一半在沟通：让对方有事可做、有处可看，僵硬感就会消失。"},{"h":"操作路径","p":"今天的练习：逆光人像分别用不补光、白墙反射、手机屏幕补光各拍一张。拍摄流程：先定环境与机位，让背景干净或有明确层次；再定光——窗光让被摄者侧对窗口 45 度，室内用白墙补暗部；然后对焦到近侧眼睛，用单点对焦并确认对焦点真的落在眼睛上。光圈从 f/2.8 起试，太虚就往回收。沟通上给具体指令而非抽象要求：不要说「自然一点」，要说「手扶一下领口，看我这边，呼气」。连拍抓状态，但每十张停下来给对方看一张，反馈会让后半段明显更好。"},{"h":"边界与代价","p":"典型翻车：直接加曝光，背景全白轮廓消失。人像的代价集中在「过」与「假」。磨皮过度会抹掉皮肤纹理与年龄特征，人物变成塑料；瘦脸液化过度会让背景线条弯曲穿帮；大光圈全开会让近侧眼睛在焦而远侧眼睛糊掉，正面拍尤其明显。逆光人像不补光就只剩剪影，补光过强又失去氛围。还要尊重边界：未经同意不发布、不修图改人、不拍让人不适的角度，这既是伦理也是专业底线。"},{"h":"怎么判断到位","p":"今天的判据：是先保高光再补脸。先问：近侧眼睛在焦内吗，放大到 100% 看还锐吗？再问：被摄者的姿态和视线是有意的还是僵的？最后问：背景是在交代环境还是在抢主体？三问过后再看肤色与整体，人像的合格线是「自然、有神、不假」。"}],"points":["是先保高光再补脸","今天只验证这一个变量：能在逆光下同时保住轮廓与脸"],"pitfalls":["直接加曝光，背景全白轮廓消失"],"quiz":[{"q":"「逆光也能拍」的判断要点是什么？先说结论再谈理由。","a":"是先保高光再补脸","why":"先按背景高光曝光（或减三分之二档）保住头发轮廓，再想办法给脸补一到两档：白墙、浅色地面、反光板、白纸、手机屏幕都行"},{"q":"有人说：直接加曝光，背景全白轮廓消失。这样对吗？","a":"不对。是先保高光再补脸","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"逆光人像分别用不补光、白墙反射、手机屏幕补光各拍一张｜定焦 35/50/85 任一，f/2–2.8，对焦人眼，窗光 45 度侧对","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 35%：近侧眼睛在焦内、肤色自然、无红眼（每项 5 分制，任一不达标记 3 分以下）","表达 45%：姿态不僵硬、视线有意、背景不抢","规范 20%：未过度磨皮、未拉伸变形"]}},"M01-K06":{"title":"户外人像的时段","anchor":"是日出后与日落前一小时，不是正午","source":"参考：自编讲义（坐标：《美国摄影教程》人像与纪实章节） · 人像上手（按目录对应）","sections":[{"h":"为什么是这样","p":"黄金时段太阳低、光暖、方向好，脸有立体感。正午要么改到树荫与建筑阴影的边缘拍（阴影里再找一块反光地面），要么干脆拍高反差风格。阴天全天可拍，光柔但需靠背景明暗制造层次。人像的技术分层是先保底线、再谈风格。底线三条：焦在近侧眼睛、肤色不发绿不发灰、背景不穿过头顶。上层才是风格：环境人像还是特写、亮调还是低调、正面还是侧背。拍摄前先问清用途——证件、社交头像、家庭记录、作品集，四种用途对构图、光比、后期程度的要求完全不同，先定用途能省掉一半返工。人像的难处在被摄者，不在相机。"},{"h":"操作路径","p":"今天的练习：分别在正午与黄昏各拍一组同一人，比较阴影。让被摄者先做动作再定格，而不是先站好再摆姿势。走动、转身、整理衣领、抬手挡光，这些动作之间的中间帧最自然。机位高度决定观感：略高于眼位显瘦、与眼平显自然、略低显气场但易露鼻孔。每换一个位置先拍一张测试帧，确认曝光与对焦再正式拍。一组控制在二十分钟内，注意力衰减后效率会断崖下跌，宁可分两次拍。"},{"h":"边界与代价","p":"典型翻车：正午在空地拍，眼窝鼻下全是硬阴影。人像的边界是尊重：不要求被摄者做让其不适的动作、不在未同意时发布、不把改变其身体特征当作默认操作。技术上的边界是景深——f/1.4 全开时眼睛与鼻尖都不在同一焦平面，正面近摄尤其明显，必要时收到 f/2.8 换容错。环境人像若背景信息过多，主体会被稀释，必须在「交代环境」与「不抢主体」之间选一边站。"},{"h":"怎么判断到位","p":"今天的判据：是日出后与日落前一小时，不是正午。自检三问：底线三条（对焦、肤色、背景）都过了吗？机位高度是有意选的吗？这组照片的用途决定了我的取舍吗？"}],"points":["是日出后与日落前一小时，不是正午","今天只验证这一个变量：能选对时间出门拍人像"],"pitfalls":["正午在空地拍，眼窝鼻下全是硬阴影"],"quiz":[{"q":"「户外人像的时段」的判断要点是什么？先说结论再谈理由。","a":"是日出后与日落前一小时，不是正午","why":"黄金时段太阳低、光暖、方向好，脸有立体感"},{"q":"有人说：正午在空地拍，眼窝鼻下全是硬阴影。这样对吗？","a":"不对。是日出后与日落前一小时，不是正午","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"分别在正午与黄昏各拍一组同一人，比较阴影｜定焦 35/50/85 任一，f/2–2.8，对焦人眼，窗光 45 度侧对","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 35%：近侧眼睛在焦内、肤色自然、无红眼（每项 5 分制，任一不达标记 3 分以下）","表达 45%：姿态不僵硬、视线有意、背景不抢","规范 20%：未过度磨皮、未拉伸变形"]}},"M01-K07":{"title":"人像构图三选一","anchor":"是先想让人看哪里","source":"参考：自编讲义（坐标：《美国摄影教程》人像与纪实章节） · 人像上手（按目录对应）","sections":[{"h":"为什么是这样","p":"想让人感到稳定正式用中心；想自然舒展把眼睛放上三分线交点；想表达孤独安静让主体偏一侧留大片空白。留白要给朝向侧，人才不憋。拍一组时三种轮流用，节奏才不单调。人像的技术分层是先保底线、再谈风格。底线三条：焦在近侧眼睛、肤色不发绿不发灰、背景不穿过头顶。上层才是风格：环境人像还是特写、亮调还是低调、正面还是侧背。拍摄前先问清用途——证件、社交头像、家庭记录、作品集，四种用途对构图、光比、后期程度的要求完全不同，先定用途能省掉一半返工。人像的难处在被摄者，不在相机。"},{"h":"操作路径","p":"今天的练习：同一人用中心、三分、大量留白各拍一张。让被摄者先做动作再定格，而不是先站好再摆姿势。走动、转身、整理衣领、抬手挡光，这些动作之间的中间帧最自然。机位高度决定观感：略高于眼位显瘦、与眼平显自然、略低显气场但易露鼻孔。每换一个位置先拍一张测试帧，确认曝光与对焦再正式拍。一组控制在二十分钟内，注意力衰减后效率会断崖下跌，宁可分两次拍。"},{"h":"边界与代价","p":"典型翻车：每张都把眼睛放右下角，全部一样。人像的边界是尊重：不要求被摄者做让其不适的动作、不在未同意时发布、不把改变其身体特征当作默认操作。技术上的边界是景深——f/1.4 全开时眼睛与鼻尖都不在同一焦平面，正面近摄尤其明显，必要时收到 f/2.8 换容错。环境人像若背景信息过多，主体会被稀释，必须在「交代环境」与「不抢主体」之间选一边站。"},{"h":"怎么判断到位","p":"今天的判据：是先想让人看哪里。自检三问：底线三条（对焦、肤色、背景）都过了吗？机位高度是有意选的吗？这组照片的用途决定了我的取舍吗？"}],"points":["是先想让人看哪里","今天只验证这一个变量：能按意图选中心、三分、留白"],"pitfalls":["每张都把眼睛放右下角，全部一样"],"quiz":[{"q":"「人像构图三选一」的判断要点是什么？先说结论再谈理由。","a":"是先想让人看哪里","why":"想让人感到稳定正式用中心"},{"q":"有人说：每张都把眼睛放右下角，全部一样。这样对吗？","a":"不对。是先想让人看哪里","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"同一人用中心、三分、大量留白各拍一张｜定焦 35/50/85 任一，f/2–2.8，对焦人眼，窗光 45 度侧对","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 35%：近侧眼睛在焦内、肤色自然、无红眼（每项 5 分制，任一不达标记 3 分以下）","表达 45%：姿态不僵硬、视线有意、背景不抢","规范 20%：未过度磨皮、未拉伸变形"]}},"M01-K08":{"title":"抓拍比摆拍好用","anchor":"是制造情境再连拍，不是数三二一","source":"参考：自编讲义（坐标：《美国摄影教程》人像与纪实章节） · 人像上手（按目录对应）","sections":[{"h":"为什么是这样","p":"让人动起来：走过来、转身回头、拨头发、整理衣领、突然叫名字。用低速连拍抓过渡瞬间，表情在变化中最好看。眼神看镜头是交流，看画外是故事，一组里两种都要有。人像的核心不是把人拍清楚，而是让被摄者看起来像他自己、而且状态松弛。技术上要控制三件事：焦段带来的透视（35mm 带环境、50mm 接近观感、85mm 起压缩背景）、光圈带来的景深（f/2 前后能分离背景，f/5.6 交代环境）、光线带来的皮肤质感（大面积柔光最讨喜，硬光强调结构但会放大瑕疵）。人像的成败一半在沟通：让对方有事可做、有处可看，僵硬感就会消失。"},{"h":"操作路径","p":"今天的练习：让对方向你走来，边走边连拍二十张挑一张。拍摄流程：先定环境与机位，让背景干净或有明确层次；再定光——窗光让被摄者侧对窗口 45 度，室内用白墙补暗部；然后对焦到近侧眼睛，用单点对焦并确认对焦点真的落在眼睛上。光圈从 f/2.8 起试，太虚就往回收。沟通上给具体指令而非抽象要求：不要说「自然一点」，要说「手扶一下领口，看我这边，呼气」。连拍抓状态，但每十张停下来给对方看一张，反馈会让后半段明显更好。"},{"h":"边界与代价","p":"典型翻车：每张都是同一个僵笑。人像的代价集中在「过」与「假」。磨皮过度会抹掉皮肤纹理与年龄特征，人物变成塑料；瘦脸液化过度会让背景线条弯曲穿帮；大光圈全开会让近侧眼睛在焦而远侧眼睛糊掉，正面拍尤其明显。逆光人像不补光就只剩剪影，补光过强又失去氛围。还要尊重边界：未经同意不发布、不修图改人、不拍让人不适的角度，这既是伦理也是专业底线。"},{"h":"怎么判断到位","p":"今天的判据：是制造情境再连拍，不是数三二一。先问：近侧眼睛在焦内吗，放大到 100% 看还锐吗？再问：被摄者的姿态和视线是有意的还是僵的？最后问：背景是在交代环境还是在抢主体？三问过后再看肤色与整体，人像的合格线是「自然、有神、不假」。"}],"points":["是制造情境再连拍，不是数三二一","今天只验证这一个变量：能用连拍抓到真实表情"],"pitfalls":["每张都是同一个僵笑"],"quiz":[{"q":"「抓拍比摆拍好用」的判断要点是什么？先说结论再谈理由。","a":"是制造情境再连拍，不是数三二一","why":"让人动起来：走过来、转身回头、拨头发、整理衣领、突然叫名字"},{"q":"有人说：每张都是同一个僵笑。这样对吗？","a":"不对。是制造情境再连拍，不是数三二一","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"让对方向你走来，边走边连拍二十张挑一张｜定焦 35/50/85 任一，f/2–2.8，对焦人眼，窗光 45 度侧对","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 35%：近侧眼睛在焦内、肤色自然、无红眼（每项 5 分制，任一不达标记 3 分以下）","表达 45%：姿态不僵硬、视线有意、背景不抢","规范 20%：未过度磨皮、未拉伸变形"]}},"M01-K09":{"title":"夜景人像不糊不黄","anchor":"是找光源站人，不是硬开闪光","source":"参考：自编讲义（坐标：《美国摄影教程》人像与纪实章节） · 人像上手（按目录对应）","sections":[{"h":"为什么是这样","p":"先把人带到有光的地方：路灯、橱窗、灯箱、广告牌。用大光圈、快门不低于六十分之一、ISO 让画面够亮。背景的灯串与霓虹要保留，别用闪光压掉。白平衡可手动设 3200 到 4000K 压黄，或后期统一。人像的核心不是把人拍清楚，而是让被摄者看起来像他自己、而且状态松弛。技术上要控制三件事：焦段带来的透视（35mm 带环境、50mm 接近观感、85mm 起压缩背景）、光圈带来的景深（f/2 前后能分离背景，f/5.6 交代环境）、光线带来的皮肤质感（大面积柔光最讨喜，硬光强调结构但会放大瑕疵）。人像的成败一半在沟通：让对方有事可做、有处可看，僵硬感就会消失。"},{"h":"操作路径","p":"今天的练习：在路灯与店铺灯箱下各拍一组，比较肤色。拍摄流程：先定环境与机位，让背景干净或有明确层次；再定光——窗光让被摄者侧对窗口 45 度，室内用白墙补暗部；然后对焦到近侧眼睛，用单点对焦并确认对焦点真的落在眼睛上。光圈从 f/2.8 起试，太虚就往回收。沟通上给具体指令而非抽象要求：不要说「自然一点」，要说「手扶一下领口，看我这边，呼气」。连拍抓状态，但每十张停下来给对方看一张，反馈会让后半段明显更好。"},{"h":"边界与代价","p":"典型翻车：直接开闪光，脸白背景黑。人像的代价集中在「过」与「假」。磨皮过度会抹掉皮肤纹理与年龄特征，人物变成塑料；瘦脸液化过度会让背景线条弯曲穿帮；大光圈全开会让近侧眼睛在焦而远侧眼睛糊掉，正面拍尤其明显。逆光人像不补光就只剩剪影，补光过强又失去氛围。还要尊重边界：未经同意不发布、不修图改人、不拍让人不适的角度，这既是伦理也是专业底线。"},{"h":"怎么判断到位","p":"今天的判据：是找光源站人，不是硬开闪光。先问：近侧眼睛在焦内吗，放大到 100% 看还锐吗？再问：被摄者的姿态和视线是有意的还是僵的？最后问：背景是在交代环境还是在抢主体？三问过后再看肤色与整体，人像的合格线是「自然、有神、不假」。"}],"points":["是找光源站人，不是硬开闪光","今天只验证这一个变量：能在夜里拍出干净的人像"],"pitfalls":["直接开闪光，脸白背景黑"],"quiz":[{"q":"「夜景人像不糊不黄」的判断要点是什么？先说结论再谈理由。","a":"是找光源站人，不是硬开闪光","why":"先把人带到有光的地方：路灯、橱窗、灯箱、广告牌"},{"q":"有人说：直接开闪光，脸白背景黑。这样对吗？","a":"不对。是找光源站人，不是硬开闪光","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"在路灯与店铺灯箱下各拍一组，比较肤色｜定焦 35/50/85 任一，f/2–2.8，对焦人眼，窗光 45 度侧对","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 35%：近侧眼睛在焦内、肤色自然、无红眼（每项 5 分制，任一不达标记 3 分以下）","表达 45%：姿态不僵硬、视线有意、背景不抢","规范 20%：未过度磨皮、未拉伸变形"]}},"M01-K10":{"title":"肤色统一的简易后期","anchor":"是只动橙色，不动全局色温","source":"参考：自编讲义（坐标：《美国摄影教程》人像与纪实章节） · 人像上手（按目录对应）","sections":[{"h":"为什么是这样","p":"三个动作：HSL 里橙色饱和降五到十、橙色明度提五到十五（皮肤变干净）、高光略压（去油光）。别全局拉饱和与暖度，那会让肤色先崩。同组照片复制这套参数再逐张微调，整组才统一。人像的技术分层是先保底线、再谈风格。底线三条：焦在近侧眼睛、肤色不发绿不发灰、背景不穿过头顶。上层才是风格：环境人像还是特写、亮调还是低调、正面还是侧背。拍摄前先问清用途——证件、社交头像、家庭记录、作品集，四种用途对构图、光比、后期程度的要求完全不同，先定用途能省掉一半返工。人像的难处在被摄者，不在相机。"},{"h":"操作路径","p":"今天的练习：用 HSL 只调橙色饱和与明度，比较肤色变化。让被摄者先做动作再定格，而不是先站好再摆姿势。走动、转身、整理衣领、抬手挡光，这些动作之间的中间帧最自然。机位高度决定观感：略高于眼位显瘦、与眼平显自然、略低显气场但易露鼻孔。每换一个位置先拍一张测试帧，确认曝光与对焦再正式拍。一组控制在二十分钟内，注意力衰减后效率会断崖下跌，宁可分两次拍。"},{"h":"边界与代价","p":"典型翻车：整体加暖加饱和，脸发黄发橙。人像的边界是尊重：不要求被摄者做让其不适的动作、不在未同意时发布、不把改变其身体特征当作默认操作。技术上的边界是景深——f/1.4 全开时眼睛与鼻尖都不在同一焦平面，正面近摄尤其明显，必要时收到 f/2.8 换容错。环境人像若背景信息过多，主体会被稀释，必须在「交代环境」与「不抢主体」之间选一边站。"},{"h":"怎么判断到位","p":"今天的判据：是只动橙色，不动全局色温。自检三问：底线三条（对焦、肤色、背景）都过了吗？机位高度是有意选的吗？这组照片的用途决定了我的取舍吗？"}],"points":["是只动橙色，不动全局色温","今天只验证这一个变量：能用三个滑块让肤色自然"],"pitfalls":["整体加暖加饱和，脸发黄发橙"],"quiz":[{"q":"「肤色统一的简易后期」的判断要点是什么？先说结论再谈理由。","a":"是只动橙色，不动全局色温","why":"三个动作：HSL 里橙色饱和降五到十、橙色明度提五到十五（皮肤变干净）、高光略压（去油光）"},{"q":"有人说：整体加暖加饱和，脸发黄发橙。这样对吗？","a":"不对。是只动橙色，不动全局色温","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"用 HSL 只调橙色饱和与明度，比较肤色变化｜定焦 35/50/85 任一，f/2–2.8，对焦人眼，窗光 45 度侧对","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 35%：近侧眼睛在焦内、肤色自然、无红眼（每项 5 分制，任一不达标记 3 分以下）","表达 45%：姿态不僵硬、视线有意、背景不抢","规范 20%：未过度磨皮、未拉伸变形"]}},"M01-K11":{"title":"一组人像怎么成组","anchor":"是景别与情绪交替，不是十张同一个角度","source":"参考：自编讲义（坐标：《美国摄影教程》人像与纪实章节） · 人像上手（按目录对应）","sections":[{"h":"为什么是这样","p":"一组要有：一张环境全景（交代地点）、两到三张半身、两三张特写（眼睛、手、细节）、一张情绪高点。景别交替、视线方向交替、明暗交替。开场用有代入感的，结尾留余味，中间不要连着三张同角度。人像的技术分层是先保底线、再谈风格。底线三条：焦在近侧眼睛、肤色不发绿不发灰、背景不穿过头顶。上层才是风格：环境人像还是特写、亮调还是低调、正面还是侧背。拍摄前先问清用途——证件、社交头像、家庭记录、作品集，四种用途对构图、光比、后期程度的要求完全不同，先定用途能省掉一半返工。人像的难处在被摄者，不在相机。"},{"h":"操作路径","p":"今天的练习：从一次拍摄挑十张排出顺序。让被摄者先做动作再定格，而不是先站好再摆姿势。走动、转身、整理衣领、抬手挡光，这些动作之间的中间帧最自然。机位高度决定观感：略高于眼位显瘦、与眼平显自然、略低显气场但易露鼻孔。每换一个位置先拍一张测试帧，确认曝光与对焦再正式拍。一组控制在二十分钟内，注意力衰减后效率会断崖下跌，宁可分两次拍。"},{"h":"边界与代价","p":"典型翻车：十张全是大头半身，看着重复。人像的边界是尊重：不要求被摄者做让其不适的动作、不在未同意时发布、不把改变其身体特征当作默认操作。技术上的边界是景深——f/1.4 全开时眼睛与鼻尖都不在同一焦平面，正面近摄尤其明显，必要时收到 f/2.8 换容错。环境人像若背景信息过多，主体会被稀释，必须在「交代环境」与「不抢主体」之间选一边站。"},{"h":"怎么判断到位","p":"今天的判据：是景别与情绪交替，不是十张同一个角度。自检三问：底线三条（对焦、肤色、背景）都过了吗？机位高度是有意选的吗？这组照片的用途决定了我的取舍吗？"}],"points":["是景别与情绪交替，不是十张同一个角度","今天只验证这一个变量：能把十张编成一组"],"pitfalls":["十张全是大头半身，看着重复"],"quiz":[{"q":"「一组人像怎么成组」的判断要点是什么？先说结论再谈理由。","a":"是景别与情绪交替，不是十张同一个角度","why":"一组要有：一张环境全景（交代地点）、两到三张半身、两三张特写（眼睛、手、细节）、一张情绪高点"},{"q":"有人说：十张全是大头半身，看着重复。这样对吗？","a":"不对。是景别与情绪交替，不是十张同一个角度","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"从一次拍摄挑十张排出顺序｜定焦 35/50/85 任一，f/2–2.8，对焦人眼，窗光 45 度侧对","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 35%：近侧眼睛在焦内、肤色自然、无红眼（每项 5 分制，任一不达标记 3 分以下）","表达 45%：姿态不僵硬、视线有意、背景不抢","规范 20%：未过度磨皮、未拉伸变形"]}},"M01-K12":{"title":"人像自检清单","anchor":"是逐项打勾，不是凭感觉","source":"参考：自编讲义（坐标：《美国摄影教程》人像与纪实章节） · 人像上手（按目录对应）","sections":[{"h":"为什么是这样","p":"五项：眼睛是否在焦内、皮肤有没有过曝或发灰、手指与头顶有没有被切、背景有无穿头线、整组色温是否一致。任一项不合格就修或删。养成导出前必查的习惯，比多拍十张有用。人像的技术分层是先保底线、再谈风格。底线三条：焦在近侧眼睛、肤色不发绿不发灰、背景不穿过头顶。上层才是风格：环境人像还是特写、亮调还是低调、正面还是侧背。拍摄前先问清用途——证件、社交头像、家庭记录、作品集，四种用途对构图、光比、后期程度的要求完全不同，先定用途能省掉一半返工。人像的难处在被摄者，不在相机。"},{"h":"操作路径","p":"今天的练习：用五项清单检查一组照片并记录问题。让被摄者先做动作再定格，而不是先站好再摆姿势。走动、转身、整理衣领、抬手挡光，这些动作之间的中间帧最自然。机位高度决定观感：略高于眼位显瘦、与眼平显自然、略低显气场但易露鼻孔。每换一个位置先拍一张测试帧，确认曝光与对焦再正式拍。一组控制在二十分钟内，注意力衰减后效率会断崖下跌，宁可分两次拍。"},{"h":"边界与代价","p":"典型翻车：交片后发现眼睛虚、手指被切。人像的边界是尊重：不要求被摄者做让其不适的动作、不在未同意时发布、不把改变其身体特征当作默认操作。技术上的边界是景深——f/1.4 全开时眼睛与鼻尖都不在同一焦平面，正面近摄尤其明显，必要时收到 f/2.8 换容错。环境人像若背景信息过多，主体会被稀释，必须在「交代环境」与「不抢主体」之间选一边站。"},{"h":"怎么判断到位","p":"今天的判据：是逐项打勾，不是凭感觉。自检三问：底线三条（对焦、肤色、背景）都过了吗？机位高度是有意选的吗？这组照片的用途决定了我的取舍吗？"}],"points":["是逐项打勾，不是凭感觉","今天只验证这一个变量：能在交片前两分钟自查完"],"pitfalls":["交片后发现眼睛虚、手指被切"],"quiz":[{"q":"「人像自检清单」的判断要点是什么？先说结论再谈理由。","a":"是逐项打勾，不是凭感觉","why":"五项：眼睛是否在焦内、皮肤有没有过曝或发灰、手指与头顶有没有被切、背景有无穿头线、整组色温是否一致"},{"q":"有人说：交片后发现眼睛虚、手指被切。这样对吗？","a":"不对。是逐项打勾，不是凭感觉","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"用五项清单检查一组照片并记录问题｜定焦 35/50/85 任一，f/2–2.8，对焦人眼，窗光 45 度侧对","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 35%：近侧眼睛在焦内、肤色自然、无红眼（每项 5 分制，任一不达标记 3 分以下）","表达 45%：姿态不僵硬、视线有意、背景不抢","规范 20%：未过度磨皮、未拉伸变形"]}},"M02-K01":{"title":"一机一镜就够了","anchor":"是装备越少拍得越多","source":"参考：自编讲义（坐标：《美国摄影教程》人像与纪实章节） · 人文街拍上手（按目录对应）","sections":[{"h":"为什么是这样","p":"街拍要的是反应速度，不是焦段覆盖。等效 35mm 最通用（能交代环境又够近），等效 50mm 更适合特写。机身挂胸前或斜挎，开机、取盖、参数预设好。装备越轻，你走得越远、举机越快。街拍是在不可控的环境里做可控的判断。它的技术含量不高，判断含量极高：要在零点几秒内看出「这个人、这个背景、这一瞬间」三者能不能拼成一个有意味的画面。技术上通常预设好参数——光圈 f/8 保证容错景深、快门 1/500 冻结动作、ISO 自动上限 6400、区域对焦或超焦距，让相机不需要思考，把注意力全部留给观察。构图靠预判：先找到好背景，再等合适的人走进来。"},{"h":"操作路径","p":"今天的练习：只带一支等效 35 或 50 的镜头出门拍两小时。流程：先走一遍街区找三到五个“舞台”——有光、有层次、有重复结构的背景；在舞台旁站定，参数预设好，等主体进入预定位置再按快门。距离控制在两到四米，用广角带环境或 35mm 等效视角，太近会让被摄者警觉、太远会失去关系。遇到好瞬间可以先拍再沟通，被质疑时坦诚说明并删除，这是最低的伦理要求。每次出门定一个小主题（雨、影子、橱窗、背影），比漫无目的扫街收成高得多。"},{"h":"边界与代价","p":"典型翻车：背三支镜头，一路在换镜头。街拍的代价是伦理与法律的边界。公共场所拍摄通常可行，但涉及可识别的个人、尤其是弱势群体、儿童、私密场景时应避免；商业使用需要肖像授权。用摆拍冒充抓拍是欺骗，用长焦偷拍是越界。技术上也要接受大量废片：一个下午出一张能看的就算正常，追求百分之百成功率只会让你不敢按快门。别为了戏剧性去干预现场，纪实的价值来自真实。"},{"h":"怎么判断到位","p":"今天的判据：是装备越少拍得越多。先问：这张照片里主体和背景有关系吗，换个人站那儿还成立吗？再问：这个瞬间是不可重复的吗？最后问：如果被摄者当场问我为什么拍，我能坦然解释吗？三问都过，这张才值得留。"}],"points":["是装备越少拍得越多","今天只验证这一个变量：能确定扫街只用一套装备"],"pitfalls":["背三支镜头，一路在换镜头"],"quiz":[{"q":"「一机一镜就够了」的判断要点是什么？先说结论再谈理由。","a":"是装备越少拍得越多","why":"街拍要的是反应速度，不是焦段覆盖"},{"q":"有人说：背三支镜头，一路在换镜头。这样对吗？","a":"不对。是装备越少拍得越多","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"只带一支等效 35 或 50 的镜头出门拍两小时｜等效 35mm，f/8，1/500，ISO 自动上限 6400，区域对焦","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 30%：焦点落在主体、曝光在容错范围内（每项 5 分制，任一不达标记 3 分以下）","表达 55%：主体与背景有关系、瞬间有意味","规范 15%：未摆拍冒充纪实、未越过伦理边界"]}},"M02-K02":{"title":"三秒预设法","anchor":"是提前设好，不是现场调","source":"参考：自编讲义（坐标：《美国摄影教程》人像与纪实章节） · 人文街拍上手（按目录对应）","sections":[{"h":"为什么是这样","p":"预设组合：f8 保景深、快门 1/500 冻结行人、ISO 自动、对焦区域放画面中部、连拍低速。或用手动对焦对到三到五米，f8 下两米到无穷都在焦内，抬手即拍不用对焦。手机则长按锁定曝光与对焦。街拍是在不可控的环境里做可控的判断。它的技术含量不高，判断含量极高：要在零点几秒内看出「这个人、这个背景、这一瞬间」三者能不能拼成一个有意味的画面。技术上通常预设好参数——光圈 f/8 保证容错景深、快门 1/500 冻结动作、ISO 自动上限 6400、区域对焦或超焦距，让相机不需要思考，把注意力全部留给观察。构图靠预判：先找到好背景，再等合适的人走进来。"},{"h":"操作路径","p":"今天的练习：预设 f8、1/500、自动 ISO 上限 6400，用区域对焦拍一小时。流程：先走一遍街区找三到五个“舞台”——有光、有层次、有重复结构的背景；在舞台旁站定，参数预设好，等主体进入预定位置再按快门。距离控制在两到四米，用广角带环境或 35mm 等效视角，太近会让被摄者警觉、太远会失去关系。遇到好瞬间可以先拍再沟通，被质疑时坦诚说明并删除，这是最低的伦理要求。每次出门定一个小主题（雨、影子、橱窗、背影），比漫无目的扫街收成高得多。"},{"h":"边界与代价","p":"典型翻车：看到画面先调参数，机会已经过去。街拍的代价是伦理与法律的边界。公共场所拍摄通常可行，但涉及可识别的个人、尤其是弱势群体、儿童、私密场景时应避免；商业使用需要肖像授权。用摆拍冒充抓拍是欺骗，用长焦偷拍是越界。技术上也要接受大量废片：一个下午出一张能看的就算正常，追求百分之百成功率只会让你不敢按快门。别为了戏剧性去干预现场，纪实的价值来自真实。"},{"h":"怎么判断到位","p":"今天的判据：是提前设好，不是现场调。先问：这张照片里主体和背景有关系吗，换个人站那儿还成立吗？再问：这个瞬间是不可重复的吗？最后问：如果被摄者当场问我为什么拍，我能坦然解释吗？三问都过，这张才值得留。"}],"points":["是提前设好，不是现场调","今天只验证这一个变量：能在抬手瞬间拍下"],"pitfalls":["看到画面先调参数，机会已经过去"],"quiz":[{"q":"「三秒预设法」的判断要点是什么？先说结论再谈理由。","a":"是提前设好，不是现场调","why":"预设组合：f8 保景深、快门 1/500 冻结行人、ISO 自动、对焦区域放画面中部、连拍低速"},{"q":"有人说：看到画面先调参数，机会已经过去。这样对吗？","a":"不对。是提前设好，不是现场调","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"预设 f8、1/500、自动 ISO 上限 6400，用区域对焦拍一小时｜等效 35mm，f/8，1/500，ISO 自动上限 6400，区域对焦","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 30%：焦点落在主体、曝光在容错范围内（每项 5 分制，任一不达标记 3 分以下）","表达 55%：主体与背景有关系、瞬间有意味","规范 15%：未摆拍冒充纪实、未越过伦理边界"]}},"M02-K03":{"title":"先在街上站十分钟","anchor":"是先融入再拍摄，不是偷偷摸摸","source":"参考：自编讲义（坐标：《美国摄影教程》人像与纪实章节） · 人文街拍上手（按目录对应）","sections":[{"h":"为什么是这样","p":"站定观察让人习惯你的存在，也让你的眼睛适应。先拍背影、局部、环境，热身后再拍正面。被注意到就点头微笑，多数人不在意。躲闪反而引人怀疑。相机挂胸前抬手就拍，动作越小越自然。街拍是在不可控的环境里做可控的判断。它的技术含量不高，判断含量极高：要在零点几秒内看出「这个人、这个背景、这一瞬间」三者能不能拼成一个有意味的画面。技术上通常预设好参数——光圈 f/8 保证容错景深、快门 1/500 冻结动作、ISO 自动上限 6400、区域对焦或超焦距，让相机不需要思考，把注意力全部留给观察。构图靠预判：先找到好背景，再等合适的人走进来。"},{"h":"操作路径","p":"今天的练习：在同一条街站十分钟只观察，再开始拍。流程：先走一遍街区找三到五个“舞台”——有光、有层次、有重复结构的背景；在舞台旁站定，参数预设好，等主体进入预定位置再按快门。距离控制在两到四米，用广角带环境或 35mm 等效视角，太近会让被摄者警觉、太远会失去关系。遇到好瞬间可以先拍再沟通，被质疑时坦诚说明并删除，这是最低的伦理要求。每次出门定一个小主题（雨、影子、橱窗、背影），比漫无目的扫街收成高得多。"},{"h":"边界与代价","p":"典型翻车：举机就跑，照片全虚且引人侧目。街拍的代价是伦理与法律的边界。公共场所拍摄通常可行，但涉及可识别的个人、尤其是弱势群体、儿童、私密场景时应避免；商业使用需要肖像授权。用摆拍冒充抓拍是欺骗，用长焦偷拍是越界。技术上也要接受大量废片：一个下午出一张能看的就算正常，追求百分之百成功率只会让你不敢按快门。别为了戏剧性去干预现场，纪实的价值来自真实。"},{"h":"怎么判断到位","p":"今天的判据：是先融入再拍摄，不是偷偷摸摸。先问：这张照片里主体和背景有关系吗，换个人站那儿还成立吗？再问：这个瞬间是不可重复的吗？最后问：如果被摄者当场问我为什么拍，我能坦然解释吗？三问都过，这张才值得留。"}],"points":["是先融入再拍摄，不是偷偷摸摸","今天只验证这一个变量：能克服举机的心理障碍"],"pitfalls":["举机就跑，照片全虚且引人侧目"],"quiz":[{"q":"「先在街上站十分钟」的判断要点是什么？先说结论再谈理由。","a":"是先融入再拍摄，不是偷偷摸摸","why":"站定观察让人习惯你的存在，也让你的眼睛适应"},{"q":"有人说：举机就跑，照片全虚且引人侧目。这样对吗？","a":"不对。是先融入再拍摄，不是偷偷摸摸","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"在同一条街站十分钟只观察，再开始拍｜等效 35mm，f/8，1/500，ISO 自动上限 6400，区域对焦","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 30%：焦点落在主体、曝光在容错范围内（每项 5 分制，任一不达标记 3 分以下）","表达 55%：主体与背景有关系、瞬间有意味","规范 15%：未摆拍冒充纪实、未越过伦理边界"]}},"M02-K04":{"title":"找光比找人重要","anchor":"是光造画面，人只是进场","source":"参考：自编讲义（坐标：《美国摄影教程》人像与纪实章节） · 人文街拍上手（按目录对应）","sections":[{"h":"为什么是这样","p":"街道最好的光是傍晚的侧逆光（拉长影子、勾轮廓）与店铺门口的光池。先站到光好的位置，等合适的人走进来。有光的地方，普通的动作也好看；没光的地方，再有趣的人也拍不出层次。街拍的成品率由看的顺序决定：先看光，再看背景，最后才看人。光决定这块地方值不值得等，背景决定画面结构是否干净，人只是最后填入的内容。多数街拍失败不是没拍到人，而是背景本身就是一团乱，人进去只会更乱。所以先找「舞台」，再等「演员」，最后才是按快门。"},{"h":"操作路径","p":"今天的练习：在同一街区找出三处有侧光或逆光的位置。把相机预设成抬手即拍：光圈优先 f/8、最低快门 1/500、ISO 自动上限 6400、区域对焦、静音快门、关掉回放。走位时让画面里有一条明确的水平或垂直线可依靠。用腰平或胸前机位减少压迫感，拍完不要立刻低头看屏，既暴露意图也错过下一个瞬间。每次出门带一个具体命题，收工只挑三张，其余归档不删，半年后回看会有新判断。"},{"h":"边界与代价","p":"典型翻车：在平淡的阴影里等人经过，画面发灰。街拍最大的风险不是拍不到，是越界。可识别的私人场景、儿童、医疗与宗教场所、明显不愿被拍的姿态，都应主动放弃。用长焦远距离偷拍、用连拍扫射人群、把抓拍说成摆拍，都是对这个题材的伤害。技术上要接受错过：好瞬间出现而参数不对是常态，解法是让参数长期处于待发状态，而不是事后惋惜。"},{"h":"怎么判断到位","p":"今天的判据：是光造画面，人只是进场。自检三问：这块背景我先看过再等人的吗？参数是不是一直处于待发状态？这张的拍摄方式我能公开说明吗？"}],"points":["是光造画面，人只是进场","今天只验证这一个变量：能先找有光的地方再等人"],"pitfalls":["在平淡的阴影里等人经过，画面发灰"],"quiz":[{"q":"「找光比找人重要」的判断要点是什么？先说结论再谈理由。","a":"是光造画面，人只是进场","why":"街道最好的光是傍晚的侧逆光（拉长影子、勾轮廓）与店铺门口的光池"},{"q":"有人说：在平淡的阴影里等人经过，画面发灰。这样对吗？","a":"不对。是光造画面，人只是进场","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"在同一街区找出三处有侧光或逆光的位置｜等效 35mm，f/8，1/500，ISO 自动上限 6400，区域对焦","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 30%：焦点落在主体、曝光在容错范围内（每项 5 分制，任一不达标记 3 分以下）","表达 55%：主体与背景有关系、瞬间有意味","规范 15%：未摆拍冒充纪实、未越过伦理边界"]}},"M02-K05":{"title":"干净背景加一个人","anchor":"是背景做减法","source":"参考：自编讲义（坐标：《美国摄影教程》人像与纪实章节） · 人文街拍上手（按目录对应）","sections":[{"h":"为什么是这样","p":"街拍最容易出片的结构是：干净背景（一面墙、一块玻璃、一片天空、一条空街）加一个主体。背景颜色越单纯，人的姿态越突出。用长焦压缩也能把杂乱背景压成色块。街拍的成品率由看的顺序决定：先看光，再看背景，最后才看人。光决定这块地方值不值得等，背景决定画面结构是否干净，人只是最后填入的内容。多数街拍失败不是没拍到人，而是背景本身就是一团乱，人进去只会更乱。所以先找「舞台」，再等「演员」，最后才是按快门。"},{"h":"操作路径","p":"今天的练习：找一面纯色墙或大片玻璃，等一个人经过。把相机预设成抬手即拍：光圈优先 f/8、最低快门 1/500、ISO 自动上限 6400、区域对焦、静音快门、关掉回放。走位时让画面里有一条明确的水平或垂直线可依靠。用腰平或胸前机位减少压迫感，拍完不要立刻低头看屏，既暴露意图也错过下一个瞬间。每次出门带一个具体命题，收工只挑三张，其余归档不删，半年后回看会有新判断。"},{"h":"边界与代价","p":"典型翻车：背景招牌、广告、杂物全部挤进画面。街拍最大的风险不是拍不到，是越界。可识别的私人场景、儿童、医疗与宗教场所、明显不愿被拍的姿态，都应主动放弃。用长焦远距离偷拍、用连拍扫射人群、把抓拍说成摆拍，都是对这个题材的伤害。技术上要接受错过：好瞬间出现而参数不对是常态，解法是让参数长期处于待发状态，而不是事后惋惜。"},{"h":"怎么判断到位","p":"今天的判据：是背景做减法。自检三问：这块背景我先看过再等人的吗？参数是不是一直处于待发状态？这张的拍摄方式我能公开说明吗？"}],"points":["是背景做减法","今天只验证这一个变量：能用简单背景突出主体"],"pitfalls":["背景招牌、广告、杂物全部挤进画面"],"quiz":[{"q":"「干净背景加一个人」的判断要点是什么？先说结论再谈理由。","a":"是背景做减法","why":"街拍最容易出片的结构是：干净背景（一面墙、一块玻璃、一片天空、一条空街）加一个主体"},{"q":"有人说：背景招牌、广告、杂物全部挤进画面。这样对吗？","a":"不对。是背景做减法","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"找一面纯色墙或大片玻璃，等一个人经过｜等效 35mm，f/8，1/500，ISO 自动上限 6400，区域对焦","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 30%：焦点落在主体、曝光在容错范围内（每项 5 分制，任一不达标记 3 分以下）","表达 55%：主体与背景有关系、瞬间有意味","规范 15%：未摆拍冒充纪实、未越过伦理边界"]}},"M02-K06":{"title":"等一个主体走进画面","anchor":"是先构好图再等人","source":"参考：自编讲义（坐标：《美国摄影教程》人像与纪实章节） · 人文街拍上手（按目录对应）","sections":[{"h":"为什么是这样","p":"先把背景、光、构图全部定好，然后等主体进入预定位置再按。这叫提前构图等主体，成功率远高于追着拍。预判人的路线：看方向、看步速、看有没有在打电话（会走直线）。快门延迟要提前算。街拍的成品率由看的顺序决定：先看光，再看背景，最后才看人。光决定这块地方值不值得等，背景决定画面结构是否干净，人只是最后填入的内容。多数街拍失败不是没拍到人，而是背景本身就是一团乱，人进去只会更乱。所以先找「舞台」，再等「演员」，最后才是按快门。"},{"h":"操作路径","p":"今天的练习：选一处好背景，等三个人分别走进同一位置。把相机预设成抬手即拍：光圈优先 f/8、最低快门 1/500、ISO 自动上限 6400、区域对焦、静音快门、关掉回放。走位时让画面里有一条明确的水平或垂直线可依靠。用腰平或胸前机位减少压迫感，拍完不要立刻低头看屏，既暴露意图也错过下一个瞬间。每次出门带一个具体命题，收工只挑三张，其余归档不删，半年后回看会有新判断。"},{"h":"边界与代价","p":"典型翻车：边走边找，永远在追画面。街拍最大的风险不是拍不到，是越界。可识别的私人场景、儿童、医疗与宗教场所、明显不愿被拍的姿态，都应主动放弃。用长焦远距离偷拍、用连拍扫射人群、把抓拍说成摆拍，都是对这个题材的伤害。技术上要接受错过：好瞬间出现而参数不对是常态，解法是让参数长期处于待发状态，而不是事后惋惜。"},{"h":"怎么判断到位","p":"今天的判据：是先构好图再等人。自检三问：这块背景我先看过再等人的吗？参数是不是一直处于待发状态？这张的拍摄方式我能公开说明吗？"}],"points":["是先构好图再等人","今天只验证这一个变量：能提前构图并等时机"],"pitfalls":["边走边找，永远在追画面"],"quiz":[{"q":"「等一个主体走进画面」的判断要点是什么？先说结论再谈理由。","a":"是先构好图再等人","why":"先把背景、光、构图全部定好，然后等主体进入预定位置再按"},{"q":"有人说：边走边找，永远在追画面。这样对吗？","a":"不对。是先构好图再等人","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"选一处好背景，等三个人分别走进同一位置｜等效 35mm，f/8，1/500，ISO 自动上限 6400，区域对焦","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 30%：焦点落在主体、曝光在容错范围内（每项 5 分制，任一不达标记 3 分以下）","表达 55%：主体与背景有关系、瞬间有意味","规范 15%：未摆拍冒充纪实、未越过伦理边界"]}},"M02-K07":{"title":"用影子与反光","anchor":"是找第二层空间","source":"参考：自编讲义（坐标：《美国摄影教程》人像与纪实章节） · 人文街拍上手（按目录对应）","sections":[{"h":"为什么是这样","p":"影子（长影、斜影、栅栏影）能把地面变成画面；反光（水洼、橱窗、车镜、玻璃幕墙）能造出第二个空间，形成对称或错位。拍反光注意角度要低，倒影才完整；浅水洼拍完记得别踩。街拍的成品率由看的顺序决定：先看光，再看背景，最后才看人。光决定这块地方值不值得等，背景决定画面结构是否干净，人只是最后填入的内容。多数街拍失败不是没拍到人，而是背景本身就是一团乱，人进去只会更乱。所以先找「舞台」，再等「演员」，最后才是按快门。"},{"h":"操作路径","p":"今天的练习：在水洼、橱窗、玻璃幕墙各拍一张。把相机预设成抬手即拍：光圈优先 f/8、最低快门 1/500、ISO 自动上限 6400、区域对焦、静音快门、关掉回放。走位时让画面里有一条明确的水平或垂直线可依靠。用腰平或胸前机位减少压迫感，拍完不要立刻低头看屏，既暴露意图也错过下一个瞬间。每次出门带一个具体命题，收工只挑三张，其余归档不删，半年后回看会有新判断。"},{"h":"边界与代价","p":"典型翻车：只拍实体，画面平铺直叙。街拍最大的风险不是拍不到，是越界。可识别的私人场景、儿童、医疗与宗教场所、明显不愿被拍的姿态，都应主动放弃。用长焦远距离偷拍、用连拍扫射人群、把抓拍说成摆拍，都是对这个题材的伤害。技术上要接受错过：好瞬间出现而参数不对是常态，解法是让参数长期处于待发状态，而不是事后惋惜。"},{"h":"怎么判断到位","p":"今天的判据：是找第二层空间。自检三问：这块背景我先看过再等人的吗？参数是不是一直处于待发状态？这张的拍摄方式我能公开说明吗？"}],"points":["是找第二层空间","今天只验证这一个变量：能用影子和倒影造画面"],"pitfalls":["只拍实体，画面平铺直叙"],"quiz":[{"q":"「用影子与反光」的判断要点是什么？先说结论再谈理由。","a":"是找第二层空间","why":"影子（长影、斜影、栅栏影）能把地面变成画面"},{"q":"有人说：只拍实体，画面平铺直叙。这样对吗？","a":"不对。是找第二层空间","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"在水洼、橱窗、玻璃幕墙各拍一张｜等效 35mm，f/8，1/500，ISO 自动上限 6400，区域对焦","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 30%：焦点落在主体、曝光在容错范围内（每项 5 分制，任一不达标记 3 分以下）","表达 55%：主体与背景有关系、瞬间有意味","规范 15%：未摆拍冒充纪实、未越过伦理边界"]}},"M02-K08":{"title":"并置与借位","anchor":"是关系产生意义","source":"参考：自编讲义（坐标：《美国摄影教程》人像与纪实章节） · 人文街拍上手（按目录对应）","sections":[{"h":"为什么是这样","p":"并置是让两个原本无关的元素同框产生对照：广告上的完美人脸与疲惫路人、墙上的大眼与真实的眼睛。借位是让远近物体看似接触（手托太阳、头顶广告牌）。要点是先发现背景，再等合适的人补上另一半。街拍是在不可控的环境里做可控的判断。它的技术含量不高，判断含量极高：要在零点几秒内看出「这个人、这个背景、这一瞬间」三者能不能拼成一个有意味的画面。技术上通常预设好参数——光圈 f/8 保证容错景深、快门 1/500 冻结动作、ISO 自动上限 6400、区域对焦或超焦距，让相机不需要思考，把注意力全部留给观察。构图靠预判：先找到好背景，再等合适的人走进来。"},{"h":"操作路径","p":"今天的练习：找一处广告牌或海报，等行人进入形成对照。流程：先走一遍街区找三到五个“舞台”——有光、有层次、有重复结构的背景；在舞台旁站定，参数预设好，等主体进入预定位置再按快门。距离控制在两到四米，用广角带环境或 35mm 等效视角，太近会让被摄者警觉、太远会失去关系。遇到好瞬间可以先拍再沟通，被质疑时坦诚说明并删除，这是最低的伦理要求。每次出门定一个小主题（雨、影子、橱窗、背影），比漫无目的扫街收成高得多。"},{"h":"边界与代价","p":"典型翻车：每张都是单人，没有关系。街拍的代价是伦理与法律的边界。公共场所拍摄通常可行，但涉及可识别的个人、尤其是弱势群体、儿童、私密场景时应避免；商业使用需要肖像授权。用摆拍冒充抓拍是欺骗，用长焦偷拍是越界。技术上也要接受大量废片：一个下午出一张能看的就算正常，追求百分之百成功率只会让你不敢按快门。别为了戏剧性去干预现场，纪实的价值来自真实。"},{"h":"怎么判断到位","p":"今天的判据：是关系产生意义。先问：这张照片里主体和背景有关系吗，换个人站那儿还成立吗？再问：这个瞬间是不可重复的吗？最后问：如果被摄者当场问我为什么拍，我能坦然解释吗？三问都过，这张才值得留。"}],"points":["是关系产生意义","今天只验证这一个变量：能用两个元素的关系表达意味"],"pitfalls":["每张都是单人，没有关系"],"quiz":[{"q":"「并置与借位」的判断要点是什么？先说结论再谈理由。","a":"是关系产生意义","why":"并置是让两个原本无关的元素同框产生对照：广告上的完美人脸与疲惫路人、墙上的大眼与真实的眼睛"},{"q":"有人说：每张都是单人，没有关系。这样对吗？","a":"不对。是关系产生意义","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"找一处广告牌或海报，等行人进入形成对照｜等效 35mm，f/8，1/500，ISO 自动上限 6400，区域对焦","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 30%：焦点落在主体、曝光在容错范围内（每项 5 分制，任一不达标记 3 分以下）","表达 55%：主体与背景有关系、瞬间有意味","规范 15%：未摆拍冒充纪实、未越过伦理边界"]}},"M02-K09":{"title":"雨天的街","anchor":"是雨给反光与氛围","source":"参考：自编讲义（坐标：《美国摄影教程》人像与纪实章节） · 人文街拍上手（按目录对应）","sections":[{"h":"为什么是这样","p":"雨天是街拍的黄金天气：地面成镜、颜色饱和、伞与雨衣提供色彩与形状、玻璃水珠能做前景。注意保护器材（雨罩或塑料袋），快门保持 1/250 以上凝固雨丝，慢门可拉出雨线。夜雨加霓虹最好看。街拍是在不可控的环境里做可控的判断。它的技术含量不高，判断含量极高：要在零点几秒内看出「这个人、这个背景、这一瞬间」三者能不能拼成一个有意味的画面。技术上通常预设好参数——光圈 f/8 保证容错景深、快门 1/500 冻结动作、ISO 自动上限 6400、区域对焦或超焦距，让相机不需要思考，把注意力全部留给观察。构图靠预判：先找到好背景，再等合适的人走进来。"},{"h":"操作路径","p":"今天的练习：雨天拍一组：伞、倒影、玻璃水珠。流程：先走一遍街区找三到五个“舞台”——有光、有层次、有重复结构的背景；在舞台旁站定，参数预设好，等主体进入预定位置再按快门。距离控制在两到四米，用广角带环境或 35mm 等效视角，太近会让被摄者警觉、太远会失去关系。遇到好瞬间可以先拍再沟通，被质疑时坦诚说明并删除，这是最低的伦理要求。每次出门定一个小主题（雨、影子、橱窗、背影），比漫无目的扫街收成高得多。"},{"h":"边界与代价","p":"典型翻车：下雨就收工。街拍的代价是伦理与法律的边界。公共场所拍摄通常可行，但涉及可识别的个人、尤其是弱势群体、儿童、私密场景时应避免；商业使用需要肖像授权。用摆拍冒充抓拍是欺骗，用长焦偷拍是越界。技术上也要接受大量废片：一个下午出一张能看的就算正常，追求百分之百成功率只会让你不敢按快门。别为了戏剧性去干预现场，纪实的价值来自真实。"},{"h":"怎么判断到位","p":"今天的判据：是雨给反光与氛围。先问：这张照片里主体和背景有关系吗，换个人站那儿还成立吗？再问：这个瞬间是不可重复的吗？最后问：如果被摄者当场问我为什么拍，我能坦然解释吗？三问都过，这张才值得留。"}],"points":["是雨给反光与氛围","今天只验证这一个变量：能在坏天气里拍到好画面"],"pitfalls":["下雨就收工"],"quiz":[{"q":"「雨天的街」的判断要点是什么？先说结论再谈理由。","a":"是雨给反光与氛围","why":"雨天是街拍的黄金天气：地面成镜、颜色饱和、伞与雨衣提供色彩与形状、玻璃水珠能做前景"},{"q":"有人说：下雨就收工。这样对吗？","a":"不对。是雨给反光与氛围","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"雨天拍一组：伞、倒影、玻璃水珠｜等效 35mm，f/8，1/500，ISO 自动上限 6400，区域对焦","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 30%：焦点落在主体、曝光在容错范围内（每项 5 分制，任一不达标记 3 分以下）","表达 55%：主体与背景有关系、瞬间有意味","规范 15%：未摆拍冒充纪实、未越过伦理边界"]}},"M02-K10":{"title":"不打扰的距离","anchor":"是靠近但不侵入","source":"参考：自编讲义（坐标：《美国摄影教程》人像与纪实章节） · 人文街拍上手（按目录对应）","sections":[{"h":"为什么是这样","p":"两米左右是最有临场感的距离，但需要自信与礼貌。用广角侧身拍、假装在拍别处、拍完微笑点头。若对方皱眉或摆手，立即放下相机并示意抱歉。距离近换来的画面张力，是长焦给不了的。街拍是在不可控的环境里做可控的判断。它的技术含量不高，判断含量极高：要在零点几秒内看出「这个人、这个背景、这一瞬间」三者能不能拼成一个有意味的画面。技术上通常预设好参数——光圈 f/8 保证容错景深、快门 1/500 冻结动作、ISO 自动上限 6400、区域对焦或超焦距，让相机不需要思考，把注意力全部留给观察。构图靠预判：先找到好背景，再等合适的人走进来。"},{"h":"操作路径","p":"今天的练习：用等效 35mm 在两米内拍，练习不被察觉。流程：先走一遍街区找三到五个“舞台”——有光、有层次、有重复结构的背景；在舞台旁站定，参数预设好，等主体进入预定位置再按快门。距离控制在两到四米，用广角带环境或 35mm 等效视角，太近会让被摄者警觉、太远会失去关系。遇到好瞬间可以先拍再沟通，被质疑时坦诚说明并删除，这是最低的伦理要求。每次出门定一个小主题（雨、影子、橱窗、背影），比漫无目的扫街收成高得多。"},{"h":"边界与代价","p":"典型翻车：举着长焦隔着马路偷拍，画面疏离。街拍的代价是伦理与法律的边界。公共场所拍摄通常可行，但涉及可识别的个人、尤其是弱势群体、儿童、私密场景时应避免；商业使用需要肖像授权。用摆拍冒充抓拍是欺骗，用长焦偷拍是越界。技术上也要接受大量废片：一个下午出一张能看的就算正常，追求百分之百成功率只会让你不敢按快门。别为了戏剧性去干预现场，纪实的价值来自真实。"},{"h":"怎么判断到位","p":"今天的判据：是靠近但不侵入。先问：这张照片里主体和背景有关系吗，换个人站那儿还成立吗？再问：这个瞬间是不可重复的吗？最后问：如果被摄者当场问我为什么拍，我能坦然解释吗？三问都过，这张才值得留。"}],"points":["是靠近但不侵入","今天只验证这一个变量：能找到既自然又不冒犯的拍摄位置"],"pitfalls":["举着长焦隔着马路偷拍，画面疏离"],"quiz":[{"q":"「不打扰的距离」的判断要点是什么？先说结论再谈理由。","a":"是靠近但不侵入","why":"两米左右是最有临场感的距离，但需要自信与礼貌"},{"q":"有人说：举着长焦隔着马路偷拍，画面疏离。这样对吗？","a":"不对。是靠近但不侵入","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"用等效 35mm 在两米内拍，练习不被察觉｜等效 35mm，f/8，1/500，ISO 自动上限 6400，区域对焦","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 30%：焦点落在主体、曝光在容错范围内（每项 5 分制，任一不达标记 3 分以下）","表达 55%：主体与背景有关系、瞬间有意味","规范 15%：未摆拍冒充纪实、未越过伦理边界"]}},"M02-K11":{"title":"街拍的边界","anchor":"是公共场合也有底线","source":"参考：自编讲义（坐标：《美国摄影教程》人像与纪实章节） · 人文街拍上手（按目录对应）","sections":[{"h":"为什么是这样","p":"不拍：隐私部位、私密场景、明确拒绝的人、可能造成伤害的处境。不发：未经同意且可识别的商业使用、带住址定位信息、涉及未成年人敏感的。被要求删除就删。法律底线之上还有一条：你想被怎样对待。街拍的成品率由看的顺序决定：先看光，再看背景，最后才看人。光决定这块地方值不值得等，背景决定画面结构是否干净，人只是最后填入的内容。多数街拍失败不是没拍到人，而是背景本身就是一团乱，人进去只会更乱。所以先找「舞台」，再等「演员」，最后才是按快门。"},{"h":"操作路径","p":"今天的练习：写出三条你不会拍的情形与三条不会发的情形。把相机预设成抬手即拍：光圈优先 f/8、最低快门 1/500、ISO 自动上限 6400、区域对焦、静音快门、关掉回放。走位时让画面里有一条明确的水平或垂直线可依靠。用腰平或胸前机位减少压迫感，拍完不要立刻低头看屏，既暴露意图也错过下一个瞬间。每次出门带一个具体命题，收工只挑三张，其余归档不删，半年后回看会有新判断。"},{"h":"边界与代价","p":"典型翻车：把可识别的困境者照片配上戏谑文案发布。街拍最大的风险不是拍不到，是越界。可识别的私人场景、儿童、医疗与宗教场所、明显不愿被拍的姿态，都应主动放弃。用长焦远距离偷拍、用连拍扫射人群、把抓拍说成摆拍，都是对这个题材的伤害。技术上要接受错过：好瞬间出现而参数不对是常态，解法是让参数长期处于待发状态，而不是事后惋惜。"},{"h":"怎么判断到位","p":"今天的判据：是公共场合也有底线。自检三问：这块背景我先看过再等人的吗？参数是不是一直处于待发状态？这张的拍摄方式我能公开说明吗？"}],"points":["是公共场合也有底线","今天只验证这一个变量：能判断哪些不能拍不能发"],"pitfalls":["把可识别的困境者照片配上戏谑文案发布"],"quiz":[{"q":"「街拍的边界」的判断要点是什么？先说结论再谈理由。","a":"是公共场合也有底线","why":"不拍：隐私部位、私密场景、明确拒绝的人、可能造成伤害的处境"},{"q":"有人说：把可识别的困境者照片配上戏谑文案发布。这样对吗？","a":"不对。是公共场合也有底线","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"写出三条你不会拍的情形与三条不会发的情形｜等效 35mm，f/8，1/500，ISO 自动上限 6400，区域对焦","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 30%：焦点落在主体、曝光在容错范围内（每项 5 分制，任一不达标记 3 分以下）","表达 55%：主体与背景有关系、瞬间有意味","规范 15%：未摆拍冒充纪实、未越过伦理边界"]}},"M02-K12":{"title":"十二张一组","anchor":"是有开场有转折有落点","source":"参考：自编讲义（坐标：《美国摄影教程》人像与纪实章节） · 人文街拍上手（按目录对应）","sections":[{"h":"为什么是这样","p":"结构参考：一张环境（这是哪）、三四张人物（这是谁）、两三张细节（手、鞋、招牌、影子）、一张情绪高点、一张收尾（空镜或背影）。避免连续同景别。写完两句说明再回看，就知道哪张多余。街拍的成品率由看的顺序决定：先看光，再看背景，最后才看人。光决定这块地方值不值得等，背景决定画面结构是否干净，人只是最后填入的内容。多数街拍失败不是没拍到人，而是背景本身就是一团乱，人进去只会更乱。所以先找「舞台」，再等「演员」，最后才是按快门。"},{"h":"操作路径","p":"今天的练习：从两小时拍摄里挑十二张排出顺序并写两句说明。把相机预设成抬手即拍：光圈优先 f/8、最低快门 1/500、ISO 自动上限 6400、区域对焦、静音快门、关掉回放。走位时让画面里有一条明确的水平或垂直线可依靠。用腰平或胸前机位减少压迫感，拍完不要立刻低头看屏，既暴露意图也错过下一个瞬间。每次出门带一个具体命题，收工只挑三张，其余归档不删，半年后回看会有新判断。"},{"h":"边界与代价","p":"典型翻车：每张都抓眼，但彼此无关。街拍最大的风险不是拍不到，是越界。可识别的私人场景、儿童、医疗与宗教场所、明显不愿被拍的姿态，都应主动放弃。用长焦远距离偷拍、用连拍扫射人群、把抓拍说成摆拍，都是对这个题材的伤害。技术上要接受错过：好瞬间出现而参数不对是常态，解法是让参数长期处于待发状态，而不是事后惋惜。"},{"h":"怎么判断到位","p":"今天的判据：是有开场有转折有落点。自检三问：这块背景我先看过再等人的吗？参数是不是一直处于待发状态？这张的拍摄方式我能公开说明吗？"}],"points":["是有开场有转折有落点","今天只验证这一个变量：能把一次扫街编成一组"],"pitfalls":["每张都抓眼，但彼此无关"],"quiz":[{"q":"「十二张一组」的判断要点是什么？先说结论再谈理由。","a":"是有开场有转折有落点","why":"结构参考：一张环境（这是哪）、三四张人物（这是谁）、两三张细节（手、鞋、招牌、影子）、一张情绪高点、一张收尾（空镜或背影）"},{"q":"有人说：每张都抓眼，但彼此无关。这样对吗？","a":"不对。是有开场有转折有落点","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"从两小时拍摄里挑十二张排出顺序并写两句说明｜等效 35mm，f/8，1/500，ISO 自动上限 6400，区域对焦","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 30%：焦点落在主体、曝光在容错范围内（每项 5 分制，任一不达标记 3 分以下）","表达 55%：主体与背景有关系、瞬间有意味","规范 15%：未摆拍冒充纪实、未越过伦理边界"]}}};

function pad(n){ return n < 10 ? '0' + n : '' + n; }
function iso(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function today(){ return iso(new Date()); }
function parseISO(s){ var a = s.split('-'); return new Date(+a[0], +a[1]-1, +a[2]); }
function wd(s){ return ['周日','周一','周二','周三','周四','周五','周六'][parseISO(s).getDay()]; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

// ---------- 计划索引 ----------
var MODIDX = {"人像上手": 1, "人文街拍上手": 2};
var MODTOTAL = {"人像上手": 12, "人文街拍上手": 12};
var BYDAY = {};          // 日期 -> 行

var NEWROW = {};         // key -> 行

function keyOf(r){

  for (var j = 0; j < PLAN.length; j++) {

  }
  return 'M' + pad(mIdx) + '-K' + pad(kIdx);
}

PLAN.forEach(function(r){
  BYDAY[r[0]] = r;

    NEWROW[key] = r;
    for (var i = 11; i <= 15; i++) {
      if (!r[i]) continue;
      (REV[r[i]] = REV[r[i]] || []).push({key: key, title: r[5], stage: ['D1','D3','D7','D14','D30'][i-11], from: r[0], tag: r[17]});
    }

});
function keyOf(r){

var state = {tab: 'today', quiz: [], qi: 0, matOpen: null};

function render(){

    b.classList.toggle('on', b.dataset.t === state.tab);
  });
  $('#hd').textContent = ('0' + APP_VER).slice(-5);
  if (state.tab === 'today') vToday();
  else if (state.tab === 'quiz') vQuiz();
  else if (state.tab === 'cards') vCards();
  else if (state.tab === 'stats') vStats();
  else vMats();
}

function vToday(){
  var di = dayInfo(), r = di.row, v = $('#view'), t = today();
  var done = lsGet('done.' + t, null);
  var due = REV[t] || [];
  var h = '';

    h += '<div class="card" style="border-color:var(--warn)"><h2>计划区间外</h2><p class="muted" style="margin:0">' +
      (di.early ? '计划尚未开始，先看首日预览。' : '主周期已结束，已为你停在最后一天；请进入长期循环（见使用说明）。') +
      '</p></div>';
  }
  h += '<div class="card hero"><div class="k">第 ' + r[2] + ' 天 · ' + r[1] + ' · ' + r[3] + '</div>' +
       '<div class="t">' + esc(r[5]) + '</div>' +
       '<div class="s">' + esc(r[4]) + ' · ' + esc(r[6]) + '</div>' +
       '<div style="margin-top:10px"><span class="pill ' + (r[16]||'B').toLowerCase() + '">优先级 ' + esc(r[16]) + '</span>' +
       '<span class="pill">' + esc(r[17] || '综合') + '</span></div></div>';

  if (r[3] === '新知识点') {
    h += '<div class="card"><h2>今天要验证的一个变量</h2><p class="v" style="margin-bottom:0">' +
         esc((MATERIALS[keyOf(r)] || {}).anchor || r[8]) + '</p></div>';
    h += '<div class="card"><h2>学习目标</h2><p class="v" style="margin-bottom:0">' + esc(r[7]) + '</p></div>';
    h += '<div class="card"><h2>练习任务</h2><p class="v" style="margin-bottom:0">' + esc(r[9]) + '</p></div>';
    h += '<div class="card"><h2>任务卡</h2>' + taskCardHTML(keyOf(r)) + '</div>';
    h += '<div class="card"><h2>今日动作</h2><div class="row">' +
         '<button class="btn primary" id="bopen">打开精讲</button>' +
         '<button class="btn ' + (done ? '' : 'primary') + '" id="bdone">' + (done ? '已完成 ✓' : '标记完成') + '</button>' +
         '</div><p class="muted" style="margin:8px 0 0">完成标准：有交付物（成片 1–3 张 + 失败对照 1 张），不看时长。</p></div>';
  } else {
    h += '<div class="card"><h2>今日动作</h2><p class="v">' + esc(r[9]) + '</p>' +
         '<div class="row"><button class="btn primary" id="bdone">' + (done ? '已完成 ✓' : '标记完成') + '</button>' +
         '<button class="btn" id="btostats">看统计</button></div></div>';
  }

  if (due.length) {
    h += '<div class="card"><h2>到期复习 · ' + due.length + ' 条</h2><ul class="clean">';
    due.forEach(function(d){
      h += '<li>' + esc(d.stage) + ' · ' + esc(d.title) + '<span class="tag">' + esc(d.tag || '') + '</span></li>';
    });
    h += '</ul><div class="row"><button class="btn" id="bquiz">去答题</button></div></div>';
  }
  v.innerHTML = h;

  var bo = $('#bopen'); if (bo) bo.onclick = function(){ openReader(keyOf(r)); };
  var bd = $('#bdone'); if (bd) bd.onclick = function(){
    var m = lsGet('done.' + t, {});
    m.new = true; m.minutes = m.minutes || 60; m.date = t;
    lsSet('done.' + t, m);
    toast('已记录');
    render();
  };
  var bq = $('#bquiz'); if (bq) bq.onclick = function(){ state.tab = 'quiz'; state.quiz = []; render(); };
  var bs = $('#btostats'); if (bs) bs.onclick = function(){ state.tab = 'stats'; render(); };
}

function taskCardHTML(key){
  var m = MATERIALS[key] || {};
  var tc = m.task_card;
  if (!tc) return '<p class="muted">暂无任务卡</p>';
  var h = '<p class="k">设定</p><p class="v">' + esc(tc.setup) + '</p>' +
          '<p class="k">交付</p><p class="v">' + esc(tc.deliverable) + '</p>' +
          '<p class="k">评分（三维）</p><ul class="clean">';
  (tc.rubric || []).forEach(function(x){ h += '<li>' + esc(x) + '</li>'; });
  h += '</ul>';
  if (m.pitfalls && m.pitfalls.length)
    h += '<p class="k" style="margin-top:10px">失败样本</p><p class="v" style="margin-bottom:0">' + esc(m.pitfalls[0]) + '</p>';
  return h;
}

function vQuiz(){
  var t = today(), v = $('#view');
  if (!state.quiz.length) {
    var di = dayInfo();
    var pool = [];
    if (di.row[3] === '新知识点') pool.push(keyOf(di.row));
    (REV[t] || []).forEach(function(d){ if (pool.indexOf(d.key) < 0) pool.push(d.key); });
    if (!pool.length) {
      v.innerHTML = '<div class="card"><h2>今天没有待答的题</h2><p class="muted" style="margin:0">当日无新知识点也没有到期复习。可以去「材料」页自由复习。</p></div>';
      return;
    }
    state.quiz = pool.slice(0, 5); state.qi = 0;
  }
  var key = state.quiz[state.qi], m = MATERIALS[key] || {};
  var qs = (m.quiz || []).slice(0, 2);
  var rec = lsGet('quiz.' + t, []);
  var mine = null;
  rec.forEach(function(x){ if (x.key === key) mine = x.self; });
  var h = '<div class="card"><div class="k">第 ' + (state.qi+1) + ' / ' + state.quiz.length + ' 题 · ' + esc(key) + '</div>' +
          '<h2>' + esc(m.title || key) + '</h2>';
  if (!qs.length) h += '<p class="muted">该点暂无自测题</p>';
  qs.forEach(function(q){
    h += '<div class="q"><p class="stem">' + esc(q.q) + '</p>' +
         '<button class="btn ghost" style="min-height:36px;font-size:13px;padding:0 10px" onclick="var p=this.parentNode;p.classList.toggle(\'open\')">显示答案</button>' +
         '<p class="ans"><b>答：</b>' + esc(q.a) + '<br><b>为什么：</b>' + esc(q.why) + '</p></div>';
  });
  h += '<p class="k" style="margin-top:12px">三档自评</p><div class="tri">' +
       ['会','模糊','不会'].map(function(s){
         return '<button data-s="' + s + '" class="' + (mine === s ? 'on' : '') + '">' + s + '</button>';
       }).join('') + '</div>' +
       '<p class="muted" style="margin:10px 0 0">规则：会→进入下一档；模糊→间隔减半；不会→回到 D1 并进错题本。</p>';
  h += '</div><div class="row"><button class="btn" id="bprev"' + (state.qi === 0 ? ' disabled' : '') + '>上一题</button>' +
       '<button class="btn primary" id="bnext">' + (state.qi === state.quiz.length-1 ? '完成' : '下一题') + '</button></div>';
  v.innerHTML = h;
  v.querySelectorAll('.tri button').forEach(function(b){
    b.onclick = function(){
      var arr = lsGet('quiz.' + t, []);
      var found = false;
      arr.forEach(function(x){ if (x.key === key) { x.self = b.dataset.s; found = true; } });
      if (!found) arr.push({key: key, self: b.dataset.s, at: t});
      lsSet('quiz.' + t, arr);
      v.querySelectorAll('.tri button').forEach(function(z){ z.classList.remove('on'); });
      b.classList.add('on');
      toast('已记录：' + b.dataset.s);
    };
  });
  $('#bprev').onclick = function(){ if (state.qi > 0) { state.qi--; render(); } };
  $('#bnext').onclick = function(){
    if (state.qi < state.quiz.length-1) { state.qi++; render(); }
    else { state.quiz = []; state.tab = 'today'; toast('答题完成'); render(); }
  };
}

function vCards(){
  var t = today(), v = $('#view');
  var all = [];
  Object.keys(NEWROW).forEach(function(k){
    var r = NEWROW[k];
    all.push({key: k, title: r[5], mod: r[4], tag: r[17]});
  });
  var reads = lsGet('read', {});
  var quiz = lsGet('quiz.' + t, []);
  var selfMap = {};
  Object.keys(lsGet('allquiz', {})).forEach(function(d){
    lsGet('allquiz', {})[d].forEach(function(x){ selfMap[x.key] = x.self; });
  });
  quiz.forEach(function(x){ selfMap[x.key] = x.self; });
  var h = '<div class="card"><h2>卡片库 · ' + all.length + ' 张</h2>' +
    '<p class="muted" style="margin:0 0 10px">只读展示；导出为 CSV（key/正面/背面/标签/自评）。</p>' +
    '<div class="row"><button class="btn" id="bexp">导出 CSV</button>' +
    '<button class="btn" id="bexpjson">导出进度 JSON</button>' +
    '<button class="btn" id="bimp">导入 JSON</button></div></div>';
  h += '<div class="card"><table><thead><tr><th>知识点</th><th>自评</th><th>已读</th></tr></thead><tbody>';
  all.forEach(function(c){
    var m = MATERIALS[c.key] || {};
    h += '<tr><td>' + esc(c.title) + '<div class="muted">' + esc(c.tag) + '</div></td>' +
         '<td>' + esc(selfMap[c.key] || '—') + '</td>' +
         '<td>' + (reads[c.key] ? '✓' : '') + '</td></tr>';
  });
  h += '</tbody></table></div>';
  v.innerHTML = h;
  $('#bexp').onclick = function(){
    var rows = [['key','正面','背面','标签','自评']];
    all.forEach(function(c){
      var m = MATERIALS[c.key] || {};
      rows.push([c.key, '「' + c.title + '」的判断要点是什么？', (m.anchor || '') + '｜' + ((m.pitfalls||[])[0] || ''), c.tag || '', selfMap[c.key] || '']);
    });
    download('卡片库-' + SCHEME + '.csv', '\ufeff' + rows.map(function(r){ return r.map(function(x){ return '"' + String(x).replace(/"/g,'""') + '"'; }).join(','); }).join('\r\n'), 'text/csv');
  };
  $('#bexpjson').onclick = function(){
    var dump = {meta:{ver: APP_VER, scheme: SCHEME, exported: new Date().toISOString()}, data:{}};
    try{
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k.indexOf(PFX) === 0) dump.data[k.slice(PFX.length)] = JSON.parse(localStorage.getItem(k));
      }
    }catch(e){}
    download('进度-' + SCHEME + '-' + today() + '.json', JSON.stringify(dump, null, 1), 'application/json');
  };
  $('#bimp').onclick = function(){
    var inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json';
    inp.onchange = function(){
      var f = inp.files[0]; if (!f) return;
      var rd = new FileReader();
      rd.onload = function(){
        try{
          var o = JSON.parse(rd.result);
          if (!o.data) throw new Error('格式不符');
          Object.keys(o.data).forEach(function(k){ lsSet(k, o.data[k]); });
          toast('已导入');
          render();
        }catch(e){ toast('导入失败：' + e.message); }
      };
      rd.readAsText(f, 'utf-8');
    };
    inp.click();
  };
}

function vStats(){
  var v = $('#view'), done = lsGet('doneMap', {});
  var doneDates = [];
  Object.keys(localStorage).forEach(function(k){
    if (k.indexOf(PFX + 'done.') === 0) doneDates.push(k.slice((PFX + 'done.').length));
  });
  var started = PLAN[0][0], t = today();
  var elapsed = Math.max(1, Math.round((parseISO(t) - parseISO(started))/86400000) + 1);
  var totalPlan = PLAN.length;
  var doneN = doneDates.length;
  var streak = 0, cur = new Date();
  for (var i = 0; i < 400; i++) {
    var k2 = 'done.' + iso(cur);
    var has = false;
    try{ has = !!localStorage.getItem(PFX + k2); }catch(e){}
    if (has) { streak++; cur.setDate(cur.getDate() - 1); }
    else if (i === 0) { cur.setDate(cur.getDate() - 1); }
    else break;
  }
  // 逾期积压
  var backlog = 0;
  Object.keys(REV).forEach(function(d){
    if (d < t && d >= started) {
      var r = BYDAY[d];
      if (!r) return;
      var rec = lsGet('quiz.' + d, null);
      if (!rec) backlog += REV[d].length;
    }
  });
  // 方向矩阵
  var agg = {};
  Object.keys(localStorage).forEach(function(k){
    if (k.indexOf(PFX + 'quiz.') !== 0) return;
    var d = k.slice((PFX+'quiz.').length);
    try{
      JSON.parse(localStorage.getItem(k)).forEach(function(x){
        var r0 = NEWROW[x.key]; if (!r0) return;
        var tag = r0[17] || '综合';
        var s = x.self === '会' ? 5 : x.self === '模糊' ? 3 : 1;
        (agg[tag] = agg[tag] || {n: 0, s: 0}).n++;
        agg[tag].s += s;
      });
    }catch(e){}
  });
  var h = '<div class="grid">' +
    '<div class="stat"><div class="n">' + doneN + '</div><div class="l">已完成天数</div></div>' +
    '<div class="stat"><div class="n">' + Math.min(100, Math.round(doneN/Math.max(elapsed,1)*100)) + '%</div><div class="l">区间完成率</div></div>' +
    '<div class="stat"><div class="n">' + streak + '</div><div class="l">连续天数</div></div>' +
    '<div class="stat"><div class="n">' + backlog + '</div><div class="l">逾期复习条数</div></div>' +
    '</div>';
  h += '<div class="card"><h2>模块掌握</h2>';
  Object.keys(MODIDX).forEach(function(mod){
    var tot = MODTOTAL[mod] || 0;
    var dn = 0;
    Object.keys(NEWROW).forEach(function(k){
      if (NEWROW[k][4] === mod) {
        try{ if (localStorage.getItem(PFX + 'done.' + NEWROW[k][0])) dn++; }catch(e){}
      }
    });
    var p = tot ? Math.round(dn/tot*100) : 0;
    h += '<div style="margin:0 0 10px"><div style="display:flex;justify-content:space-between;font-size:14px">' +
         '<span>' + esc(mod) + '</span><span class="muted">' + dn + '/' + tot + '</span></div>' +
         '<div class="bar-o"><div class="bar-i" style="width:' + p + '%"></div></div></div>';
  });
  h += '</div>';
  h += '<div class="card"><h2>题材 × 自评矩阵</h2>';
  var keys = Object.keys(agg);
  if (!keys.length) h += '<p class="muted" style="margin:0">还没有答题记录</p>';
  else {
    h += '<table><thead><tr><th>题材</th><th>答题数</th><th>均分</th></tr></thead><tbody>';
    keys.sort(function(a,b){ return agg[a].s/agg[a].n - agg[b].s/agg[b].n; }).forEach(function(k3){
      h += '<tr><td>' + esc(k3) + '</td><td>' + agg[k3].n + '</td><td>' + (agg[k3].s/agg[k3].n).toFixed(1) + '</td></tr>';
    });
    h += '</tbody></table><p class="muted" style="margin:8px 0 0">均分最低的两题材进下周复盘重点。</p>';
  }
  h += '</div>';
  v.innerHTML = h;
}

function vMats(){
  var v = $('#view');
  var reads = lsGet('read', {});
  var h = '<div class="card"><h2>材料 · 按模块</h2><p class="muted" style="margin:0">点击进入阅读层；读完点「标记已读」。</p></div>';
  Object.keys(MODIDX).forEach(function(mod){
    var ks = Object.keys(NEWROW).filter(function(k){ return NEWROW[k][4] === mod; });
    if (!ks.length) return;
    h += '<div class="card"><h2>' + esc(mod) + ' <span class="muted">' + ks.filter(function(k){return reads[k];}).length + '/' + ks.length + '</span></h2><ul class="clean">';
    ks.forEach(function(k){
      h += '<li><a href="#" data-k="' + k + '" style="color:var(--fg);text-decoration:none">' +
        (reads[k] ? '✓ ' : '') + esc(NEWROW[k][5]) + '</a><span class="tag">' + esc(NEWROW[k][17]||'') + '</span></li>';
    });
    h += '</ul></div>';
  });
  v.innerHTML = h;
  v.querySelectorAll('a[data-k]').forEach(function(a){
    a.onclick = function(e){ e.preventDefault(); openReader(a.dataset.k); };
  });
}

function openReader(key){
  var m = MATERIALS[key] || {};
  var r = NEWROW[key];
  $('#rtitle').textContent = m.title || (r ? r[5] : key);
  var h = '<h2>' + esc(m.title || key) + '</h2><p class="muted">' + esc(m.source || '') + ' · ' + esc(key) + '</p>';
  if (m.anchor) h += '<p style="border-left:3px solid var(--accent);padding-left:12px;color:var(--accent)">' + esc(m.anchor) + '</p>';
  (m.sections || []).forEach(function(s){ h += '<h3>' + esc(s.h) + '</h3><p>' + esc(s.p) + '</p>'; });
  if (m.points && m.points.length) {
    h += '<h3>要点</h3><ul class="clean">' + m.points.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
  }
  if (m.pitfalls && m.pitfalls.length) {
    h += '<h3>易错与失败样本</h3><ul class="clean">' + m.pitfalls.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
  }
  if (m.task_card) {
    h += '<h3>任务卡</h3><p><b>设定：</b>' + esc(m.task_card.setup) + '</p><p><b>交付：</b>' + esc(m.task_card.deliverable) + '</p>';
    h += '<ul class="clean">' + m.task_card.rubric.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
  }
  if (m.quiz && m.quiz.length) {
    h += '<h3>自测</h3>';
    m.quiz.forEach(function(q){
      h += '<p><b>' + esc(q.q) + '</b><br>' + esc(q.a) + '<br><span class="muted">' + esc(q.why) + '</span></p>';
    });
  }
  $('#rbody').innerHTML = h;
  $('#rbody').scrollTop = 0;
  $('#reader').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  $('#rdone').onclick = function(){
    var reads = lsGet('read', {}); reads[key] = 1; lsSet('read', reads);
    toast('已标记已读');
  };
}
$('#rback').onclick = function(){
  $('#reader').classList.add('hidden');
  document.body.style.overflow = '';
  render();
};

function toast(msg){
  var d = document.createElement('div');
  d.textContent = msg;
  d.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + max(env(safe-area-inset-bottom),10px));z-index:99;background:rgba(20,22,26,.9);color:#fff;padding:8px 14px;border-radius:10px;font-size:14px';
  document.body.appendChild(d);
  setTimeout(function(){ d.remove(); }, 1600);
}
function download(name, text, mime){
  var b = new Blob([text], {type: mime + ';charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
}

// 主题
var th = lsGet('theme', null);
if (th) document.documentElement.setAttribute('data-theme', th);
$('#theme').onclick = function(){
  var cur = document.documentElement.getAttribute('data-theme');
  var next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  lsSet('theme', next);
};
document.querySelectorAll('nav button').forEach(function(b){
  b.onclick = function(){ state.tab = b.dataset.t; state.quiz = []; state.qi = 0; render(); window.scrollTo(0,0); };
});
render();
})();

</div>
<script>
/* 「更新」按钮：比对 version.json 的 build，不一致即清缓存+注销 SW+硬重载 */
(function(){
  var b=document.getElementById('pvUpd'); if(!b) return;
  var m=document.querySelector('meta[name="pv-build"]'); var local=m?m.getAttribute('content'):'';
  var t0=b.textContent;
  function say(t,ms){ b.textContent=t; setTimeout(function(){ b.textContent=t0; }, ms||1600); }
  function hard(){
    try{ if('caches' in window){ caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }).catch(function(){}); } }catch(e){}
    try{ if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){ navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ try{ r.unregister(); }catch(e){} }); }); } }catch(e){}
    setTimeout(function(){ var u=location.href.split('#')[0]; var sep=u.indexOf('?')>=0?'&':'?'; try{ location.replace(u+sep+'t='+Date.now()); }catch(e){ location.reload(); } },150);
  }
  b.addEventListener('click', function(){
    if(!/^https?:/i.test(location.protocol)){ hard(); return; }
    var base = location.pathname.indexOf('/tools/') >= 0 ? '../' : '';
    say('检查中');
    fetch(base+'version.json?t='+Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(j){
