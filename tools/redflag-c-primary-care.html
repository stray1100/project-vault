何禁输血小板；③写出首选治疗；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","chapter":"基层指南 · 血液病转诊"},{"n":80,"w":12,"d":3,"kind":"new","title":"过敏性休克：肾上腺素肌注优先","mod":"肿瘤血液皮肤与过敏急症","mod_i":8,"priority":"A","tag":"过敏","goal":"能在 60 秒内给出肾上腺素剂量与部位并说明为何不用抗组胺替代","key_point":"接触后数分钟内荨麻疹/喉头水肿/支气管痉挛+低血压=过敏性休克；肾上腺素 0.3–0.5mg 大腿外侧肌注，5–15 分钟可重复；抗组胺与激素是辅助","practice":"①写出剂量与部位；②写出重复间隔；③说明为何不能只给激素；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","chapter":"基层指南 · 严重过敏反应处置"},{"n":81,"w":12,"d":4,"kind":"new","title":"重症药疹：SJS/TEN 的体表面积","mod":"肿瘤血液皮肤与过敏急症","mod_i":8,"priority":"B","tag":"皮肤","goal":"能按表皮剥脱面积分型并说出停药与转诊时限","key_point":"SJS<10% 体表面积、SJS/TEN 重叠 10–30%、TEN>30%；黏膜受累+发热+疼痛性皮疹+尼氏征阳性；立即停可疑药，尽早转烧伤/皮肤重症病房","practice":"①写出分型阈值；②写出尼氏征检查；③说明为何要算体表面积；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","chapter":"基层指南 · 药疹识别与转诊"},{"n":82,"w":12,"d":5,"kind":"new","title":"风湿急症：巨细胞动脉炎与狼疮脑病","mod":"肿瘤血液皮肤与过敏急症","mod_i":8,"priority":"B","tag":"风湿","goal":"能在 >50 岁新发头痛/视力改变时立即用激素","key_point":">50 岁新发颞部头痛、下颌跛行、视力模糊、ESR 显著升高=巨细胞动脉炎，激素不能因等待活检而延迟；狼疮患者新发癫痫/精神症状需排除感染后按神经狼疮处理","practice":"①写出 GCA 4 条线索；②说明激素与活检的先后；③写出狼疮脑病的鉴别顺序；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","chapter":"基层指南 · 风湿病转诊"},{"n":83,"w":12,"d":6,"kind":"new","title":"特殊人群红旗：老年、孕产、儿童","mod":"肿瘤血液皮肤与过敏急症","mod_i":8,"priority":"A","tag":"特殊人群","goal":"能说出三类人群各自“阈值下移”的 3 个要点","key_point":"老年：无发热也可能严重感染、腹痛体征轻但病变重、基线功能下降是新发红旗；孕产：腹痛/出血/头痛/血压/胎动减少优先想产科急症；儿童：RR 与心率按年龄、精神反应比数值更敏感","practice":"①各写 3 条；②对 3 个病例判断是否升级；③写一句“阈值下移”的解释；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","chapter":"基层诊疗指南 · 儿童/孕产妇/老年人健康管理"},{"n":84,"w":12,"d":7,"kind":"mock","title":"第3次月模考（第9–12周）","mod":"复盘与模考","mod_i":-1,"priority":"","tag":"模考","goal":"","key_point":"","practice":"","chapter":""}],"weeks":[{"w":1},{"w":2},{"w":3},{"w":4},{"w":5},{"w":6},{"w":7},{"w":8},{"w":9},{"w":10},{"w":11},{"w":12}],"mats":{"红旗征的定义与“先排除后诊断”":{"title":"红旗征的定义与“先排除后诊断”","why":"红旗征不是诊断，而是决定“能不能让病人回家”的阈值；用错排序会直接把可救的病因放走。","sections":[{"h":"判据","p":"红旗征指在某一主诉下，一旦存在就足以改变处置路径（留观、影像、会诊、转运）的临床特征。判断时按“致命—常见—少见”排序：先问“如果不处理，几小时内会死或致残的是什么”，再问“最常见的是什么”。胸痛的致命组是 ACS、主动脉夹层、肺栓塞、张力性气胸、心包填塞、食管破裂；腹痛的致命组是 AAA 破裂、肠系膜缺血、绞窄性梗阻、异位妊娠、穿孔。"},{"h":"边界","p":"红旗征阴性不等于排除：它的设计目标是高敏感而非高特异，因此“没有红旗”只能支持“可以按常规路径评估”，不能支持“无需随访”。反过来，红旗征阳性也不等于确诊，过度检查的代价是时间与资源，但不改变“先排除致命”的优先级。真正需要警惕的是把统计学概率当床旁结论：年轻、无危险因素、心电图正常都不能单独排除夹层或 PE。"},{"h":"动作","p":"对每个主诉固定一套“三问”：有没有即刻威胁生命的表现（气道、呼吸、循环、意识）；有没有时间窗（溶栓、取栓、抗生素、减压、手术）；有没有必须现在做的床旁检查（血糖、心电图、SpO2、尿妊娠、床旁超声）。三问任一为“是”，处置先行、证据后补，并在病历里写清“先处理后补证”的理由与复查节点。"}],"points":["红旗征=改变处置路径的阈值，不是诊断结论","排序用“致命优先”，不用“概率优先”","固定三问：即刻威胁、时间窗、床旁检查"],"pitfalls":["把“年轻、无危险因素”当作排除依据","红旗阴性后不写随访与复诊条件"],"quiz":[{"q":"患者 28 岁，剧烈胸痛，心电图正常，D-二聚体正常，能否排除主动脉夹层？","a":"不能","why":"心电图与 D-二聚体均不能排除夹层，需看疼痛性质、脉搏血压差与影像；年轻只是降低先验概率，不构成排除。","type":"陷阱"},{"q":"“先排除后诊断”的排序依据是什么？","a":"漏诊后果的严重度与时间窗","why":"排序服务的是“不漏掉可救病因”，而非统计学发生率。","type":"知识"}],"overlay":{"A":"规培主线把这条用在病历书写上：A 段先写“已排除的致命病因及依据”，再写最可能诊断，避免只写一个印象诊断。","B":"急诊口径把它压缩成分诊台的三个动作：量全生命体征、做床旁心电图与血糖、决定留观或抢救区；不做完不叫“看完”。","C":"基层口径把它变成“安全网”：门诊无红旗者可回家，但必须写清复诊时点与“出现哪三条就立刻回来”，并留联系方式。"}},"生命体征的红旗阈值与趋势":{"title":"生命体征的红旗阈值与趋势","why":"生命体征是唯一每个病人都能立刻拿到、且能在检验回报前改变决策的数据。","sections":[{"h":"判据","p":"六项升级阈值：呼吸频率>30 次/分或<8 次/分；吸空气 SpO2<90%；收缩压<90mmHg 或较基线下降>40mmHg；心率>130 次/分或<40 次/分；体温>40℃ 或<35℃；GCS≤13（或较基线下降≥2 分）。任一成立即升级监护级别。此外要算休克指数（心率/收缩压）与 MAP（(SBP+2DBP)/3），MAP<65 提示器官灌注不足。"},{"h":"边界","p":"单点正常不能排除恶化：β 受体阻滞剂、起搏器、脊髓损伤可掩盖心动过速；慢性高血压患者 SBP 110mmHg 可能已是低灌注；年轻孕妇生理性血压偏低。反之，单点异常也可能由疼痛、焦虑、测量误差造成，需要复测与看趋势。趋势判读要求同一体位、同一肢体、同一设备，间隔 15–30 分钟。"},{"h":"动作","p":"入室即测全套并记录时点；异常值 15 分钟内复测；把“趋势箭头”写进交班（↑↓→ 加时间）；对高危主诉直接连监护而非间断测量。任何“生命体征不稳”优先于鉴别诊断，先稳定再问病因。"}],"points":["六项阈值任一成立即升级","MAP<65、休克指数≥1 是补充判据","趋势优先：同条件、15–30 分钟复测"],"pitfalls":["只记单点数值，不记测量时点与体位","用“血压正常”否定休克（代偿期可正常）"],"quiz":[{"q":"72 岁男性，SBP 105mmHg（基线 160），心率 118，皮肤湿冷，是否属于循环红旗？","a":"是","why":"相对基线下降>40mmHg 且休克指数≈1.12，皮肤湿冷提示低灌注，属红旗。","type":"知识"},{"q":"服 β 阻滞剂的患者心率 62，能否据此认为无感染性休克风险？","a":"不能","why":"药物掩盖代偿性心动过速，需看乳酸、CRT、尿量与意识。","type":"陷阱"}],"overlay":{"A":"内科病房场景重点在“夜间趋势”：把 22:00、02:00、06:00 三点连成线看，比单次查房更早发现恶化。","B":"急诊场景要求 5 分钟内拿到完整一套并算 NEWS2，用分值决定分区，而不是凭“看着还行”决定候诊顺序。","C":"基层场景先解决设备限制：必须配备指夹血氧、电子血压计与体温计，并把“测不出 SpO2 或值<94%”直接列为上转条件。"}},"休克四型快速判别":{"title":"休克四型快速判别","why":"休克分型决定第一支药和第一个动作；分错型会把心源性休克越补越坏。","sections":[{"h":"判据","p":"用三个床旁体征做二维判别：颈静脉（塌陷/怒张）、皮温（冷/暖）、肺部（清晰/湿啰音）。低容量性：颈静脉塌陷、皮温低、肺清晰；心源性：颈静脉怒张、皮温低、肺底湿啰音；分布性（脓毒症、过敏、神经源性）：颈静脉平或塌陷、皮温暖、脉压宽；梗阻性（张力性气胸、心包填塞、大面积 PE）：颈静脉怒张、肺野清晰、低血压。补充：床旁超声看下腔静脉充盈度、心包积液、右心大小、肺滑动。"},{"h":"边界","p":"混合型常见：脓毒症合并心功能不全、创伤合并张力性气胸，不要强行归入单一型。晚期分布性休克也会转为冷休克。颈静脉评估在肥胖、COPD 患者中可靠性下降，需结合超声。老年服用 β 阻滞剂者心率不升，不能以心率正常排除休克。"},{"h":"动作","p":"低容量：快速晶体液并找出血/丢失源；心源性：限制补液、利尿/扩血管（血压允许时）、正性肌力、查心电图与 BNP；分布性：去甲肾上腺素+液体+控感染源；梗阻性：先解除梗阻（减压、心包穿刺、溶栓/取栓），补液只是桥接。所有类型共同动作：大流量吸氧、监护、开通两路静脉、留取乳酸与血气。"}],"points":["三联体征定位四型：颈静脉、皮温、肺","梗阻性休克必须先解除梗阻","混合型按主要矛盾排序处理"],"pitfalls":["心源性休克盲目大剂量补液","把暖休克当“不严重”而降级监护"],"quiz":[{"q":"血压 78/50，颈静脉怒张，双肺清晰，气管左偏，右肺呼吸音消失，首选动作？","a":"立即右侧针刺减压","why":"张力性气胸属梗阻性休克，减压优先于补液与升压。","type":"知识"},{"q":"脓毒症患者皮温暖、脉压宽，说明休克不重？","a":"错","why":"暖休克是分布性休克早期代偿，乳酸与器官功能可能已恶化。","type":"陷阱"}],"overlay":{"A":"内科口径强调“病因+分型”双写：如“心源性休克（急性前壁心梗，Killip IV）”，便于复盘时对照治疗反应。","B":"急诊口径把分型压进 60 秒：看一眼颈静脉、摸一下皮温、听两肺，同时上超声，先定“要不要减压/穿刺”再谈补液。","C":"基层口径只需判“是否休克+能否在此处理”，四型中仅低容量可试补液，其余一律建立通路后立即上转。"}},"qSOFA、SOFA 与 NEWS2 的正确用法":{"title":"qSOFA、SOFA 与 NEWS2 的正确用法","why":"评分被误当成“排除工具”，是脓毒症漏诊最常见的系统性原因。","sections":[{"h":"判据","p":"qSOFA 三项各 1 分：呼吸频率≥22、收缩压≤100、GCS<15，≥2 提示预后差。SOFA 评估六系统（呼吸、凝血、肝、循环、神经、肾），用于器官障碍判定与病程追踪，需基线值。NEWS2 含呼吸频率、SpO2、吸氧、血压、心率、意识、体温，用于病房早期预警与升级触发。三者定位不同：筛查、判定、预警。"},{"h":"边界","p":"现行 SSC 指南不再推荐 qSOFA 作为单一筛查工具，因其灵敏度不足，qSOFA=0 不能排除脓毒症；SOFA 在无基线时易高估，慢性器官功能不全者需谨慎；NEWS2 未纳入乳酸，对“血压正常但乳酸高”的患者不敏感。任何评分都不能替代“疑似感染+器官障碍”的临床判断，也不能替代医生看病人。"},{"h":"动作","p":"疑似感染时：先测乳酸、取血培养、启动经验性抗生素，再用 SOFA 判定器官障碍并动态复评；病房用 NEWS2 触发升级，但触发后必须床旁评估；qSOFA 可作为快速提示，阳性即升级，阴性继续按临床判断观察，不得据此降级。"}],"points":["qSOFA 阳性提示预后，阴性不能排除","SOFA 判器官障碍，需基线与动态","NEWS2 用于病房预警，不含乳酸"],"pitfalls":["用 qSOFA=0 作为“不筛”的理由","只算一次评分不复评"],"quiz":[{"q":"qSOFA 0 分、乳酸 4.2mmol/L、血压正常，是否需要按脓毒症处理？","a":"需要","why":"乳酸≥4 提示组织低灌注，属器官障碍范畴，不能因 qSOFA 0 分降级。","type":"陷阱"},{"q":"SOFA 与 qSOFA 的核心区别？","a":"SOFA 判器官障碍，qSOFA 仅床旁提示","why":"前者需检验支持并动态评估，后者为三项体征快速评分。","type":"知识"}],"overlay":{"A":"规培口径要求把 SOFA 六项逐条写在病程里，并在 24 小时、48 小时各复评一次，训练“器官障碍”而非“诊断标签”的思维。","B":"急诊口径只记一句：qSOFA 阳性或乳酸≥4 直接进抢救区，不等完整评分；评分是记录工具，不是决策闸门。","C":"基层口径用简化版：呼吸>22、血压≤100、意识改变、SpO2<94% 任两项即上转，不必等乳酸结果。"}},"疼痛特征采集：OPQRST 与放射、诱因":{"title":"疼痛特征采集：OPQRST 与放射、诱因","why":"疼痛的性质与放射路径本身就是病因学信息，问全一次可抵三次重复问诊。","sections":[{"h":"判据","p":"OPQRST：起病方式（突发/渐起）、诱因与缓解因素、性质（压榨、撕裂、刀割、绞痛、烧灼）、放射部位、严重度（0–10 且与既往对比）、时间过程（持续/间歇、最长多久）。三条危险放射路径：向背部肩胛间撕裂样→主动脉夹层；向左臂、下颌、肩放射的压榨感→心肌缺血；向肩背放射伴呕吐→胰腺/胆道。突发“一生最剧烈”是独立红旗，无论性质如何。"},{"h":"边界","p":"老年人、糖尿病患者可无典型疼痛（无痛性心梗、静息性胆道感染）；女性 ACS 更多表现为乏力、气短、上腹不适。疼痛程度与病情严重度不平行：夹层可轻痛，穿孔可先轻后剧。止痛不会掩盖诊断，反而改善评估质量；但镇痛后必须复评体征与腹部。"},{"h":"动作","p":"固定问 8 句并记原话（“像被撕开”“像石头压着”）；对“最剧烈”追加：什么时候开始的、当时在做什么、有没有晕过去；记录疼痛前后的生命体征变化；对腹痛加问排气排便、月经史、既往手术史；对胸痛加问活动关系与硝酸甘油反应。"}],"points":["三条放射路径直接对应三个致命病因","“最剧烈”本身即红旗","疼痛程度与严重度不平行"],"pitfalls":["只记“胸痛 3 小时”不记性质与放射","因担心掩盖病情而延迟镇痛"],"quiz":[{"q":"45 岁男性，突发胸背撕裂样痛，双上肢血压差 25mmHg，最可能的致命病因？","a":"主动脉夹层","why":"撕裂样+背部放射+双上肢血压差是典型组合，需立即 CTA。","type":"知识"},{"q":"疼痛评分 3 分是否可以排除严重病因？","a":"不能","why":"评分反映主观感受，与病理严重度不平行。","type":"陷阱"}],"overlay":{"A":"规培口径要求把 OPQRST 八项写进现病史而非查体，形成可复核的推理链，并与最终诊断逐条对照。","B":"急诊口径把问诊嵌进处置：一边问一边上监护、做心电图，2 分钟内问完关键的“起病方式+放射+最剧烈”。","C":"基层口径优先问“能不能用一句话说清位置和性质”，问不清或描述矛盾者，直接上转而不反复试药观察。"}},"危险分层工具的选择与局限":{"title":"危险分层工具的选择与局限","why":"评分的作用是“安全地排除低危”，不是“把高危变得看起来低危”。","sections":[{"h":"判据","p":"胸痛用 HEART（病史、心电图、年龄、危险因素、肌钙蛋白），0–3 分低危可考虑门诊路径。PE 用 Wells 或 Geneva，联合年龄校正 D-二聚体（>50 岁：年龄×10μg/L）。极低危可用 PERC，但必须八项全阴。晕厥用加拿大晕厥风险评分或 San Francisco 规则。所有工具都以“生命体征稳定”为使用前提。"},{"h":"边界","p":"评分低危但临床高度怀疑时，以临床为准；肌钙蛋白单次阴性不能进入低危路径，需 0/1 或 0/3 小时动态；D-二聚体在妊娠、肿瘤、创伤、术后、老年假阳性率高；PERC 不适用于已怀疑 PE 的患者。评分不能替代随访可及性判断：无法复诊的低危患者也应留观。"},{"h":"动作","p":"先判稳定性，再选工具，再写“排除条件”：低危出院必须同时满足评分低危+动态标志物阴性+能 48–72 小时复诊+有明确返院标准。任一条不满足，降级为留观。评分结果与临床判断不一致时，记录不一致的理由。"}],"points":["工具用于安全排除低危，不用于推翻高危","动态标志物优先于单次结果","出院条件包含随访可及性"],"pitfalls":["用单次肌钙蛋白阴性直接放行","对妊娠或肿瘤患者直接套用标准 D-二聚体阈值"],"quiz":[{"q":"HEART 评分 2 分，但患者 30 分钟内反复胸痛，可否门诊随访？","a":"不可以","why":"反复发作属不稳定表现，评分低不能覆盖动态风险。","type":"陷阱"},{"q":"年龄校正 D-二聚体阈值如何计算？","a":">50 岁用年龄×10μg/L","why":"提高老年患者特异性，减少不必要的 CTPA。","type":"知识"}],"overlay":{"A":"规培口径要求写清“用了哪个工具、为什么选它、哪一条不满足所以留观”，训练可审计的决策记录。","B":"急诊口径只信两条：不稳就升级、动态标志物才作数；评分用于快速分流候诊区，不用于替代复评。","C":"基层口径把工具简化为“三无一有”：无动态变化、无高危病史、无标志物升高，且有 48 小时复诊条件，才可门诊观察。"}},"床旁体征红旗：三凹征、颈静脉、CRT、皮疹":{"title":"床旁体征红旗：三凹征、颈静脉、CRT、皮疹","why":"四项体征都不需要设备，却能在 90 秒内把“看着还行”变成“必须处理”。","sections":[{"h":"判据","p":"三凹征（胸骨上窝、锁骨上窝、肋间隙吸气性凹陷）提示吸气做功显著增加，见于上气道梗阻、重症哮喘、COPD 急性加重。颈静脉在 45° 半卧位下充盈超过胸骨角上方 3cm 为怒张。CRT：按压指甲或胸骨 5 秒后复色>3 秒提示外周低灌注。出血性皮疹：玻片压之不褪色，提示脑膜炎球菌血症、DIC、血管炎。"},{"h":"边界","p":"CRT 受环境温度、光线、肤色、末梢水肿影响，需结合乳酸与尿量；颈静脉在肥胖、桶状胸患者难以评估，可用床旁超声看下腔静脉；三凹征在极度疲劳的濒危患者可能“消失”，那不是好转而是衰竭（静默胸同理）。皮疹不褪色也见于血小板减少性紫癜，需结合血小板计数。"},{"h":"动作","p":"把四项做成固定顺序：看呼吸做功→看颈静脉→压甲床→翻查皮肤（含腋下、腹股沟、口腔黏膜）。任一项阳性即进入“升级评估”：血气/乳酸、床旁超声、请上级。记录时写具体数值与体位，不写“无明显异常”。"}],"points":["四项体征=90 秒床旁红旗筛查","体征“消失”可能是衰竭而非好转","不褪色皮疹需立即按暴发型感染处理"],"pitfalls":["在平卧位评估颈静脉导致假阳性","把静默胸当作喘鸣减轻"],"quiz":[{"q":"重症哮喘患者喘鸣音突然减弱、嗜睡，说明什么？","a":"病情恶化，濒临呼吸衰竭","why":"气流严重受限导致喘鸣消失，属“静默肺”，需立即气道支持。","type":"陷阱"},{"q":"不褪色皮疹最需要警惕哪类疾病？","a":"脑膜炎球菌血症等暴发性感染","why":"提示微血管内血栓与出血，进展以小时计。","type":"知识"}],"overlay":{"A":"内科口径强调“体征要与病理生理对应”：三凹征对应胸腔内负压增大，颈静脉怒张对应右心充盈压升高，各自推出下一步检查。","B":"急诊口径把它做成创伤/休克初评的一部分，与 ABCDE 同步完成，体征阳性直接触发团队呼叫。","C":"基层口径只要求会看两项：呼吸做功与 CRT；没有把握时按“疑似重症”上转，不因体征不典型而观察。"}},"床旁检验与“不能等结果”的决策":{"title":"床旁检验与“不能等结果”的决策","why":"治疗窗常常短于检验周转时间，等结果等于放弃时间窗。","sections":[{"h":"判据","p":"五项必须床旁完成：血糖（意识障碍、抽搐、大汗）、12/18 导联心电图（胸痛、心悸、晕厥、意识障碍）、SpO2 与血气（呼吸困难、休克）、尿/血妊娠试验（育龄女性任何腹痛、晕厥、出血）、床旁超声（心包积液、腹腔游离液体、肺滑动、下腔静脉、腹主动脉）。补充：床旁乳酸、肌钙蛋白 POCT、D-二聚体 POCT 在条件允许时提前。"},{"h":"边界","p":"床旁检测的灵敏度低于实验室方法：POCT 肌钙蛋白阴性不能排除 ACS；床旁血糖在低灌注时可能偏低；床旁超声依赖操作者，阴性不能排除 PE 或夹层。相反，床旁结果阳性通常足以启动处理。任何床旁结果都要在病历中标注“床旁快速检测”，并送实验室复核。"},{"h":"动作","p":"建立“边查边治”顺序：先抽血留样（不等结果）→ 上监护与氧疗 → 床旁检查 → 经验性治疗 → 结果回报后调整。对时间窗疾病（STEMI、卒中、脓毒症、张力性气胸、心包填塞）明确写出“不得因等待某项检查而延迟”的具体项。"}],"points":["五项床旁检查覆盖绝大多数即刻决策","POCT 阳性可启动治疗，阴性不能排除","先留样再治疗，避免治疗后无法补证"],"pitfalls":["等实验室肌钙蛋白再决定是否再灌注","床旁超声阴性即排除肺栓塞"],"quiz":[{"q":"疑似 STEMI，实验室肌钙蛋白需 60 分钟，是否应等待？","a":"不应等待","why":"再灌注决策依据症状与心电图，肌钙蛋白不用于启动溶栓/转运。","type":"知识"},{"q":"育龄女性晕厥，血压偏低，最该先做的床旁检查之一是什么？","a":"尿妊娠试验（并查床旁超声）","why":"异位妊娠破裂是致命且可快速识别的原因。","type":"陷阱"}],"overlay":{"A":"规培口径要求掌握心电图机与超声的基本操作，能在上级到场前独立完成并描述所见，而不是只写“已联系”。","B":"急诊口径把“床旁五项”做成岗位清单，护士与医师分工同时进行，目标 10 分钟内完成。","C":"基层口径至少要配血糖仪、心电图机、血氧仪；不具备条件时，把“无法完成床旁评估”本身作为上转理由。"}},"急性冠脉综合征：胸痛 + 心电图 + 肌钙蛋白":{"title":"急性冠脉综合征：胸痛 + 心电图 + 肌钙蛋白","why":"ACS 的处置由心电图而非肌钙蛋白决定，顺序颠倒会直接损失心肌。","sections":[{"h":"判据","p":"接诊 10 分钟内完成 12 导联（疑后壁加 V7–V9，疑右室加 V3R–V4R）。ST 段抬高按年龄性别阈值判读（如 ≥40 岁男性 V2–V3 ≥2mm）；等危表现包括后壁心梗（V1–V3 镜像性 ST 压低、R 波增高）、下壁心梗伴 aVL 压低、新发左束支阻滞、de Winter 型。肌钙蛋白升高+动态变化+缺血证据=非 ST 抬高型心肌梗死；不稳定心绞痛为标志物阴性但有缺血表现。"},{"h":"边界","p":"肌钙蛋白升高不等于 ACS：肺栓塞、脓毒症、心衰、心肌炎、肾衰、夹层均可升高，需看动态与临床。单次阴性不能排除，须 0/1 或 0/3 小时动态。主动脉夹层可同时累及冠脉导致“假性 STEMI”，溶栓前须评估撕裂样痛、双上肢血压差、纵隔增宽。老年、糖尿病、女性可无典型胸痛。"},{"h":"动作","p":"STEMI：双联抗血小板+抗凝，尽快再灌注（首选直接 PCI，无法在 120 分钟内完成则溶栓），并给氧仅用于 SpO2<90%。NSTE-ACS：抗血小板+抗凝+抗缺血，按 GRACE 分层决定 24 小时内或择期造影。所有患者：监护、除颤仪备用、禁 NSAIDs、评估出血风险与他汀负荷。"}],"points":["心电图决定再灌注，肌钙蛋白决定分层","STEMI 等危表现必须认全","溶栓前必须排除夹层"],"pitfalls":["等肌钙蛋白结果再启动再灌注","把下壁心梗合并的低血压当容量不足猛补液（右室梗死）"],"quiz":[{"q":"下壁 STEMI 患者血压 85/55，颈静脉怒张，补液后血压回升，最可能机制？","a":"右室梗死导致前负荷依赖","why":"右室梗死需维持前负荷，慎用硝酸酯与利尿剂。","type":"知识"},{"q":"V1–V3 ST 压低、R 波增高、胸痛持续，应首先考虑？","a":"后壁心肌梗死","why":"属 STEMI 等危，需按再灌注路径处理。","type":"陷阱"}],"overlay":{"A":"内科口径把 ACS 做成“诊断—分层—再灌注—二级预防”四段病历，出院前必须写清射血分数、出院用药与随访时点。","B":"急诊口径只盯三件事：10 分钟心电图、除颤仪在手、30 分钟内决定转运或溶栓；不因排队等床而延迟。","C":"基层口径的核心是“识别+首剂+转运”：给阿司匹林负荷、建立静脉通路、联系 120，不做负荷试验、不观察等待。"}},"主动脉夹层：撕裂样痛 + 脉搏血压差":{"title":"主动脉夹层：撕裂样痛 + 脉搏血压差","why":"夹层最怕的不是难诊断，而是被当成 ACS 给了抗凝与抗血小板。","sections":[{"h":"判据","p":"支持线索：突发撕裂/刀割样胸背痛并向下迁移、双上肢血压差>20mmHg、脉搏短绌或血压不对称、新发主动脉瓣反流杂音、纵隔增宽、胸腔积液、下肢缺血、晕厥。高危背景：高血压、马凡/结缔组织病、二叶主动脉瓣、妊娠、既往主动脉手术。确诊靠 CTA（主动脉全程），不稳定者可床旁经食道超声。"},{"h":"边界","p":"D-二聚体阴性有较高阴性预测价值，但不能单独排除，尤其在发病极早期或假腔内血栓形成时；胸片正常不能排除。A 型可累及冠脉开口造成心电图 ST 抬高，此时抗凝溶栓是致命的。疼痛可无“撕裂”描述，约一成患者无痛（多见于 A 型伴神经症状）。"},{"h":"动作","p":"疑诊即：绝对卧床、双路静脉、控制心率与血压（β 阻滞剂优先，目标心率 60 次/分左右、收缩压 100–120mmHg 或维持可灌注的最低水平）、充分镇痛、立即 CTA、请血管外科/心外科。A 型急诊手术，B 型无并发症以药物治疗为主，有并发症行腔内修复。"}],"points":["双上肢血压差+脉搏短绌是床旁关键线索","确诊靠 CTA，D-二聚体不能单用排除","先控心率再控血压，禁用抗凝溶栓"],"pitfalls":["把累及冠脉的 A 型夹层当 STEMI 溶栓","只测一侧上肢血压"],"quiz":[{"q":"胸痛患者心电图提示前壁 ST 抬高，同时双上肢血压差 30mmHg，下一步最不应做的是？","a":"立即溶栓","why":"需先排除夹层，溶栓可致灾难性出血。","type":"陷阱"},{"q":"A 型夹层的初始药物治疗目标？","a":"先降心率（约 60 次/分）再降血压","why":"降低 dp/dt 比单纯降压更能减少撕裂扩展。","type":"知识"}],"overlay":{"A":"内科口径强调危险因素筛查与长期随访：出院后 1、3、6、12 月影像复查，终身控制血压与心率。","B":"急诊口径把它列为“胸痛必排除项”，凡撕裂样痛或血压不对称，先做 CTA 再谈抗凝，团队呼叫不迟疑。","C":"基层口径只要做到两点：双侧血压都测；疑诊即禁抗凝、控制心率血压并直接转有 CTA 能力的医院。"}},"肺栓塞：危险因素 + 低氧 + 右心负荷":{"title":"肺栓塞：危险因素 + 低氧 + 右心负荷","why":"PE 的漏诊多发生在“生命体征平稳、只是有点气短”的患者身上。","sections":[{"h":"判据","p":"典型组合：突发呼吸困难+胸膜性胸痛+低氧，伴单侧下肢肿胀/压痛、近期制动、手术、创伤、肿瘤、妊娠、口服避孕药、既往 VTE。体征：呼吸急促、心动过速、P2 亢进、颈静脉怒张、下肢周径差>1cm。检查：心电图（S1Q3T3、右束支阻滞、V1–V4 T 波倒置）、血气（低氧+低碳酸）、D-二聚体、CTPA、床旁超声（右心扩大、室间隔左移、下肢深静脉血栓）。"},{"h":"边界","p":"血流动力学不稳者不做 D-二聚体排除路径，直接 CTPA 或床旁超声（右心负荷重+下肢血栓可支持经验性再灌注）。妊娠期优先下肢超声与肺通气灌注扫描。肾功能不全、造影剂过敏者考虑 V/Q 或 MR。心电图正常、SpO2 正常均不能排除小面积 PE。"},{"h":"动作","p":"稳定者：Wells/Geneva+年龄校正 D-二聚体，阴性且低度可能可排除；阳性行 CTPA。确诊后按风险分层：低危用 DOAC 或低分子肝素门诊治疗；中高危入监护；高危（持续低血压、休克）行系统溶栓，禁忌者导管或外科取栓。所有患者评估出血风险与抗凝疗程（诱因相关 3 个月，肿瘤/复发者延长）。"}],"points":["“气短+低氧+右心负荷”是核心组合","不稳定者跳过 D-二聚体直接影像","抗凝疗程由诱因与复发风险决定"],"pitfalls":["SpO2 正常即排除 PE","对不稳定患者仍按门诊流程等 D-二聚体"],"quiz":[{"q":"术后第 5 天突发气短，SpO2 96%，心率 108，D-二聚体 1.8mg/L，能否门诊观察？","a":"不能","why":"术后+心动过速+低氧+ D-二聚体升高，需影像评估并留观。","type":"陷阱"},{"q":"高危 PE 的定义核心是什么？","a":"持续低血压或休克","why":"决定是否启动再灌注治疗。","type":"知识"}],"overlay":{"A":"内科口径要求把 VTE 风险评估做成入院常规（Caprini/Padua），把“预防”写在 PE 之前，而不是只学治疗。","B":"急诊口径强调“不稳先影像、稳了再算分”，并把床旁心脏超声作为低血压患者的快速分流工具。","C":"基层口径重点在识别与转运：突发气短+单侧腿肿+近期手术/肿瘤，不等待 D-二聚体，直接上转。"}},"稳定型与不稳定型心绞痛的边界":{"title":"稳定型与不稳定型心绞痛的边界","why":"“稳定”一旦变成“不稳定”，路径从门诊负荷试验切换为急诊 ACS 评估。","sections":[{"h":"判据","p":"不稳定三条：新发（病程<2 个月即达 CCS III 级或明显限制活动）、静息发作（安静状态下发作，常>20 分钟）、恶化（原可耐受的活动量下降、发作频率增加、硝酸甘油需要量增加）。伴动态 ST-T 改变、肌钙蛋白升高即按 NSTE-ACS 处理。稳定型：劳力诱发、休息或硝酸甘油 5 分钟内缓解、近 2 个月模式不变。"},{"h":"边界","p":"女性、老年、糖尿病患者的“等同症状”为气短、乏力、上腹不适、恶心，不能因无典型胸痛判为稳定。贫血、甲亢、发热可诱发心绞痛（需求性），需同时处理诱因。稳定型也需评估左室功能与冠脉解剖风险，不能只凭症状安抚。"},{"h":"动作","p":"不稳定：按 ACS 路径——监护、双联抗血小板、抗凝、抗缺血，动态肌钙蛋白，按 GRACE 分层决定造影时机；禁做运动负荷试验。稳定：门诊评估危险因素、优化药物治疗，按预试验概率选择冠脉 CTA、负荷影像或运动试验。"}],"points":["新发、静息、恶化三条任一即不稳定","不稳定期禁做负荷试验","等同症状（气短/乏力/上腹不适）不可忽视"],"pitfalls":["把静息发作当“神经官能症”","不稳定患者安排运动平板"],"quiz":[{"q":"患者近 2 周静息时胸闷发作 3 次，每次 10 分钟，心电图无改变，属哪类？","a":"不稳定型心绞痛","why":"静息发作即不稳定，需按 ACS 评估。","type":"知识"},{"q":"稳定型心绞痛患者症状加重，仍可先做运动试验？","a":"不可","why":"已转为不稳定，负荷试验有风险且不改变急诊处理。","type":"陷阱"}],"overlay":{"A":"内科口径要求把 CCS 分级与实际活动耐量写进病历，用具体米数/楼层描述，便于随访比较。","B":"急诊口径只问一句“比以前更容易发作吗”，答“是”即进胸痛单元流程。","C":"基层口径把“新发或加重”直接列为上转指征，不做运动试验，不开硝酸甘油让患者自行观察。"}},"宽 QRS 心动过速：先假定室速":{"title":"宽 QRS 心动过速：先假定室速","why":"把室速误当室上速给维拉帕米，是可预防的致死性错误。","sections":[{"h":"判据","p":"宽 QRS（≥120ms）心动过速一律先按室速处理，除非有既往束支阻滞证据且形态一致。支持室速：房室分离、夺获搏动、融合波、电轴极度偏移、胸前导联同向性、既往心梗/心衰/心肌病。血流动力学不稳（低血压、意识改变、胸痛、心衰、休克）→ 同步电复律。"},{"h":"边界","p":"室上速伴差异性传导、预激合并房颤（宽大不规则）、高钾血症、三环类中毒均可表现为宽 QRS。预激合并房颤禁用房室结阻滞剂（可加速旁路传导）。电解质与药物史必须问；任何“规则宽 QRS”都不能用腺苷试验性治疗替代判断。"},{"h":"动作","p":"不稳：镇静后同步电复律（多形性/室颤则非同步除颤）。稳定：按室速给胺碘酮或普鲁卡因胺，纠正电解质（钾、镁）；避免维拉帕米、地尔硫䓬、腺苷。复律后查心电图（QT、缺血）、超声与心肌标志物，评估 ICD 指征。"}],"points":["宽 QRS 一律先按室速处理","预激合并房颤禁房室结阻滞剂","不稳即同步电复律，稳定用胺碘酮/普鲁卡因胺"],"pitfalls":["用维拉帕米处理未明宽 QRS 心动过速","把预激合并房颤当普通房颤控率"],"quiz":[{"q":"宽 QRS 不规则心动过速、血压 80/50，最不应使用的是？","a":"维拉帕米/地尔硫䓬","why":"可能是预激合并房颤，房室结阻滞剂可致室颤；应同步复律。","type":"陷阱"},{"q":"血流动力学不稳定的宽 QRS 心动过速首选？","a":"同步电复律","why":"药物起效慢，不稳定者电复律优先。","type":"知识"}],"overlay":{"A":"内科口径要会看“既往心电图对比”，并掌握抗心律失常药的促心律失常风险与 QT 监测。","B":"急诊口径：宽、快、不稳就复律；稳定则胺碘酮，除颤仪不离床旁。","C":"基层口径只做两件事：识别宽 QRS + 呼叫转运；不试静脉抗心律失常药，准备好除颤仪并持续监护。"}},"缓慢性心律失常与晕厥":{"title":"缓慢性心律失常与晕厥","why":"晕厥患者的心电图决定“回家”还是“进监护”，而被记住的往往只是“晕了一下”。","sections":[{"h":"判据","p":"高危心电图：二度 II 型房室阻滞、三度房室阻滞、交替性束支阻滞、长间歇>3 秒、宽 QRS 逸搏、窦性停搏、Brugada 图形、QT 延长、预激。高危临床：运动中/平卧时晕厥、无前驱、伴胸痛或心悸、心脏病史、家族猝死史、贫血/低血压。老年跌倒需排除缓慢性心律失常。"},{"h":"边界","p":"血管迷走性晕厥有前驱（恶心、出汗、视物模糊）、诱因（久站、闷热、情绪）且恢复快，但仍需心电图排除。单纯“头晕”不等于晕厥；低血糖、消化道出血、肺栓塞、异位妊娠均可表现为晕厥。阿托品对二度 II 型及三度阻滞效果有限，不能作为唯一手段。"},{"h":"动作","p":"全部做 12 导联心电图并持续监护；建立静脉通路；有症状的心动过缓先用阿托品 0.5mg 静推（最大 3mg），无效则经皮起搏，同时准备临时起搏；纠正可逆因素（高钾、药物过量、低温、甲减）；高危者收入监护病房并请心内科评估永久起搏。"}],"points":["晕厥必查心电图并监护","二度 II 型/三度阻滞属高危","阿托品无效即经皮起搏，不拖延"],"pitfalls":["把运动相关晕厥当血管迷走","只做一次心电图就放行"],"quiz":[{"q":"65 岁患者晕厥，心电图示三度房室阻滞、心率 34 次/分，首选处置？","a":"监护+经皮起搏准备，必要时临时起搏","why":"阿托品对结下阻滞效果差，需起搏保障。","type":"知识"},{"q":"晕厥伴抽搐一定是癫痫？","a":"不一定","why":"脑灌注骤降可致抽搐样动作（惊厥性晕厥），需查心电图与心律。","type":"陷阱"}],"overlay":{"A":"内科口径强调晕厥的病因三分（心源性、体位性、反射性）与危险分层，住院期间完成动态心电图与超声。","B":"急诊口径把“晕厥+心脏病史”直接归高危留观，不因清醒后状态好而放行。","C":"基层口径凡晕厥伴心悸、运动中发作、家族猝死史者，一律上转做心电监测，不在门诊观察。"}},"急性心衰：端坐呼吸 + 湿啰音 + BNP":{"title":"急性心衰：端坐呼吸 + 湿啰音 + BNP","why":"急性心衰的首剂选择由血压决定，不由“喘得厉害”决定。","sections":[{"h":"判据","p":"症状：端坐呼吸、夜间阵发性呼吸困难、粉红色泡沫痰、活动耐量骤降。体征：双肺湿啰音、颈静脉怒张、第三心音、下肢水肿、四肢湿冷。检查：BNP/NT-proBNP 升高（肥胖者偏低、房颤与肾衰偏高）、胸片（肺淤血、Kerley B 线）、床旁超声（射血分数、下腔静脉、B 线）、心电图与肌钙蛋白排除 ACS。"},{"h":"边界","p":"BNP 正常有较强排除价值，但“闪发性肺水肿”早期可不高；肥胖使值偏低；肾功能不全使值偏高。喘鸣明显者易误诊为哮喘（“心源性哮喘”），关键在病史、颈静脉与超声。低血压+湿冷+少尿提示心源性休克，此时利尿剂可能加重低灌注。"},{"h":"动作","p":"按血压分型：高血压型——血管扩张剂（硝酸酯/乌拉地尔）+利尿，常需无创通气；正常血压型——利尿为主+评估病因；低血压型——谨慎利尿、寻找可逆病因（ACS、快速心律失常、机械并发症、肺栓塞）、必要时正性肌力药与升压药。所有患者：坐位、氧疗（SpO2<90%）、监护、限盐限液、记录出入量。"}],"points":["首剂由血压分型决定","BNP 正常排除价值强，肥胖/肾衰需校正","低血压型慎利尿，先找可逆病因"],"pitfalls":["喘鸣即按哮喘给大剂量激素与沙丁胺醇而忽略心衰","低血压心衰仍大剂量呋塞米"],"quiz":[{"q":"急性肺水肿、血压 190/110、SpO2 85%，最合适的初始组合？","a":"无创通气+硝酸酯类血管扩张+利尿","why":"高血压型以降低前后负荷为主。","type":"知识"},{"q":"心源性休克患者能否用大剂量利尿剂减轻肺水肿？","a":"需谨慎，可能加重低灌注","why":"应先改善灌注（正性肌力/升压/解除病因），利尿从小剂量并监测。","type":"陷阱"}],"overlay":{"A":"内科口径要求完成“病因+诱因+分型+射血分数”四要素诊断，出院前启动指南导向药物并安排随访。","B":"急诊口径只看血压与氧合：高血压扩血管、低血压找病因，10 分钟内上无创通气。","C":"基层口径识别即上转，途中坐位、吸氧、监测；不常规给大剂量利尿，不按哮喘反复雾化。"}},"感染性心内膜炎：发热 + 新杂音 + 栓塞":{"title":"感染性心内膜炎：发热 + 新杂音 + 栓塞","why":"血培养的采集时机与组数，直接决定能不能做出病原学诊断。","sections":[{"h":"判据","p":"支持线索：不明原因发热>1 周、新出现反流性杂音、栓塞事件（脑、脾、肾、眼底 Roth 斑）、皮肤表现（瘀点、甲下线状出血、Janeway 损害、Osler 结节）、植入人工瓣或起搏器、静脉药瘾、近期牙科/侵入操作。诊断用改良 Duke 标准（血培养+超声为主要标准）。"},{"h":"边界","p":"血培养阴性心内膜炎（已用抗生素、苛养菌）占一定比例，需延长培养与分子检测。超声阴性不能排除，尤其早期或小赘生物，需经食道超声复评。发热+杂音也可能是风湿性瓣膜病合并感染，需鉴别。老年患者可无发热。"},{"h":"动作","p":"抗生素前采 3 组（不同部位、不同时间）血培养，每组双瓶；尽快经胸超声，必要时经食道；经验性用药覆盖金葡菌、链球菌、肠球菌（按是否人工瓣、是否药瘾调整）；手术指征：瓣膜功能衰竭致心衰、未控制感染、大赘生物（>10mm）伴栓塞风险、脓肿/瘘。"}],"points":["抗生素前 3 组不同部位血培养","超声阴性不能排除，需 TEE 复评","心衰、未控感染、大赘生物是手术指征"],"pitfalls":["先用抗生素再抽血培养","只抽一组血培养就下结论"],"quiz":[{"q":"疑似心内膜炎，患者已用抗生素 3 天，血培养应如何采集？","a":"仍需多组采集并告知实验室已用抗生素，考虑延长培养","why":"已用药者需特殊处理以提高检出。","type":"知识"},{"q":"经胸超声未见赘生物即可排除心内膜炎？","a":"不能","why":"需经食道超声并重复评估，结合临床与微生物证据。","type":"陷阱"}],"overlay":{"A":"内科口径要求按 Duke 标准逐条列出主要/次要标准，形成可复核的诊断推理。","B":"急诊口径先抽 3 组血培养再给抗生素，同时床旁超声看瓣膜与心功能，不稳定者直接请心外科。","C":"基层口径不承担确诊，做到“发热+新杂音/栓塞表现”即抽血培养并上转，不自行长疗程用抗生素。"}},"急腹症“不能等”的六个信号":{"title":"急腹症“不能等”的六个信号","why":"急腹症的关键不是确诊，而是识别“现在就要外科”的六个信号。","sections":[{"h":"判据","p":"六信号：① 腹膜刺激征（板状腹、反跳痛）；② 血流动力学不稳或进行性恶化；③ 疼痛由阵发转持续且剧烈；④ 发热伴白细胞明显升高/核左移；⑤ 乳酸升高、代谢性酸中毒；⑥ 气腹、游离液体、肠壁积气/门静脉积气。任一成立即需外科评估，不等完整诊断。"},{"h":"边界","p":"老年、免疫抑制、使用激素者腹膜刺激征可缺如，此时以生命体征、乳酸与影像替代判断；“体征轻”在肠系膜缺血中是危险信号而非安全信号。育龄女性须先验孕。上腹痛需查心电图排除心梗。"},{"h":"动作","p":"同步进行：禁食、两条通路、镇痛、监护、抽血（血常规、乳酸、淀粉酶、肝肾功能、凝血、血型）、尿妊娠、床旁超声、按需 CT、请外科。记录“从进门到外科到场”的时间节点，作为质量指标。"}],"points":["六信号任一成立即请外科","老年/激素使用者体征可缺失，用乳酸与影像替代","禁食+通路+镇痛+影像同步推进"],"pitfalls":["以“疼痛缓解”判断无需外科","等待全部检验回报才请会诊"],"quiz":[{"q":"急腹症患者乳酸 4.0mmol/L、腹部柔软，是否需要外科评估？","a":"需要","why":"乳酸升高提示组织低灌注/缺血，属六信号之一。","type":"知识"},{"q":"腹痛减轻是否可以排除外科急腹症？","a":"不能","why":"缺血坏死或神经病变可使疼痛减轻，需结合体征与乳酸。","type":"陷阱"}],"overlay":{"A":"内科口径把这六条写进首程“外科会诊指征”，并记录会诊时间与结论。","B":"急诊口径以此为分诊升级标准，触诊一次即决定是否进抢救区。","C":"基层口径按六条判断“能不能留”，任何一条成立即上转并提前电话告知。"}},"急性胰腺炎：三缺一与严重度":{"title":"急性胰腺炎：三缺一与严重度","why":"诊断只需三条中的两条，但严重度决定是否需要监护与液体策略。","sections":[{"h":"判据","p":"三条：典型上腹痛向背放射、脂肪酶/淀粉酶>3 倍正常上限、影像符合。严重度：轻症无器官障碍与局部并发症；中度为一过性器官障碍<48 小时或局部并发症；重症为持续器官障碍>48 小时（改良 Marshall）。红旗：SIRS 持续、BUN 升高、血细胞比容升高、乳酸升高、少尿。"},{"h":"边界","p":"酶学正常不能排除（高脂血症性、就诊晚）；酶学高低不反映严重度；早期 CT 可正常，坏死评估宜 72 小时后；高三酰甘油血症（>11.3mmol/L）需同时降脂；胆源性需查 ALT 与胆管扩张。"},{"h":"动作","p":"目标导向液体复苏（乳酸林格，评估容量反应性，避免过负荷）、镇痛、24–48 小时内启动肠内营养、不常规预防性抗生素；胆管炎或持续胆道梗阻→早期 ERCP；感染性坏死→延期引流。"}],"points":["诊断两条即可成立，酶学正常不排除","持续器官障碍>48 小时=重症","早期肠内营养、限制性液体、不常规抗生素"],"pitfalls":["以淀粉酶下降判断好转","确诊即常规使用抗生素"],"quiz":[{"q":"脂肪酶正常但 CT 与症状典型，能否诊断急性胰腺炎？","a":"能","why":"三条中两条即可，影像+症状足够。","type":"知识"},{"q":"胰腺炎患者应禁食至淀粉酶正常？","a":"错","why":"24–48 小时启动肠内营养，不必等酶学正常。","type":"陷阱"}],"overlay":{"A":"内科口径逐日记录 Marshall 各项与液体出入量，训练“持续 vs 一过性”判断。","B":"急诊口径先判能否口服与有无器官障碍，不能即入监护、限制性补液。","C":"基层口径“持续呕吐、不能进食、少尿、SpO2 下降”即上转，不在门诊长时输液。"}},"胆道感染：Charcot 与 Reynolds":{"title":"胆道感染：Charcot 与 Reynolds","why":"胆道感染的生死在引流时机，抗生素只是配套。","sections":[{"h":"判据","p":"急性胆囊炎：右上腹痛、Murphy 征、发热、白细胞升高；超声见壁厚>3mm、胆囊增大、结石、周围积液。急性胆管炎：Charcot 三联（发热寒战、黄疸、右上腹痛）；Reynolds 五联加休克与意识改变。实验室：胆红素、ALP/GGT 升高，炎症指标升高；影像见胆管扩张。"},{"h":"边界","p":"老年、免疫抑制者可仅表现为脓毒症；无黄疸不能排除胆管炎；结石可一过性排出致酶学波动。鉴别：胰腺炎、溃疡穿孔、右肾感染、肝脓肿。"},{"h":"动作","p":"胆囊炎：禁食、补液、镇痛、抗生素，72 小时内腹腔镜切除；高危者经皮胆囊造瘘。胆管炎：复苏+抗生素+尽早 ERCP 引流（重症 24 小时内），监测乳酸与尿量。"}],"points":["Charcot 三联→胆管炎；Reynolds 五联→重症","胆管炎决定措施是 ERCP 引流","老年可仅表现为脓毒症"],"pitfalls":["只升级抗生素不做引流","无黄疸即排除胆管炎"],"quiz":[{"q":"发热黄疸右上腹痛伴低血压与意识改变，最关键的下一步？","a":"复苏+抗生素+紧急胆道引流","why":"Reynolds 五联提示化脓性胆管炎，引流是决定性的。","type":"知识"},{"q":"胆管炎患者抗生素升级后体温下降即可不引流？","a":"不可","why":"梗阻未解除易复发恶化。","type":"陷阱"}],"overlay":{"A":"内科口径要求写出“梗阻部位+感染范围+引流计划”，并随访肝功能恢复。","B":"急诊口径“发热+黄疸+低血压”直接呼叫内镜与外科，不等影像完整。","C":"基层口径识别三联即禁食、补液、抗生素、上转。"}},"肠梗阻与绞窄信号":{"title":"肠梗阻与绞窄信号","why":"分水岭是有无绞窄，因为绞窄一旦形成，保守观察就是在赌肠管坏死。","sections":[{"h":"判据","p":"表现：腹痛（阵发→持续）、呕吐、腹胀、停止排气排便；早期肠鸣音亢进、后期减弱。绞窄信号：持续剧痛、发热、心动过速、白细胞升高、腹膜刺激征、乳酸升高、固定压痛。CT 判断部位、闭袢、缺血（肠壁积气、门静脉积气、肠系膜水肿）。"},{"h":"边界","p":"仍有排气排便不能排除不全梗阻；术后早期炎性梗阻与机械性不同；结肠梗阻警惕肿瘤与扭转（咖啡豆征）；老年无手术史者想到肿瘤与粪嵌塞；绞窄早期影像可无特异表现。"},{"h":"动作","p":"禁食、胃肠减压、补液与纠正电解质、监测尿量与乳酸；绞窄/闭袢/穿孔/缺血→急诊手术；无绞窄者可保守 24–48 小时并设复评时限；结肠肿瘤性梗阻考虑支架桥接。禁泻药与促动力药。"}],"points":["持续痛+发热+白细胞高+腹膜刺激=绞窄","闭袢与缺血需急诊手术","保守治疗必须设复评时限"],"pitfalls":["以仍有排气排除梗阻","对疑似绞窄长时间观察"],"quiz":[{"q":"肠梗阻患者腹痛转持续、体温 38.6℃、心率 118、乳酸 3.1，提示？","a":"绞窄可能，需急诊手术评估","why":"多项绞窄信号同时出现。","type":"知识"},{"q":"结肠梗阻可用新斯的明促进排便？","a":"不可","why":"机械性梗阻禁用促动力药，可能穿孔。","type":"陷阱"}],"overlay":{"A":"内科口径记录“部位+程度+有无绞窄+病因”，关注液体与电解质。","B":"急诊口径 6 小时内完成 CT 与外科会诊，绞窄不等复查。","C":"基层口径禁食禁水、减压、通路、上转，不用泻药。"}},"消化道出血：休克指数与初始复苏":{"title":"消化道出血：休克指数与初始复苏","why":"出血量的床旁估计与复苏节奏，比“是什么病”更早决定生死。","sections":[{"h":"判据","p":"休克指数=心率/收缩压：≥0.5 提示血容量不足，≥1.0 提示显著丢失（约 30%），≥1.5 提示重度休克。其他：直立性低血压、CRT 延长、乳酸升高、Hb 下降（滞后）。高危：呕鲜血、便血、SBP<90、心率>100、Hb<80g/L、晕厥。"},{"h":"边界","p":"Hb 早期可正常（未稀释），不能据初次值判断出血量；服用 β 阻滞剂者心率不升；黑便也可来自鼻咽出血、铁剂。抗凝/抗血小板患者需权衡停药风险。"},{"h":"动作","p":"两条大孔径通路、监护、限制性输血（Hb<70g/L，冠心病<80g/L）、静脉质子泵抑制剂、疑静脉曲张加生长抑素+抗生素；24 小时内胃镜（不稳者 12 小时内）；持续出血考虑介入栓塞或手术。"}],"points":["休克指数≥1 提示显著失血","Hb 早期正常不能排除大出血","限制性输血，24 小时内胃镜"],"pitfalls":["等 Hb 下降才启动复苏","对所有出血常规大量输血"],"quiz":[{"q":"心率 120、SBP 100，休克指数为多少？提示什么？","a":"1.2，提示显著血容量丢失","why":"需立即两条通路、备血与紧急内镜评估。","type":"知识"},{"q":"Hb 120g/L 可排除急性大出血？","a":"不能","why":"血液未稀释前 Hb 可正常。","type":"陷阱"}],"overlay":{"A":"内科口径要求记录休克指数、输血阈值与内镜时机，出院前处理病因（Hp、静脉曲张）。","B":"急诊口径先复苏再分诊，血压不稳直接联系内镜与 ICU。","C":"基层口径建立通路、监测、上转；不口服止血药，不等待。"}},"上/下消化道出血判别与内镜时机":{"title":"上/下消化道出血判别与内镜时机","why":"定位决定内镜种类与准备，判错会让患者做两次准备、拖两次时间。","sections":[{"h":"判据","p":"上消化道：呕血、咖啡样物、黑便，多伴上腹不适；下消化道：便血（鲜红/暗红）、排便习惯改变。屈氏韧带以上为上消化道；快速上消化道出血（>1000ml）也可便血。结肠镜适用于稳定、便血为主者；急诊肠镜在大量便血且血流动力学允许时考虑。"},{"h":"边界","p":"黑便多为上消化道，但小肠出血也可；痔出血常鲜红但需排除近端病变；不明原因出血（反复发作、初查阴性）考虑小肠镜/胶囊内镜/血管造影。缺血性结肠炎、炎症性肠病、肿瘤均可便血。"},{"h":"动作","p":"上消化道：稳定后 24 小时内胃镜；下消化道：稳定后择期结肠镜，急性大出血可先行 CT 血管造影定位。内镜前纠正休克与凝血，必要时气道保护。持续不能定位者行介入栓塞或术中肠镜。"}],"points":["黑便≠一定上消化道，便血≠一定下消化道","上消化道 24 小时内胃镜，不稳者更早","不明原因出血考虑小肠检查或血管造影"],"pitfalls":["便血患者只做肛门镜检查即放行","未稳定即行肠道准备"],"quiz":[{"q":"患者便血 800ml、血压 85/50，首选？","a":"复苏+急诊评估（可先行 CTA/急诊内镜）","why":"先稳定，影像可快速定位大出血点。","type":"知识"},{"q":"黑便患者即可确诊上消化道出血？","a":"不能","why":"小肠出血、鼻咽出血、药物也可致黑便。","type":"陷阱"}],"overlay":{"A":"内科口径要求按部位与病因组织鉴别，并写明内镜前准备与风险评估。","B":"急诊口径“先稳定后定位”，大出血走 CTA 与介入路径。","C":"基层口径识别出血量与稳定性，决定是否上转，不做肠道准备。"}},"肝硬化失代偿：肝性脑病与自发性腹膜炎":{"title":"肝硬化失代偿：肝性脑病与自发性腹膜炎","why":"肝硬化患者“突然糊涂”或“莫名发热”，先按肝性脑病与自发性腹膜炎处理。","sections":[{"h":"判据","p":"肝性脑病：意识改变、扑翼样震颤、定向力障碍、睡眠倒错，按 West Haven 分级 I–IV；诱因：感染、消化道出血、低钾/碱中毒、便秘、镇静药、低血糖、脱水。自发性腹膜炎：发热或腹痛、腹水增多、外周血白细胞升高，腹水多形核细胞≥250/mm³ 即可诊断。"},{"h":"边界","p":"肝性脑病需排除低血糖、电解质紊乱、颅内病变、酒精戒断、药物；血氨正常不能排除。自发性腹膜炎可无腹痛（约半数），需常规诊断性穿刺；继发性腹膜炎（穿孔）腹水多形核细胞更高、总蛋白高、多重病原。"},{"h":"动作","p":"肝性脑病：乳果糖口服/灌肠、利福昔明、纠正诱因、慎用镇静；自发性腹膜炎：诊断性穿刺后立即头孢曲松等三代头孢，白蛋白 1.5g/kg 第 1 天、1g/kg 第 3 天用于肾衰高风险者；所有失代偿腹水患者评估曲张静脉出血预防与移植指征。"}],"points":["腹水多形核细胞≥250 即诊断自发性腹膜炎","肝性脑病先找诱因再降氨","自发性腹膜炎需白蛋白辅助降低肾衰风险"],"pitfalls":["肝硬化患者发热不穿刺腹水","肝性脑病直接用镇静药控制躁动"],"quiz":[{"q":"肝硬化腹水患者腹水多形核细胞 400/mm³，诊断与处理？","a":"自发性腹膜炎，立即三代头孢+白蛋白","why":"达到诊断阈值，不等培养结果。","type":"知识"},{"q":"血氨正常可排除肝性脑病？","a":"不能","why":"诊断以临床为主，血氨仅辅助。","type":"陷阱"}],"overlay":{"A":"内科口径要求每次失代偿都列诱因清单，并在出院前完成二级预防（乳果糖、营养、随访）。","B":"急诊口径对肝硬化+意识改变/发热常规做诊断性穿刺与血糖，不先给镇静。","C":"基层口径识别意识改变或发热即上转，不用镇静药，不长期口服抗生素自行处理。"}},"腹主动脉瘤破裂：老年 + 腰背痛 + 搏动包块":{"title":"腹主动脉瘤破裂：老年 + 腰背痛 + 搏动包块","why":"这是能在床旁 30 秒确诊的致命腹痛，前提是想到并去做超声。","sections":[{"h":"判据","p":"三联：突发腰背/腹部剧痛、低血压、搏动性包块（触诊敏感度低，深压有风险）。高危：男性>65、吸烟、高血压、既往动脉瘤、结缔组织病。床旁超声见腹主动脉扩张（男>3cm、女>2.7cm）或内膜片/血肿；CTA 确诊（血流动力学允许时）。"},{"h":"边界","p":"约半数无典型三联；肥胖/低血压时包块不可及；需与夹层、肾绞痛、憩室炎、胰腺炎鉴别。超声正常不能完全排除小动脉瘤破裂或腹膜后血肿。"},{"h":"动作","p":"绝对卧床、两条大静脉通路、限制性液体复苏（SBP 80–90mmHg 或维持意识）、立即血管外科会诊送手术/介入（EVAR 优先）、血压允许时控制性降压；不因等 CT 延迟通知外科。"}],"points":["三联不典型靠危险因素+床旁超声","限制性液体复苏避免血压过高","确诊与呼叫外科同步进行"],"pitfalls":["反复深压腹部触诊","大量补液使 SBP>120mmHg"],"quiz":[{"q":"疑似 AAA 破裂血压 80/50，补液目标？","a":"维持意识的最低可接受血压（SBP 约 80–90）","why":"过量补液升高血压加重出血。","type":"知识"},{"q":"床旁超声主动脉 2.8cm 可排除破裂？","a":"不能","why":"需结合临床与 CTA，女性阈值更低。","type":"陷阱"}],"overlay":{"A":"内科口径强调 65 岁以上吸烟男性一次性超声筛查的获益。","B":"急诊口径“老年+腰痛+低血压”触发床旁超声与血管外科呼叫。","C":"基层口径识别即不按压、不过量补液、立即上转并电话预警。"}},"发热待查的红旗：免疫抑制、旅行、动物接触":{"title":"发热待查的红旗：免疫抑制、旅行、动物接触","why":"发热的鉴别靠“先问三个问题”，而不是先开一堆检查。","sections":[{"h":"判据","p":"三问：① 免疫状态（化疗、移植、激素、生物制剂、脾切除、HIV）；② 暴露（旅行、蜱虫、动物、生食、水源、结核接触、院内操作）；③ 局部线索（皮疹、关节、心脏杂音、腹部压痛、鼻窦、牙源、导管、植入物）。红旗：发热+低血压、意识改变、颈抵抗、皮疹紫癜、脾大、新杂音、近期器械操作、中性粒细胞缺乏。"},{"h":"边界","p":"老年与免疫抑制者可无高热，仅表现意识改变或低体温；结核、淋巴瘤、成人 Still 病、药物热是长期不明发热的常见“非感染”原因；退热药可掩盖热型。"},{"h":"动作","p":"先做“可快速出结果且改变处置”的检查：血常规、血培养（抗生素前两套）、乳酸、肝肾功、尿常规、胸片/CT、必要时腰穿。按暴露给特异性检查（疟疾涂片、登革、布鲁菌、Q 热）。不稳定或中性粒细胞缺乏者 1 小时内用药，不等结果。"}],"points":["发热评估三问：免疫、暴露、局部线索","免疫抑制者可无典型高热","不稳定或粒细胞缺乏者先用药"],"pitfalls":["未问旅行与动物接触即按普通感染处理","血培养在抗生素之后才留取"],"quiz":[{"q":"发热患者血培养应在何时留取？","a":"抗生素使用前，两套不同部位","why":"提高检出率，避免假阴性。","type":"知识"},{"q":"老年发热患者体温 37.8℃ 可认为感染不重？","a":"不能","why":"老年反应差，需看意识与生命体征趋势。","type":"陷阱"}],"overlay":{"A":"内科口径要求把“暴露史+免疫状态”写进病历，并分层列出感染与非感染病因。","B":"急诊口径先筛红旗（低血压、意识、皮疹、颈抵抗），再决定检查顺序。","C":"基层口径重点问旅行、动物、结核接触与用药史，识别需上转者。"}},"脓毒症 1 小时集束化":{"title":"脓毒症 1 小时集束化","why":"脓毒症的时间窗以分钟计，1 小时集束化是可核查的动作清单。","sections":[{"h":"判据","p":"脓毒症=感染+器官功能障碍（SOFA 较基线升高≥2 分）；感染性休克=脓毒症+需血管活性药维持 MAP≥65 且乳酸>2mmol/L（SSC 2025 口径）。床旁提示：意识改变、RR≥22、SBP≤100、花斑、CRT>3 秒、少尿、乳酸升高。注意 SSC 2025 不再推荐 qSOFA 作为单一筛查工具。"},{"h":"边界","p":"qSOFA 阴性不能排除；乳酸正常不能排除（尤其肝功能障碍）；β 阻滞剂使用者心率不可靠；老年、免疫抑制者体温可正常。脓毒症不是“发热+白细胞高”，无发热也可成立。"},{"h":"动作","p":"1 小时内：测乳酸、抗生素前留血培养、广谱抗生素、对低血压或乳酸≥4 者启动 30ml/kg 晶体液（需评估容量反应性与心肾功能）、升压药维持 MAP≥65；重复乳酸与灌注评估；尽快明确并控制感染源（引流、清创、拔管）。"}],"points":["脓毒症=感染+SOFA≥2；休克加升压药与乳酸>2","1 小时内完成五项核心动作","感染源控制与抗生素同等重要"],"pitfalls":["以 qSOFA 阴性排除脓毒症","对所有患者机械执行 30ml/kg 而不评估反应"],"quiz":[{"q":"脓毒症患者乳酸 5mmol/L、血压 88/52，液体复苏初始量？","a":"30ml/kg 晶体液并评估反应，必要时加升压药","why":"乳酸≥4 且低血压属启动指征，但需动态评估。","type":"知识"},{"q":"qSOFA 0 分能否排除脓毒症？","a":"不能","why":"SSC 2025 不推荐其作为单一筛查工具。","type":"陷阱"}],"overlay":{"A":"内科口径要求每小时记录乳酸清除、尿量、MAP 与升压药剂量，形成复苏评估链。","B":"急诊口径把 1 小时集束化做成勾选表，护理与医师并行执行。","C":"基层口径识别后立即建立通路、抽培养（条件允许）、首剂抗生素并转运，不观察。"}},"中枢神经系统感染：发热 + 头痛 + 颈抵抗":{"title":"中枢神经系统感染：发热 + 头痛 + 颈抵抗","why":"脑膜炎的胜负在抗生素是否在腰穿前就给上，而不是腰穿做得多漂亮。","sections":[{"h":"判据","p":"三联：发热、头痛、颈抵抗；加意识改变、呕吐、畏光、皮疹（脑膜炎球菌紫癜）、癫痫、局灶体征。脑膜炎：颈抵抗、Kernig/Brudzinski 阳性、CSF 压力高、细胞数升高、糖低、蛋白高。脑炎：意识改变突出、可有精神症状与癫痫。CSF 典型：细菌性中性粒为主、糖<2.2mmol/L 或 CSF/血糖<0.4；病毒性淋巴为主、糖正常；结核性淋巴为主、糖低、ADA 高。"},{"h":"边界","p":"免疫抑制、老年、新生儿可无颈抵抗；单纯疱疹脑炎早期 CSF 可正常；腰椎穿刺前需评估脑疝风险（意识下降、局灶体征、癫痫、免疫抑制、视乳头水肿）→ 先影像与经验性治疗。皮疹紫癜提示脑膜炎球菌血症，进展极快。"},{"h":"动作","p":"怀疑细菌性脑膜炎：立即血培养+经验性抗生素（三代头孢±万古霉素，按年龄与耐药风险）+地塞米松（肺炎链球菌可能者，抗生素前或同时），不因等待腰穿或影像而延迟；评估脑疝风险后再腰穿；疱疹脑炎可能者加阿昔洛韦；接触者预防与上报。"}],"points":["抗生素优先于腰穿，不因等检查延迟","地塞米松在抗生素前或同时给","紫癜皮疹提示脑膜炎球菌血症"],"pitfalls":["为等腰穿延迟抗生素","未评估脑疝风险即腰穿"],"quiz":[{"q":"疑似细菌性脑膜炎，CT 排队需 1 小时，如何处理？","a":"先血培养并立即经验性抗生素+地塞米松","why":"延迟抗生素增加死亡率与后遗症。","type":"知识"},{"q":"颈抵抗阴性可排除脑膜炎？","a":"不能","why":"老年、免疫抑制者可缺如。","type":"陷阱"}],"overlay":{"A":"内科口径要求按 CSF 指标写出病原推断，并随访听力学与神经功能后遗症。","B":"急诊口径“怀疑即用药”，腰穿在稳定与排除脑疝后进行。","C":"基层口径识别三联或紫癜皮疹即建立通路、首剂抗生素后立即上转，并做好接触者管理提醒。"}},"坏死性筋膜炎：疼痛超体征 + 气球征":{"title":"坏死性筋膜炎：疼痛超体征 + 气球征","why":"这是“看着不像重”的软组织感染，手术延迟数小时即显著增加死亡。","sections":[{"h":"判据","p":"线索：疼痛程度远超局部体征、皮肤紧绷发亮、红斑迅速扩大、水疱/血疱、皮肤坏死、捻发音、麻木（神经坏死，是晚期信号）、发热与中毒貌、白细胞升高、CRP 高、低钠、肌酸激酶升高、乳酸升高。LRINEC 评分辅助（≥6 提示高风险）。气球征：按压皮肤有“握雪感”。"},{"h":"边界","p":"早期可仅有疼痛与轻度红斑，易误为蜂窝织炎；糖尿病、免疫抑制、肥胖、肝硬化、NSAIDs 使用者风险高；捻发音非必有；影像（CT/MRI）不敏感，不能为等影像延迟手术；坏死深度需术中判断。"},{"h":"动作","p":"立即请外科急诊清创（唯一决定性治疗）+广谱抗生素（覆盖革兰阳性、阴性、厌氧，含抗 MRSA）+液体复苏与镇痛；标注红斑边界并每小时复查扩大速度；术后反复清创；评估中毒性休克与器官支持。"}],"points":["疼痛远超体征是核心线索","手术清创是决定性治疗，不等影像","抗生素需覆盖厌氧与 MRSA"],"pitfalls":["按蜂窝织炎门诊口服抗生素","等 MRI 结果再请外科"],"quiz":[{"q":"糖尿病患者小腿红斑、剧痛、皮肤麻木、出现血疱，最可能？","a":"坏死性筋膜炎","why":"麻木提示神经坏死，需立即外科清创。","type":"知识"},{"q":"无捻发音可排除坏死性筋膜炎？","a":"不能","why":"捻发音为晚期表现，缺失常见。","type":"陷阱"}],"overlay":{"A":"内科口径关注糖尿病与免疫抑制背景下的软组织感染升级信号，早期请外科。","B":"急诊口径“疼痛>体征”即外科会诊，用记号笔标记边界并定时复测。","C":"基层口径不切不引流可疑病例，建立通路、首剂抗生素即上转。"}},"破伤风与狂犬病暴露分级处置":{"title":"破伤风与狂犬病暴露分级处置","why":"这两件事都靠“暴露后规范处置”预防，一旦发病几乎无法挽救。","sections":[{"h":"判据","p":"破伤风：伤口污染（泥土、粪便、铁锈、咬伤、烧伤、深刺伤）+免疫史不全；潜伏 3–21 天，表现为牙关紧闭、苦笑面容、角弓反张、声光刺激诱发痉挛，意识清醒。狂犬病暴露分级：I 级接触/喂养无破损皮肤；II 级轻咬、无出血抓伤、破损皮肤被舔；III 级单处/多处贯穿性咬伤、黏膜污染、蝙蝠暴露。"},{"h":"边界","p":"破伤风免疫史不明按未完成处理；已全程免疫者清洁小伤口 10 年内不需加强，污染伤口 5 年内不需。狂犬病潜伏期可长达数年，暴露后处置越早越好，但超过 24 小时仍应接种；十日观察法仅用于评估，不替代立即接种。"},{"h":"动作","p":"破伤风：彻底清创+破伤风类毒素（按免疫史）+破伤风免疫球蛋白（污染重或免疫不全）；发作期用镇静、肌松、气管切开与 ICU 支持。狂犬病：I 级清洗；II 级清洗+全程疫苗；III 级清洗+疫苗+狂犬病免疫球蛋白浸润注射；伤口尽量不缝合或延迟缝合。"}],"points":["污染伤口按免疫史决定类毒素与免疫球蛋白","III 级暴露必须疫苗+免疫球蛋白","伤口彻底冲洗是共同第一步"],"pitfalls":["以十日观察法推迟首针疫苗","III 级暴露只打疫苗不用免疫球蛋白"],"quiz":[{"q":"被流浪狗咬伤手指出血，属几级暴露、如何处置？","a":"III 级，冲洗+疫苗+免疫球蛋白","why":"贯穿性咬伤属 III 级，需被动免疫。","type":"知识"},{"q":"暴露超过 24 小时接种狂犬病疫苗已无意义？","a":"错，仍应尽快接种","why":"潜伏期较长，延迟接种仍有价值。","type":"陷阱"}],"overlay":{"A":"内科口径要求完整记录免疫史与伤口分级，并开具后续接种时间表。","B":"急诊口径把“伤口冲洗 15 分钟”作为硬动作，避免只开疫苗不处理伤口。","C":"基层口径负责首诊清洗与首针，按冷链要求转运疫苗或转诊至接种门诊。"}},"导管相关血流感染与植入物感染":{"title":"导管相关血流感染与植入物感染","why":"不明原因发热里的“管子”和“植入物”，是查体之外最容易被忘掉的一处。","sections":[{"h":"判据","p":"导管相关血流感染：留置中心静脉导管/输液港/PICC，出现发热寒战、穿刺点红肿渗液、插管时寒战、无其他感染灶；血培养（外周+导管）阳性且导管血先阳性（差异生长时间≥2 小时）支持。植入物感染：起搏器/人工关节/人工瓣膜/血管支架，表现为局部疼痛、窦道、假体松动、反复低热、新杂音、栓塞事件。"},{"h":"边界","p":"血培养单侧阳性常为污染（尤其凝固酶阴性葡萄球菌），需两套；导管尖端培养需拔管后送检；植入物感染可多年后发生，低度感染表现隐匿；超声对人工瓣膜感染敏感性低于自体瓣膜，需多次血培养与经食管超声。"},{"h":"动作","p":"导管相关：两套血培养（外周+导管）后经验性抗生素；金黄色葡萄球菌、念珠菌、铜绿假单胞菌、复杂感染或休克→拔管；无其他来源且病情稳定者可行导丝更换但需警惕。植入物：请相关专科评估，多数需取出植入物+长期抗生素，单纯药物常失败。"}],"points":["发热+留置导管/植入物要主动想感染","双侧血培养并比较阳性时间","金葡菌与念珠菌感染通常需拔管/取植入物"],"pitfalls":["只留导管血培养","人工关节感染仅用抗生素不评估取出"],"quiz":[{"q":"PICC 置管患者发热寒战，下一步？","a":"外周+导管各一套血培养，随后经验性抗生素并评估拔管","why":"差异生长时间有助于判断来源。","type":"知识"},{"q":"起搏器囊袋红肿可仅口服抗生素观察？","a":"不可，需评估取出装置","why":"生物膜感染药物难以清除，常需取出。","type":"陷阱"}],"overlay":{"A":"内科口径要求把“留置装置清单”写进入院评估，长期发热患者逐项排查。","B":"急诊口径对脓毒症患者查体时专门看导管口与植入物部位。","C":"基层口径识别装置相关发热即上转，不在门诊反复更换抗生素。"}},"多重耐药风险与经验性用药":{"title":"多重耐药风险与经验性用药","why":"经验性用药的宽度取决于耐药风险，而不是“越强越好”。","sections":[{"h":"判据","p":"多重耐药高危：近 90 天内静脉抗生素使用、既往培养出耐药菌、住院>48 小时或养老机构居住、侵袭性操作/留置装置、免疫抑制、近期旅行至高耐药区。常见：ESBL 肠杆菌（碳青霉烯类）、CRE（多黏菌素/头孢他啶阿维巴坦）、MRSA（万古霉素/利奈唑胺）、铜绿假单胞菌（哌拉西林他唑巴坦/头孢吡肟）、VRE（利奈唑胺/达托霉素）。"},{"h":"边界","p":"宽谱经验性用药必须配合降阶梯，否则加速耐药；万古霉素需按体重与肾功能给药并监测谷浓度；碳青霉烯类不用于无风险患者的常规一线；培养阴性不能随意停用抗生素（需结合临床改善）。"},{"h":"动作","p":"用药前留取培养（血、痰、尿、引流液）；按感染部位与风险选方案；48–72 小时评估并降阶梯；记录抗生素使用天数与理由；局部抗生素封管、雾化吸入等仅在有指征时使用。"}],"points":["90 天抗生素史与既往耐药菌是核心风险","经验性宽，48–72 小时必须降阶梯","培养阴性不等于可随意停药"],"pitfalls":["无风险患者首选碳青霉烯","长期广谱用药不做降阶梯评估"],"quiz":[{"q":"既往 ESBL 感染患者再发脓毒症，经验性应覆盖？","a":"碳青霉烯类","why":"既往耐药菌是复发耐药的重要预测因素。","type":"知识"},{"q":"经验性广谱抗生素应持续至出院？","a":"错，48–72 小时评估并降阶梯","why":"减少耐药与艰难梭菌风险。","type":"陷阱"}],"overlay":{"A":"内科口径要求写明“选择理由+降阶梯计划+疗程”，与微生物室联动。","B":"急诊口径首剂按风险给足，同时留取培养，避免因等结果延迟。","C":"基层口径首剂后上转，不长期自行更换口服抗生素。"}},"中性粒细胞缺乏伴发热：1 小时内抗生素":{"title":"中性粒细胞缺乏伴发热：1 小时内抗生素","why":"粒细胞缺乏伴发热的感染进展以小时计，抗生素延迟与死亡率直接相关。","sections":[{"h":"判据","p":"中性粒细胞缺乏：ANC<0.5×10⁹/L 或预计 48 小时内降至<0.5；发热：单次口温≥38.3℃ 或≥38.0℃ 持续 1 小时。高危：ANC<0.1、预计缺乏>7 天、血流动力学不稳、肺炎、腹痛、黏膜炎、导管感染。常见病原：革兰阴性菌（铜绿假单胞菌）、革兰阳性菌（葡萄球菌、链球菌）、真菌（长期缺乏）。"},{"h":"边界","p":"粒细胞缺乏时局部炎症体征可缺如（无脓、无渗出），不能以“看着不重”排除；肛周感染禁忌直肠指检；真菌感染多在缺乏>7 天后；发热也可来自肿瘤热或药物热，但需先按感染处理。"},{"h":"动作","p":"1 小时内：血培养（外周+导管）、尿培养、胸片、必要时 CT；立即经验性抗假单胞菌 β-内酰胺（哌拉西林他唑巴坦/头孢吡肟/碳青霉烯），不稳定或耐药高危者加万古霉素；评估感染源；持续发热>4–7 天加抗真菌；粒细胞集落刺激因子按方案使用。"}],"points":["ANC<0.5+发热即启动 1 小时抗生素","粒细胞缺乏时局部体征可缺如","经验方案须覆盖铜绿假单胞菌"],"pitfalls":["等培养结果再用药","对粒细胞缺乏患者做直肠指检"],"quiz":[{"q":"化疗后 ANC 0.2、体温 38.5℃，何时用药？","a":"1 小时内经验性广谱抗生素","why":"延迟与死亡率相关。","type":"知识"},{"q":"无明显感染灶可先观察 24 小时？","a":"不可","why":"粒细胞缺乏者感染进展快且体征隐匿。","type":"陷阱"}],"overlay":{"A":"内科口径要求按危险分层选择门诊或住院方案，并写明降阶梯与抗真菌时机。","B":"急诊口径 60 分钟内完成培养+首剂抗生素，不等影像。","C":"基层口径识别即联系上转，途中不延误首剂。"}},"卒中识别与“最后正常时间”":{"title":"卒中识别与“最后正常时间”","why":"决定能否溶栓的不是到院时间，而是最后看起来正常的时间。","sections":[{"h":"判据","p":"识别工具：FAST（面瘫、上肢无力、言语异常、立即呼叫）；BEFAST 加平衡与视物；后循环表现：眩晕、复视、共济失调、吞咽困难、交叉性感觉障碍。关键问句：最后一次看起来正常是什么时候（last known well），谁见证、有无醒来即发现。"},{"h":"边界","p":"低血糖可完全模拟卒中，必须先测血糖；癫痫后瘫痪（Todd 麻痹）、偏头痛先兆、功能性障碍可类似；NIHSS 0 分不代表无卒中（后循环、轻度）。醒后卒中与时间不明者需影像（DWI-FLAIR 不匹配）判断发病时间。"},{"h":"动作","p":"启动卒中绿色通道：血糖、指脉氧、心电图、抽血（含凝血）、NIHSS、立即头颅 CT（排除出血）+CTA（大血管）；记录“最后正常时间—到院—CT—用药”各节点；不因等化验结果延迟溶栓决策（除血糖与凝血外）。"}],"points":["最后正常时间是溶栓决策核心","卒中识别前必测血糖","绿色通道并行推进，不等全部化验"],"pitfalls":["以到院时间代替发病时间","NIHSS 低分即排除后循环卒中"],"quiz":[{"q":"患者 7 点被家属发现不能说话，昨晚 23 点睡觉时正常，最后正常时间？","a":"23 点（前夜入睡时）","why":"时间不明者需按最后正常时间评估并考虑影像指导再灌注。","type":"知识"},{"q":"指尖血糖 3.1mmol/L 的偏瘫患者应先纠正血糖再判断卒中？","a":"是，低血糖可完全模拟卒中","why":"纠正后复评，同时不放弃卒中评估。","type":"陷阱"}],"overlay":{"A":"内科口径要求完整书写 NIHSS 与时间轴，训练“定位+血管分布”的归纳。","B":"急诊口径把“最后正常时间”作为第一条必问项，10 分钟内完成 CT。","C":"基层口径识别 FAST 即联系转运并提前通报，途中测血糖、不给口服药。"}},"出血性卒中：头痛 + 呕吐 + 意识下降":{"title":"出血性卒中：头痛 + 呕吐 + 意识下降","why":"脑出血的第一步不是止血药，而是血压管理与是否手术。","sections":[{"h":"判据","p":"表现：突发头痛、呕吐、意识下降、局灶体征、血压显著升高；CT 见高密度灶。评分：GCS、血肿量（ABC/2）、是否脑室出血、是否脑疝。警示：抗凝相关出血（INR 升高）、淀粉样血管病（老年脑叶出血）、AVM/动脉瘤、肿瘤出血。"},{"h":"边界","p":"小量出血可仅表现为轻度偏瘫或头痛，需 CT 确认；血压升高可能是应激反应而非病因，不可过度降压；抗凝相关出血需立即逆转；CT 早期对等密度出血不敏感，临床高度怀疑可复查或 MRI。"},{"h":"动作","p":"平稳降压（SBP 目标 130–140mmHg，避免骤降）、头位抬高 30°、镇痛止吐、控制血糖与体温；抗凝相关立即逆转（维生素 K+凝血酶原复合物；达比加群用依达赛珠单抗）；评估手术指征（小脑出血>3cm 或伴脑干受压、幕上大量出血伴意识下降）；监测瞳孔与意识。"}],"points":["CT 是确诊手段，血压平稳下降而非骤降","抗凝相关出血需立即逆转","小脑出血伴脑干受压是手术指征"],"pitfalls":["把高血压脑出血的血压降到 110 以下","抗凝患者出血只停药不逆转"],"quiz":[{"q":"自发性脑出血 SBP 200mmHg，目标？","a":"平稳降至 130–140mmHg","why":"避免骤降导致灌注不足。","type":"知识"},{"q":"华法林相关脑出血只需停用华法林？","a":"不可，需维生素 K+凝血酶原复合物","why":"需快速逆转以限制血肿扩大。","type":"陷阱"}],"overlay":{"A":"内科口径要求计算血肿量、记录 GCS 与瞳孔变化，评估再出血与癫痫风险。","B":"急诊口径“CT 确诊+血压控制+神外会诊”三线同步。","C":"基层口径识别即头高 30°、建立通路、控制血压不过度、立即上转。"}},"蛛网膜下腔出血：雷击样头痛":{"title":"蛛网膜下腔出血：雷击样头痛","why":"“一生最剧烈、1 分钟内达峰”的头痛，必须查 CT 与腰穿，不能靠止痛观察。","sections":[{"h":"判据","p":"典型：雷击样头痛（数秒至 1 分钟达峰）、伴恶心呕吐、颈抵抗、畏光、短暂意识丧失；可有动眼神经麻痹（后交通动脉瘤）。CT 平扫发病 6 小时内敏感度接近 100%，随时间下降；CT 阴性而临床怀疑→腰穿见均匀血性或黄变（分光光度法）。"},{"h":"边界","p":"约 1/3 患者头痛非“最剧烈”，可被误为偏头痛或紧张性头痛；腰穿在发病 12 小时后更易见黄变；CT 阴性不能完全排除（尤其>6 小时）；需与脑静脉窦血栓、动脉夹层、垂体卒中鉴别。"},{"h":"动作","p":"确诊后：绝对卧床、镇痛、控制血压（SBP<160）、预防再出血（尼莫地平预防血管痉挛）、尽早介入栓塞或夹层手术；监测脑积水与低钠；避免用力、通便；转有神经介入条件中心。"}],"points":["雷击样头痛必须 CT+必要时腰穿","CT 6 小时内最敏感，之后需腰穿补充","尼莫地平预防血管痉挛"],"pitfalls":["CT 阴性即放行回家","用止痛药掩盖后观察"],"quiz":[{"q":"雷击样头痛 24 小时、CT 阴性，下一步？","a":"腰椎穿刺查黄变与红细胞","why":"超过 6 小时 CT 敏感度下降，需腰穿。","type":"知识"},{"q":"头痛程度不剧烈可排除 SAH？","a":"不能","why":"约三分之一表现不典型。","type":"陷阱"}],"overlay":{"A":"内科口径要求掌握腰穿分光光度法判读与血管痉挛监测。","B":"急诊口径“雷击样头痛=CT 立即+神外/介入会诊”，不用止痛药后观察。","C":"基层口径不做腰穿即上转，途中安静、镇痛、避免用力。"}},"意识障碍分级与“代谢 vs 结构”":{"title":"意识障碍分级与“代谢 vs 结构”","why":"意识障碍的第一个分岔是代谢性还是结构性，因为处置方向完全相反。","sections":[{"h":"判据","p":"分级：AVPU（清醒/言语/疼痛/无反应）、GCS（睁眼4+语言5+运动6，≤8 考虑气道保护）。代谢性线索：双侧对称、瞳孔对光存在、扑翼样震颤、血糖/电解质/肝肾功能异常、体温异常、药物史；结构性线索：瞳孔不等大、眼位偏斜、局灶体征、呼吸模式异常、进行性恶化。"},{"h":"边界","p":"低血糖、低钠、肝性脑病、尿毒症、CO₂ 潴留、镇静药过量均可致意识障碍；GCS 在插管、面瘫、语言障碍者失真；瞳孔固定散大在低温、药物（阿托品）也可出现。"},{"h":"动作","p":"ABC 优先、立即测血糖（并给葡萄糖/纳洛酮按指征）、查瞳孔与眼位、生命体征与体温、血气与电解质、肝肾功能、血氨、药物筛查；代谢性→纠正病因；结构性→头颅 CT 并请神内外；GCS≤8 或气道不能保护→插管。"}],"points":["先测血糖，任何意识障碍第一步","对称+瞳孔正常偏向代谢性","GCS≤8 考虑气道保护"],"pitfalls":["未测血糖即送 CT","以瞳孔正常排除结构性病变"],"quiz":[{"q":"意识障碍患者第一步处置？","a":"ABC+立即测血糖","why":"低血糖是最可逆的致命原因。","type":"知识"},{"q":"GCS 15 分可排除严重颅内病变？","a":"不能，需结合局灶体征与病程","why":"早期或非优势半球病变可 GCS 正常。","type":"陷阱"}],"overlay":{"A":"内科口径按“代谢六项”（糖、钠、钙、氨、血气、肾功）顺序排查并记录。","B":"急诊口径 5 分钟内完成血糖、瞳孔、GCS，决定 CT 或纠正代谢。","C":"基层口径测血糖、看瞳孔、保气道，不能解释者即上转。"}},"癫痫持续状态：5 分钟即处理":{"title":"癫痫持续状态：5 分钟即处理","why":"抽搐超过 5 分钟不会自行停止的概率显著上升，等待就是在制造脑损伤。","sections":[{"h":"判据","p":"惊厥性持续状态：抽搐≥5 分钟，或两次发作间意识未恢复。非惊厥性：意识改变+脑电图癫痫样放电，易漏诊。病因：停药、低血糖、低钠、感染、卒中、肿瘤、中毒、酒精戒断。红旗：首发>40 岁、局灶起始、发热、妊娠、外伤。"},{"h":"边界","p":"假性发作（心因性）可有节律性动作但瞳孔正常、无发绀、无发作后意识模糊；低血糖与低钠必须即刻纠正；妊娠期需考虑子痫（硫酸镁）；酒精戒断需苯二氮䓬类。"},{"h":"动作","p":"0–5 分钟：保护、侧卧、吸氧、测血糖、建立通路；5 分钟：苯二氮䓬类（地西泮静推或咪达唑仑肌注）；仍发作→二线（左乙拉西坦/丙戊酸/苯妥英）；难治性→气管插管+丙泊酚/咪达唑仑持续泵入+脑电监测。同时查病因。"}],"points":["5 分钟即用苯二氮䓬类","二线用药不重叠同机制","难治性需插管与脑电监测"],"pitfalls":["反复多次推注苯二氮䓬类导致呼吸抑制","未测血糖即用抗癫痫药"],"quiz":[{"q":"抽搐持续 6 分钟，首选药物？","a":"苯二氮䓬类（地西泮/咪达唑仑）","why":"一线终止发作，同时测血糖。","type":"知识"},{"q":"抽搐停止即无需再评估？","a":"错，需找病因并评估非惊厥性持续状态","why":"意识未恢复者需脑电评估。","type":"陷阱"}],"overlay":{"A":"内科口径要求记录发作时间轴、用药剂量与意识恢复过程，并排查病因。","B":"急诊口径以分钟为节点执行阶梯方案，提前备好气道。","C":"基层口径保护气道、测血糖、首剂苯二氮䓬类后立即上转。"}},"颅内压增高与脑疝：瞳孔、呼吸、血压":{"title":"颅内压增高与脑疝：瞳孔、呼吸、血压","why":"脑疝的识别窗口只有几分钟，瞳孔与呼吸模式是床旁最可靠的信号。","sections":[{"h":"判据","p":"颅内压增高：头痛（晨起加重）、喷射性呕吐、视乳头水肿、意识下降、血压升高伴心动过缓（Cushing 反应）、呼吸不规则。脑疝：一侧瞳孔散大固定（颞叶钩回疝）、去大脑强直、呼吸模式改变（Cheyne-Stokes、中枢性过度通气）、GCS 快速下降。"},{"h":"边界","p":"Cushing 三联出现常为晚期；阿托品、缺氧、低温可影响瞳孔；视乳头水肿需时间形成，急性期可缺如；镇静与肌松会掩盖神经体征。"},{"h":"动作","p":"立即：头高 30°、保持气道与氧合（避免低氧与高碳酸）、维持 MAP 保证脑灌注；甘露醇（0.5–1g/kg）或高渗盐水，短期过度通气（PaCO₂ 30–35mmHg）用于濒危；急查 CT、请神外；禁用低渗液，控制体温与癫痫。"}],"points":["一侧瞳孔散大+意识下降=脑疝","Cushing 反应为晚期，不可等","甘露醇/高渗盐水+神外急诊"],"pitfalls":["平卧、颈部屈曲加重颅内压","以视乳头水肿缺失排除颅高压"],"quiz":[{"q":"患者头痛呕吐、右瞳散大固定、血压 180/60、心率 52，最可能？","a":"颞叶钩回疝伴 Cushing 反应","why":"需立即降颅压并请神外。","type":"知识"},{"q":"腰椎穿刺可用于缓解颅高压？","a":"严禁在颅高压/脑疝风险时腰穿","why":"可诱发脑疝。","type":"陷阱"}],"overlay":{"A":"内科口径要求动态记录瞳孔、GCS、呼吸模式与血压心率组合。","B":"急诊口径“瞳孔不等+意识下降”即降颅压+CT+神外，不等影像。","C":"基层口径头高、保气道、不过量补液、立即上转，不做腰穿。"}},"头痛红旗：SNOOP4":{"title":"头痛红旗：SNOOP4","why":"头痛的绝大多数是良性，但红旗一旦漏掉，代价极高；SNOOP4 是可背的清单。","sections":[{"h":"判据","p":"S（全身症状/疾病）：发热、体重下降、肿瘤史、免疫抑制、妊娠；N（神经功能缺损）：局灶体征、意识改变、癫痫；O（起病）：突然雷击样；O（年龄）：新发>50 岁；P1（模式改变）：既往头痛性质变化、频率加重；P2（体位）：站立加重（低颅压）或平卧加重（颅高压）；P3（用力诱发）：咳嗽、排便、运动诱发；P4（视乳头水肿）。"},{"h":"边界","p":"偏头痛可有先兆与呕吐，易与红旗混淆；紧张性头痛为双侧压迫感；丛集性头痛为单侧眼眶痛伴自主神经症状与夜间发作；药物过度使用性头痛需问止痛药天数。新发>50 岁的头痛需考虑巨细胞动脉炎（查 ESR/CRP、颞动脉）。"},{"h":"动作","p":"有红旗→影像（CT/MRI，按怀疑方向）+必要实验室（ESR/CRP、血常规、腰穿）；无红旗且符合原发性头痛标准→对症治疗与随访；避免长期使用复方止痛药；交代需返院的新发症状。"}],"points":["SNOOP4 是头痛红旗清单","新发>50 岁头痛想到巨细胞动脉炎","雷击样头痛按 SAH 流程"],"pitfalls":["把所有头痛都开 CT","长期复方止痛药导致药物过度使用性头痛"],"quiz":[{"q":"65 岁新发颞部头痛、咀嚼无力，需查什么？","a":"ESR/CRP 并考虑颞动脉活检/激素治疗","why":"巨细胞动脉炎可致失明，需尽快激素。","type":"知识"},{"q":"头痛伴发热、颈抵抗可按偏头痛处理？","a":"不可，需排除中枢感染","why":"属于 SNOOP4 红旗。","type":"陷阱"}],"overlay":{"A":"内科口径要求按 SNOOP4 逐项记录并写出影像指征。","B":"急诊口径红旗阳性即影像，阴性者给方案并交代返院指征。","C":"基层口径问清起病方式、年龄、伴随症状，红旗阳性即上转。"}},"眩晕：中枢与外周的 HINTS 检查":{"title":"眩晕：中枢与外周的 HINTS 检查","why":"眩晕的最大风险是把小脑梗死当成“耳石症”放回家。","sections":[{"h":"判据","p":"HINTS（适用于急性持续眩晕伴自发性眼震）：Head Impulse 正常（无纠正性扫视）提示中枢；Nystagmus 方向改变或垂直性提示中枢；Test of Skew 垂直偏斜提示中枢。任一项中枢型→按卒中处理。外周：单向水平眼震、头脉冲试验异常（有纠正性扫视）、无垂直偏斜；BPPV 为位置性、<1 分钟、Dix-Hallpike 阳性。"},{"h":"边界","p":"HINTS 仅适用于持续眩晕且能配合者，不适用于间歇性眩晕或 BPPV；早期小脑卒中头脉冲可正常（假阴性），伴吞咽困难、共济失调、复视、交叉性感觉障碍提示后循环；听力下降提示迷路或前庭神经病变。"},{"h":"动作","p":"有血管危险因素或中枢体征→头颅 MRI（DWI，CT 早期敏感度低）+卒中流程；外周性→对症（异丙嗪/苯海拉明短期）、BPPV 行手法复位（Epley）；避免长期用前庭抑制剂影响代偿；交代跌倒风险。"}],"points":["HINTS 三项任一中枢型按卒中处理","CT 对小脑梗死不敏感，需 MRI DWI","BPPV 首选手法复位"],"pitfalls":["以“眩晕+恶心”按胃肠炎处理","CT 阴性即排除后循环卒中"],"quiz":[{"q":"持续眩晕、垂直眼震、头脉冲正常，考虑？","a":"中枢性眩晕（后循环卒中可能）","why":"HINTS 提示中枢，需 MRI 与卒中流程。","type":"知识"},{"q":"头颅 CT 正常能否排除小脑梗死？","a":"不能，需 MRI DWI","why":"后颅窝 CT 伪影多、早期敏感度低。","type":"陷阱"}],"overlay":{"A":"内科口径要求掌握 HINTS 操作要点与后循环定位，写出鉴别依据。","B":"急诊口径“眩晕+血管危险因素”直接 MRI 通道，不按耳石症放行。","C":"基层口径无法做 HINTS 时，凡持续眩晕伴行走不稳即上转。"}},"呼吸困难分级与“说不出话”的红旗":{"title":"呼吸困难分级与“说不出话”的红旗","why":"呼吸做功与说话能力比 SpO2 更早反映“即将衰竭”。","sections":[{"h":"判据","p":"红旗：不能完整说一句话、辅助呼吸肌参与（胸锁乳突肌收缩）、三凹征、鼻翼扇动、发绀、大汗、意识改变（烦躁→嗜睡）、呼吸频率>30 或<8、单侧呼吸音消失、吸气性喘鸣。分级可用 mMRC 或 NYHA 描述慢性状态，急性期用“说话能力+做功+意识”三要素快速判断。"},{"h":"边界","p":"SpO2 正常可能是代偿期（过度通气）或一氧化碳中毒、贫血；SpO2 低也可能是慢性基线（COPD、先心）。呼吸频率正常而潮气量小（浅快）同样危险。焦虑所致过度通气需在排除器质性病因后诊断，不能先给镇静。"},{"h":"动作","p":"按 ABC 处理：体位（坐位/前倾）、高流量氧或无创通气（按病种）、监护、建立通路；同时做床旁病因筛查（心电、超声、血气、D-二聚体、胸片）；“说不出话”即按濒危气道准备，呼叫上级与麻醉，备气管插管。"}],"points":["说话能力是床旁最敏感的严重度指标","SpO2 正常不能排除衰竭（代偿/CO 中毒/贫血）","说不出话=按濒危气道准备"],"pitfalls":["以 SpO2 正常安抚“喘得厉害”的患者","对过度通气先给镇静"],"quiz":[{"q":"患者能说单字、三凹征明显、SpO2 94%，属于？","a":"濒危呼吸状态，需立即干预","why":"做功显著增加且不能成句，SpO2 尚未下降不代表安全。","type":"陷阱"},{"q":"COPD 患者 SpO2 88% 一定是急症？","a":"不一定","why":"需与其基线比较，结合意识、血气与做功判断。","type":"知识"}],"overlay":{"A":"内科口径用 mMRC 与 CAT 记录慢性状态，急性加重时用血气与做功描述，避免只写“气促”。","B":"急诊口径 30 秒完成“能不能说句、有没有三凹、意识清不清”，据此决定是否进抢救区。","C":"基层口径把“不能平卧、不能成句、口唇发紫”作为立即上转的三条硬指标。"}},"重症哮喘：静默肺与 PaCO2 正常化":{"title":"重症哮喘：静默肺与 PaCO2 正常化","why":"哮喘最危险的时刻，往往看起来“喘鸣减轻了”。","sections":[{"h":"判据","p":"濒危信号：喘鸣音减弱或消失（静默肺）、PaCO2 由低转正常或升高（>45mmHg）、意识改变/嗜睡、呼吸肌疲劳、发绀、心动过缓、气胸。重症发作：不能成句、RR>30、心率>120、SpO2<90%、PEF<50% 预计值、辅助呼吸肌参与。"},{"h":"边界","p":"PaCO2 正常在哮喘急性发作中是危险信号而非好转，因为患者本应过度通气。喘鸣强度与气流受限不平行，声音小可能气流更差。需与心源性哮喘、上气道梗阻、COPD、异物、肺栓塞鉴别；年轻患者出现“哮喘”首次发作要想到其他诊断。"},{"h":"动作","p":"氧疗目标 SpO2 93–95%；反复吸入短效 β2 受体激动剂（可连续雾化）+ 异丙托溴铵；早期全身糖皮质激素；硫酸镁静脉用于重症；不常规用抗生素与镇静剂。无改善或出现濒危信号→无创通气慎用（可能加重气体陷闭），准备气管插管与小潮气量通气，警惕动态肺过度充气与气胸。"}],"points":["静默肺与 PaCO2 正常化是恶化信号","氧疗目标 93–95%，避免过度给氧","濒危者准备插管，无创通气需谨慎"],"pitfalls":["以喘鸣减轻判断好转","PaCO2 正常即认为无需升级"],"quiz":[{"q":"哮喘患者经治疗后喘鸣减弱、嗜睡、PaCO2 46mmHg，提示？","a":"病情恶化，濒危","why":"气流严重受限+通气衰竭+意识改变，需立即气道支持。","type":"陷阱"},{"q":"重症哮喘患者 PaCO2 正常代表？","a":"可能是疲劳失代偿的过渡，属危险信号","why":"本应低碳酸，正常化说明通气能力下降。","type":"知识"}],"overlay":{"A":"内科口径强调“哮喘控制评估+吸入装置技术+书面行动计划”，急性期后必须复查肺功能。","B":"急诊口径走“氧-雾化-激素-镁-评估”五步，30 分钟复评一次，不改善即升级。","C":"基层口径：能雾化+激素者先处理，但“不能成句、发绀、嗜睡”三条任一即上转，不反复观察。"}},"COPD 急性加重：意识与血气优先":{"title":"COPD 急性加重：意识与血气优先","why":"COPD 加重的处置由血气与意识决定，不由喘鸣与痰量决定。","sections":[{"h":"判据","p":"重症标准：意识改变、pH<7.35 且 PaCO2>45mmHg、呼吸功显著增加、SpO2<88%、血流动力学不稳、新发心律失常。需住院：症状显著加重、合并症失代偿、家庭治疗失败、无法居家管理。诱因：感染（最常见）、空气污染、心衰、肺栓塞、气胸、镇静药。"},{"h":"边界","p":"氧疗目标 88–92%，过高可加重高碳酸血症与二氧化碳麻醉。无创通气首选于急性高碳酸性呼吸衰竭，禁忌包括：不能配合、意识障碍加重、误吸风险高、面部畸形/创伤、血流动力学不稳、上气道梗阻。意识改变要先排除镇静药、脑卒中、低血糖、高碳酸血症。"},{"h":"动作","p":"控制性氧疗+支气管扩张剂（短效 β2+抗胆碱能）+全身激素（5–7 天）+有指征时抗生素（痰脓性+量增/气促加重，或需机械通气）；30–60 分钟复评血气；无创通气（pH≤7.35 且 PaCO2>45 优先）；恶化则插管。同时排查气胸、心衰、PE。"}],"points":["氧疗目标 88–92%，警惕 CO2 蓄积","无创通气首选但需排禁忌","意识改变先想 CO2 麻醉并排除其他"],"pitfalls":["高流量吸氧导致 CO2 麻醉","对意识障碍患者直接上无创通气而不评估"],"quiz":[{"q":"COPD 急性加重，pH 7.28、PaCO2 68、意识清楚、能配合，首选呼吸支持？","a":"无创通气","why":"急性高碳酸性呼吸衰竭且能配合，NIV 可降低插管率。","type":"知识"},{"q":"COPD 患者 SpO2 目标应维持在 98% 以上？","a":"错","why":"目标 88–92%，过高有 CO2 蓄积风险。","type":"陷阱"}],"overlay":{"A":"内科口径要把“稳定期管理”接上：戒烟、疫苗、吸入长效支扩、肺康复，减少再入院。","B":"急诊口径盯血气与意识，1 小时内复评，NIV 30 分钟看 pH 是否改善。","C":"基层口径具备血气的机构可按目标氧疗处理，无血气条件者氧疗后仍气促或嗜睡即上转。"}},"肺炎严重度：CURB-65 与重症标准":{"title":"肺炎严重度：CURB-65 与重症标准","why":"肺炎的关键决定是“在哪治”，而评分只是把决定变得可审计。","sections":[{"h":"判据","p":"CURB-65：意识障碍、尿素>7mmol/L、呼吸频率≥30、血压（SBP<90 或 DBP≤60）、年龄≥65，每项 1 分；0–1 分可门诊，2 分住院，≥3 分考虑 ICU。重症肺炎（IDSA/ATS 主要标准）：需有创通气或需升压药；次要标准（≥3 条）：RR≥30、氧合指数≤250、多肺叶浸润、意识障碍、尿毒症、白细胞<4×10⁹/L、血小板<10×10⁹/L、低体温。"},{"h":"边界","p":"老年人、免疫抑制者可无发热与白细胞升高，CURB-65 会低估；年轻患者可因低氧单独达标而迅速恶化。CURB-65 不含氧合，SpO2 与氧合指数必须单独看。影像学吸收滞后，不能以胸片“没变化”判断治疗失败。"},{"h":"动作","p":"门诊：口服抗生素+48–72 小时复评+安全网。住院：判断病原（社区/医院获得、有无耐药风险），首剂抗生素在诊断后 4 小时内（重症 1 小时内），并测乳酸、血培养（重症）、流感/新冠检测。48–72 小时评估反应，无改善考虑并发症（脓胸、肺脓肿）、耐药、非感染性病因。"}],"points":["CURB-65 决定门诊/住院，不含氧合","重症标准：需通气或升压药，或≥3 条次要标准","48–72 小时无改善要重新想诊断"],"pitfalls":["以体温正常排除老年重症肺炎","把胸片吸收慢当成治疗失败"],"quiz":[{"q":"CURB-65 1 分但 SpO2 88%，可否门诊治疗？","a":"不可","why":"低氧提示重症可能，评分未纳入氧合。","type":"陷阱"},{"q":"重症肺炎的“主要标准”包括哪两项？","a":"需有创机械通气、需升压药","why":"任一成立即诊断重症，直接进 ICU 评估。","type":"知识"}],"overlay":{"A":"内科口径要求写清“病原推测依据+抗生素选择理由+降阶梯计划”，并在 48–72 小时复评。","B":"急诊口径 1 小时内给重症患者首剂抗生素，同时留取血培养与乳酸，不因等床延迟。","C":"基层口径用简化判断：SpO2<93%、RR≥30、意识改变、不能口服、独居无人照护，任一即上转。"}},"ARDS：柏林定义与早期识别":{"title":"ARDS：柏林定义与早期识别","why":"ARDS 的漏诊多发生在“吸氧后 SpO2 还行”的患者，而它的治疗核心只是肺保护性通气。","sections":[{"h":"判据","p":"柏林定义四要素：起病 1 周内已知诱因或新发/加重呼吸道症状；双肺浸润影不能用积液、肺不张、结节解释；呼吸衰竭不能完全由心衰或液体过负荷解释；氧合指数 PaO2/FiO2≤300mmHg（PEEP≥5）。分级：轻度 200–300、中度 100–200、重度<100。床旁替代：SpO2/FiO2≤315 提示可能。"},{"h":"边界","p":"SpO2 正常不能排除早期 ARDS（吸氧掩盖）；心衰与 ARDS 可并存，需床旁超声评估心功能与 B 线；高原地区需校正 PaO2。肥胖、胸壁畸形影响影像判读。输血相关、胰腺炎、误吸、肺挫伤、脓毒症是常见诱因，必须写明。"},{"h":"动作","p":"低潮气量 6ml/kg 预测体重、平台压≤30cmH₂O、允许性高碳酸血症；适当 PEEP；俯卧位用于中重度（>12–16 小时/天）；限制性液体策略；治疗原发病。避免大潮气量与高平台压，这是唯一被反复证明能降低死亡率的两项。"}],"points":["氧合指数≤300+PEEP≥5 是诊断门槛","6ml/kg 预测体重+平台压≤30 是核心治疗","中重度尽早俯卧位"],"pitfalls":["以吸氧后 SpO2 尚可排除 ARDS","按实际体重设定潮气量"],"quiz":[{"q":"ARDS 患者平台压 34cmH₂O，首要调整？","a":"下调潮气量以降低平台压至≤30","why":"肺保护性通气是降低死亡率的关键。","type":"知识"},{"q":"心衰患者出现双肺浸润与低氧，是否一定不是 ARDS？","a":"不一定，两者可并存","why":"需床旁超声与治疗反应判断，不能单凭病史排除。","type":"陷阱"}],"overlay":{"A":"内科口径要求逐日记录氧合指数、PEEP、平台压与驱动压，形成可追溯的肺保护执行记录。","B":"急诊口径识别“诱因+双肺浸润+低氧”即按 ARDS 保护性通气，插管前就设定好潮气量。","C":"基层口径只判两件事：吸氧后仍低氧、双肺湿性病变；符合即上转，途中避免高流量高浓度氧掩盖。"}},"上气道梗阻：吸气性喘鸣与不能发声":{"title":"上气道梗阻：吸气性喘鸣与不能发声","why":"这是“几分钟内决定气道”的问题，任何药物观察都可能来不及。","sections":[{"h":"判据","p":"线索：吸气性喘鸣（stridor）、声音改变（犬吠样咳、声音嘶哑）、不能发声或说话含糊、流涎、吞咽困难、三凹征、烦躁、发绀。病因：会厌炎、喉头水肿（过敏/ACEI）、异物、肿瘤、双侧声带麻痹、颈部血肿/感染。过敏相关常伴荨麻疹、面部肿胀、既往类似史。"},{"h":"边界","p":"喘鸣音减弱不代表好转，可能是气流近乎消失；儿童与成人表现不同，儿童以病毒感染（哮吼）多见，成人需警惕会厌炎与肿瘤。不可强行查看咽部或让患者平卧，可能诱发完全梗阻。哮喘为呼气性喘鸣，两者机制不同。"},{"h":"动作","p":"保持坐位、不要平卧、减少刺激；高流量氧；立即呼叫麻醉/耳鼻喉/上级，准备困难气道与外科气道（环甲膜切开）；过敏性喉水肿立即肾上腺素肌注；会厌炎按经验性抗生素+激素并保持自主呼吸，避免盲目插管刺激。"}],"points":["吸气性喘鸣+声音改变=气道急症","禁止平卧与强行查咽","肾上腺素用于过敏，环甲膜切开是最后保障"],"pitfalls":["把成人吸气性喘鸣当哮喘雾化观察","让患者平卧以“缓解呼吸困难”"],"quiz":[{"q":"成人突发流涎、不能吞咽、吸气性喘鸣、发热，最可能？","a":"急性会厌炎","why":"需保持坐位、避免刺激、准备气道，抗生素+激素。","type":"知识"},{"q":"喘鸣音变小说明梗阻缓解？","a":"不一定，可能是气流消失","why":"需看意识、发绀与呼吸做功。","type":"陷阱"}],"overlay":{"A":"内科口径要掌握 ACEI 相关血管性水肿与过敏的鉴别，以及激素使用的时机与剂量依据。","B":"急诊口径“不躺、不查咽、不镇咳”，直接呼叫气道团队并备环甲膜切开包。","C":"基层口径识别即保持坐位、吸氧、呼叫转运；不试行插管，不用镇静药。"}},"咯血分级与大咯血处理":{"title":"咯血分级与大咯血处理","why":"大咯血的首要死因是窒息而非失血，体位与气道优先于止血药。","sections":[{"h":"判据","p":"分级：少量<100ml/24h；中量 100–500ml/24h；大咯血>500ml/24h 或一次>100ml，或任何引起气道阻塞的咯血。窒息预警：咯血突然停止伴呼吸困难加重、烦躁、SpO2 下降、单侧呼吸音消失。常见病因：支气管扩张、结核、肿瘤、曲霉球、肺血管畸形、抗凝相关、心衰（粉红泡沫痰）。"},{"h":"边界","p":"需与呕血鉴别（咯血鲜红、泡沫、伴咳嗽；呕血暗红、有食物残渣、伴恶心）。咯血量估计常不准，窒息风险比总量更重要。抗凝/抗血小板患者的咯血需评估逆转。少量咯血也可能是肿瘤的首发表现，需影像随访。"},{"h":"动作","p":"侧卧位（患侧在下）、保持气道通畅、吸引器备用、高流量氧；建立两条通路、备血、纠正凝血；大咯血呼叫呼吸/介入/胸外，尽早支气管镜定位与清除血块，可行支气管动脉栓塞；必要时双腔管或硬质镜。禁用强效镇咳至抑制咳嗽反射，慎用镇静。"}],"points":["窒息风险>失血量，体位与吸引优先","患侧卧位、备吸引与气道工具","支气管动脉栓塞是大咯血主要止血手段"],"pitfalls":["平卧导致血液灌入健侧肺","只给止血药不准备气道与介入"],"quiz":[{"q":"大咯血患者突然咯血停止、烦躁、SpO2 82%、右肺呼吸音消失，首要动作？","a":"立即气道清理（吸引/插管）并侧卧患侧","why":"提示血块阻塞气道，窒息是主要死因。","type":"知识"},{"q":"大咯血首选止血药物即可，无需介入？","a":"错","why":"药物效果有限，支气管动脉栓塞或镜下处理是关键。","type":"陷阱"}],"overlay":{"A":"内科口径要求查清病因（CT、支气管镜、痰检）并管理抗凝，出院后随访影像。","B":"急诊口径先气道后病因：吸引、侧卧、备插管，同时呼叫介入。","C":"基层口径不处理大咯血，保持侧卧与吸引、建立通路即上转，途中持续监护。"}},"胸腔积液与脓胸：发热 + 单侧浊音":{"title":"胸腔积液与脓胸：发热 + 单侧浊音","why":"发热+单侧浊音要想到脓胸，因为它需要引流而不只是抗生素。","sections":[{"h":"判据","p":"体征：患侧叩浊、呼吸音减弱、语颤减弱、气管向健侧移位（大量时）。脓胸线索：发热、胸痛、白细胞升高、积液呈脓性或 pH<7.2、葡萄糖<3.3mmol/L、LDH 显著升高、胸水培养阳性。影像：胸片立位见肋膈角变钝（>200ml 才明显），床旁超声可定位与评估分隔。"},{"h":"边界","p":"胸片难以区分积液与肺实变，需超声或 CT；漏出液与渗出液用 Light 标准区分，但心衰利尿后胸水可呈“假性渗出”；结核性胸膜炎以淋巴细胞为主、ADA 升高；胰腺炎、食管破裂可致左侧胸腔积液（淀粉酶升高）。"},{"h":"动作","p":"超声定位后诊断性穿刺（外观、细胞分类、蛋白、LDH、葡萄糖、pH、涂片培养、细胞学）；脓胸或复杂性肺炎旁积液→胸腔引流（尽早，避免形成纤维板）；抗生素覆盖厌氧菌与革兰阴性菌；包裹性积液可考虑胸腔内纤溶或外科处理。"}],"points":["发热+单侧浊音+积液要考虑脓胸","脓胸关键是引流，不只是抗生素","胸水 pH<7.2、糖低提示复杂性积液"],"pitfalls":["反复穿刺抽液而不置管引流脓胸","把结核性胸膜炎当普通肺炎长期抗感染"],"quiz":[{"q":"肺炎患者胸水 pH 7.05、葡萄糖 1.8mmol/L，处理？","a":"胸腔置管引流+抗生素","why":"提示复杂性肺炎旁积液/脓胸，需引流。","type":"知识"},{"q":"胸片肋膈角变钝可排除少量胸腔积液？","a":"不能","why":"胸片对少量积液不敏感，超声更佳。","type":"陷阱"}],"overlay":{"A":"内科口径要求按 Light 标准与胸水指标写诊断推理，并区分结核、恶性、感染性积液。","B":"急诊口径床旁超声定位即穿刺，脓性/低 pH 立即置管。","C":"基层口径能穿刺者做诊断性穿刺并送检，不能者上转；脓胸不留在门诊。"}},"糖尿病酮症酸中毒：血糖 + 酮体 + 阴离子间隙":{"title":"糖尿病酮症酸中毒：血糖 + 酮体 + 阴离子间隙","why":"DKA 的死亡多来自补液与补钾不当，而不是血糖降得不够快。","sections":[{"h":"判据","p":"三联：高血糖（或正常血糖 DKA，见于 SGLT2 抑制剂、妊娠、进食少）、酮体升高（血 β-羟丁酸≥3mmol/L 或尿酮强阳性）、代谢性酸中毒（pH<7.3 或 HCO₃⁻<18）。阴离子间隙升高。诱因：感染、胰岛素中断、心梗、卒中、妊娠、药物（SGLT2i、糖皮质激素、抗精神病药）。红旗：K<3.5、意识改变、乳酸升高、低血压。"},{"h":"边界","p":"血糖正常不能排除（正常血糖 DKA）；尿酮以乙酰乙酸为主，治疗后可能滞后于病情；高渗状态与 DKA 可重叠；儿童需警惕脑水肿（头痛、意识恶化、心率减慢）。"},{"h":"动作","p":"① 补液：生理盐水 15–20ml/kg 首小时，随后按脱水程度；② 钾：K<3.5 先补钾再上胰岛素；K 3.5–5.2 边补边用；③ 胰岛素：0.1U/kg/h 泵入，血糖降至 11–14mmol/L 加葡萄糖；④ 每小时监测血糖、每 2–4 小时查电解质与血气；⑤ 找并处理诱因；⑥ 过渡到皮下胰岛素需重叠 1–2 小时。"}],"points":["K<3.5 先补钾再用胰岛素","血糖正常也可发生 DKA","补液与补钾比降糖速度更决定安全"],"pitfalls":["胰岛素先于补钾导致致命低钾","血糖降至 13 即停胰岛素不查酮体"],"quiz":[{"q":"DKA 患者血钾 3.1mmol/L，能否立即启动胰岛素泵？","a":"不能，先补钾","why":"胰岛素使钾向细胞内转移，可致致命心律失常。","type":"知识"},{"q":"血糖 12mmol/L 可排除 DKA？","a":"不能，存在正常血糖 DKA","why":"需查酮体与血气，SGLT2i 使用者尤其。","type":"陷阱"}],"overlay":{"A":"内科口径要求逐小时记录血糖、钾、阴离子间隙与补液量，写出达标判据（酮体清除而非仅血糖）。","B":"急诊口径先补液与查钾，胰岛素延后至钾安全，同步找诱因。","C":"基层口径建立通路、补液、查血糖血酮，条件不足即上转，不自行大剂量胰岛素。"}},"高渗高血糖状态：极高血糖 + 高渗 + 意识障碍":{"title":"高渗高血糖状态：极高血糖 + 高渗 + 意识障碍","why":"HHS 的脱水程度远重于 DKA，补液速度决定脑与肾的结局。","sections":[{"h":"判据","p":"血糖常>33.3mmol/L、有效血浆渗透压>320mOsm/kg、无明显酮症酸中毒（pH>7.3、HCO₃⁻>18）、意识障碍突出、脱水严重（可>8L）、老年 2 型糖尿病多见。计算：有效渗透压=2×Na+血糖(mmol/L)。"},{"h":"边界","p":"HHS 与 DKA 可重叠（尤其感染与胰岛素中断）；意识障碍程度与渗透压相关，但也需排除卒中、感染、药物；血钠测定在高血糖时需校正（血糖每升高 5.6mmol/L，血钠约降 1.6mmol/L）。"},{"h":"动作","p":"积极但平稳补液（首小时生理盐水 15–20ml/kg，随后按钠与容量调整），胰岛素 0.05–0.1U/kg/h 起始（血糖下降速度 3–5mmol/L/h 为宜），监测钾并按需补充，纠正诱因，预防血栓（必要时抗凝），老年患者防容量过负荷与心衰。"}],"points":["有效渗透压>320 且血糖>33.3 提示 HHS","补液是核心，速度需平稳","意识障碍需同时排除卒中与感染"],"pitfalls":["血糖下降过快导致脑水肿","忽略高渗状态下的血钠校正"],"quiz":[{"q":"HHS 患者补液首要目标？","a":"纠正容量不足，平稳恢复循环与渗透压","why":"过快降糖或降渗可致神经系统损伤。","type":"知识"},{"q":"HHS 一定没有酮体？","a":"不一定，可与 DKA 重叠","why":"需查血气与酮体判断。","type":"陷阱"}],"overlay":{"A":"内科口径计算有效渗透压并逐小时记录神志与出入量，评估血栓风险。","B":"急诊口径先评估容量与意识，补液与查因并行。","C":"基层口径识别“极高血糖+意识改变”即上转，途中不快速大量补液。"}},"低血糖：意识改变 + 可逆性":{"title":"低血糖：意识改变 + 可逆性","why":"低血糖是最可逆的意识障碍原因，测一次血糖只要 10 秒。","sections":[{"h":"判据","p":"Whipple 三联：低血糖（<3.9mmol/L，严重者<3.0）、相应症状（交感：心悸、出汗、震颤、饥饿；神经低糖：意识模糊、行为异常、抽搐、昏迷）、纠正后症状缓解。高危：胰岛素或磺脲类、饮酒、肝肾功能不全、进食少、老年、肾上腺功能不全。"},{"h":"边界","p":"β 阻滞剂可掩盖心悸震颤；磺脲类所致低血糖可反复且持久（需观察 24–72 小时）；意识障碍者不能口服，需静脉葡萄糖；低血糖纠正后仍昏迷需考虑脑损伤或其他病因。"},{"h":"动作","p":"意识清楚：15g 快速碳水，15 分钟复测；意识障碍：50% 葡萄糖 40–60ml 静推或胰高血糖素 1mg 肌注（无静脉通路时），随后持续葡萄糖输注；磺脲类所致加用奥曲肽并收入观察；查因并调整降糖方案，教育患者与家属。"}],"points":["任何意识障碍先测血糖","磺脲类低血糖可持久，需延长观察","不能口服者静脉葡萄糖或胰高血糖素"],"pitfalls":["给意识障碍者喂食导致误吸","低血糖纠正后立即让患者回家（磺脲类）"],"quiz":[{"q":"昏迷患者血糖 1.9mmol/L，首选处置？","a":"静脉推注葡萄糖（或肌注胰高血糖素）","why":"不可口服，避免误吸。","type":"知识"},{"q":"血糖回升至 5.0 即可离院？","a":"不一定，磺脲类可再发","why":"需观察并持续葡萄糖输注。","type":"陷阱"}],"overlay":{"A":"内科口径要求查清低血糖原因（药物、肝肾功能、肾上腺、胰岛素瘤）并调整方案。","B":"急诊口径“昏迷先测血糖”，纠正后观察再决定去留。","C":"基层口径备葡萄糖，识别即处理并上转反复发作者。"}},"甲状腺危象：Burch-Wartofsky 评分":{"title":"甲状腺危象：Burch-Wartofsky 评分","why":"甲状腺危象是临床诊断，等 T3/T4 结果再治往往已经晚了。","sections":[{"h":"判据","p":"Burch-Wartofsky 评分≥45 提示高度可能：体温（37.2–37.7 起计分，≥40 高分）、心率（≥130 高分）、房颤、心衰、中枢神经症状（烦躁、谵妄、昏迷）、胃肠肝（腹泻、黄疸）、诱因（感染、手术、分娩、碘造影、停药）。表现：高热、心动过速、震颤、谵妄、腹泻、呕吐、黄疸。"},{"h":"边界","p":"需与脓毒症、恶性高热、抗精神病药恶性综合征、戒断鉴别；老年人可表现为淡漠型（乏力、房颤、心衰，无明显躁动）；T3/T4 在危象与非危象甲亢可重叠，不能单独据此诊断。"},{"h":"动作","p":"① 丙硫氧嘧啶（首选，抑制外周 T4→T3）或甲巯咪唑；② 用药 1 小时后给碘剂（ Lugol 液/碘化钾）；③ β 阻滞剂（普萘洛尔）控制心率；④ 糖皮质激素（氢化可的松）；⑤ 降温（禁用阿司匹林，避免水杨酸置换甲状腺激素）、补液、纠正诱因、ICU 监护。"}],"points":["临床评分≥45 即按危象治疗，不等化验","先抗甲状腺药，1 小时后再给碘","禁用阿司匹林退热"],"pitfalls":["先给碘剂后给抗甲状腺药（碘成底物）","以 T3/T4 正常排除危象"],"quiz":[{"q":"甲状腺危象用药顺序关键点？","a":"抗甲状腺药先，1 小时后碘剂","why":"先阻断合成，再阻断释放。","type":"知识"},{"q":"高热可用阿司匹林退热？","a":"禁用","why":"水杨酸可置换甲状腺激素，加重病情。","type":"陷阱"}],"overlay":{"A":"内科口径要求完成 Burch-Wartofsky 评分并记录各项分值，训练可复核的判断。","B":"急诊口径“高热+心动过速+谵妄”即启动五项治疗，不等内分泌会诊。","C":"基层口径识别即降温、β 阻滞剂、上转，不用阿司匹林。"}},"肾上腺危象：低血压 + 低钠 + 色素沉着":{"title":"肾上腺危象：低血压 + 低钠 + 色素沉着","why":"难治性低血压的鉴别里必须有一次“给激素”的考虑。","sections":[{"h":"判据","p":"线索：低血压对补液与升压药反应差、低钠、高钾、低血糖、乏力、恶心呕吐腹痛、发热、意识改变、色素沉着（原发性）、长期激素突然停用、双侧肾上腺出血（抗凝患者）、垂体功能低下（不伴高钾与色素沉着）。"},{"h":"边界","p":"感染性休克与肾上腺危象可并存，需同时处理；高钾不显著不能排除（继发性）；色素沉着仅在原发性慢性者出现；腹痛可误为急腹症；抗凝患者突发低血压腹痛要想到肾上腺出血。"},{"h":"动作","p":"不等结果：立即静脉氢化可的松 100mg（或地塞米松，便于留皮质醇标本），随后 50–100mg q6h；补液（生理盐水）+葡萄糖纠正低血糖；纠正诱因与电解质；血压稳定后减量并转为口服，交代应激剂量与激素卡。"}],"points":["难治性低血压要想到肾上腺危象","先抽皮质醇再给氢化可的松（不因等待延迟）","补液+糖皮质激素同时进行"],"pitfalls":["等皮质醇结果再给激素","漏问长期激素使用与骤停史"],"quiz":[{"q":"感染性休克患者补液+去甲肾上腺素仍低血压，可考虑？","a":"氢化可的松（并排查肾上腺危象）","why":"难治性休克需评估肾上腺功能与激素治疗。","type":"知识"},{"q":"血钾正常可排除肾上腺危象？","a":"不能","why":"继发性者血钾可正常。","type":"陷阱"}],"overlay":{"A":"内科口径要求掌握长期激素患者的应激剂量与减量方案，写入出院交代。","B":"急诊口径“低血压+低钠+低血糖”三联即给氢化可的松。","C":"基层口径建立通路、给激素前抽血、补液后立即上转。"}},"高钾血症：心电图 + 紧急降钾":{"title":"高钾血症：心电图 + 紧急降钾","why":"高钾的死亡以分钟计，心电图改变决定是否需要立即用钙剂。","sections":[{"h":"判据","p":"分级：K 5.5–6.0 轻度；6.1–7.0 中度；>7.0 或任何心电图改变为重度。心电图演进：T 波高尖→PR 延长/P 波变小→QRS 增宽→正弦波→室颤/停搏。红旗：心率慢、QRS 增宽、低血压。常见原因：AKI/CKD、ACEI/ARB、螺内酯、保钾利尿剂、溶血、横纹肌溶解、酸中毒、肾上腺功能不全。"},{"h":"边界","p":"溶血标本可假性高钾，需复查且避免压脉带过久；心电图正常不能排除危险（慢性 CKD 可耐受较高钾）；血钾上升速度比绝对值更重要。"},{"h":"动作","p":"有心电图改变：10% 葡萄糖酸钙 10–20ml 静推（稳定心肌，起效数分钟，不降钾）；胰岛素+葡萄糖促钾内移；沙丁胺醇雾化辅助；碳酸氢钠仅用于酸中毒；之后必须排钾：利尿剂、阳离子交换树脂、透析（难治或肾衰）。持续心电监护并复查血钾。"}],"points":["心电图改变→先静脉钙剂稳定心肌","钙剂不降钾，必须同时排钾","溶血标本可假性高钾"],"pitfalls":["只降钾不用钙剂保护心肌","给钙剂后认为已解决不再复查"],"quiz":[{"q":"血钾 7.2mmol/L 伴 QRS 增宽，第一步？","a":"静脉葡萄糖酸钙","why":"先稳定心肌膜，再促转移与排钾。","type":"知识"},{"q":"血钾 6.0 且心电图正常即可门诊观察？","a":"不可，需评估原因与复查","why":"CKD 患者可迅速恶化。","type":"陷阱"}],"overlay":{"A":"内科口径要求梳理所有升钾药物与肾功能，出院前调整方案并复查。","B":"急诊口径“先钙剂、再转移、后排钾”三步固定顺序，全程监护。","C":"基层口径无监护条件者不用静脉钙剂后放行，处理即上转。"}},"低钠血症：渗透压 + 容量 + 纠正速度":{"title":"低钠血症：渗透压 + 容量 + 纠正速度","why":"低钠的处置难点不是补钠，而是“补多快”，过快会造成不可逆渗透性脱髓鞘。","sections":[{"h":"判据","p":"确诊真性低钠：血浆渗透压<275mOsm/kg；按容量分三型：低容量（脱水、利尿剂）、等容量（SIADH、甲减、肾上腺功能不全）、高容量（心衰、肝硬化、肾病）。症状分级：重度（呕吐、抽搐、昏迷、GCS 下降）、中度（恶心、意识模糊、头痛）、轻度（无力、注意力下降）。"},{"h":"边界","p":"高血糖、严重高脂血症/高蛋白可致假性低钠；SIADH 需排除甲减与肾上腺功能不全；低钠纠正过快（>8–10mmol/L/24h）致渗透性脱髓鞘，营养不良、酒精、老年女性风险更高；慢性低钠比急性更易出现并发症。"},{"h":"动作","p":"重度症状：3% 高渗盐水 100–150ml 静滴（目标 4–6mmol/L 快速提升，症状缓解即停），随后每 24 小时不超过 8–10mmol/L；无症状：限水/病因治疗，缓慢纠正；每 4–6 小时复查血钠；出现纠正过快用去氨加压素+葡萄糖回降。"}],"points":["先确认真性低钠（测血浆渗透压）","重度症状用 3% 盐水快速小量提升","24 小时纠正不超过 8–10mmol/L"],"pitfalls":["对所有低钠一律快速补钠","未查渗透压即按低钠处理假性低钠"],"quiz":[{"q":"低钠伴抽搐，目标提升速度？","a":"先快速提升 4–6mmol/L 缓解症状，24 小时总量≤8–10","why":"兼顾症状控制与脱髓鞘风险。","type":"知识"},{"q":"低钠纠正越快越好？","a":"错，过快可致渗透性脱髓鞘","why":"需限速并频繁复查。","type":"陷阱"}],"overlay":{"A":"内科口径按“渗透压—容量—病因”三层推理，记录每小时尿量与血钠。","B":"急诊口径重度症状先用 3% 盐水小量冲击，症状缓解即转慢。","C":"基层口径不自行快速补钠，识别重度症状即上转。"}},"急性肾损伤：KDIGO 分期与肾后性排查":{"title":"急性肾损伤：KDIGO 分期与肾后性排查","why":"AKI 的第一个动作是排除“堵住了”，因为解除梗阻能立刻恢复肾功能。","sections":[{"h":"判据","p":"KDIGO：48 小时内肌酐升高≥26.5μmol/L；或 7 天内升至基线 1.5 倍；或尿量<0.5ml/kg/h 持续 6 小时。分期：1 期 1.5–1.9 倍；2 期 2.0–2.9 倍；3 期≥3 倍或≥353.6μmol/L 或启动透析。肾后性线索：少尿/无尿、排尿困难、膀胱充盈、肾积水、结石/肿瘤/前列腺病史。"},{"h":"边界","p":"肌酐滞后于损伤，肌肉量少者基础值低；AKI 与 CKD 可重叠；利尿剂可能掩盖少尿；造影剂、NSAIDs、ACEI/ARB、氨基糖苷类是常见诱因；肾前性补液后改善，但心衰患者需评估容量。"},{"h":"动作","p":"① 停用肾毒性药物；② 评估容量并个体化补液；③ 床旁超声查肾积水（肾后性→导尿/造瘘/输尿管支架）；④ 查尿常规、尿钠、FENa、血气、钾；⑤ 监测尿量与体重；⑥ 指征透析：难治性高钾、酸中毒、肺水肿、尿毒症症状、中毒。"}],"points":["AKI 必做床旁超声排除梗阻","肌酐滞后，尿量是更早指标","停药+容量评估+解除梗阻是前三条"],"pitfalls":["未查肾积水即大量补液","对少尿患者盲目使用大剂量利尿剂"],"quiz":[{"q":"患者突发无尿、膀胱区膨隆，首要处理？","a":"导尿解除梗阻","why":"肾后性 AKI 解除梗阻可迅速恢复。","type":"知识"},{"q":"肌酐正常可排除 AKI？","a":"不能，需结合尿量与动态变化","why":"肌酐上升滞后。","type":"陷阱"}],"overlay":{"A":"内科口径要求按 KDIGO 分期记录，并逐日评估容量、药物与梗阻三因素。","B":"急诊口径“少尿+肾积水”立即导尿或请泌尿外科。","C":"基层口径停药、评估容量、查超声，不能解除者即上转。"}},"张力性气胸：单侧呼吸音 + 立即减压":{"title":"张力性气胸：单侧呼吸音 + 立即减压","why":"这是少数“纯临床诊断、必须立刻动手”的急症，等影像会死人。","sections":[{"h":"判据","p":"组合：突发单侧胸痛与呼吸困难、患侧呼吸音消失、叩诊鼓音、气管向健侧移位、患侧语颤减弱、颈静脉怒张、低血压、进行性低氧。高危背景：正压通气中、胸部创伤、COPD、哮喘持续状态、既往气胸、肺大疱。正压通气患者出现血压骤降+气道阻力升高，应首先想到张力性气胸。"},{"h":"边界","p":"气管移位在早期可不明显；皮下气肿提示但非必需；机械通气患者可能只表现为血压下降与 SpO2 下降。胸片是确认手段但不是前置条件，血流动力学不稳时禁止为拍片而转运。单纯（非张力性）气胸可观察或穿刺抽气，二者处置强度不同。"},{"h":"动作","p":"立即高流量氧、监护、建立静脉通路；针刺减压：锁骨中线第 2 肋间或前腋线第 4–5 肋间，粗针（≥14G）垂直刺入，随后置入胸腔引流管；无条件时先针后管，转运途中保持减压。正压通气患者减压后仍需降低气道压并排查支气管胸膜瘘。"}],"points":["张力性气胸是临床诊断，不等胸片","减压部位两处：锁骨中线第 2 肋间、前腋线第 4–5 肋间","减压后必须置管并复评"],"pitfalls":["等胸片确认而延误减压","只针刺不置管导致复发"],"quiz":[{"q":"机械通气患者突然血压 60/40、气道压升高、右肺呼吸音消失，最可能？","a":"张力性气胸","why":"正压通气是典型诱因，需立即减压。","type":"知识"},{"q":"张力性气胸能否先送 CT 确认再处理？","a":"不能","why":"属血流动力学急症，影像会延误救命时机。","type":"陷阱"}],"overlay":{"A":"内科口径要掌握正压通气相关气胸的识别，尤其无创通气与哮喘插管患者，交接班写明“气道压与血压同步变化”。","B":"急诊口径把它列为创伤初评的“必须排除项”，与心包填塞、低血容量、张力性气胸同列可逆病因。","C":"基层口径要求会判断+会穿刺减压（有条件者），无条件时立即上转并在途中保持氧疗与监护。"}},"心包填塞：Beck 三联 + 奇脉":{"title":"心包填塞：Beck 三联 + 奇脉","why":"低血压+颈静脉怒张+肺野清晰这三个体征出现时，补液可以暂时救命，但穿刺才是解决。","sections":[{"h":"判据","p":"Beck 三联：低血压、颈静脉怒张、心音低钝。奇脉：吸气时收缩压下降>10mmHg。其他：心动过速、脉压变窄、肝大、Kussmaul 征（吸气时颈静脉更充盈）。床旁超声：心包积液+右房/右室舒张期塌陷+下腔静脉充盈且不随呼吸变化，可确诊。高危背景：恶性肿瘤、尿毒症、结核、近期心脏手术/介入、主动脉夹层、抗凝治疗。"},{"h":"边界","p":"奇脉在严重哮喘、COPD、肥胖、心衰中也可出现（假阳性），房颤时不可靠；低血压+颈静脉怒张也见于张力性气胸与大面积 PE，区别在肺部体征与右心大小。缓慢积累的积液可耐受到很大容量而无填塞，急性 100ml 即可致命——所以“积液量小”不能排除。"},{"h":"动作","p":"立即床旁超声、监护、开放静脉；补液维持前负荷（晶体液快速输注）作为桥接；禁用扩血管药与利尿剂；尽快心包穿刺引流（超声引导，首选剑突下），同时请心内科/心外科。抗凝相关填塞需逆转抗凝。穿刺后复评血压、颈静脉与超声。"}],"points":["低血压+颈静脉怒张+肺野清晰=填塞三联思路","积液量小也可致命（急性积血）","补液桥接、穿刺解决，禁扩血管与利尿"],"pitfalls":["把填塞当心衰给利尿剂","因积液量少而排除填塞"],"quiz":[{"q":"外伤患者血压 70/40、颈静脉怒张、双肺呼吸音清、心音遥远，最可能？","a":"心包填塞","why":"三联+肺野清+心音低钝典型，需床旁超声与穿刺。","type":"知识"},{"q":"奇脉阳性是否可确诊填塞？","a":"不能","why":"哮喘、肺气肿等也可出现，需结合超声。","type":"陷阱"}],"overlay":{"A":"内科口径关注病因链：肿瘤/尿毒症/结核性心包炎各有不同后续处理，穿刺液送检项目要一次开全。","B":"急诊口径把它放进“低血压+颈静脉怒张”鉴别组，与张力性气胸、PE 并列，床旁超声 1 分钟定夺。","C":"基层口径只做识别与转运：禁利尿、慎扩血管、保持静脉通路、直接转有超声与穿刺能力医院。"}},"食管破裂与纵隔气肿":{"title":"食管破裂与纵隔气肿","why":"剧烈呕吐后的胸痛最容易被当胃食管反流，而 Boerhaave 综合征 24 小时内的死亡率以小时计。","sections":[{"h":"判据","p":"典型：剧烈呕吐（常先有饮酒/暴食）后突发下胸/上腹痛并向背部放射、皮下气肿（颈部捻发感）、纵隔气肿、胸腔积液（多左侧）、发热与休克。检查：胸部 CT（口服水溶性造影剂）为首选，造影吞咽可辅助；白细胞与 CRP 升高、乳酸升高提示坏死与脓毒症。 Mackler 三联：呕吐、胸痛、皮下气肿。"},{"h":"边界","p":"约三分之一患者无典型三联；疼痛可酷似 ACS、胰腺炎、消化性溃疡穿孔；早期胸片可正常。若已形成脓胸与纵隔炎，表现以脓毒症为主，容易误诊为肺炎。内镜检查有加重撕裂风险，通常不作为首选。"},{"h":"动作","p":"立即禁食、胃肠减压、广谱抗生素（覆盖革兰阴性菌与厌氧菌）、充分液体复苏、镇痛；急请胸外科评估手术（尤其 24 小时内、污染重者）；同时纠正休克与电解质紊乱。任何“呕吐后胸痛+皮下气肿”都不得按门诊反流处理。"}],"points":["呕吐后胸痛+皮下气肿=食管破裂，直接 CT","禁食、抗生素、外科会诊三件事同步","内镜有加重风险，不作首选"],"pitfalls":["按胃食管反流给抑酸药回家观察","等胸片出现纵隔气肿才行动"],"quiz":[{"q":"饮酒后剧烈呕吐，随后胸骨后剧痛、颈部捻发感，首选检查？","a":"胸部 CT（含水溶性造影）","why":"可确认破裂部位与纵隔/胸腔受累，指导手术。","type":"知识"},{"q":"食管破裂患者是否可以先行胃镜检查明确？","a":"通常不作为首选","why":"注气可扩大撕裂，加重纵隔污染。","type":"陷阱"}],"overlay":{"A":"内科口径要把它列入“呕吐并发症”的鉴别，与贲门黏膜撕裂（Mallory-Weiss）区分：后者以出血为主，少有纵隔气肿。","B":"急诊口径把“呕吐后胸痛”设为独立分诊提示词，触发 CT 与外科呼叫，避免按普通腹痛排队。","C":"基层口径识别即禁食禁水、建立通路、上转；不试抑酸观察，不给口服药。"}},"高血压急症与亚急症：看靶器官不看数值":{"title":"高血压急症与亚急症：看靶器官不看数值","why":"决定是否静脉降压的是靶器官损害，而血压数值只决定“多快开始评估”。","sections":[{"h":"判据","p":"高血压急症=重度血压升高（常>180/120mmHg）伴新发或进行性靶器官损害：高血压脑病（头痛、呕吐、意识改变、视乳头水肿）、缺血性/出血性卒中、急性心衰/肺水肿、ACS、主动脉夹层、急性肾损伤、子痫/HELLP、视网膜出血/渗出。亚急症=同样高的血压但无急性靶器官损害。"},{"h":"边界","p":"血压数值与损害不平行：慢性高血压患者 200/120 可无症状，年轻人 160/110 也可能已脑病。降压速度必须按病种：主动脉夹层最快（心率优先）、ACS 与肺水肿较快、卒中需谨慎（缺血性卒中一般不急于强化降压，除非溶栓或>220/120）、脑病 24 小时降 20–25%。快速降压可致脑、心、肾低灌注。"},{"h":"动作","p":"先评估靶器官（意识、眼底、心肺、尿量、肌酐、心电图、尿蛋白），再决定路径。急症：静脉药物（尼卡地平、乌拉地尔、拉贝洛尔、硝普钠按病种选择）+ 动脉监测 + 每 5–15 分钟复评。亚急症：口服药、数小时至数天逐步达标，并安排随访与依从性评估。"}],"points":["分型看靶器官损害，不看血压数值","降压速度按病种分层","亚急症口服药缓降，不静脉猛降"],"pitfalls":["对无症状重度高血压舌下含服硝苯地平快速降压","缺血性卒中未溶栓即强化降压"],"quiz":[{"q":"患者血压 210/125，无头痛、无胸痛、肌酐正常、眼底无出血，属于？","a":"高血压亚急症","why":"无急性靶器官损害，口服药缓降并随访。","type":"知识"},{"q":"主动脉夹层的降压目标与一般急症相同？","a":"不同","why":"夹层先降心率至约 60 次/分，收缩压降至 100–120mmHg 或可耐受最低水平。","type":"陷阱"}],"overlay":{"A":"内科口径要求把“靶器官损害排查清单”写进病历：眼底、心电图、肌酐、尿常规、神经查体，一项不缺。","B":"急诊口径 10 分钟内完成靶器官筛查，急症直接进抢救区并启动静脉降压与动脉监测。","C":"基层口径只分两类：有任何靶器官损害表现→立即上转；无损害→口服药、当日复诊、查明依从性与用药史。"}},"肠系膜缺血：疼痛与体征不符":{"title":"肠系膜缺血：疼痛与体征不符","why":"“痛得厉害、按着不痛”是唯一能把此病从“功能性腹痛”里捞出来的线索。","sections":[{"h":"判据","p":"典型：剧烈腹痛与轻微体征不相称；背景为房颤、瓣膜病、近期心梗、动脉粥样硬化、低血压；伴恶心呕吐、便血（晚期）、乳酸升高、代谢性酸中毒、白细胞升高。CTA（动脉+静脉期）确诊；平片早期多无异常；晚期见肠壁积气、门静脉积气。"},{"h":"边界","p":"早期乳酸可正常；镇痛后疼痛缓解会误导；D-二聚体不特异；低血压患者出现腹痛要考虑非闭塞性肠缺血。需与胰腺炎、穿孔、肾绞痛、DKA 鉴别。"},{"h":"动作","p":"禁食、补液、纠正休克、广谱抗生素、镇痛；立即 CTA 并请血管外科/普外科；动脉闭塞行取栓或重建，静脉血栓在无坏死时抗凝；腹膜刺激征或坏死→急诊手术。"}],"points":["痛与体征不相称+房颤→立即 CTA","早期乳酸正常不能排除","坏死征象→急诊手术"],"pitfalls":["因腹部柔软按功能性腹痛处理","只做平片不申请 CTA"],"quiz":[{"q":"房颤患者剧烈腹痛、腹部柔软、乳酸正常，下一步？","a":"立即腹部 CTA","why":"不能以乳酸正常与体征轻排除。","type":"知识"},{"q":"肠系膜缺血的典型体征是明显腹膜刺激？","a":"不是，早期体征轻微","why":"痛与体征不相称才是特征。","type":"陷阱"}],"overlay":{"A":"内科口径把房颤抗凝管理与腹痛评估连起来看，识别栓塞风险未控制。","B":"急诊口径“老年+房颤+剧烈腹痛”走绿色通道 CTA。","C":"基层口径疑诊即禁食、补液、上转，不用泻药。"}},"异位妊娠与卵巢扭转：育龄女性腹痛必查":{"title":"异位妊娠与卵巢扭转：育龄女性腹痛必查","why":"育龄女性腹痛的评估起点不是鉴别诊断，而是妊娠试验。","sections":[{"h":"判据","p":"异位妊娠：停经、腹痛、阴道流血；破裂时晕厥、低血压、腹膜刺激、宫颈举痛、附件包块；β-hCG 阳性+经阴道超声未见宫内孕囊（超过判别区）。卵巢扭转：突发单侧剧痛、恶心呕吐、附件压痛、卵巢增大、多普勒血流减少（可假阴性）。"},{"h":"边界","p":"异位妊娠可无停经史；β-hCG 低于判别区时超声阴性不能诊断，需 48 小时动态；辅助生殖后可能宫内合并宫外。卵巢扭转多普勒正常不能排除（间歇性）。需鉴别黄体破裂、盆腔炎、阑尾炎。"},{"h":"动作","p":"异位妊娠：通路、备血、监护；不稳→急诊手术；稳定且符合条件可用甲氨蝶呤并严格随访 β-hCG。卵巢扭转：尽早腹腔镜探查，不因血流“尚可”延迟。"}],"points":["育龄女性腹痛常规妊娠试验","β-hCG 动态+经阴道超声为核心","卵巢扭转血流正常不能排除"],"pitfalls":["以无停经史排除异位妊娠","多普勒有血流即排除扭转"],"quiz":[{"q":"25 岁女性下腹痛、晕厥、血压 85/50、尿妊娠阳性，最可能？","a":"异位妊娠破裂","why":"立即复苏、备血、急诊手术。","type":"知识"},{"q":"β-hCG 低、超声未见孕囊即可诊断异位妊娠？","a":"不能，需动态监测","why":"早期宫内孕亦不可见。","type":"陷阱"}],"overlay":{"A":"内科口径掌握甲氨蝶呤适应证、禁忌与随访方案。","B":"急诊口径“先验孕再分诊”，不稳者直接抢救区。","C":"基层口径尿妊娠阳性伴腹痛即上转，不在门诊观察。"}},"感染性休克：去甲肾上腺素与液体反应性":{"title":"感染性休克：去甲肾上腺素与液体反应性","why":"复苏的目标是灌注，不是血压数字；升压药与液体都需要“反应性”证据。","sections":[{"h":"判据","p":"感染性休克：需升压药维持 MAP≥65 且乳酸>2。液体反应性评估：被动抬腿试验（PLR）致每搏量升高≥10%、或每搏量变异度（SVV）在机械通气且窦律者可用、或下腔静脉变异；不能单凭 CVP 判断。去甲肾上腺素一线，起始 0.05–0.1μg/kg/min，目标 MAP 65（老年可个体化）。"},{"h":"边界","p":"乳酸升高也可源于肝衰、癫痫、肾上腺素、氰化物中毒；花斑与 CRT 比 MAP 更敏感；心率在房颤或起搏器患者不能反映灌注。液体过负荷会加重肺水肿与肾损伤，30ml/kg 不是无条件总量。"},{"h":"动作","p":"先小量液体（250–500ml）快速试验并评估反应，无反应者转升压药；去甲肾上腺素尽早经中心或外周大静脉泵入；MAP 不达标可加血管加压素（0.03U/min）；仍不达标考虑肾上腺素并评估心功能（床旁超声）。加用氢化可的松用于血压依赖者。"}],"points":["MAP≥65 是目标，但需看灌注指标","液体反应性优先于固定补液量","去甲肾上腺素一线，尽早使用"],"pitfalls":["以 CVP 指导补液","无限量补液导致肺水肿与腹腔高压"],"quiz":[{"q":"感染性休克患者补液 2L 后 MAP 仍 58，下一步？","a":"启动去甲肾上腺素并评估心功能与容量反应","why":"不宜继续盲目补液。","type":"知识"},{"q":"MAP 65 即说明灌注充分？","a":"不一定，需看乳酸、尿量、CRT 与花斑","why":"微循环障碍可在大循环达标时仍存在。","type":"陷阱"}],"overlay":{"A":"内科口径按“容量—泵—血管张力—微循环”四层记录，逐层加措施并说明依据。","B":"急诊口径以“乳酸+CRT+尿量”做 30 分钟复评节点，早用升压药不犹豫。","C":"基层口径建立通路、启动首剂抗生素、限制性补液并尽快转运至有 ICU 的医院。"}},"缺血性卒中再灌注：时间窗与禁忌":{"title":"缺血性卒中再灌注：时间窗与禁忌","why":"再灌注的核心是“选对人”：时间窗内看禁忌，超窗看影像。","sections":[{"h":"判据","p":"静脉溶栓（阿替普酶/替奈普酶）：4.5 小时内，部分患者经影像筛选可延至 9 小时或醒后卒中（DWI-FLAIR 不匹配或灌注不匹配）。血管内取栓：前循环大血管闭塞 6 小时内；经灌注影像筛选可延至 24 小时。禁忌：颅内出血、近期手术/出血、血小板<100×10⁹/L、INR>1.7、血压>185/110 未控制、大面积梗死。"},{"h":"边界","p":"血压 185/110 以下才能溶栓，需先降压但不可过度；溶栓后 24 小时内不用抗凝/抗血小板；轻微症状仍可能获益但需权衡；后循环卒中时间窗可更宽（需个体化与影像）。"},{"h":"动作","p":"溶栓前：血糖、血压、血小板、凝血、CT 排除出血、知情同意；用药后监护 24 小时（神经功能、血压、出血征象）；大血管闭塞同时联系取栓团队，不因溶栓而延迟转运；记录 door-to-needle 时间。"}],"points":["4.5 小时内静脉溶栓，影像筛选可延窗","血压>185/110 先降压再溶栓","大血管闭塞取栓可与溶栓并行"],"pitfalls":["等凝血全部回报再溶栓（除必要项）","溶栓后立即给抗血小板"],"quiz":[{"q":"发病 3 小时、血压 196/112，能否直接溶栓？","a":"不能，先降至<185/110 并稳定后评估","why":"未控高血压是溶栓禁忌之一。","type":"知识"},{"q":"溶栓后 24 小时内常规使用阿司匹林？","a":"不可，需 24 小时后影像复查再决定","why":"增加出血风险。","type":"陷阱"}],"overlay":{"A":"内科口径掌握适应证/禁忌逐条核查表，并在病程中写明权衡依据。","B":"急诊口径以 door-to-needle<60 分钟为目标，取栓与溶栓并行不互等。","C":"基层口径不溶栓，识别后 30 分钟内转出并提前通报，不自行降压过低。"}},"脊髓压迫：背痛 + 截瘫 + 尿便障碍":{"title":"脊髓压迫：背痛 + 截瘫 + 尿便障碍","why":"脊髓压迫的可逆窗口以小时计，尿便障碍出现后恢复率骤降。","sections":[{"h":"判据","p":"红旗：肿瘤病史（前列腺、乳腺、肺、肾、甲状腺、多发性骨髓瘤）、夜间加重背痛、平卧加重、束带感、进行性无力、感觉平面、腱反射改变、尿潴留或失禁、肛门括约肌张力下降。马鞍区感觉缺失+尿潴留=马尾综合征。影像：全脊柱 MRI 增强为首选。"},{"h":"边界","p":"早期可仅表现为背痛，无神经体征；腰椎间盘突出多为单侧根性痛，但巨大中央型可致马尾综合征；硬膜外脓肿需发热与感染史，但可无发热；脊髓炎、吉兰-巴雷综合征（对称、上升性）需鉴别。"},{"h":"动作","p":"疑诊即：卧床、避免搬动与负重、急查 MRI（全脊柱）、请神外/肿瘤科；怀疑硬膜外脓肿或转移瘤压迫→地塞米松（按病因，脓肿需抗生素+引流）；尽快手术减压或放疗；评估膀胱残余尿。"}],"points":["尿便障碍与鞍区麻木提示马尾综合征","全脊柱 MRI 是首选检查","地塞米松用于肿瘤压迫，脓肿需引流"],"pitfalls":["把夜间背痛当劳损观察数周","只做腰椎 MRI 漏掉颈胸段病灶"],"quiz":[{"q":"肿瘤患者新发背痛伴双下肢无力、尿潴留，最关键检查？","a":"急诊全脊柱 MRI","why":"转移性脊髓压迫需尽快减压。","type":"知识"},{"q":"有腱反射亢进可排除马尾综合征？","a":"不能，需看鞍区感觉与括约肌功能","why":"马尾为下运动神经元，但合并其他病灶可变。","type":"陷阱"}],"overlay":{"A":"内科口径要求对肿瘤患者常规询问背痛与神经症状，并记录感觉平面与括约肌功能。","B":"急诊口径把“背痛+尿潴留”设为 MRI 加急指征。","C":"基层口径疑诊即上转，不用推拿按摩，不长期止痛观察。"}},"肿瘤急症：上腔静脉综合征、脊髓压迫、高钙":{"title":"肿瘤急症：上腔静脉综合征、脊髓压迫、高钙","why":"肿瘤病人突然恶化，多数不是“肿瘤长大”，而是这三类可急救的急症。","sections":[{"h":"上腔静脉综合征","p":"面颈部与上肢肿胀、颈静脉与胸壁静脉怒张、呼吸困难（平卧加重）、声嘶、头痛或意识改变。病因：肺癌（小细胞/鳞癌）、淋巴瘤、纵隔转移、中心静脉导管血栓。意识改变或气道受压＝立即放疗或血管内支架；输液改下肢通路；避免受压侧置管。"},{"h":"脊髓压迫","p":"肿瘤史＋夜间加重背痛＋束带感＋进行性下肢无力＋感觉平面＋尿潴留/失禁；鞍区麻木＋尿潴留为马尾综合征。首选急诊全脊柱 MRI 增强；地塞米松后尽快手术减压或放疗；尿便障碍出现后恢复率骤降，不能观察。"},{"h":"高钙危象","p":"血钙>3.5mmol/L 或校正钙明显升高，表现淡漠、嗜睡、呕吐、便秘、多尿脱水、QT 缩短与心律失常。常见于骨髓瘤、乳腺癌、肺癌、鳞癌。处理：生理盐水扩容＋静脉双膦酸盐（唑来膦酸）；袢利尿剂仅在容量充足后使用；纠正后查 PTH、PTHrP、维生素 D。"},{"h":"边界","p":"上腔静脉综合征良性病因（导管血栓）需抗凝而非放疗；脊髓压迫早期可仅有背痛无神经体征；高钙症状易被误为“肿瘤晚期虚弱”或镇静药过量；地塞米松可暂时降低血钙，掩盖判断。"}],"points":["面颈肿胀+平卧加重+颈静脉怒张＝上腔静脉综合征","肿瘤病人背痛+尿潴留＝急诊全脊柱 MRI","血钙>3.5 或校正钙高＋意识改变＝高钙危象，扩容+双膦酸盐"],"pitfalls":["在上肢或受压侧建立输液通路","把肿瘤患者新发背痛当劳损观察数周","给高钙患者先用利尿剂而不扩容"],"quiz":[{"q":"上腔静脉综合征伴意识改变，最紧急处理？","a":"紧急放疗或血管内支架解除压迫","why":"脑水肿与气道压迫可致命。","type":"知识"},{"q":"肿瘤患者新发背痛+尿潴留，最关键检查？","a":"急诊全脊柱 MRI 增强","why":"转移性脊髓压迫需尽快减压，窗口以小时计。","type":"知识"},{"q":"高钙危象首选袢利尿剂促排钙？","a":"错，先扩容再考虑利尿","why":"脱水状态下利尿加重高钙与肾损伤。","type":"陷阱"}],"overlay":{"A":"内科口径要求三类急症写成可即时执行的清单，并记录激素、双膦酸盐与放疗的先后顺序。","B":"急诊口径“气道—脊髓—血钙”三线同步筛查，影像与用药不等结果。","C":"基层口径识别即上转，不长期用利尿剂与止痛药观察。"}},"输血反应与急性溶血":{"title":"输血反应与急性溶血","why":"输血中突然寒战、腰痛、酱油色尿，第一动作是“停输血、保通路”。","sections":[{"h":"判据","p":"急性溶血反应：ABO 不合、发热寒战、腰背痛、胸闷、低血压、血红蛋白尿（酱油色）、DIC、急性肾损伤。其他类型：非溶血性发热反应（常见、良性）、过敏反应（荨麻疹、喉水肿）、TRALI（输血后 6 小时内低氧与双肺浸润）、TACO（容量负荷、高血压、BNP 升高）、细菌污染（高热休克）、迟发性溶血（3–14 天）。"},{"h":"边界","p":"TRALI 与 TACO 都表现为呼吸困难，需靠血压、BNP、利尿反应区分；发热反应也可为严重溶血的首发；全麻患者可能仅表现为低血压与渗血。"},{"h":"动作","p":"立即停止输血、保留静脉通路（换新管路生理盐水）、核对血袋与患者信息、通知血库、留取标本复查、监测尿量与肾功能、维持血压与利尿（必要时）；过敏反应给抗组胺与肾上腺素（喉水肿）；TRALI 以支持治疗为主（限制液体）；TACO 利尿。"}],"points":["先停输血，再核对与报告血库","酱油色尿+低血压=急性溶血","TRALI 限液、TACO 利尿"],"pitfalls":["继续慢速输血观察","不核对血袋信息即更换血袋"],"quiz":[{"q":"输血 10 分钟后寒战、腰痛、血压下降，第一步？","a":"立即停止输血并保留通路","why":"急性溶血可致命，需即刻处理。","type":"知识"},{"q":"输血后呼吸困难一律利尿？","a":"不可，需区分 TRALI 与 TACO","why":"TRALI 以支持治疗为主，利尿可能有害。","type":"陷阱"}],"overlay":{"A":"内科口径要求完整记录输血前核对、反应时间与处理经过，并上报输血不良反应。","B":"急诊口径“停、换管、核对、报告”四步固定动作。","C":"基层口径停输、保通路、抗过敏、立即上转并带回血袋。"}},"TTP 与 HUS：微血管病性溶血 + 血小板减少":{"title":"TTP 与 HUS：微血管病性溶血 + 血小板减少","why":"血小板下降+贫血+神经症状，别急着输血小板，先想 TTP。","sections":[{"h":"判据","p":"五联征（不一定全有）：血小板减少、微血管病性溶血性贫血（破碎红细胞、LDH 升高、间接胆红素升高、网织升高、结合珠蛋白降低）、神经症状（波动性、意识/局灶）、发热、肾损害。ADAMTS13 活性<10% 确诊 TTP。HUS 以肾损害为主（志贺毒素相关，多见儿童，腹泻前驱）。"},{"h":"边界","p":"DIC 也可有血小板低与破碎红细胞，但凝血指标（PT/APTT/FIB）异常更突出，TTP 通常凝血正常；妊娠、药物（噻氯匹定、氯吡格雷、可卡因）、移植、肿瘤可诱发；血小板输注在 TTP 中可能加重血栓，仅危及生命出血时使用。"},{"h":"动作","p":"疑诊即请血液科，急送 ADAMTS13 并立即开始血浆置换（不等待结果）；糖皮质激素联合；难治加用利妥昔单抗；避免血小板输注与不必要的侵入操作；监测神经与肾功能；HUS 以支持透析为主（依库珠单抗用于非典型 HUS）。"}],"points":["血小板低+破碎红细胞+LDH 高=微血管病性溶血","疑 TTP 立即血浆置换，不等 ADAMTS13","TTP 慎输血小板"],"pitfalls":["按 ITP 给激素而不做血浆置换","血小板低即输注加重血栓"],"quiz":[{"q":"血小板 20×10⁹/L、破碎红细胞增多、意识波动，最可能？","a":"TTP","why":"需紧急血浆置换。","type":"知识"},{"q":"TTP 患者血小板极低应预防性输注？","a":"一般避免，除非危及生命出血","why":"可加重微血栓。","type":"陷阱"}],"overlay":{"A":"内科口径要求掌握五联征与外周血涂片判读，写出与 DIC 的鉴别点。","B":"急诊口径“血小板低+神经症状+贫血”即联系血液科与血浆置换。","C":"基层口径不输血小板，识别即上转至有血浆置换条件医院。"}},"过敏性休克：肾上腺素肌注优先":{"title":"过敏性休克：肾上腺素肌注优先","why":"过敏性休克的唯一救命药是肾上腺素，抗组胺药与激素都不能替代。","sections":[{"h":"判据","p":"诊断（符合其一）：① 急性起病（分钟至数小时）伴皮肤黏膜改变（荨麻疹、面舌唇肿胀）+呼吸窘迫或低血压；② 暴露于可疑过敏原后出现低血压、支气管痉挛或喉水肿（可无皮疹）。常见诱因：药物（青霉素、NSAIDs、造影剂）、食物、蜂蜇、乳胶。"},{"h":"边界","p":"约 10–20% 无皮疹；血管性水肿（ACEI 相关）对肾上腺素反应差，需气道管理；休克也可为感染性、心源性，需并行评估；β 阻滞剂使用者对肾上腺素反应减弱，可加胰高血糖素。"},{"h":"动作","p":"肾上腺素 0.3–0.5mg 肌注大腿外侧（必要时 5–15 分钟重复），平卧抬腿、吸氧、快速补液（1–2L 生理盐水）、移除过敏原；喉水肿→早期气管插管；抗组胺与激素为辅助（激素不能预防双相反应）；观察 6–12 小时（双相反应），出院交代肾上腺素笔与过敏原回避。"}],"points":["肾上腺素肌注大腿，5–15 分钟可重复","可无皮疹，不能因此排除","观察 6–12 小时防双相反应"],"pitfalls":["先给抗组胺药等待起效","症状缓解立即离院"],"quiz":[{"q":"过敏性休克首选药物与途径？","a":"肾上腺素 0.3–0.5mg 肌注大腿外侧","why":"起效最快，纠正气道与循环。","type":"知识"},{"q":"无皮疹可排除过敏性休克？","a":"不能","why":"约 10–20% 无皮肤表现。","type":"陷阱"}],"overlay":{"A":"内科口径要求记录过敏原、反应分级与出院后的回避与急救方案。","B":"急诊口径“肾上腺素优先”写入流程，抗组胺为辅助。","C":"基层口径备肾上腺素，首剂即用并上转，不观察等待。"}},"重症药疹：SJS/TEN 的体表面积":{"title":"重症药疹：SJS/TEN 的体表面积","why":"这是药物引起的皮肤急症，停用可疑药比任何外用药都重要，剥脱面积决定分级与预后。","sections":[{"h":"判据","p":"前驱发热、流感样症状 1–3 天后出现疼痛性红斑、非典型靶形损害、水疱、Nikolsky 征阳性、黏膜受累（口腔、眼、生殖器）。按体表面积剥脱分：SJS<10%、SJS/TEN 重叠 10–30%、TEN>30%。常见药物：别嘌醇、卡马西平、苯妥英、磺胺、NSAIDs、抗生素、PD-1 抑制剂。"},{"h":"边界","p":"需与中毒性表皮坏死松解（金葡菌 SSSS）、多形红斑、DRESS、AGEP、药疹鉴别；早期仅似普通药疹，可迅速进展；眼受累可致永久视力损害，需眼科每日评估；HLA-B*1502（卡马西平）、HLA-B*5801（别嘌醇）为高危等位基因。"},{"h":"动作","p":"立即停用所有可疑药物；转入烧伤/ICU 单元，按烧伤原则补液与创面护理；眼、口腔、生殖器专科处理；避免使用糖皮质激素（证据不一致，早期短程可考虑）、不预防性用抗生素；TEN 可考虑环孢素/IVIG/依那西普（按中心经验）；记录药物并终身禁用。"}],"points":["停用可疑药物是第一动作","Nikolsky 征阳性+黏膜受累要警惕","眼科每日评估防失明"],"pitfalls":["按普通药疹继续用药观察","未做眼科评估"],"quiz":[{"q":"服药后发热、皮肤疼痛性红斑、口腔溃疡、Nikolsky 征阳性，处置？","a":"立即停可疑药并转入烧伤/ICU","why":"按体表面积评估分级并支持治疗。","type":"知识"},{"q":"SJS 应常规预防性使用抗生素？","a":"不推荐","why":"增加耐药与二重感染。","type":"陷阱"}],"overlay":{"A":"内科口径要求建立药物因果判断与终身禁用记录，并做高危基因筛查宣教。","B":"急诊口径“停药+评估剥脱面积+眼科会诊”同步。","C":"基层口径停药、不涂刺激性外用药、立即上转。"}},"风湿急症：巨细胞动脉炎与狼疮脑病":{"title":"风湿急症：巨细胞动脉炎与狼疮脑病","why":"这两个病都以“看似普通的主诉”开场，但延误可致失明或不可逆脑损伤。","sections":[{"h":"判据","p":"巨细胞动脉炎：>50 岁新发头痛（颞部）、颞动脉压痛/结节/无脉、咀嚼间歇性无力（jaw claudication）、视力模糊或一过性黑矇、发热乏力消瘦、ESR/CRP 显著升高；可伴风湿性多肌痛（肩髋带疼痛晨僵）。狼疮脑病：SLE 患者出现癫痫、精神症状、意识改变、卒中样发作，需排除感染与代谢原因。"},{"h":"边界","p":"GCA 与 PMR 可重叠；ESR 正常不能完全排除（少数）；颞动脉活检阴性不排除（跳跃性病变）；狼疮脑病为排除性诊断，中枢感染在免疫抑制患者中更常见且更紧急；激素可掩盖感染与淋巴瘤。"},{"h":"动作","p":"GCA：怀疑即给大剂量糖皮质激素（泼尼松 40–60mg/d 或甲泼尼龙冲击），不等活检，24–48 小时内安排颞动脉超声/活检；视力受累按急症冲击治疗；加用阿司匹林与骨质疏松预防。狼疮脑病：激素冲击+免疫抑制，同时广谱抗感染与腰穿排除感染。"}],"points":["50 岁以上新发头痛+ESR 高→先激素后活检","视力受累为急症","狼疮脑病必须先排除中枢感染"],"pitfalls":["等颞动脉活检结果再给激素致失明","免疫抑制患者把意识改变直接归为狼疮活动"],"quiz":[{"q":"72 岁新发颞部头痛、视力一过性黑矇、ESR 90，下一步？","a":"立即糖皮质激素，不等活检","why":"防不可逆失明。","type":"知识"},{"q":"SLE 患者癫痫发作，先加大激素即可？","a":"不可，先排除中枢感染与代谢原因","why":"免疫抑制者感染风险高。","type":"陷阱"}],"overlay":{"A":"内科口径要求掌握 GCA 的临床预测评分与 PMR 关系，写出激素疗程与监测。","B":"急诊口径“视力症状+高 ESR”立即激素，同步安排影像与活检。","C":"基层口径识别即激素首剂并上转，不在门诊观察视力变化。"}},"特殊人群红旗：老年、孕产、儿童":{"title":"特殊人群红旗：老年、孕产、儿童","why":"同样的疾病在不同人群里表现不同，红旗阈值必须下移。","sections":[{"h":"判据","p":"老年：发热可缺如（低体温或仅意识改变）、腹痛可轻而病变重（肠系膜缺血、胆囊炎、穿孔）、心梗可无胸痛（气促、乏力、晕厥）、低钠与跌倒常为感染首发。孕产：腹痛+阴道流血+休克→异位妊娠、胎盘早剥；孕晚期头痛+视物模糊+右上腹痛+血压高→子痫前期/HELLP；发热+胎动减少→绒毛膜羊膜炎。儿童：精神反应差比体温更重要、脱水看尿量与毛细血管再充盈、警惕脑膜炎（前囟膨隆、颈抵抗可不明显）、肠套叠（阵发哭闹、果酱样便）、异物与中毒。"},{"h":"边界","p":"孕期生理性改变使心率快、血压偏低、白细胞升高，需按孕周判读；儿童心率随年龄变化，不能按成人标准；老年多重用药导致症状被掩盖（β 阻滞剂掩盖心动过速、激素掩盖发热与腹痛）。"},{"h":"动作","p":"老年：降低检查门槛，早做影像与心电图，早评估容量与用药。孕产：产科与急诊联合评估，超声+β-hCG，高血压急症用拉贝洛尔/肼屈嗪与硫酸镁防抽搐。儿童：按体重给药、评估精神反应与灌注、必要时上级医院转运。"}],"points":["老年感染可无发热，意识改变即红旗","孕期腹痛+休克先想异位妊娠","儿童看精神反应与灌注而非只看体温"],"pitfalls":["以体温正常排除老年严重感染","孕期把右上腹痛当胃病"],"quiz":[{"q":"78 岁患者突然意识模糊、体温 36.2℃，首先考虑？","a":"严重感染等可致意识改变的原因，需立即评估","why":"老年可无发热。","type":"知识"},{"q":"育龄女性腹痛伴晕厥，先按胃肠炎处理？","a":"不可，先排除异位妊娠","why":"需查 β-hCG 与超声。","type":"陷阱"}],"overlay":{"A":"内科口径要求针对老年与孕产妇调整病史与检查策略，写明阈值下移的理由。","B":"急诊口径对特殊人群一律“先排除最致命”，检查门槛前移。","C":"基层口径识别特殊人群红旗即上转，不门诊观察。"}}}};
const KEY = 'rf:v1:C:state';
const DEF = {start:null, done:{}, chk:{}, wrong:[], star:{}, ver:1};
let S = load();
function load(){
  try{const o=JSON.parse(localStorage.getItem(KEY));if(o&&o.ver===1)return Object.assign({},DEF,o);}catch(e){}
  const o=Object.assign({},DEF,{start:todayStr()});
  try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}
  return o;
}
function save(o){S=o||S;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dayDiff(a,b){const p=s=>{const[t]=s.split(' ');const[y,m,d]=t.split('-').map(Number);return Date.UTC(y,m-1,d);};return Math.round((p(b)-p(a))/86400000);}
let CURDAY=null;
function realN(){const n=dayDiff(S.start,todayStr())+1;return Math.min(84,Math.max(1,n));}
function todayN(){if(CURDAY)return Math.min(84,Math.max(1,CURDAY));return realN();}
function dateOf(n){
  const p=S.start.split('-').map(Number);
  const d=new Date(Date.UTC(p[0],p[1]-1,p[2]+n-1));
  return d.toISOString().slice(0,10);
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function pct(){return Math.round(Object.keys(S.done).length/84*100);}
function dayOf(n){return DATA.days[n-1];}
function itemOf(title){return DATA.mats[title]||null;}

/* ---------- 今日 ---------- */
function renderToday(){
  const n=todayN(), d=dayOf(n), w=DATA.weeks[n-1];
  const ck=(S.chk[n]||{});
  const rn=realN();
  let html='<div class="card dbar">'+
    '<button class="btn sq" data-daymove="-1"'+(n<=1?' disabled':'')+' aria-label="前一天">‹</button>'+
    '<input type="date" id="dpick" min="'+dateOf(1)+'" max="'+dateOf(84)+'" value="'+dateOf(n)+'" aria-label="选择日期">'+
    '<button class="btn sq" data-daymove="1"'+(n>=84?' disabled':'')+' aria-label="后一天">›</button>'+
    '<button class="btn sq2'+((n===rn)?' cur':'')+'" data-daytoday>今天</button></div>';
  html+='<div class="card"><div class="row spread"><div><div class="tiny">第 '+n+' / 84 天 · 第 '+d.w+' 周 周'+'一二三四五六日'[d.d-1]+'</div>'+
        '<h2 style="margin:6px 0 2px">'+esc(d.title)+'</h2>'+
        '<div class="tiny">'+esc(d.mod||'')+(d.chapter?' · '+esc(d.chapter):'')+'</div></div>'+
        '<div class="ring" style="--p:'+pct()+'"><b>'+pct()+'%<small>总进度</small></b></div></div></div>';

  if(d.kind==='new'){
    const it=itemOf(d.title);

/* 底部「返回今天」浮动条：仅在翻到非今天时出现 */
function syncBk(n,rn){
  const el=document.getElementById('bktoday');
  if(!el)return;
  if(n!==rn){
    el.hidden=false;
    el.querySelector('b').textContent='正在看第 '+n+' 天 · '+dateOf(n);
    el.querySelector('small').textContent='今天实际第 '+rn+' 天，打卡会记在第 '+n+' 天';
    document.body.classList.add('has-bk');
  }else{
    el.hidden=true;
    document.body.classList.remove('has-bk');
  }
}

function weekList(n,take){
  const w=Math.floor((n-1)/7)+1;
  const back=(take&&take>1)?take:1;
  const fromW=Math.max(1,w-back+1);
  let out="";
  for(let ww=fromW;ww<=w;ww++){
    for(let i=(ww-1)*7;i<(ww-1)*7+6;i++){
      const d=dayOf(i+1);if(!d||d.kind!=="new")continue;
      out+='<div class="item" data-open="'+esc(d.title)+'"><h3>'+esc(d.title)+'</h3><p>第 '+ww+' 周 · '+esc(d.mod||"")+'</p></div>';
    }
  }
  return out||'<div class="empty">本段无新知识点</div>';
}

/* ---------- 事件 ---------- */
const VIEWS=['today','plan','cards','wrong','me'];
const RENDER={today:renderToday,plan:renderPlan,cards:renderCards,wrong:renderWrong,me:renderMe};
function go(v){
  VIEWS.forEach(x=>document.getElementById('v-'+x).classList.toggle('on',x===v));
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  if(RENDER[v])RENDER[v]();
  if(v!=='today'){const bk=document.getElementById('bktoday');if(bk)bk.hidden=true;document.body.classList.remove('has-bk');}
  window.scrollTo({top:0});
}
document.addEventListener('click',function(e){
  const t=e.target.closest('[data-v],[data-v2],[data-open],[data-mod],[data-wt],[data-rev],[data-miss],[data-nav],[data-wq],[data-daymove],[data-daytoday],[data-jump]');
  if(!t){ if(e.target.id==='rback')closeReader(); return; }
  if(t.id==='rback'||t.closest('#rback')){closeReader();return;}
  if(t.dataset.daymove){CURDAY=Math.min(84,Math.max(1,todayN()+Number(t.dataset.daymove)));go('today');return;}
  if(t.hasAttribute('data-daytoday')){CURDAY=null;go('today');return;}
  if(t.dataset.jump){CURDAY=Number(t.dataset.jump);go('today');return;}
  if(t.dataset.v){go(t.dataset.v);return;}
  if(t.dataset.v2){go(t.dataset.v2);return;}
  if(t.dataset.open){openCard(t.dataset.open);return;}
  if(t.dataset.mod){cardFilter.mod=t.dataset.mod;renderCards();return;}
  if(t.dataset.wt){wrongFilter=t.dataset.wt;renderWrong();return;}
  if(t.dataset.rev){const sp=document.getElementById('sp'+t.dataset.rev);sp.classList.toggle('on');t.textContent=sp.classList.contains('on')?'收起答案':'显示答案';return;}
  if(t.dataset.miss){
    const p=DATA.pts.find(x=>x.title===cur);const it=itemOf(cur);const q=it.quiz[+t.dataset.miss];
    addWrong(cur,q);t.textContent='已记入错题';t.disabled=true;return;
  }
  if(t.dataset.nav){
    const i=DATA.pts.findIndex(x=>x.title===cur);const j=(i+ +t.dataset.nav+72)%72;openCard(DATA.pts[j].title);return;
  }
  if(t.dataset.wq){
    const w=S.wrong.find(x=>x.id===t.dataset.wq);if(!w)return;
    cur=w.t;openCard(w.t);
    setTimeout(()=>{const box=document.getElementById('rbody');box.scrollTop=0;},50);
    return;
  }
  if(e.target.id==='rstar'||t.id==='rstar'){}
},false);

  }

    if(confirm('确定清空本版本的打卡、错题与收藏？此操作不可恢复。')){save({start:S.start,done:{},chk:{},wrong:[],star:{},ver:1});alert('已重置');go('me');}

  if(b.id==='mockgo'){
    const n=todayN();const w=dayOf(n).w;const pool=DATA.pts.filter(p=>{const d=DATA.days.find(x=>x.title===p.title);return d&&d.w<=w;});
    const pick=[];const cp=pool.slice();
    const take=Math.min(20,cp.length);for(let i=0;i<take;i++){pick.push(cp.splice(Math.floor(Math.random()*cp.length),1)[0]);}
    const qs=[];pick.forEach(p=>{const it=itemOf(p.title);if(it&&it.quiz&&it.quiz.length)qs.push({t:p.title,q:it.quiz[0]});});
    let h='<div class="card"><h2>随机 '+qs.length+' 题（自评用）</h2>';
    qs.forEach((x,i)=>{h+='<div style="margin-bottom:14px"><p class="prose" style="font-weight:600">'+(i+1)+'. '+esc(x.q.q)+'</p>'+
      '<div class="spoiler" id="mk'+i+'"><div class="kb">'+esc(x.q.a)+'<br><span class="tiny">'+esc(x.q.why)+'</span></div></div>'+
      '<div class="row" style="gap:8px;margin-top:8px"><button class="btn" data-mk="'+i+'">显示答案</button><button class="btn" data-mkm="'+i+'" data-tt="'+esc(x.t)+'">没答上</button></div></div>';});
    h+='<div class="row"><button class="btn wide" data-v2="today">回到今日</button></div></div>';
    document.getElementById('v-today').innerHTML=h;
    document.querySelectorAll('[data-mk]').forEach(bb=>bb.addEventListener('click',()=>{const s=document.getElementById('mk'+bb.dataset.mk);s.classList.toggle('on');bb.textContent=s.classList.contains('on')?'收起':'显示答案';}));
    document.querySelectorAll('[data-mkm]').forEach(bb=>bb.addEventListener('click',()=>{const tit=bb.dataset.tt;const it=itemOf(tit);if(it)addWrong(tit,it.quiz[0]);bb.textContent='已记入错题';bb.disabled=true;}));
  }
});

function addWrong(title,q){
  const id=title+'|'+q.q.slice(0,20);
  const ex=S.wrong.find(w=>w.id===id);
  if(ex){ex.n=(ex.n||1)+1;ex.at=todayStr();}
  else S.wrong.push({id:id,t:title,q:q.q,a:q.a,why:q.why,type:q.type,at:todayStr(),n:1});
  save();
}
renderToday();renderPlan();renderCards();renderWrong();renderMe();go('today');
</script>

/* 工具页自带底部常驻提示条（#bktoday）时，浮动按钮组上移避让，避免遮住「回到今天」 */
#pvBar{transition:bottom .18s ease}
#bktoday:not([hidden])~#pvBar{bottom:calc(132px + env(safe-area-inset-bottom))!important}
</style>
<div id="pvBar" style="position:fixed;bottom:14px;right:12px;z-index:9999;display:flex;flex-direction:column;gap:8px;">
  <a id="pvHome" href="../index.html" aria-label="返回项目清单" style="display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:rgba(120,120,128,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;text-decoration:none;font-size:16px;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.22);">&#8962;</a>
  <button class="btn sm" id="pvUpd" type="button" aria-label="检查并更新到最新版本" style="width:36px;height:36px;border:none;border-radius:50%;background:rgba(120,120,128,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font-size:15px;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.22);">&#8635;</button>
</div>
<script>
/* 「更新」按钮：比对 version.json 的 build，不一致即清缓存+注销 SW+硬重载 */
(function(){
  var b=document.getElementById('pvUpd'); if(!b) return;
  var m=document.querySelector('meta[name="pv-build"]'); var local=m?m.getAttribute('content'):'';
  var t0=b.textContent;
  function say(t,ms){ b.textContent=t; setTimeout(function(){ b.textContent=t0; }, ms||1600); }
  function hard(){
    try{ if('caches' in window){ caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }).catch(function(){}); } }catch(e){}
    try{ if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){ navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ try{ r.unregister(); }catch(e){} }); }); } }catch(e){}
    setTimeout(function(){ var u=location.href.split('#')[0]; var sep=u.indexOf('?')>=0?'&':'?'; try{ location.replace(u+sep+'t='+Date.now()); }catch(e){ location.reload(); } },150);
  }
  b.addEventListener('click', function(){
    if(!/^https?:/i.test(location.protocol)){ hard(); return; }
    var base = location.pathname.indexOf('/tools/') >= 0 ? '../' : '';
    say('检查中');
    fetch(base+'version.json?t='+Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(j){
      if(j && j.build && j.build !== local){ say('更新中'); hard(); } else { say('已最新'); }
    }).catch(function(){ hard(); });
  });
})();
</script>
