<style>
:root{
  --accent:#0f766e; --accent-soft:color-mix(in srgb,#0f766e 10%,#fff);
  --bg:#f5f6f8; --card:#fff; --ink:#16181d; --ink2:#4a5160; --ink3:#6b7280;
  --line:#e5e7eb; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
  --r:14px; --sp:16px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1115;--card:#171a20;--ink:#f2f4f7;--ink2:#c3c9d4;--ink3:#98a0ad;--line:#272c35;
        --accent-soft:color-mix(in srgb,#0f766e 22%,#171a20);}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-size:16px;line-height:1.7;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));}
.hd{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) var(--sp) 10px;display:flex;align-items:center;gap:12px}
.hd h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px;flex:1;min-width:0}
.hd h1 small{display:block;font-size:12px;font-weight:400;color:var(--ink3);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{flex:none;background:var(--accent);color:#fff;font-size:12px;padding:4px 9px;border-radius:20px}
main{padding:12px var(--sp) 8px;max-width:820px;margin:0 auto}
.view{display:none}
.view.on{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 8px}
.muted{color:var(--ink3);font-size:14px}
.tiny{font-size:13px;color:var(--ink3)}
.row{display:flex;align-items:center;gap:10px}
.spread{justify-content:space-between}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:var(--accent-soft);color:var(--accent);margin:0 6px 6px 0}
.pill.g{background:#e8f5ee;color:#15803d}
@media (prefers-color-scheme:dark){.pill.g{background:#12261a;color:#4ade80}}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:12px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;font-weight:600;cursor:pointer}
.btn.p{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn:active{transform:scale(.985)}
.btn.wide{width:100%}
.dbar{display:flex;align-items:center;gap:8px;padding:10px}
.dbar .btn.sq{min-height:44px;width:44px;padding:0;flex:none;font-size:20px;line-height:1;font-weight:500}
.dbar .btn.sq2{min-height:44px;padding:0 12px;flex:none;font-size:15px}
.dbar .btn.cur{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.dbar .btn[disabled]{opacity:.35}
.dbar input[type=date]{flex:1;min-width:0;min-height:44px;padding:0 8px;border:1px solid var(--line);
  border-radius:12px;background:var(--card);color:var(--ink);font-size:16px;font-family:inherit;text-align:center}
.pvnote{margin:-4px 2px 10px;text-align:center;font-size:13px;color:var(--accent)}
.backtoday{position:fixed;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:45;
  max-width:420px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;
  border-radius:14px;background:var(--accent);color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.2);
  font-size:13px;line-height:1.35;animation:bkin .18s ease}
.backtoday[hidden]{display:none}
.backtoday .bk-txt{flex:1;min-width:0}
.backtoday b{display:block;font-size:14px;font-weight:700}
.backtoday small{display:block;font-size:11.5px;opacity:.9;margin-top:1px}
.backtoday button{flex:none;min-height:40px;padding:0 14px;border:0;border-radius:10px;background:#fff;
  color:var(--accent);font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
.backtoday button:active{transform:scale(.96)}
@keyframes bkin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
body.has-bk{padding-bottom:calc(136px + env(safe-area-inset-bottom))}
@media (prefers-reduced-motion:reduce){.backtoday{animation:none}}
.startpick{min-height:40px;padding:0 8px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);color:var(--ink);font-size:15px;font-family:inherit;max-width:150px}
.btn.ghost{background:transparent}
.chk{display:flex;align-items:flex-start;gap:12px;min-height:48px;padding:8px 10px;border:1px solid var(--line);
  border-radius:12px;margin-bottom:8px;cursor:pointer;background:var(--card)}
.chk input{appearance:none;width:24px;height:24px;flex:none;margin:2px 0 0;border:2px solid var(--ink3);border-radius:7px;position:relative;cursor:pointer}
.chk input:checked{background:var(--accent);border-color:var(--accent)}
.chk input:checked::after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:2px solid #fff;border-top:0;border-left:0;transform:rotate(42deg)}
.chk span{font-size:16px}
.chk.on{border-color:var(--accent);background:var(--accent-soft)}
.ring{width:54px;height:54px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;
  background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);position:relative}
.ring::after{content:"";position:absolute;inset:5px;background:var(--card);border-radius:50%}
.ring b{position:relative;z-index:1;font-size:13px}
.ring b small{display:block;font-size:9px;font-weight:400;color:var(--ink3);text-align:center}
input[type=search],input[type=text]{width:100%;min-height:44px;font-size:16px;padding:0 12px;border-radius:12px;
  border:1px solid var(--line);background:var(--card);color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;display:inline-flex;align-items:center;padding:0 14px;border-radius:20px;
  border:1px solid var(--line);background:var(--card);font-size:14px;color:var(--ink2);cursor:pointer}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-height:56px;cursor:pointer}
.item:active{background:var(--accent-soft)}
.item h3{font-size:16px;margin:0 0 4px;font-weight:600;line-height:1.45}
.item p{margin:0;font-size:13px;color:var(--ink3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:var(--card);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1 1 0;min-width:0;min-height:56px;border:0;background:none;color:var(--ink3);font-size:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:6px 2px}
.tabbar button.on{color:var(--accent);font-weight:700}
.tabbar i{font-style:normal;font-size:19px;line-height:1}
.reader{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;overflow-y:auto;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.reader.on{display:block}
.rbar{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);z-index:2;
  display:flex;gap:10px;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.rbar .btn{min-height:44px;padding:0 12px;font-size:15px}
.rbody{padding:14px var(--sp) calc(40px + env(safe-area-inset-bottom));max-width:820px;margin:0 auto}
.rbody h2{font-size:19px;line-height:1.45;margin:6px 0 10px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.sec h4{margin:0 0 8px;font-size:16px;color:var(--accent);letter-spacing:.3px}
.prose{font-size:17px;line-height:1.78;margin:0;color:var(--ink)}
ul.mats{margin:0;padding-left:20px}
ul.mats li{font-size:17px;line-height:1.78;margin-bottom:8px}
.quiz b{color:var(--accent)}
.kb{background:var(--accent-soft);border-radius:12px;padding:12px;font-size:17px;line-height:1.75}
.spoiler{display:none}
.spoiler.on{display:block}
.wrongtag{font-size:12px;color:var(--bad);border:1px solid var(--bad);border-radius:8px;padding:1px 6px}
.empty{text-align:center;color:var(--ink3);font-size:15px;padding:32px 8px}
.foot{color:var(--ink3);font-size:12px;line-height:1.7;padding:8px 2px 24px}
.acc{border-left:3px solid var(--accent);padding-left:10px}
progress{width:100%;height:10px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.tbl th{color:var(--ink3);font-weight:600;font-size:13px}
details{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--card)}
details summary{font-size:16px;font-weight:600;cursor:pointer;min-height:32px}
details .prose{font-size:16px}
</style>

具并说出其排除边界","key_point":"HEART 用于急诊胸痛低危分流；Wells/ Geneva 需结合 D-二聚体年龄校正；PERC 仅用于极低危；任何评分都不能替代“生命体征不稳即升级”","practice":"①列出 3 个工具的适用人群；②写 1 个评分低危但实际高危的反例；③说明年龄校正 D-二聚体的意义；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","priority":"B","tag":"总论","mod":"门诊红旗筛查与安全网","mod_i":0},{"title":"床旁体征红旗：三凹征、颈静脉、CRT、皮疹","chapter":"诊断学 第10版 · 体格检查 + 门诊快速筛查","goal":"能在 90 秒内完成 4 项床旁红旗体征检查并解释其含义","key_point":"三凹征=吸气做功大增；颈静脉怒张>3cm 提示右心/容量负荷；CRT>3 秒提示低灌注；出血性皮疹不褪色提示脑膜炎球菌血症或 DIC","practice":"①对 1 人实测 CRT 与颈静脉；②写出 4 项体征各自的下一步；③说明肥胖/老年使 CRT 失真的原因；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","priority":"A","tag":"总论","mod":"门诊红旗筛查与安全网","mod_i":0},{"title":"床旁检验与“不能等结果”的决策","chapter":"基层诊疗指南 · 基层可及检查","goal":"能列出 5 项必须床旁完成、不能等回报的检查","key_point":"血糖、心电图、SpO2/血气、尿妊娠、床旁超声（心包/腹腔/肺）属“边查边治”；治疗窗短于检验周转时间时必须先处理","practice":"①列 5 项床旁检查及理由；②写出 1 个“等结果导致延误”的场景；③写一句“先处理后补证”的记录模板；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","priority":"A","tag":"总论","mod":"门诊红旗筛查与安全网","mod_i":0},{"title":"急性冠脉综合征：胸痛 + 心电图 + 肌钙蛋白","chapter":"NICE NG185/基层指南 · 胸痛与 ACS","goal":"能在 10 分钟内完成 18 导联心电图并判断是否需再灌注","key_point":"ST 段抬高或等同表现（后壁、下壁伴 aVL 压低）即按 STEMI 处理；单次肌钙蛋白阴性不能排除，需动态；持续胸痛+动态改变比绝对值更重要","practice":"①默写 STEMI 与等危心电图表现；②对 2 份心电图定位梗死相关血管；③写出首剂抗血小板与抗凝的启动时点；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","priority":"A","tag":"心血管","mod":"胸痛与心悸门诊判别","mod_i":1},{"title":"主动脉夹层：撕裂样痛 + 脉搏血压差","chapter":"基层指南 · 胸痛转诊 + 影像可及性","goal":"能在 3 个问题内决定是否启动 CTA","key_point":"双上肢血压差>20mmHg、脉搏短绌、新发主动脉瓣反流、纵隔增宽任一存在即高度怀疑；D-二聚体阴性有较高排除价值但不能单用","practice":"①写出 4 条支持线索；②说明为何不能先给抗凝；③设计 1 个“被误认为 ACS”的病例；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","priority":"A","tag":"心血管","mod":"胸痛与心悸门诊判别","mod_i":1},{"title":"肺栓塞：危险因素 + 低氧 + 右心负荷","chapter":"NICE NG158 · 静脉血栓栓塞症","goal":"能用 Wells 评分 + 年龄校正 D-二聚体完成一次排除路径","key_point":"突发呼吸困难+胸痛+低氧、单侧下肢肿胀、近期制动/手术/肿瘤是核心线索；血流动力学不稳者直接 CTPA/床旁超声，不做 D-二聚体排除","practice":"①算 1 例 Wells 分；②写出年龄校正公式；③说明不稳定患者的替代路径；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","priority":"A","tag":"心血管","mod":"胸痛与心悸门诊判别","mod_i":1},{"title":"稳定型与不稳定型心绞痛的边界","chapter":"NICE NG185 · 稳定性胸痛门诊路径","goal":"能用 3 个变化判断“稳定”是否已变成“不稳定”","key_point":"新发（<2 月）、静息发作、频率/程度加重三者任一即为不稳定；不稳定=按 ACS 路径评估，不做运动试验","practice":"①写出 3 个变化；②给 2 个病例判定；③说明为何不稳定期禁做负荷试验；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","priority":"B","tag":"心血管","mod":"胸痛与心悸门诊判别","mod_i":1},{"title":"宽 QRS 心动过速：先假定室速","chapter":"基层指南 · 心律失常识别与转运","goal":"能在 60 秒内按“假定室速”给出处理顺序","key_point":"宽 QRS 且血流动力学不稳→同步电复律；稳定者按室速处理，胺碘酮/普鲁卡因胺，避免维拉帕米；找不到既往束支阻滞证据就不要当室上速","practice":"①写出不稳定与稳定两条路径；②列出 3 条支持室速的线索；③说明为何避免钙拮抗剂；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","priority":"A","tag":"心血管","mod":"胸痛与心悸门诊判别","mod_i":1},{"title":"缓慢性心律失常与晕厥","chapter":"基层指南 · 晕厥门诊评估与转诊","goal":"能识别高度房室阻滞并决定是否临时起搏","key_point":"晕厥+宽 QRS 逸搏、二度 II 型、三度阻滞、长间歇>3 秒、伴低血压或意识恢复慢→按高危处理；阿托品无效即准备起搏","practice":"①写出 4 条高危心电图；②说明阿托品剂量与上限；③写 1 个“血管迷走性晕厥”的排除依据；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","priority":"A","tag":"心血管","mod":"胸痛与心悸门诊判别","mod_i":1},{"title":"急性心衰：端坐呼吸 + 湿啰音 + BNP","chapter":"基层指南 · 心衰门诊与转诊","goal":"能在 5 分钟内完成急性心衰的初步分型与首剂处理","key_point":"端坐呼吸+双肺湿啰音+颈静脉怒张+BNP 升高支持；血压高者以血管扩张剂+利尿为主，血压低者警惕心源性休克，慎用大剂量利尿","practice":"①写出 4 条支持线索；②按血压分三型给首剂；③说明何时需要无创通气；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","priority":"A","tag":"心血管","mod":"胸痛与心悸门诊判别","mod_i":1},{"title":"感染性心内膜炎：发热 + 新杂音 + 栓塞","chapter":"基层指南 · 发热门诊与转诊","goal":"能说出 3 组血培养采集规则与需手术的 3 个指征","key_point":"不明原因发热+新出现反流杂音+栓塞/瘀点/Osler 结节支持；抗生素前 3 组不同部位血培养；瓣膜功能衰竭、未控制感染、大赘生物是手术指征","practice":"①写出采血规则；②列 3 个手术指征；③说明为何不能等超声再抽血；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","priority":"B","tag":"感染","mod":"胸痛与心悸门诊判别","mod_i":1},{"title":"急腹症“不能等”的六个信号","chapter":"基层指南 · 急腹症识别与转诊","goal":"能在 2 分钟内筛出需外科会诊的急腹症","key_point":"腹膜刺激征、血流动力学不稳、气腹、肠鸣音消失+腹胀、疼痛与体征不符、老年/免疫抑制+新发腹痛=高危；镇痛不掩盖病情，应早给","practice":"①写出 6 条信号；②对 2 个病例判断是否叫外科；③说明为何“先止痛再查”更安全；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","priority":"A","tag":"消化","mod":"腹痛与消化道门诊","mod_i":2},{"title":"急性胰腺炎：三缺一与严重度","chapter":"基层指南 · 急性胰腺炎分级诊疗","goal":"能按修订亚特兰大标准诊断并分级","key_point":"典型腹痛、淀粉酶/脂肪酶>3 倍上限、影像三项中两项即可诊断；持续器官衰竭>48h 为重度；早期液体复苏是关键，抗生素无感染不用","practice":"①写出三条诊断依据；②按器官衰竭分级；③写出首 24 小时液体策略； nt":"血压升高+心率减慢+呼吸不规则（Cushing 反应）、瞳孔不等大、意识进行性下降=脑疝；抬高床头 30°、甘露醇/高渗盐、过度通气仅作桥接、立即神经外科","practice":"①写出 Cushing 三联；②列 3 项紧急措施；③说明为何不做腰穿；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","priority":"A","tag":"神经","mod":"头痛眩晕与神经预警","mod_i":4},{"title":"头痛红旗：SNOOP4","chapter":"NICE NG12/基层指南 · 头痛门诊","goal":"能背出 SNOOP4 五类并各举一例","key_point":"全身症状/疾病（发热、肿瘤、免疫抑制）、神经功能缺损、突发雷击样、>50 岁新发、模式改变（频率/程度/体位相关）=需影像","practice":"①默写 SNOOP4；②各举 1 例；③说明先用止痛药观察的风险；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","priority":"A","tag":"神经","mod":"头痛眩晕与神经预警","mod_i":4},{"title":"眩晕：中枢与外周的 HINTS 检查","chapter":"基层指南 · 眩晕门诊路径","goal":"能用 HINTS 三步把中枢性眩晕从外周中分出","key_point":"头脉冲试验正常、方向改变的凝视性眼震、垂直眼震偏斜=中枢；HINTS 仅用于持续眩晕且无其他局灶体征者，不能用于间歇性眩晕","practice":"①写出三步；②对 2 例判读；③说明 HINTS 的适用前提；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","priority":"A","tag":"神经","mod":"头痛眩晕与神经预警","mod_i":4},{"title":"呼吸困难分级与“说不出话”的红旗","chapter":"基层指南 · 呼吸困难门诊识别","goal":"能在 30 秒内用说话能力与呼吸做功判断严重度","key_point":"不能完整说句、辅助呼吸肌参与、三凹征、发绀、意识改变= imminent failure；SpO2 正常不能排除“即将衰竭”（代偿期）","practice":"①写出 5 条红旗；②对 3 个场景分级；③说明“沉默胸”的含义；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","priority":"A","tag":"呼吸","mod":"呼吸与低氧","mod_i":5},{"title":"重症哮喘：静默肺与 PaCO2 正常化","chapter":"基层指南 · 哮喘急性发作分级","goal":"能识别“看似好转实为衰竭”的两个信号","key_point":"喘鸣音减弱/静默肺、PaCO2 由低转正常或升高、意识改变、呼吸肌疲劳=濒危；此时不能按“减轻”处理","practice":"①写出 4 条濒危信号；②说明 PaCO2 正常的陷阱；③列出首小时处理顺序；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","priority":"A","tag":"呼吸","mod":"呼吸与低氧","mod_i":5},{"title":"COPD 急性加重：意识与血气优先","chapter":"基层指南 · COPD 分级诊疗","goal":"能判断是否需无创通气并说出禁忌","key_point":"意识改变、pH<7.35 且 PaCO2>45、呼吸功增加=重症；无创通气首选，意识障碍加重、不能配合、误吸风险高为禁忌","practice":"①写出重症标准；②列无创通气禁忌；③说明氧疗目标为何是 88–92%；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","priority":"A","tag":"呼吸","mod":"呼吸与低氧","mod_i":5},{"title":"肺炎严重度：CURB-65 与重症标准","chapter":"基层指南 · 社区获得性肺炎","goal":"能用 CURB-65 与次要标准决定门诊/住院/ICU","key_point":"CURB-65≥2 建议住院，≥3 考虑 ICU；需有创通气或需升压药为主要标准，呼吸频率≥30、氧合指数≤250、多肺叶、意识障碍、尿毒症、白细胞减少、血小板减少、低体温为次要标准（≥3 条）","practice":"①默写 CURB-65 五项；②算 2 个病例分数；③说明为何老年人分数需谨慎解读；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","priority":"B","tag":"感染","mod":"呼吸与低氧","mod_i":5},{"title":"ARDS：柏林定义与早期识别","chapter":"基层指南 · 呼吸衰竭转诊","goal":"能按柏林定义判断并说出肺保护性通气目标","key_point":"起病 1 周内、双肺浸润不能完全由心衰解释、PEEP≥5 时 PaO2/FiO2≤300；潮气量 6ml/kg 理想体重、平台压<30cmH2O","practice":"①写出 3 条定义；②算 1 例氧合指数并分级；③说明为何避免大潮气量；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","priority":"B","tag":"呼吸","mod":"呼吸与低氧","mod_i":5},{"title":"上气道梗阻：吸气性喘鸣与不能发声","chapter":"基层指南 · 气道急症转运","goal":"能区分上气道与下气道梗阻并给出“不刺激”的处置","key_point":"吸气性喘鸣、声音改变、不能完整发声、流涎、三凹征=上气道；避免压舌板检查与仰卧，准备困难气道与外科气道","practice":"①写出 5 条鉴别；②说明为何不用压舌板；③列出药物（雾化肾上腺素/激素）与外科兜底；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","priority":"A","tag":"呼吸","mod":"呼吸与低氧","mod_i":5},{"title":"咯血分级与大咯血处理","chapter":"基层指南 · 咯血门诊与转诊","goal":"能判断大咯血并说出体位与气道保护原则","key_point":">400ml/24h 或一次>100ml、伴窒息/低氧=大咯血；患侧卧位、头低、保持气道、备气管插管与支气管镜；抗凝抗板需评估","practice":"①写出分级；②说明体位原理；③列出 3 项初始处置；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","priority":"A","tag":"呼吸","mod":"呼吸与低氧","mod_i":5},{"title":"胸腔积液与脓胸：发热 + 单侧浊音","chapter":"基层指南 · 胸腔积液诊治","goal":"能判断是否需要诊断性穿刺及引流指征","key_point":"发热+单侧叩浊+呼吸音低；超声定位后穿刺；pH<7.2、葡萄糖<3.3mmol/L、LDH 高、脓性、包裹/多房=需引流","practice":"①写出穿刺适应证与禁忌；②列 4 条引流指征；③说明为何不能只凭胸片定性；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","priority":"B","tag":"呼吸","mod":"呼吸与低氧","mod_i":5},{"title":"糖尿病酮症酸中毒：血糖 + 酮体 + 阴离子间隙","chapter":"基层指南 · 糖尿病急症识别","goal":"能按三步诊断并写出液体、胰岛素、补钾顺序","key_point":"血糖>13.9mmol/L、血/尿酮阳性、pH<7.3 或 HCO3<18、阴离子间隙升高；先补液，血钾<3.3 先补钾再用胰岛素，胰岛素 0.1U/kg/h，血糖降至 11.1 加葡萄糖","practice":"①写出四条诊断；②写出补钾阈值；③写出胰岛素与葡萄糖的衔接；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","priority":"A","tag":"代谢","mod":"内分泌代谢与肾脏","mod_i":6},{"title":"高渗高血糖状态：极高血糖 + 高渗 + 意识障碍","chapter":"基层指南 · 糖尿病急症","goal":"能区分 HHS 与 DKA 并说明补液差异","key_point":"血糖常>33.3mmol/L、有效血浆渗透压>320mOsm/kg、酮体阴性或弱阳性、意识障碍更突出；脱水更重，补液更慢更谨慎，胰岛素用量更低","practice":"①做 2 例鉴别表；②写出渗透压公式；③说明 HHS 补液速度为何更慢；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","priority":"A","tag":"代谢","mod":"内分泌代谢与肾脏","mod_i":6},{"title":"低血糖：意识改变 + 可逆性","chapter":"基层指南 · 低血糖处置","goal":"能在意识障碍患者中先测血糖并说出纠正后观察要点","key_point":"血糖<3.9mmol/L 且有症状即低血糖，<3.0 为严重；口服葡萄糖/静脉葡萄糖，磺脲类或胰岛素过量需持续输注并留观；纠正后仍有神经缺损要排除卒中","practice":"①写出阈值；②写出两种给药途径；③说明为何磺脲类需长时间留观；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","priority":"A","tag":"代谢","mod":"内分泌代谢与肾脏","mod_i":6},{"title":"甲状腺危象：Burch-Wartofsky 评分","chapter":"基层指南 · 甲状腺危象识别","goal":"能在发热+心动过速+中枢症状时评分并启动四联治疗","key_point":"体温、心率、中枢、消化、诱因五项评分≥45 高度支持；治疗顺序：抗甲状腺药→碘剂（1 小时后）→β 阻滞剂→糖皮质激素，同时找诱因","practice":"①写出五项评分；②说明碘剂为何后给；③写出四联顺序；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","priority":"B","tag":"代谢","mod":"内分泌代谢与肾脏","mod_i":6},{"title":"肾上腺危象：低血压 + 低钠 + 色素沉着","chapter":"基层指南 · 内分泌急症转诊","goal":"能在难治性低血压时经验性使用氢化可的松","key_point":"低血压对补液/升压不敏感、低钠高钾、乏力恶心、长期激素使用史或色素沉着=危象；先抽皮质醇/ACTH 不等结果，立即氢化可的松 100mg 后每 6 小时","practice":"①写出 4 条线索；②写出激素剂量与给药方式；③说明为何不能等皮质醇结果；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","priority":"A","tag":"代谢","mod":"内分泌代谢与肾脏","mod_i":6},{"title":"高钾血症：心电图 + 紧急降钾","chapter":"基层指南 · 电解质急症","goal":"能按心电图改变分级并说出三步降钾","key_point":"T 波高尖→P 波变平→QRS 增宽→正弦波；>6.5 或有心电改变即紧急；葡萄糖酸钙稳定心肌、胰岛素+葡萄糖转移、利尿/透析清除","practice":"①写出心电图演变；②写出三步药物；③说明钙剂为何不降钾但仍先用；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","priority":"A","tag":"代谢","mod":"内分泌代谢与肾脏","mod_i":6},{"title":"低钠血症：渗透压 + 容量 + 纠正速度","chapter":"基层指南 · 低钠血症门诊处理","goal":"能按容量状态分类并说出纠正上限","key_point":"先测血浆渗透压排除假性/高渗；低容量、等容量（SIADH）、高容量三类决定补钠或限水；24 小时血钠升高不超过 8–10mmol/L，防渗透性脱髓鞘","practice":"①写出分类三步；②写出纠正上限；③说明抽搐时的处理；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","priority":"A","tag":"代谢","mod":"内分泌代谢与肾脏","mod_i":6},{"title":"急性肾损伤：KDIGO 分期与肾后性排查","chapter":"基层指南 · AKI 识别与转诊","goal":"能按 KDIGO 分期并先排查梗阻","key_point":"48 小时肌酐升高≥26.5μmol/L、7 天升至 1.5 倍、尿量<0.5ml/kg/h 6 小时；先做膀胱超声排除梗阻，再分肾前/肾性；停肾毒药物、调剂量","practice":"①写出 3 条诊断；②列 3 类肾毒性药物；③说明梗阻排查为何优先；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","priority":"A","tag":"肾脏","mod":"内分泌代谢与肾脏","mod_i":6},{"title":"张力性气胸：单侧呼吸音 + 立即减压","chapter":"基层指南 · 气胸识别与转运","goal":"能在听诊 30 秒内识别并说出减压部位","key_point":"单侧呼吸音消失+叩诊鼓音+气管向对侧移位+颈静脉怒张+低血压=张力性气胸；诊断靠临床，不等胸片，立即针刺减压","practice":"①写出 5 条体征组合；②标出锁骨中线第 2 肋间与前腋线第 4–5 肋间两个部位；③写出减压后下一步；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","priority":"A","tag":"呼吸","mod":"门诊见即转的急症","mod_i":7},{"title":"心包填塞：Beck 三联 + 奇脉","chapter":"基层指南 · 心包积液识别与转诊","goal":"能说出 Beck 三联与奇脉测法并解释低血压机制","key_point":"低血压+颈静脉怒张+心音低钝为三联；奇脉>10mmHg 支持；床旁超声心包积液+右心塌陷可确诊；关键是“低血压+颈静脉怒张+肺野清晰”","practice":"①写出三联；②说明奇脉测量步骤；③与缩窄性心包炎做 2 点鉴别；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","priority":"A","tag":"心血管","mod":"门诊见即转的急症","mod_i":7},{"title":"食管破裂与纵隔气肿","chapter":"基层指南 · 胸痛转诊指征","goal":"能在剧烈呕吐后胸痛场景中想到并说出确诊检查","key_point":"剧烈呕吐后突发胸背痛+皮下气肿+纵隔气肿=Boerhaave；造影/CT 确诊，禁食、广谱抗生素、外科会诊三件事同时启动","practice":"①写出 3 条线索；②说明为何不能只按“胃食管反流”处理；③列出确诊与初始处置；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","priority":"B","tag":"呼吸","mod":"门诊见即转的急症","mod_i":7},{"title":"高血压急症与亚急症：看靶器官不看数值","chapter":"基层指南 · 高血压分级诊疗","goal":"能用 3 个靶器官损害判断是否属于急症","key_point":"伴脑病/卒中/心衰/主动脉夹层/肾损伤/视网膜出血即急症，需静脉降压并按病种定降幅；无靶器官损害即使>180/120 也属亚急症，口服药缓慢降","practice":"①列 5 类靶器官损害；②写出主动脉夹层与卒中的不同降压目标；③说明“快速降压”的风险；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","priority":"A","tag":"心血管","mod":"门诊见即转的急症","mod_i":7},{"title":"肠系膜缺血：疼痛与体征不符","chapter":"基层指南 · 腹痛转诊指征","goal":"能在“剧痛但腹部软”时想到本病并启动 CTA","key_point":"与体征不相称的剧烈腹痛、房颤/动脉硬化、乳酸升高、恶心呕吐=警惕；CTA 是首选；早期易被当作“胃肠炎”","practice":"①写出 3 条线索；②说明为何乳酸正常不能排除；③写出确诊路径；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","priority":"A","tag":"消化","mod":"门诊见即转的急症","mod_i":7},{"title":"异位妊娠与卵巢扭转：育龄女性腹痛必查","chapter":"基层指南 · 育龄女性腹痛处理","goal":"能对所有育龄女性腹痛先做尿妊娠试验","key_point":"停经+腹痛+阴道流血+晕厥=异位妊娠；尿妊娠阴性基本排除（除外极早期）；突发单侧剧痛+恶心+附件包块=扭转，需 6 小时内手术评估","practice":"①写出三联；②说明为何“上环”也要查；③写出扭转的影像与时间窗；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","priority":"A","tag":"消化","mod":"门诊见即转的急症","mod_i":7},{"title":"感染性休克：去甲肾上腺素与液体反应性","chapter":"基层指南 · 休克识别与转运","goal":"能在液体复苏后按步骤加用升压药并评估反应","key_point":"去甲肾上腺素为首选，目标 MAP≥65；乳酸、CRT、尿量、意识用于评估灌注；液体反应性用被动抬腿/每搏量变异评估，避免盲目补液","practice":"①写出升压药首选与目标；②列 4 个灌注指标；③说明液体过负荷的 3 个信号；④写出本点的上转阈值，并准备一句对患者的安全网交代（出现什么就立刻回来）","priority":"A","tag":"感染","mod":"门诊见即转的急症","mod_i":7},{"title":"缺血性卒中再灌注：时间窗与禁忌","chapter":"基层指南 · 卒中转运与时间窗","goal":"能说出静脉溶栓与取栓的时间窗及主要禁忌","key_point":"阿替普酶/替奈普酶 4.
