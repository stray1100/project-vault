html[data-theme="light"]{--bg:#f7f7f5; --fg:#1a1c20; --sub:#5c626b; --line:#e2e2dd; --card:#ffffff; --accent:#2f5d8a; --accent-2:#8a5a2f; --ok:#2e7d5b; --warn:#a8731b; --bad:#a63a3a; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);}

.hidden{display:none!important}

.reader .body h2{font-size:19px;margin:0 0 4px}

.reader .body p{margin:0 0 1em}
.q{border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px;background:var(--card)}

.tri button.on{background:var(--accent);color:#fff;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.stat .l{font-size:12px;color:var(--sub)}

th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}

.bar-o{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.bar-i{height:100%;background:var(--accent)}
.muted{color:var(--sub);font-size:13px}

.hero .s{font-size:14px;color:var(--sub);margin-top:6px}

var MATERIALS = {"M01-K01":{"title":"机身与镜头的分工","anchor":"是镜头定视角机身定响应，不是贵机身出好片","source":"参考：《新摄影笔记》 · 器材与基本操作（按目录对应）","sections":[{"h":"为什么是这样","p":"机身决定对焦速度、连拍、高感噪点与取景方式；镜头决定视角、透视压缩与最大光圈。判断缺什么：拍不到是焦段不够，拍不清是对焦慢或噪点多，画面平是光位与视角问题。先把钱花在镜头上，通常比换机身见效快。器材的真实边界由传感器尺寸、镜头光学与机身响应共同决定，而不由参数表上的最大值决定。传感器尺寸决定了同样视角下的景深与高感表现：小底在高 ISO 下暗部先出色噪，大底则能把可用区间再往上推一挡半。焦距改变的不只是取景范围，更是透视关系——广角把近处推远、把纵深夸大，长焦压缩前后景、让背景靠近主体。这些差异在拍摄前就该心里有数，而不是拍完再猜为什么画面不对。"},{"h":"操作路径","p":"今天的练习：用同一机身换两支焦段拍同一主体，比较画面变化。器材练习的关键是控制变量：同一机位、同一光线、同一被摄体，只换焦距或只换光圈，然后并排看差异。出门前把三件事做完——清空存储卡、确认电池余量、把常用参数存成自定义档位。手持时肘部贴紧躯干、在呼气末按快门；一旦上三脚架，先关掉镜头或机身防抖，否则防抖在稳定环境下反而引入微抖。收工后回到同一菜单把参数复位，避免下一次带着上一场的设定出门。"},{"h":"边界与代价","p":"典型翻车：画面不对就想着换机身。器材从来不在瓶颈的前三位。预算优先投给能常带出门的那支镜头，而不是参数更漂亮却常年躺在包里的那支。别拿升级器材替代基本功：换机身治不好测光判断错误、构图无序和快门时机滞后。也要警惕参数洁癖——为追极致锐度把光圈收到 f/16，衍射反而让画面发软；为追虚化全开光圈，结果主体边缘薄得像纸。设备的价值在于它被带出去多少次，而不是它标称多少像素。"},{"h":"怎么判断到位","p":"今天的判据：是镜头定视角机身定响应，不是贵机身出好片。先问：这套参数是我决定的，还是相机的自动档替我决定的？再问：同一场景换一挡光圈或一挡焦距，画面差异我能提前预判吗？最后问：所有设备状态（电量、存储、防抖、色彩设置）我都确认过了吗？三问都能答清，才算真的掌握了器材。"}],"points":["是镜头定视角机身定响应，不是贵机身出好片","今天只验证这一个变量：能判断自己缺的是焦段还是机身能力"],"pitfalls":["画面不对就想着换机身"],"quiz":[{"q":"「机身与镜头的分工」的判断要点是什么？先说结论再谈理由。","a":"是镜头定视角机身定响应，不是贵机身出好片","why":"机身决定对焦速度、连拍、高感噪点与取景方式"},{"q":"有人说：画面不对就想着换机身。这样对吗？","a":"不对。是镜头定视角机身定响应，不是贵机身出好片","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"用同一机身换两支焦段拍同一主体，比较画面变化｜相机：光圈优先、f/5.6、ISO 自动上限 3200、单点对焦；手机：专业模式锁定 ISO 与对焦","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：参数按设定执行、对焦落在预定位置、手持 1/30s 可读（每项 5 分制，任一不达标记 3 分以下）","表达 25%：主体可辨、无意外遮挡","规范 15%：参数记录完整、未用后期掩盖操作失误"]}},"M01-K02":{"title":"画幅与等效焦距","anchor":"是对角线换算不是长边，APS-C 约乘 1.5","source":"参考：《新摄影笔记》 · 器材与基本操作（按目录对应）","sections":[{"h":"为什么是这样","p":"等效焦距等于实际焦距乘裁切系数（全幅 1.0、APS-C 约 1.5、M43 为 2.0）。它只换算视角，不改变透视，透视只由拍摄距离决定。所以 APS-C 赚长焦只是裁切，压缩感与全幅同焦段并不相同。换算的意义是预判取景范围。器材的真实边界由传感器尺寸、镜头光学与机身响应共同决定，而不由参数表上的最大值决定。传感器尺寸决定了同样视角下的景深与高感表现：小底在高 ISO 下暗部先出色噪，大底则能把可用区间再往上推一挡半。焦距改变的不只是取景范围，更是透视关系——广角把近处推远、把纵深夸大，长焦压缩前后景、让背景靠近主体。这些差异在拍摄前就该心里有数，而不是拍完再猜为什么画面不对。"},{"h":"操作路径","p":"今天的练习：查自己设备裁切系数，把常用三支镜头换算成等效焦距。器材练习的关键是控制变量：同一机位、同一光线、同一被摄体，只换焦距或只换光圈，然后并排看差异。出门前把三件事做完——清空存储卡、确认电池余量、把常用参数存成自定义档位。手持时肘部贴紧躯干、在呼气末按快门；一旦上三脚架，先关掉镜头或机身防抖，否则防抖在稳定环境下反而引入微抖。收工后回到同一菜单把参数复位，避免下一次带着上一场的设定出门。"},{"h":"边界与代价","p":"典型翻车：拿 APS-C 的 50mm 当全幅 50mm 用，拍完发现偏窄。器材从来不在瓶颈的前三位。预算优先投给能常带出门的那支镜头，而不是参数更漂亮却常年躺在包里的那支。别拿升级器材替代基本功：换机身治不好测光判断错误、构图无序和快门时机滞后。也要警惕参数洁癖——为追极致锐度把光圈收到 f/16，衍射反而让画面发软；为追虚化全开光圈，结果主体边缘薄得像纸。设备的价值在于它被带出去多少次，而不是它标称多少像素。"},{"h":"怎么判断到位","p":"今天的判据：是对角线换算不是长边，APS-C 约乘 1.5。先问：这套参数是我决定的，还是相机的自动档替我决定的？再问：同一场景换一挡光圈或一挡焦距，画面差异我能提前预判吗？最后问：所有设备状态（电量、存储、防抖、色彩设置）我都确认过了吗？三问都能答清，才算真的掌握了器材。"}],"points":["是对角线换算不是长边，APS-C 约乘 1.5","今天只验证这一个变量：能把手上设备焦距换算成等效视角"],"pitfalls":["拿 APS-C 的 50mm 当全幅 50mm 用，拍完发现偏窄"],"quiz":[{"q":"「画幅与等效焦距」的判断要点是什么？先说结论再谈理由。","a":"是对角线换算不是长边，APS-C 约乘 1.5","why":"等效焦距等于实际焦距乘裁切系数（全幅 1.0、APS-C 约 1.5、M43 为 2.0）"},{"q":"有人说：拿 APS-C 的 50mm 当全幅 50mm 用，拍完发现偏窄。这样对吗？","a":"不对。是对角线换算不是长边，APS-C 约乘 1.5","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"查自己设备裁切系数，把常用三支镜头换算成等效焦距｜相机：光圈优先、f/5.6、ISO 自动上限 3200、单点对焦；手机：专业模式锁定 ISO 与对焦","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：参数按设定执行、对焦落在预定位置、手持 1/30s 可读（每项 5 分制，任一不达标记 3 分以下）","表达 25%：主体可辨、无意外遮挡","规范 15%：参数记录完整、未用后期掩盖操作失误"]}},"M01-K03":{"title":"焦距分段与视角","anchor":"是焦段决定透视与压缩，不是远近靠走","source":"参考：《新摄影笔记》 · 器材与基本操作（按目录对应）","sections":[{"h":"为什么是这样","p":"24mm 以下强调前后关系、边缘拉伸；35mm 接近双人眼视野，适合环境人像与街拍；50mm 中性少变形；85-135mm 压缩背景，适合人像与细节。想让背景更干净，往往不是换更广，而是换更长并后退。器材的真实边界由传感器尺寸、镜头光学与机身响应共同决定，而不由参数表上的最大值决定。传感器尺寸决定了同样视角下的景深与高感表现：小底在高 ISO 下暗部先出色噪，大底则能把可用区间再往上推一挡半。焦距改变的不只是取景范围，更是透视关系——广角把近处推远、把纵深夸大，长焦压缩前后景、让背景靠近主体。这些差异在拍摄前就该心里有数，而不是拍完再猜为什么画面不对。"},{"h":"操作路径","p":"今天的练习：固定主体，用 24/50/135 三个焦段各拍一张并保持主体同大。器材练习的关键是控制变量：同一机位、同一光线、同一被摄体，只换焦距或只换光圈，然后并排看差异。出门前把三件事做完——清空存储卡、确认电池余量、把常用参数存成自定义档位。手持时肘部贴紧躯干、在呼气末按快门；一旦上三脚架，先关掉镜头或机身防抖，否则防抖在稳定环境下反而引入微抖。收工后回到同一菜单把参数复位，避免下一次带着上一场的设定出门。"},{"h":"边界与代价","p":"典型翻车：用广角拍人像靠太近，脸变形。器材从来不在瓶颈的前三位。预算优先投给能常带出门的那支镜头，而不是参数更漂亮却常年躺在包里的那支。别拿升级器材替代基本功：换机身治不好测光判断错误、构图无序和快门时机滞后。也要警惕参数洁癖——为追极致锐度把光圈收到 f/16，衍射反而让画面发软；为追虚化全开光圈，结果主体边缘薄得像纸。设备的价值在于它被带出去多少次，而不是它标称多少像素。"},{"h":"怎么判断到位","p":"今天的判据：是焦段决定透视与压缩，不是远近靠走。先问：这套参数是我决定的，还是相机的自动档替我决定的？再问：同一场景换一挡光圈或一挡焦距，画面差异我能提前预判吗？最后问：所有设备状态（电量、存储、防抖、色彩设置）我都确认过了吗？三问都能答清，才算真的掌握了器材。"}],"points":["是焦段决定透视与压缩，不是远近靠走","今天只验证这一个变量：能按题材选焦段而不是靠走动补"],"pitfalls":["用广角拍人像靠太近，脸变形"],"quiz":[{"q":"「焦距分段与视角」的判断要点是什么？先说结论再谈理由。","a":"是焦段决定透视与压缩，不是远近靠走","why":"24mm 以下强调前后关系、边缘拉伸"},{"q":"有人说：用广角拍人像靠太近，脸变形。这样对吗？","a":"不对。是焦段决定透视与压缩，不是远近靠走","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"固定主体，用 24/50/135 三个焦段各拍一张并保持主体同大｜相机：光圈优先、f/5.6、ISO 自动上限 3200、单点对焦；手机：专业模式锁定 ISO 与对焦","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：参数按设定执行、对焦落在预定位置、手持 1/30s 可读（每项 5 分制，任一不达标记 3 分以下）","表达 25%：主体可辨、无意外遮挡","规范 15%：参数记录完整、未用后期掩盖操作失误"]}},"M01-K04":{"title":"定焦与变焦取舍","anchor":"是定焦练视角变焦练效率，不是定焦更高级","source":"参考：《新摄影笔记》 · 器材与基本操作（按目录对应）","sections":[{"h":"为什么是这样","p":"定焦强制走位，逼出对距离与透视的感觉，光圈大体积小；变焦覆盖广、应变快。学习期用一支 35 或 50 定焦做一天一镜，实战期用变焦保成功率。没形成视角感之前依赖变焦，构图会停在原地。器材的真实边界由传感器尺寸、镜头光学与机身响应共同决定，而不由参数表上的最大值决定。传感器尺寸决定了同样视角下的景深与高感表现：小底在高 ISO 下暗部先出色噪，大底则能把可用区间再往上推一挡半。焦距改变的不只是取景范围，更是透视关系——广角把近处推远、把纵深夸大，长焦压缩前后景、让背景靠近主体。这些差异在拍摄前就该心里有数，而不是拍完再猜为什么画面不对。"},{"h":"操作路径","p":"今天的练习：一支定焦拍一整天，只用走动改变构图。器材练习的关键是控制变量：同一机位、同一光线、同一被摄体，只换焦距或只换光圈，然后并排看差异。出门前把三件事做完——清空存储卡、确认电池余量、把常用参数存成自定义档位。手持时肘部贴紧躯干、在呼气末按快门；一旦上三脚架，先关掉镜头或机身防抖，否则防抖在稳定环境下反而引入微抖。收工后回到同一菜单把参数复位，避免下一次带着上一场的设定出门。"},{"h":"边界与代价","p":"典型翻车：全程变焦，最后不知道自己站在哪。器材从来不在瓶颈的前三位。预算优先投给能常带出门的那支镜头，而不是参数更漂亮却常年躺在包里的那支。别拿升级器材替代基本功：换机身治不好测光判断错误、构图无序和快门时机滞后。也要警惕参数洁癖——为追极致锐度把光圈收到 f/16，衍射反而让画面发软；为追虚化全开光圈，结果主体边缘薄得像纸。设备的价值在于它被带出去多少次，而不是它标称多少像素。"},{"h":"怎么判断到位","p":"今天的判据：是定焦练视角变焦练效率，不是定焦更高级。先问：这套参数是我决定的，还是相机的自动档替我决定的？再问：同一场景换一挡光圈或一挡焦距，画面差异我能提前预判吗？最后问：所有设备状态（电量、存储、防抖、色彩设置）我都确认过了吗？三问都能答清，才算真的掌握了器材。"}],"points":["是定焦练视角变焦练效率，不是定焦更高级","今天只验证这一个变量：能说出自己当前阶段该用哪种"],"pitfalls":["全程变焦，最后不知道自己站在哪"],"quiz":[{"q":"「定焦与变焦取舍」的判断要点是什么？先说结论再谈理由。","a":"是定焦练视角变焦练效率，不是定焦更高级","why":"定焦强制走位，逼出对距离与透视的感觉，光圈大体积小"},{"q":"有人说：全程变焦，最后不知道自己站在哪。这样对吗？","a":"不对。是定焦练视角变焦练效率，不是定焦更高级","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"一支定焦拍一整天，只用走动改变构图｜相机：光圈优先、f/5.6、ISO 自动上限 3200、单点对焦；手机：专业模式锁定 ISO 与对焦","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：参数按设定执行、对焦落在预定位置、手持 1/30s 可读（每项 5 分制，任一不达标记 3 分以下）","表达 25%：主体可辨、无意外遮挡","规范 15%：参数记录完整、未用后期掩盖操作失误"]}},"M01-K05":{"title":"对焦模式选择","anchor":"是静态用单次动态用连续，不是一直用连续","source":"参考：《新摄影笔记》 · 器材与基本操作（按目录对应）","sections":[{"h":"为什么是这样","p":"单次对焦合焦即锁定，适合静物、风光、摆拍；连续对焦持续追焦，适合运动、走动、宠物。混合场景用单次锁焦再构图往往比让机器猜更稳。合焦提示音不可靠，要看合焦框并放大回放。器材的真实边界由传感器尺寸、镜头光学与机身响应共同决定，而不由参数表上的最大值决定。传感器尺寸决定了同样视角下的景深与高感表现：小底在高 ISO 下暗部先出色噪，大底则能把可用区间再往上推一挡半。焦距改变的不只是取景范围，更是透视关系——广角把近处推远、把纵深夸大，长焦压缩前后景、让背景靠近主体。这些差异在拍摄前就该心里有数，而不是拍完再猜为什么画面不对。"},{"h":"操作路径","p":"今天的练习：分别用单次与连续对焦拍走动的人，统计废片率。器材练习的关键是控制变量：同一机位、同一光线、同一被摄体，只换焦距或只换光圈，然后并排看差异。出门前把三件事做完——清空存储卡、确认电池余量、把常用参数存成自定义档位。手持时肘部贴紧躯干、在呼气末按快门；一旦上三脚架，先关掉镜头或机身防抖，否则防抖在稳定环境下反而引入微抖。收工后回到同一菜单把参数复位，避免下一次带着上一场的设定出门。"},{"h":"边界与代价","p":"典型翻车：拍静物用连续对焦，焦点来回抽。器材从来不在瓶颈的前三位。预算优先投给能常带出门的那支镜头，而不是参数更漂亮却常年躺在包里的那支。别拿升级器材替代基本功：换机身治不好测光判断错误、构图无序和快门时机滞后。也要警惕参数洁癖——为追极致锐度把光圈收到 f/16，衍射反而让画面发软；为追虚化全开光圈，结果主体边缘薄得像纸。设备的价值在于它被带出去多少次，而不是它标称多少像素。"},{"h":"怎么判断到位","p":"今天的判据：是静态用单次动态用连续，不是一直用连续。先问：这套参数是我决定的，还是相机的自动档替我决定的？再问：同一场景换一挡光圈或一挡焦距，画面差异我能提前预判吗？最后问：所有设备状态（电量、存储、防抖、色彩设置）我都确认过了吗？三问都能答清，才算真的掌握了器材。"}],"points":["是静态用单次动态用连续，不是一直用连续","今天只验证这一个变量：能按动与静主体选对焦模式"],"pitfalls":["拍静物用连续对焦，焦点来回抽"],"quiz":[{"q":"「对焦模式选择」的判断要点是什么？先说结论再谈理由。","a":"是静态用单次动态用连续，不是一直用连续","why":"单次对焦合焦即锁定，适合静物、风光、摆拍"},{"q":"有人说：拍静物用连续对焦，焦点来回抽。这样对吗？","a":"不对。是静态用单次动态用连续，不是一直用连续","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"分别用单次与连续对焦拍走动的人，统计废片率｜相机：光圈优先、f/5.6、ISO 自动上限 3200、单点对焦；手机：专业模式锁定 ISO 与对焦","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：参数按设定执行、对焦落在预定位置、手持 1/30s 可读（每项 5 分制，任一不达标记 3 分以下）","表达 25%：主体可辨、无意外遮挡","规范 15%：参数记录完整、未用后期掩盖操作失误"]}},"M01-K06":{"title":"对焦点选择与人眼识别","anchor":"是对焦点跟着主体走，不是中心对焦再构图","source":"参考：《新摄影笔记》 · 器材与基本操作（按目录对应）","sections":[{"h":"为什么是这样","p":"浅景深下中心对焦再平移，会因余弦误差让焦点前后偏移，f1.4 近距离尤其明显。正确做法是把对焦点直接移到主体眼睛；现代机型用眼部识别更稳。对焦区域要小于主体，别把整片背景交给相机猜。器材的真实边界由传感器尺寸、镜头光学与机身响应共同决定，而不由参数表上的最大值决定。传感器尺寸决定了同样视角下的景深与高感表现：小底在高 ISO 下暗部先出色噪，大底则能把可用区间再往上推一挡半。焦距改变的不只是取景范围，更是透视关系——广角把近处推远、把纵深夸大，长焦压缩前后景、让背景靠近主体。这些差异在拍摄前就该心里有数，而不是拍完再猜为什么画面不对。"},{"h":"操作路径","p":"今天的练习：用单点对焦把焦点放在画面边缘主体上，对比中心对焦再构图。器材练习的关键是控制变量：同一机位、同一光线、同一被摄体，只换焦距或只换光圈，然后并排看差异。出门前把三件事做完——清空存储卡、确认电池余量、把常用参数存成自定义档位。手持时肘部贴紧躯干、在呼气末按快门；一旦上三脚架，先关掉镜头或机身防抖，否则防抖在稳定环境下反而引入微抖。收工后回到同一菜单把参数复位，避免下一次带着上一场的设定出门。"},{"h":"边界与代价","p":"典型翻车：大光圈中心对焦后半按平移，焦点后移到耳朵。器材从来不在瓶颈的前三位。预算优先投给能常带出门的那支镜头，而不是参数更漂亮却常年躺在包里的那支。别拿升级器材替代基本功：换机身治不好测光判断错误、构图无序和快门时机滞后。也要警惕参数洁癖——为追极致锐度把光圈收到 f/16，衍射反而让画面发软；为追虚化全开光圈，结果主体边缘薄得像纸。设备的价值在于它被带出去多少次，而不是它标称多少像素。"},{"h":"怎么判断到位","p":"今天的判据：是对焦点跟着主体走，不是中心对焦再构图。先问：这套参数是我决定的，还是相机的自动档替我决定的？再问：同一场景换一挡光圈或一挡焦距，画面差异我能提前预判吗？最后问：所有设备状态（电量、存储、防抖、色彩设置）我都确认过了吗？三问都能答清，才算真的掌握了器材。"}],"points":["是对焦点跟着主体走，不是中心对焦再构图","今天只验证这一个变量：能选对焦点位置并说明理由"],"pitfalls":["大光圈中心对焦后半按平移，焦点后移到耳朵"],"quiz":[{"q":"「对焦点选择与人眼识别」的判断要点是什么？先说结论再谈理由。","a":"是对焦点跟着主体走，不是中心对焦再构图","why":"浅景深下中心对焦再平移，会因余弦误差让焦点前后偏移，f1.4 近距离尤其明显"},{"q":"有人说：大光圈中心对焦后半按平移，焦点后移到耳朵。这样对吗？","a":"不对。是对焦点跟着主体走，不是中心对焦再构图","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"用单点对焦把焦点放在画面边缘主体上，对比中心对焦再构图｜相机：光圈优先、f/5.6、ISO 自动上限 3200、单点对焦；手机：专业模式锁定 ISO 与对焦","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：参数按设定执行、对焦落在预定位置、手持 1/30s 可读（每项 5 分制，任一不达标记 3 分以下）","表达 25%：主体可辨、无意外遮挡","规范 15%：参数记录完整、未用后期掩盖操作失误"]}},"M01-K07":{"title":"快门与机震","anchor":"是安全快门看等效焦距，不是固定 1/60","source":"参考：《新摄影笔记》 · 器材与基本操作（按目录对应）","sections":[{"h":"为什么是这样","p":"经验值是 1 除以等效焦距；有防抖可降 2-3 档但只对静止主体有效。走动的人需 1/250 以上，跑动 1/500 以上。机震只有在放大到 100% 才看得出来，别用缩略图判断清晰度。器材的真实边界由传感器尺寸、镜头光学与机身响应共同决定，而不由参数表上的最大值决定。传感器尺寸决定了同样视角下的景深与高感表现：小底在高 ISO 下暗部先出色噪，大底则能把可用区间再往上推一挡半。焦距改变的不只是取景范围，更是透视关系——广角把近处推远、把纵深夸大，长焦压缩前后景、让背景靠近主体。这些差异在拍摄前就该心里有数，而不是拍完再猜为什么画面不对。"},{"h":"操作路径","p":"今天的练习：用 1/15、1/60、1/250 各拍 5 张手持，放大看糊片率。器材练习的关键是控制变量：同一机位、同一光线、同一被摄体，只换焦距或只换光圈，然后并排看差异。出门前把三件事做完——清空存储卡、确认电池余量、把常用参数存成自定义档位。手持时肘部贴紧躯干、在呼气末按快门；一旦上三脚架，先关掉镜头或机身防抖，否则防抖在稳定环境下反而引入微抖。收工后回到同一菜单把参数复位，避免下一次带着上一场的设定出门。"},{"h":"边界与代价","p":"典型翻车：24mm 用 1/30 以为安全，放大全软。器材从来不在瓶颈的前三位。预算优先投给能常带出门的那支镜头，而不是参数更漂亮却常年躺在包里的那支。别拿升级器材替代基本功：换机身治不好测光判断错误、构图无序和快门时机滞后。也要警惕参数洁癖——为追极致锐度把光圈收到 f/16，衍射反而让画面发软；为追虚化全开光圈，结果主体边缘薄得像纸。设备的价值在于它被带出去多少次，而不是它标称多少像素。"},{"h":"怎么判断到位","p":"今天的判据：是安全快门看等效焦距，不是固定 1/60。先问：这套参数是我决定的，还是相机的自动档替我决定的？再问：同一场景换一挡光圈或一挡焦距，画面差异我能提前预判吗？最后问：所有设备状态（电量、存储、防抖、色彩设置）我都确认过了吗？三问都能答清，才算真的掌握了器材。"}],"points":["是安全快门看等效焦距，不是固定 1/60","今天只验证这一个变量：能算出自己镜头的安全快门"],"pitfalls":["24mm 用 1/30 以为安全，放大全软"],"quiz":[{"q":"「快门与机震」的判断要点是什么？先说结论再谈理由。","a":"是安全快门看等效焦距，不是固定 1/60","why":"经验值是 1 除以等效焦距"},{"q":"有人说：24mm 用 1/30 以为安全，放大全软。这样对吗？","a":"不对。是安全快门看等效焦距，不是固定 1/60","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"用 1/15、1/60、1/250 各拍 5 张手持，放大看糊片率｜相机：光圈优先、f/5.6、ISO 自动上限 3200、单点对焦；手机：专业模式锁定 ISO 与对焦","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：参数按设定执行、对焦落在预定位置、手持 1/30s 可读（每项 5 分制，任一不达标记 3 分以下）","表达 25%：主体可辨、无意外遮挡","规范 15%：参数记录完整、未用后期掩盖操作失误"]}},"M01-K08":{"title":"ISO 与噪点","anchor":"是 ISO 为画质成本，不是亮度补充","source":"参考：《新摄影笔记》 · 器材与基本操作（按目录对应）","sections":[{"h":"为什么是这样","p":"ISO 放大信号也放大噪声，代价是暗部细节、色彩纯度与动态范围。原则是先保证快门与光圈，再让 ISO 兜底；噪点能后期降，糊片救不回。多数现代机身 1600-3200 仍可用，光线差宁可稍高 ISO 也别欠曝，欠曝再提亮噪点更重。曝光是光圈、快门、ISO 三者的等价交换：任何一项变化都必须由另一项补偿，画面亮度才能保持不变。真正要决定的不是「正确亮度」，而是「哪一项优先」——拍人像优先快门安全与景深可控，拍流水优先快门速度，拍星空优先最大进光量。测光表给出的只是把画面平均成中灰的建议值，遇到大面积雪或大面积暗部必然偏移，所以始终要用直方图与高光警告复核，而不是相信背屏在强光下的观感。"},{"h":"操作路径","p":"今天的练习：同场景用 ISO200/1600/6400 各拍一张，比较暗部与色彩。练习时把手动模式当默认：ISO 先固定，按「要凝固还是要拖影」定快门，按「要多厚景深」定光圈，最后看直方图决定是否提 ISO 或补光。每拍一张记录三个参数，事后必须能说出「这一张为什么这么定」。手机端用专业模式锁住 ISO 与对焦，只动曝光补偿，理解补偿值背后的等效关系。养成先看直方图右端、再看左端的顺序——高光溢出不可恢复，暗部通常还有救。同一场景连拍三张，分别正常、减一挡、加一挡，是最快的建立直觉的方式。"},{"h":"边界与代价","p":"典型翻车：怕噪点把 ISO 锁 100，结果快门过慢全糊。最常见的误判是把「亮」当成「对」。高调画面允许溢出、低调画面允许整体偏暗，属于表达选择；但在没有表达意图时让高光糊成一片白，就是失误。另一个代价是噪点与手抖的取舍：为了压低 ISO 把快门拖到 1/15s，手持抖动会把锐度全部吃掉，不如提高 ISO 换稳定。宽容度同样不是无限的，后期硬拉三挡以上，暗部会浮出色噪、色偏和灰雾，画面看着「提亮」了其实已经脏了。"},{"h":"怎么判断到位","p":"今天的判据：是 ISO 为画质成本，不是亮度补充。先问：这三个参数里，哪个是我今天刻意固定的，哪个是让步的？再问：直方图两端有没有不可恢复的截断？最后问：如果重拍一次，我会改哪一个数字、为什么？能答出「改哪个、为什么」，曝光才算从碰运气变成可控。"}],"points":["是 ISO 为画质成本，不是亮度补充","今天只验证这一个变量：能按场景设定 ISO 上限"],"pitfalls":["怕噪点把 ISO 锁 100，结果快门过慢全糊"],"quiz":[{"q":"「ISO 与噪点」的判断要点是什么？先说结论再谈理由。","a":"是 ISO 为画质成本，不是亮度补充","why":"ISO 放大信号也放大噪声，代价是暗部细节、色彩纯度与动态范围"},{"q":"有人说：怕噪点把 ISO 锁 100，结果快门过慢全糊。这样对吗？","a":"不对。是 ISO 为画质成本，不是亮度补充","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"同场景用 ISO200/1600/6400 各拍一张，比较暗部与色彩｜相机：手动模式，ISO 固定，每次只动一个参数；手机：专业模式锁 ISO、动曝光补偿","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：高光无溢出（直方图右端不堆积）、暗部保留细节（每项 5 分制，任一不达标记 3 分以下）","表达 25%：明暗关系服从主体，不是全图平均亮","规范 15%：未靠拉回高光硬救、未过度提亮暗部"]}},"M02-K01":{"title":"曝光量与三要素","anchor":"是曝光量等于光强乘时间，不是参数随便配","source":"参考：《理解曝光》第4版 · 曝光与测光（按目录对应）","sections":[{"h":"为什么是这样","p":"光圈开大一档光强翻倍，快门就要减半；ISO 不改变进光只放大信号。等价曝光只保证亮度一致，景深、运动模糊、噪点完全不同，这正是选择的意义。先定不能牺牲的那个：人像定光圈、运动定快门、手持定安全快门。曝光判断的本质是哪一部分必须保住。保高光就压曝光，保暗部就提曝光，两者不可兼得时按表达取舍——高调片保高光、低调片保暗部。评价测光是把画面分块加权，遇到强逆光或大面积亮背景会误判，此时切点测光对主体测光更可靠。理解这一点，就不会总抱怨相机测光不准，而是知道什么时候该接管判断。"},{"h":"操作路径","p":"今天的练习：固定场景拍 f2.8-1/500、f5.6-1/125、f11-1/30 三张并记录。先用光圈优先拍一组并记录相机给的快门，再切手动用同一组参数回拍，比较两者差异，这是建立参数直觉最快的方法。逆光时先对主体点测光，再减 0.7 挡保住高光边缘。雪景加一挡、大面积深色减一挡，这两条只作起点，最终仍以直方图为准。拍完立刻看直方图右端贴不贴边，贴边就减，不贴边就保。"},{"h":"边界与代价","p":"典型翻车：以为等价曝光画面就一样。宽容度不是无限的，而且不同机身差异很大。同一场景用两种曝光各拍一张，后期各拉一挡对比，就能摸清自己机身的真实余量。另一个边界是场景动态：人的动作、水流形态、云的位置都在变，参数一旦为了画质牺牲快门，就会同时牺牲内容。宁可噪一点，不要糊一片。"},{"h":"怎么判断到位","p":"今天的判据：是曝光量等于光强乘时间，不是参数随便配。自检三问：我保的是高光还是暗部，为什么？测光方式是相机替我选的还是我选的？机身余量我心里有数吗？"}],"points":["是曝光量等于光强乘时间，不是参数随便配","今天只验证这一个变量：能对同一场景给出三组等价曝光并说明取舍"],"pitfalls":["以为等价曝光画面就一样"],"quiz":[{"q":"「曝光量与三要素」的判断要点是什么？先说结论再谈理由。","a":"是曝光量等于光强乘时间，不是参数随便配","why":"光圈开大一档光强翻倍，快门就要减半"},{"q":"有人说：以为等价曝光画面就一样。这样对吗？","a":"不对。是曝光量等于光强乘时间，不是参数随便配","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"固定场景拍 f2.8-1/500、f5.6-1/125、f11-1/30 三张并记录｜相机：手动模式，ISO 固定，每次只动一个参数；手机：专业模式锁 ISO、动曝光补偿","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：高光无溢出（直方图右端不堆积）、暗部保留细节（每项 5 分制，任一不达标记 3 分以下）","表达 25%：明暗关系服从主体，不是全图平均亮","规范 15%：未靠拉回高光硬救、未过度提亮暗部"]}},"M02-K02":{"title":"互易关系与档位口算","anchor":"是一档换三项各一档，不是随便加减","source":"参考：《理解曝光》第4版 · 曝光与测光（按目录对应）","sections":[{"h":"为什么是这样","p":"标准档位：光圈 1.4-2-2.8-4-5.6-8-11-16；快门 1/1000 到 1/15 逐档减半；ISO 100-200-400-800。相邻各差一档。相机可设三分之一档步进，此时三格为一档。口算熟练后现场就能预判而不必试拍。曝光判断的本质是哪一部分必须保住。保高光就压曝光，保暗部就提曝光，两者不可兼得时按表达取舍——高调片保高光、低调片保暗部。评价测光是把画面分块加权，遇到强逆光或大面积亮背景会误判，此时切点测光对主体测光更可靠。理解这一点，就不会总抱怨相机测光不准，而是知道什么时候该接管判断。"},{"h":"操作路径","p":"今天的练习：把 f4-1/125-ISO200 换成五种等价组合并实拍验证。先用光圈优先拍一组并记录相机给的快门，再切手动用同一组参数回拍，比较两者差异，这是建立参数直觉最快的方法。逆光时先对主体点测光，再减 0.7 挡保住高光边缘。雪景加一挡、大面积深色减一挡，这两条只作起点，最终仍以直方图为准。拍完立刻看直方图右端贴不贴边，贴边就减，不贴边就保。"},{"h":"边界与代价","p":"典型翻车：把一档算成半档，三张亮度差一档。宽容度不是无限的，而且不同机身差异很大。同一场景用两种曝光各拍一张，后期各拉一挡对比，就能摸清自己机身的真实余量。另一个边界是场景动态：人的动作、水流形态、云的位置都在变，参数一旦为了画质牺牲快门，就会同时牺牲内容。宁可噪一点，不要糊一片。"},{"h":"怎么判断到位","p":"今天的判据：是一档换三项各一档，不是随便加减。自检三问：我保的是高光还是暗部，为什么？测光方式是相机替我选的还是我选的？机身余量我心里有数吗？"}],"points":["是一档换三项各一档，不是随便加减","今天只验证这一个变量：能在一秒内完成一档互换的口算"],"pitfalls":["把一档算成半档，三张亮度差一档"],"quiz":[{"q":"「互易关系与档位口算」的判断要点是什么？先说结论再谈理由。","a":"是一档换三项各一档，不是随便加减","why":"标准档位：光圈 1.4-2-2.8-4-5.6-8-11-16"},{"q":"有人说：把一档算成半档，三张亮度差一档。这样对吗？","a":"不对。是一档换三项各一档，不是随便加减","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"把 f4-1/125-ISO200 换成五种等价组合并实拍验证｜相机：手动模式，ISO 固定，每次只动一个参数；手机：专业模式锁 ISO、动曝光补偿","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：高光无溢出（直方图右端不堆积）、暗部保留细节（每项 5 分制，任一不达标记 3 分以下）","表达 25%：明暗关系服从主体，不是全图平均亮","规范 15%：未靠拉回高光硬救、未过度提亮暗部"]}},"M02-K03":{"title":"曝光补偿与步进","anchor":"是以三分之一档为步进，不是整数跳","source":"参考：《理解曝光》第4版 · 曝光与测光（按目录对应）","sections":[{"h":"为什么是这样","p":"机身 EV 标尺一格常为三分之一档，三格为一档即亮度翻倍。逆光人像常需 +0.7 到 +1.3，雪景需 +1 到 +2，深色主体需 -0.7 左右。步进设三分之一便于微调；需要大改时按住加减键转主拨盘。曝光是光圈、快门、ISO 三者的等价交换：任何一项变化都必须由另一项补偿，画面亮度才能保持不变。真正要决定的不是「正确亮度」，而是「哪一项优先」——拍人像优先快门安全与景深可控，拍流水优先快门速度，拍星空优先最大进光量。测光表给出的只是把画面平均成中灰的建议值，遇到大面积雪或大面积暗部必然偏移，所以始终要用直方图与高光警告复核，而不是相信背屏在强光下的观感。"},{"h":"操作路径","p":"今天的练习：把步进改成三分之一档，用 +0.3 与 +0.7 各拍一张。练习时把手动模式当默认：ISO 先固定，按「要凝固还是要拖影」定快门，按「要多厚景深」定光圈，最后看直方图决定是否提 ISO 或补光。每拍一张记录三个参数，事后必须能说出「这一张为什么这么定」。手机端用专业模式锁住 ISO 与对焦，只动曝光补偿，理解补偿值背后的等效关系。养成先看直方图右端、再看左端的顺序——高光溢出不可恢复，暗部通常还有救。同一场景连拍三张，分别正常、减一挡、加一挡，是最快的建立直觉的方式。"},{"h":"边界与代价","p":"典型翻车：以为 +1 和 +0.3 差不多。最常见的误判是把「亮」当成「对」。高调画面允许溢出、低调画面允许整体偏暗，属于表达选择；但在没有表达意图时让高光糊成一片白，就是失误。另一个代价是噪点与手抖的取舍：为了压低 ISO 把快门拖到 1/15s，手持抖动会把锐度全部吃掉，不如提高 ISO 换稳定。宽容度同样不是无限的，后期硬拉三挡以上，暗部会浮出色噪、色偏和灰雾，画面看着「提亮」了其实已经脏了。"},{"h":"怎么判断到位","p":"今天的判据：是以三分之一档为步进，不是整数跳。先问：这三个参数里，哪个是我今天刻意固定的，哪个是让步的？再问：直方图两端有没有不可恢复的截断？最后问：如果重拍一次，我会改哪一个数字、为什么？能答出「改哪个、为什么」，曝光才算从碰运气变成可控。"}],"points":["是以三分之一档为步进，不是整数跳","今天只验证这一个变量：能看懂机身正负三档标尺"],"pitfalls":["以为 +1 和 +0.3 差不多"],"quiz":[{"q":"「曝光补偿与步进」的判断要点是什么？先说结论再谈理由。","a":"是以三分之一档为步进，不是整数跳","why":"机身 EV 标尺一格常为三分之一档，三格为一档即亮度翻倍"},{"q":"有人说：以为 +1 和 +0.3 差不多。这样对吗？","a":"不对。是以三分之一档为步进，不是整数跳","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"把步进改成三分之一档，用 +0.3 与 +0.7 各拍一张｜相机：手动模式，ISO 固定，每次只动一个参数；手机：专业模式锁 ISO、动曝光补偿","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：高光无溢出（直方图右端不堆积）、暗部保留细节（每项 5 分制，任一不达标记 3 分以下）","表达 25%：明暗关系服从主体，不是全图平均亮","规范 15%：未靠拉回高光硬救、未过度提亮暗部"]}},"M02-K04":{"title":"测光模式","anchor":"是点测光测主体评价测光测平均","source":"参考：《理解曝光》第4版 · 曝光与测光（按目录对应）","sections":[{"h":"为什么是这样","p":"评价测光按全画面加权并参考场景库，适合光线均匀；中央重点偏重中心；点测光只读测光点附近百分之几的区域，适合逆光、舞台、雪地强反差场景。点测光的难点是测哪里：要测主体，并知道它比中灰亮还是暗。曝光是光圈、快门、ISO 三者的等价交换：任何一项变化都必须由另一项补偿，画面亮度才能保持不变。真正要决定的不是「正确亮度」，而是「哪一项优先」——拍人像优先快门安全与景深可控，拍流水优先快门速度，拍星空优先最大进光量。测光表给出的只是把画面平均成中灰的建议值，遇到大面积雪或大面积暗部必然偏移，所以始终要用直方图与高光警告复核，而不是相信背屏在强光下的观感。"},{"h":"操作路径","p":"今天的练习：逆光人脸分别用评价与点测光各拍一张比较。练习时把手动模式当默认：ISO 先固定，按「要凝固还是要拖影」定快门，按「要多厚景深」定光圈，最后看直方图决定是否提 ISO 或补光。每拍一张记录三个参数，事后必须能说出「这一张为什么这么定」。手机端用专业模式锁住 ISO 与对焦，只动曝光补偿，理解补偿值背后的等效关系。养成先看直方图右端、再看左端的顺序——高光溢出不可恢复，暗部通常还有救。同一场景连拍三张，分别正常、减一挡、加一挡，是最快的建立直觉的方式。"},{"h":"边界与代价","p":"典型翻车：逆光用评价测光，人黑背景白。最常见的误判是把「亮」当成「对」。高调画面允许溢出、低调画面允许整体偏暗，属于表达选择；但在没有表达意图时让高光糊成一片白，就是失误。另一个代价是噪点与手抖的取舍：为了压低 ISO 把快门拖到 1/15s，手持抖动会把锐度全部吃掉，不如提高 ISO 换稳定。宽容度同样不是无限的，后期硬拉三挡以上，暗部会浮出色噪、色偏和灰雾，画面看着「提亮」了其实已经脏了。"},{"h":"怎么判断到位","p":"今天的判据：是点测光测主体评价测光测平均。先问：这三个参数里，哪个是我今天刻意固定的，哪个是让步的？再问：直方图两端有没有不可恢复的截断？最后问：如果重拍一次，我会改哪一个数字、为什么？能答出「改哪个、为什么」，曝光才算从碰运气变成可控。"}],"points":["是点测光测主体评价测光测平均","今天只验证这一个变量：能按主体占画面比例选测光模式"],"pitfalls":["逆光用评价测光，人黑背景白"],"quiz":[{"q":"「测光模式」的判断要点是什么？先说结论再谈理由。","a":"是点测光测主体评价测光测平均","why":"评价测光按全画面加权并参考场景库，适合光线均匀"},{"q":"有人说：逆光用评价测光，人黑背景白。这样对吗？","a":"不对。是点测光测主体评价测光测平均","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"逆光人脸分别用评价与点测光各拍一张比较｜相机：手动模式，ISO 固定，每次只动一个参数；手机：专业模式锁 ISO、动曝光补偿","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：高光无溢出（直方图右端不堆积）、暗部保留细节（每项 5 分制，任一不达标记 3 分以下）","表达 25%：明暗关系服从主体，不是全图平均亮","规范 15%：未靠拉回高光硬救、未过度提亮暗部"]}},"M02-K05":{"title":"中灰与反射率误判","anchor":"是相机把测光区还原成中灰，不是还原成原色","source":"参考：《理解曝光》第4版 · 曝光与测光（按目录对应）","sections":[{"h":"为什么是这样","p":"反射式测光的目标是把测光区还原为百分之十八中灰。白墙反射率高，相机会压暗拍成灰；黑衣反射率低，相机会提亮拍成灰。修正就是曝光补偿：白加黑减。懂原理后不必背场景，直接判断这块比中灰亮还是暗。曝光是光圈、快门、ISO 三者的等价交换：任何一项变化都必须由另一项补偿，画面亮度才能保持不变。真正要决定的不是「正确亮度」，而是「哪一项优先」——拍人像优先快门安全与景深可控，拍流水优先快门速度，拍星空优先最大进光量。测光表给出的只是把画面平均成中灰的建议值，遇到大面积雪或大面积暗部必然偏移，所以始终要用直方图与高光警告复核，而不是相信背屏在强光下的观感。"},{"h":"操作路径","p":"今天的练习：对白墙与黑衣服各用点测光拍一张，看偏灰方向。练习时把手动模式当默认：ISO 先固定，按「要凝固还是要拖影」定快门，按「要多厚景深」定光圈，最后看直方图决定是否提 ISO 或补光。每拍一张记录三个参数，事后必须能说出「这一张为什么这么定」。手机端用专业模式锁住 ISO 与对焦，只动曝光补偿，理解补偿值背后的等效关系。养成先看直方图右端、再看左端的顺序——高光溢出不可恢复，暗部通常还有救。同一场景连拍三张，分别正常、减一挡、加一挡，是最快的建立直觉的方式。"},{"h":"边界与代价","p":"典型翻车：拍雪景发灰，拍黑猫发亮。最常见的误判是把「亮」当成「对」。高调画面允许溢出、低调画面允许整体偏暗，属于表达选择；但在没有表达意图时让高光糊成一片白，就是失误。另一个代价是噪点与手抖的取舍：为了压低 ISO 把快门拖到 1/15s，手持抖动会把锐度全部吃掉，不如提高 ISO 换稳定。宽容度同样不是无限的，后期硬拉三挡以上，暗部会浮出色噪、色偏和灰雾，画面看着「提亮」了其实已经脏了。"},{"h":"怎么判断到位","p":"今天的判据：是相机把测光区还原成中灰，不是还原成原色。先问：这三个参数里，哪个是我今天刻意固定的，哪个是让步的？再问：直方图两端有没有不可恢复的截断？最后问：如果重拍一次，我会改哪一个数字、为什么？能答出「改哪个、为什么」，曝光才算从碰运气变成可控。"}],"points":["是相机把测光区还原成中灰，不是还原成原色","今天只验证这一个变量：能预判测光对白与黑主体的偏差方向"],"pitfalls":["拍雪景发灰，拍黑猫发亮"],"quiz":[{"q":"「中灰与反射率误判」的判断要点是什么？先说结论再谈理由。","a":"是相机把测光区还原成中灰，不是还原成原色","why":"反射式测光的目标是把测光区还原为百分之十八中灰"},{"q":"有人说：拍雪景发灰，拍黑猫发亮。这样对吗？","a":"不对。是相机把测光区还原成中灰，不是还原成原色","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"对白墙与黑衣服各用点测光拍一张，看偏灰方向｜相机：手动模式，ISO 固定，每次只动一个参数；手机：专业模式锁 ISO、动曝光补偿","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：高光无溢出（直方图右端不堆积）、暗部保留细节（每项 5 分制，任一不达标记 3 分以下）","表达 25%：明暗关系服从主体，不是全图平均亮","规范 15%：未靠拉回高光硬救、未过度提亮暗部"]}},"M02-K06":{"title":"直方图判读","anchor":"是看两端堆积不看形状美丑","source":"参考：《理解曝光》第4版 · 曝光与测光（按目录对应）","sections":[{"h":"为什么是这样","p":"横轴是亮度 0 到 255，纵轴是像素数量。右端贴壁表示高光溢出，左端贴壁表示暗部死黑。形状由场景决定：雪景本就偏右、夜景偏左，不必追求中间隆起。只看重要区域有没有触壁：云层、白纱、皮肤高光最容易丢。曝光是光圈、快门、ISO 三者的等价交换：任何一项变化都必须由另一项补偿，画面亮度才能保持不变。真正要决定的不是「正确亮度」，而是「哪一项优先」——拍人像优先快门安全与景深可控，拍流水优先快门速度，拍星空优先最大进光量。测光表给出的只是把画面平均成中灰的建议值，遇到大面积雪或大面积暗部必然偏移，所以始终要用直方图与高光警告复核，而不是相信背屏在强光下的观感。"},{"h":"操作路径","p":"今天的练习：拍欠曝、正常、过曝三张，对比直方图左右端。练习时把手动模式当默认：ISO 先固定，按「要凝固还是要拖影」定快门，按「要多厚景深」定光圈，最后看直方图决定是否提 ISO 或补光。每拍一张记录三个参数，事后必须能说出「这一张为什么这么定」。手机端用专业模式锁住 ISO 与对焦，只动曝光补偿，理解补偿值背后的等效关系。养成先看直方图右端、再看左端的顺序——高光溢出不可恢复，暗部通常还有救。同一场景连拍三张，分别正常、减一挡、加一挡，是最快的建立直觉的方式。"},{"h":"边界与代价","p":"典型翻车：只看屏幕亮度判断曝光。最常见的误判是把「亮」当成「对」。高调画面允许溢出、低调画面允许整体偏暗，属于表达选择；但在没有表达意图时让高光糊成一片白，就是失误。另一个代价是噪点与手抖的取舍：为了压低 ISO 把快门拖到 1/15s，手持抖动会把锐度全部吃掉，不如提高 ISO 换稳定。宽容度同样不是无限的，后期硬拉三挡以上，暗部会浮出色噪、色偏和灰雾，画面看着「提亮」了其实已经脏了。"},{"h":"怎么判断到位","p":"今天的判据：是看两端堆积不看形状美丑。先问：这三个参数里，哪个是我今天刻意固定的，哪个是让步的？再问：直方图两端有没有不可恢复的截断？最后问：如果重拍一次，我会改哪一个数字、为什么？能答出「改哪个、为什么」，曝光才算从碰运气变成可控。"}],"points":["是看两端堆积不看形状美丑","今天只验证这一个变量：能从直方图判断过曝欠曝与对比"],"pitfalls":["只看屏幕亮度判断曝光"],"quiz":[{"q":"「直方图判读」的判断要点是什么？先说结论再谈理由。","a":"是看两端堆积不看形状美丑","why":"横轴是亮度 0 到 255，纵轴是像素数量"},{"q":"有人说：只看屏幕亮度判断曝光。这样对吗？","a":"不对。是看两端堆积不看形状美丑","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"拍欠曝、正常、过曝三张，对比直方图左右端｜相机：手动模式，ISO 固定，每次只动一个参数；手机：专业模式锁 ISO、动曝光补偿","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：高光无溢出（直方图右端不堆积）、暗部保留细节（每项 5 分制，任一不达标记 3 分以下）","表达 25%：明暗关系服从主体，不是全图平均亮","规范 15%：未靠拉回高光硬救、未过度提亮暗部"]}},"M02-K07":{"title":"高光警告与不可逆过曝","anchor":"是高光溢出无法恢复，不是都能拉回","source":"参考：《理解曝光》第4版 · 曝光与测光（按目录对应）","sections":[{"h":"为什么是这样","p":"传感器过曝到最大值后没有信息，后期拉回只会得到一片无细节的灰白。RAW 一般能救回 1 到 1.5 档高光，暗部能提 3 到 5 档但噪点上升。原则是宁可暗部欠一点，也别让天空或白纱死白。高光警告比看直方图更直观。曝光判断的本质是哪一部分必须保住。保高光就压曝光，保暗部就提曝光，两者不可兼得时按表达取舍——高调片保高光、低调片保暗部。评价测光是把画面分块加权，遇到强逆光或大面积亮背景会误判，此时切点测光对主体测光更可靠。理解这一点，就不会总抱怨相机测光不准，而是知道什么时候该接管判断。"},{"h":"操作路径","p":"今天的练习：开高光警告拍逆光，从 -1EV 到 +1EV 各拍一张看闪烁范围。先用光圈优先拍一组并记录相机给的快门，再切手动用同一组参数回拍，比较两者差异，这是建立参数直觉最快的方法。逆光时先对主体点测光，再减 0.7 挡保住高光边缘。雪景加一挡、大面积深色减一挡，这两条只作起点，最终仍以直方图为准。拍完立刻看直方图右端贴不贴边，贴边就减，不贴边就保。"},{"h":"边界与代价","p":"典型翻车：以为 RAW 什么都能救。宽容度不是无限的，而且不同机身差异很大。同一场景用两种曝光各拍一张，后期各拉一挡对比，就能摸清自己机身的真实余量。另一个边界是场景动态：人的动作、水流形态、云的位置都在变，参数一旦为了画质牺牲快门，就会同时牺牲内容。宁可噪一点，不要糊一片。"},{"h":"怎么判断到位","p":"今天的判据：是高光溢出无法恢复，不是都能拉回。自检三问：我保的是高光还是暗部，为什么？测光方式是相机替我选的还是我选的？机身余量我心里有数吗？"}],"points":["是高光溢出无法恢复，不是都能拉回","今天只验证这一个变量：能开启高光警告并据此调整"],"pitfalls":["以为 RAW 什么都能救"],"quiz":[{"q":"「高光警告与不可逆过曝」的判断要点是什么？先说结论再谈理由。","a":"是高光溢出无法恢复，不是都能拉回","why":"传感器过曝到最大值后没有信息，后期拉回只会得到一片无细节的灰白"},{"q":"有人说：以为 RAW 什么都能救。这样对吗？","a":"不对。是高光溢出无法恢复，不是都能拉回","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"开高光警告拍逆光，从 -1EV 到 +1EV 各拍一张看闪烁范围｜相机：手动模式，ISO 固定，每次只动一个参数；手机：专业模式锁 ISO、动曝光补偿","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：高光无溢出（直方图右端不堆积）、暗部保留细节（每项 5 分制，任一不达标记 3 分以下）","表达 25%：明暗关系服从主体，不是全图平均亮","规范 15%：未靠拉回高光硬救、未过度提亮暗部"]}},"M02-K08":{"title":"曝光补偿的加减","anchor":"是白加黑减，不是固定归零","source":"参考：《理解曝光》第4版 · 曝光与测光（按目录对应）","sections":[{"h":"为什么是这样","p":"白加黑减源于测光表把一切当中灰。经验值：雪景 +1 到 +2，白纱 +0.7 到 +1.3，深色皮肤 -0.3 到 -0.7，黑衣服约 -1，逆光人像 +1 以上。用实时取景加直方图验证比记数字可靠，手机专业模式同样有 EV 滑杆。曝光判断的本质是哪一部分必须保住。保高光就压曝光，保暗部就提曝光，两者不可兼得时按表达取舍——高调片保高光、低调片保暗部。评价测光是把画面分块加权，遇到强逆光或大面积亮背景会误判，此时切点测光对主体测光更可靠。理解这一点，就不会总抱怨相机测光不准，而是知道什么时候该接管判断。"},{"h":"操作路径","p":"今天的练习：拍白墙、灰卡、黑衣各三张，用 +1、0、-1 找出正确档。先用光圈优先拍一组并记录相机给的快门，再切手动用同一组参数回拍，比较两者差异，这是建立参数直觉最快的方法。逆光时先对主体点测光，再减 0.7 挡保住高光边缘。雪景加一挡、大面积深色减一挡，这两条只作起点，最终仍以直方图为准。拍完立刻看直方图右端贴不贴边，贴边就减，不贴边就保。"},{"h":"边界与代价","p":"典型翻车：全程零补偿，白场景发灰黑场景发亮。宽容度不是无限的，而且不同机身差异很大。同一场景用两种曝光各拍一张，后期各拉一挡对比，就能摸清自己机身的真实余量。另一个边界是场景动态：人的动作、水流形态、云的位置都在变，参数一旦为了画质牺牲快门，就会同时牺牲内容。宁可噪一点，不要糊一片。"},{"h":"怎么判断到位","p":"今天的判据：是白加黑减，不是固定归零。自检三问：我保的是高光还是暗部，为什么？测光方式是相机替我选的还是我选的？机身余量我心里有数吗？"}],"points":["是白加黑减，不是固定归零","今天只验证这一个变量：能按主体明暗正确加减补偿"],"pitfalls":["全程零补偿，白场景发灰黑场景发亮"],"quiz":[{"q":"「曝光补偿的加减」的判断要点是什么？先说结论再谈理由。","a":"是白加黑减，不是固定归零","why":"白加黑减源于测光表把一切当中灰"},{"q":"有人说：全程零补偿，白场景发灰黑场景发亮。这样对吗？","a":"不对。是白加黑减，不是固定归零","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"拍白墙、灰卡、黑衣各三张，用 +1、0、-1 找出正确档｜相机：手动模式，ISO 固定，每次只动一个参数；手机：专业模式锁 ISO、动曝光补偿","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：高光无溢出（直方图右端不堆积）、暗部保留细节（每项 5 分制，任一不达标记 3 分以下）","表达 25%：明暗关系服从主体，不是全图平均亮","规范 15%：未靠拉回高光硬救、未过度提亮暗部"]}},"M02-K09":{"title":"宽容度与动态范围","anchor":"是动态范围有上限，不是所有光比都能一次拍下","source":"参考：《理解曝光》第4版 · 曝光与测光（按目录对应）","sections":[{"h":"为什么是这样","p":"动态范围是同时记录最亮与最暗的能力，全幅约 13-14 档、APS-C 约 12-13 档、手机多帧合成更高但可能有合成痕迹。室内外光比常超十档，超出就要取舍：保高光让室内偏暗后期提，或保暗部让窗外死白，或用包围合成与补光。曝光是光圈、快门、ISO 三者的等价交换：任何一项变化都必须由另一项补偿，画面亮度才能保持不变。真正要决定的不是「正确亮度」，而是「哪一项优先」——拍人像优先快门安全与景深可控，拍流水优先快门速度，拍星空优先最大进光量。测光表给出的只是把画面平均成中灰的建议值，遇到大面积雪或大面积暗部必然偏移，所以始终要用直方图与高光警告复核，而不是相信背屏在强光下的观感。"},{"h":"操作路径","p":"今天的练习：拍正午窗内外，看窗外是否死白室内是否死黑。练习时把手动模式当默认：ISO 先固定，按「要凝固还是要拖影」定快门，按「要多厚景深」定光圈，最后看直方图决定是否提 ISO 或补光。每拍一张记录三个参数，事后必须能说出「这一张为什么这么定」。手机端用专业模式锁住 ISO 与对焦，只动曝光补偿，理解补偿值背后的等效关系。养成先看直方图右端、再看左端的顺序——高光溢出不可恢复，暗部通常还有救。同一场景连拍三张，分别正常、减一挡、加一挡，是最快的建立直觉的方式。"},{"h":"边界与代价","p":"典型翻车：硬拍强光比场景，后期两头都救不回。最常见的误判是把「亮」当成「对」。高调画面允许溢出、低调画面允许整体偏暗，属于表达选择；但在没有表达意图时让高光糊成一片白，就是失误。另一个代价是噪点与手抖的取舍：为了压低 ISO 把快门拖到 1/15s，手持抖动会把锐度全部吃掉，不如提高 ISO 换稳定。宽容度同样不是无限的，后期硬拉三挡以上，暗部会浮出色噪、色偏和灰雾，画面看着「提亮」了其实已经脏了。"},{"h":"怎么判断到位","p":"今天的判据：是动态范围有上限，不是所有光比都能一次拍下。先问：这三个参数里，哪个是我今天刻意固定的，哪个是让步的？再问：直方图两端有没有不可恢复的截断？最后问：如果重拍一次，我会改哪一个数字、为什么？能答出「改哪个、为什么」，曝光才算从碰运气变成可控。"}],"points":["是动态范围有上限，不是所有光比都能一次拍下","今天只验证这一个变量：能判断场景是否超出设备能力"],"pitfalls":["硬拍强光比场景，后期两头都救不回"],"quiz":[{"q":"「宽容度与动态范围」的判断要点是什么？先说结论再谈理由。","a":"是动态范围有上限，不是所有光比都能一次拍下","why":"动态范围是同时记录最亮与最暗的能力，全幅约 13-14 档、APS-C 约 12-13 档、手机多帧合成更高但可能有合成痕迹"},{"q":"有人说：硬拍强光比场景，后期两头都救不回。这样对吗？","a":"不对。是动态范围有上限，不是所有光比都能一次拍下","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"拍正午窗内外，看窗外是否死白室内是否死黑｜相机：手动模式，ISO 固定，每次只动一个参数；手机：专业模式锁 ISO、动曝光补偿","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：高光无溢出（直方图右端不堆积）、暗部保留细节（每项 5 分制，任一不达标记 3 分以下）","表达 25%：明暗关系服从主体，不是全图平均亮","规范 15%：未靠拉回高光硬救、未过度提亮暗部"]}},"M02-K10":{"title":"夜景曝光与噪点控制","anchor":"是上架降 ISO 拉长曝光，不是硬提 ISO","source":"参考：《理解曝光》第4版 · 曝光与测光（按目录对应）","sections":[{"h":"为什么是这样","p":"夜景优先上三脚架：低 ISO 加长曝光可获得干净画面与灯光拖影。手持时用安全快门加可接受 ISO，宁欠勿糊。长曝光的热噪点可开长曝降噪；路灯场景白平衡易偏黄，可手动设 3200-4000K 或后期统一。曝光判断的本质是哪一部分必须保住。保高光就压曝光，保暗部就提曝光，两者不可兼得时按表达取舍——高调片保高光、低调片保暗部。评价测光是把画面分块加权，遇到强逆光或大面积亮背景会误判，此时切点测光对主体测光更可靠。理解这一点，就不会总抱怨相机测光不准，而是知道什么时候该接管判断。"},{"h":"操作路径","p":"今天的练习：同机位拍 ISO3200 1/30 与 ISO200 4 秒两张对比。先用光圈优先拍一组并记录相机给的快门，再切手动用同一组参数回拍，比较两者差异，这是建立参数直觉最快的方法。逆光时先对主体点测光，再减 0.7 挡保住高光边缘。雪景加一挡、大面积深色减一挡，这两条只作起点，最终仍以直方图为准。拍完立刻看直方图右端贴不贴边，贴边就减，不贴边就保。"},{"h":"边界与代价","p":"典型翻车：手持硬拍，ISO 上万噪点糊成一片。宽容度不是无限的，而且不同机身差异很大。同一场景用两种曝光各拍一张，后期各拉一挡对比，就能摸清自己机身的真实余量。另一个边界是场景动态：人的动作、水流形态、云的位置都在变，参数一旦为了画质牺牲快门，就会同时牺牲内容。宁可噪一点，不要糊一片。"},{"h":"怎么判断到位","p":"今天的判据：是上架降 ISO 拉长曝光，不是硬提 ISO。自检三问：我保的是高光还是暗部，为什么？测光方式是相机替我选的还是我选的？机身余量我心里有数吗？"}],"points":["是上架降 ISO 拉长曝光，不是硬提 ISO","今天只验证这一个变量：能在夜景中平衡快门、ISO 与噪点"],"pitfalls":["手持硬拍，ISO 上万噪点糊成一片"],"quiz":[{"q":"「夜景曝光与噪点控制」的判断要点是什么？先说结论再谈理由。","a":"是上架降 ISO 拉长曝光，不是硬提 ISO","why":"夜景优先上三脚架：低 ISO 加长曝光可获得干净画面与灯光拖影"},{"q":"有人说：手持硬拍，ISO 上万噪点糊成一片。这样对吗？","a":"不对。是上架降 ISO 拉长曝光，不是硬提 ISO","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"同机位拍 ISO3200 1/30 与 ISO200 4 秒两张对比｜相机：手动模式，ISO 固定，每次只动一个参数；手机：专业模式锁 ISO、动曝光补偿","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：高光无溢出（直方图右端不堆积）、暗部保留细节（每项 5 分制，任一不达标记 3 分以下）","表达 25%：明暗关系服从主体，不是全图平均亮","规范 15%：未靠拉回高光硬救、未过度提亮暗部"]}},"M03-K01":{"title":"光质：硬光与软光","anchor":"是光源相对面积决定软硬，不是灯的绝对大小","source":"参考：《新摄影笔记》 · 光线与用光（按目录对应）","sections":[{"h":"为什么是这样","p":"软硬取决于光源相对被摄体的视角大小：太阳很大但极远，视角小所以是硬光，阴影边缘锐利、质感强；阴天整片天空是光源，所以是软光。要软化就靠近或加大发光面，要硬朗就拉远或用小光源。硬光显质感，软光显干净。光线决定画面的质感，参数只决定画面的亮度，这是两件事。要看的是四个属性：方向（顺、侧、逆、顶）、软硬（光源相对面积越大越软）、强度（决定能否压过环境光）、色温（决定冷暖关系）。软光过渡长、阴影边缘模糊，硬光过渡短、边缘锐利；同一个光源加上柔光布或贴近墙面反射，就从硬变软。绝大多数「高级感」来自光比被控制住，而不是来自器材或滤镜。"},{"h":"操作路径","p":"今天的练习：用裸灯与加柔光箱各拍一张人像，比阴影边缘。布光的第一步永远是定机位与主体位置，而不是先摆灯。定好机位后先看现场主光从哪来，再决定是顺着用、加反光板补暗部，还是逆着用把主体与背景分离。补光优先用白墙、泡沫板、白纸这类大面积被动反光，它比小灯更自然；确需人工光时，一盏灯加一块反光板往往胜过两盏灯对着打。每次只调一个量：先调光比，再调方向，最后才动色温。拍完保留现场照片备忘，方便复现。"},{"h":"边界与代价","p":"典型翻车：以为大灯就是软光。光线的代价主要在可控性与自然度之间。中午顶光不是不能用，但要接受眼窝阴影和地面反光，或用柔光布遮挡把硬光转软。逆光很美，但背景一亮主体就成剪影，要么补光要么索性把剪影做彻底。混合光源（窗光加暖色灯）最容易出脏色，处理方式是统一白平衡后局部修，而不是整图拉色温。别用滤镜掩盖光比失控——光比错了，滤镜只会让画面更假。"},{"h":"怎么判断到位","p":"今天的判据：是光源相对面积决定软硬，不是灯的绝对大小。先问：主光方向能一句话说清吗？再问：暗部还有细节吗，还是死黑一片？最后问：这个光比是我选的，还是现场刚好这样？三问答完，再看画面是否「好看」，因为好看常常是光对了的副产品。"}],"points":["是光源相对面积决定软硬，不是灯的绝对大小","今天只验证这一个变量：能按光质预判阴影边缘与质感"],"pitfalls":["以为大灯就是软光"],"quiz":[{"q":"「光质：硬光与软光」的判断要点是什么？先说结论再谈理由。","a":"是光源相对面积决定软硬，不是灯的绝对大小","why":"软硬取决于光源相对被摄体的视角大小：太阳很大但极远，视角小所以是硬光，阴影边缘锐利、质感强"},{"q":"有人说：以为大灯就是软光。这样对吗？","a":"不对。是光源相对面积决定软硬，不是灯的绝对大小","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"用裸灯与加柔光箱各拍一张人像，比阴影边缘｜机位固定（三脚架或靠墙），只移动光源 / 反光板 / 站位","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主光方向一致、暗部有细节、无双影（每项 5 分制，任一不达标记 3 分以下）","表达 35%：光比与软硬服从表达（是选择不是意外）","规范 20%：未用滤镜掩盖光比失控"]}},"M03-K02":{"title":"五种光位","anchor":"是光位决定立体感与情绪，不是越亮越好","source":"参考：《新摄影笔记》 · 光线与用光（按目录对应）","sections":[{"h":"为什么是这样","p":"顺光平、颜色准、适合记录；四十五度侧光最常用，一侧亮一侧暗形成体积；九十度侧光反差大、戏剧性强；逆光出轮廓与氛围但脸易黑；顶光眼窝与鼻下阴影重，需补光或换时段。顺序是先选光位，再调强度。判断光线只要回答四个问题：从哪来、多硬、多亮、什么颜色。答案决定画面质感，也决定要不要补光。硬光的价值在质感与结构，软光的价值在过渡与包容；同一个太阳，正午是硬光，阴天变软光，树荫下是斑驳光。会看光的人先决定站哪、面向哪，再决定参数；顺序反了，就只能靠后期硬救。"},{"h":"操作路径","p":"今天的练习：同一人拍顺光、四十五度侧光、逆光、顶光各一张。一天之内同一场景拍四次：顺光、侧光、逆光、阴影里，同构图同参数，回家并排看，这是理解光线最快的路径。补光先用反光板或白墙，把暗部提亮一挡就够，别追求打平。逆光时用遮光罩避免眩光失控，或故意让光晕入画作为表达。室内混合光源先统一色温再考虑补光，否则两种光打架，后期很难圆。"},{"h":"边界与代价","p":"典型翻车：全程顺光，脸平无立体。光线的限制来自物理：光比过大必然丢细节，光源面积不够必然过渡生硬，色温混杂必然出脏色。解法只有三个——换时间、换位置、加遮挡或反光。别指望后期把硬光改成软光，它只能改明暗，改不了阴影的锐利程度。另外自然光不会等你，窗口常常只有二十分钟，到场就要能立刻拍。"},{"h":"怎么判断到位","p":"今天的判据：是光位决定立体感与情绪，不是越亮越好。自检三问：四个属性我都能答上来吗？补光是为了提亮还是为了改性质？这块光还剩多少时间？"}],"points":["是光位决定立体感与情绪，不是越亮越好","今天只验证这一个变量：能说出顺侧逆顶底五种光位的效果"],"pitfalls":["全程顺光，脸平无立体"],"quiz":[{"q":"「五种光位」的判断要点是什么？先说结论再谈理由。","a":"是光位决定立体感与情绪，不是越亮越好","why":"顺光平、颜色准、适合记录"},{"q":"有人说：全程顺光，脸平无立体。这样对吗？","a":"不对。是光位决定立体感与情绪，不是越亮越好","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"同一人拍顺光、四十五度侧光、逆光、顶光各一张｜机位固定（三脚架或靠墙），只移动光源 / 反光板 / 站位","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主光方向一致、暗部有细节、无双影（每项 5 分制，任一不达标记 3 分以下）","表达 35%：光比与软硬服从表达（是选择不是意外）","规范 20%：未用滤镜掩盖光比失控"]}},"M03-K03":{"title":"光比与立体感","anchor":"是光比决定明暗差，不是补得越平越好","source":"参考：《新摄影笔记》 · 光线与用光（按目录对应）","sections":[{"h":"为什么是这样","p":"光比是亮面与暗面的亮度差，一比二约差一档、一比四差两档。人像常用一比二到一比三保留立体；一比一干净但平，一比八以上戏剧化。自然光下用反光板或白墙控制暗面，距离越近补得越亮。光线决定画面的质感，参数只决定画面的亮度，这是两件事。要看的是四个属性：方向（顺、侧、逆、顶）、软硬（光源相对面积越大越软）、强度（决定能否压过环境光）、色温（决定冷暖关系）。软光过渡长、阴影边缘模糊，硬光过渡短、边缘锐利；同一个光源加上柔光布或贴近墙面反射，就从硬变软。绝大多数「高级感」来自光比被控制住，而不是来自器材或滤镜。"},{"h":"操作路径","p":"今天的练习：同机位拍一比一、一比二、一比四三种光比的人像。布光的第一步永远是定机位与主体位置，而不是先摆灯。定好机位后先看现场主光从哪来，再决定是顺着用、加反光板补暗部，还是逆着用把主体与背景分离。补光优先用白墙、泡沫板、白纸这类大面积被动反光，它比小灯更自然；确需人工光时，一盏灯加一块反光板往往胜过两盏灯对着打。每次只调一个量：先调光比，再调方向，最后才动色温。拍完保留现场照片备忘，方便复现。"},{"h":"边界与代价","p":"典型翻车：反光板怼太近，脸平如证件照。光线的代价主要在可控性与自然度之间。中午顶光不是不能用，但要接受眼窝阴影和地面反光，或用柔光布遮挡把硬光转软。逆光很美，但背景一亮主体就成剪影，要么补光要么索性把剪影做彻底。混合光源（窗光加暖色灯）最容易出脏色，处理方式是统一白平衡后局部修，而不是整图拉色温。别用滤镜掩盖光比失控——光比错了，滤镜只会让画面更假。"},{"h":"怎么判断到位","p":"今天的判据：是光比决定明暗差，不是补得越平越好。先问：主光方向能一句话说清吗？再问：暗部还有细节吗，还是死黑一片？最后问：这个光比是我选的，还是现场刚好这样？三问答完，再看画面是否「好看」，因为好看常常是光对了的副产品。"}],"points":["是光比决定明暗差，不是补得越平越好","今天只验证这一个变量：能估计主辅光比并控制"],"pitfalls":["反光板怼太近，脸平如证件照"],"quiz":[{"q":"「光比与立体感」的判断要点是什么？先说结论再谈理由。","a":"是光比决定明暗差，不是补得越平越好","why":"光比是亮面与暗面的亮度差，一比二约差一档、一比四差两档"},{"q":"有人说：反光板怼太近，脸平如证件照。这样对吗？","a":"不对。是光比决定明暗差，不是补得越平越好","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"同机位拍一比一、一比二、一比四三种光比的人像｜机位固定（三脚架或靠墙），只移动光源 / 反光板 / 站位","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主光方向一致、暗部有细节、无双影（每项 5 分制，任一不达标记 3 分以下）","表达 35%：光比与软硬服从表达（是选择不是意外）","规范 20%：未用滤镜掩盖光比失控"]}},"M03-K04":{"title":"自然光时段","anchor":"是太阳高度决定光质，不是只看天气","source":"参考：《新摄影笔记》 · 光线与用光（按目录对应）","sections":[{"h":"为什么是这样","p":"日出后与日落前约一小时为黄金时段，太阳低、色温暖、方向性好；日落后二十到四十分钟为蓝调，天空与灯光平衡；正午顶光硬、阴影重，适合建筑与强反差题材。阴天全天可拍人像，但天空发白缺层次。光线决定画面的质感，参数只决定画面的亮度，这是两件事。要看的是四个属性：方向（顺、侧、逆、顶）、软硬（光源相对面积越大越软）、强度（决定能否压过环境光）、色温（决定冷暖关系）。软光过渡长、阴影边缘模糊，硬光过渡短、边缘锐利；同一个光源加上柔光布或贴近墙面反射，就从硬变软。绝大多数「高级感」来自光比被控制住，而不是来自器材或滤镜。"},{"h":"操作路径","p":"今天的练习：同机位在正午、黄金时段、蓝调各拍一张。布光的第一步永远是定机位与主体位置，而不是先摆灯。定好机位后先看现场主光从哪来，再决定是顺着用、加反光板补暗部，还是逆着用把主体与背景分离。补光优先用白墙、泡沫板、白纸这类大面积被动反光，它比小灯更自然；确需人工光时，一盏灯加一块反光板往往胜过两盏灯对着打。每次只调一个量：先调光比，再调方向，最后才动色温。拍完保留现场照片备忘，方便复现。"},{"h":"边界与代价","p":"典型翻车：正午顶光拍人像，眼窝全黑。光线的代价主要在可控性与自然度之间。中午顶光不是不能用，但要接受眼窝阴影和地面反光，或用柔光布遮挡把硬光转软。逆光很美，但背景一亮主体就成剪影，要么补光要么索性把剪影做彻底。混合光源（窗光加暖色灯）最容易出脏色，处理方式是统一白平衡后局部修，而不是整图拉色温。别用滤镜掩盖光比失控——光比错了，滤镜只会让画面更假。"},{"h":"怎么判断到位","p":"今天的判据：是太阳高度决定光质，不是只看天气。先问：主光方向能一句话说清吗？再问：暗部还有细节吗，还是死黑一片？最后问：这个光比是我选的，还是现场刚好这样？三问答完，再看画面是否「好看」，因为好看常常是光对了的副产品。"}],"points":["是太阳高度决定光质，不是只看天气","今天只验证这一个变量：能按时段规划拍摄"],"pitfalls":["正午顶光拍人像，眼窝全黑"],"quiz":[{"q":"「自然光时段」的判断要点是什么？先说结论再谈理由。","a":"是太阳高度决定光质，不是只看天气","why":"日出后与日落前约一小时为黄金时段，太阳低、色温暖、方向性好"},{"q":"有人说：正午顶光拍人像，眼窝全黑。这样对吗？","a":"不对。是太阳高度决定光质，不是只看天气","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"同机位在正午、黄金时段、蓝调各拍一张｜机位固定（三脚架或靠墙），只移动光源 / 反光板 / 站位","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主光方向一致、暗部有细节、无双影（每项 5 分制，任一不达标记 3 分以下）","表达 35%：光比与软硬服从表达（是选择不是意外）","规范 20%：未用滤镜掩盖光比失控"]}},"M03-K05":{"title":"逆光轮廓与补光","anchor":"是先保高光再补脸，不是整体提亮","source":"参考：《新摄影笔记》 · 光线与用光（按目录对应）","sections":[{"h":"为什么是这样","p":"逆光的价值是轮廓与氛围，代价是脸暗。做法是以背景高光为基准曝光或减三分之二档保住轮廓，再用反光板、白墙或闪灯给脸补一到两档。补光方向要与主光一致，避免双影。手机可开 HDR 但要防脸部合成发灰。光线决定画面的质感，参数只决定画面的亮度，这是两件事。要看的是四个属性：方向（顺、侧、逆、顶）、软硬（光源相对面积越大越软）、强度（决定能否压过环境光）、色温（决定冷暖关系）。软光过渡长、阴影边缘模糊，硬光过渡短、边缘锐利；同一个光源加上柔光布或贴近墙面反射，就从硬变软。绝大多数「高级感」来自光比被控制住，而不是来自器材或滤镜。"},{"h":"操作路径","p":"今天的练习：拍逆光人像：不补光、反光板、闪灯各一张对比。布光的第一步永远是定机位与主体位置，而不是先摆灯。定好机位后先看现场主光从哪来，再决定是顺着用、加反光板补暗部，还是逆着用把主体与背景分离。补光优先用白墙、泡沫板、白纸这类大面积被动反光，它比小灯更自然；确需人工光时，一盏灯加一块反光板往往胜过两盏灯对着打。每次只调一个量：先调光比，再调方向，最后才动色温。拍完保留现场照片备忘，方便复现。"},{"h":"边界与代价","p":"典型翻车：直接加曝光，背景全白轮廓消失。光线的代价主要在可控性与自然度之间。中午顶光不是不能用，但要接受眼窝阴影和地面反光，或用柔光布遮挡把硬光转软。逆光很美，但背景一亮主体就成剪影，要么补光要么索性把剪影做彻底。混合光源（窗光加暖色灯）最容易出脏色，处理方式是统一白平衡后局部修，而不是整图拉色温。别用滤镜掩盖光比失控——光比错了，滤镜只会让画面更假。"},{"h":"怎么判断到位","p":"今天的判据：是先保高光再补脸，不是整体提亮。先问：主光方向能一句话说清吗？再问：暗部还有细节吗，还是死黑一片？最后问：这个光比是我选的，还是现场刚好这样？三问答完，再看画面是否「好看」，因为好看常常是光对了的副产品。"}],"points":["是先保高光再补脸，不是整体提亮","今天只验证这一个变量：能在逆光下同时保住轮廓与脸部"],"pitfalls":["直接加曝光，背景全白轮廓消失"],"quiz":[{"q":"「逆光轮廓与补光」的判断要点是什么？先说结论再谈理由。","a":"是先保高光再补脸，不是整体提亮","why":"逆光的价值是轮廓与氛围，代价是脸暗"},{"q":"有人说：直接加曝光，背景全白轮廓消失。这样对吗？","a":"不对。是先保高光再补脸，不是整体提亮","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"拍逆光人像：不补光、反光板、闪灯各一张对比｜机位固定（三脚架或靠墙），只移动光源 / 反光板 / 站位","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主光方向一致、暗部有细节、无双影（每项 5 分制，任一不达标记 3 分以下）","表达 35%：光比与软硬服从表达（是选择不是意外）","规范 20%：未用滤镜掩盖光比失控"]}},"M03-K06":{"title":"反光板与柔光","anchor":"是反光板当第二光源，不是越近越好","source":"参考：《新摄影笔记》 · 光线与用光（按目录对应）","sections":[{"h":"为什么是这样","p":"白面柔和色中性；银面强、反差大、易出高光斑；金面暖但易偏黄。距离越近越亮。人像常用白面在暗侧四十五度、距脸一米左右，把暗部提到一比二。柔光罩的作用是把硬光变成大面积光源，面积越大越柔。光线决定画面的质感，参数只决定画面的亮度，这是两件事。要看的是四个属性：方向（顺、侧、逆、顶）、软硬（光源相对面积越大越软）、强度（决定能否压过环境光）、色温（决定冷暖关系）。软光过渡长、阴影边缘模糊，硬光过渡短、边缘锐利；同一个光源加上柔光布或贴近墙面反射，就从硬变软。绝大多数「高级感」来自光比被控制住，而不是来自器材或滤镜。"},{"h":"操作路径","p":"今天的练习：用白面与银面各补一次，比较强度与色偏。布光的第一步永远是定机位与主体位置，而不是先摆灯。定好机位后先看现场主光从哪来，再决定是顺着用、加反光板补暗部，还是逆着用把主体与背景分离。补光优先用白墙、泡沫板、白纸这类大面积被动反光，它比小灯更自然；确需人工光时，一盏灯加一块反光板往往胜过两盏灯对着打。每次只调一个量：先调光比，再调方向，最后才动色温。拍完保留现场照片备忘，方便复现。"},{"h":"边界与代价","p":"典型翻车：银色反光板贴脸，出现油光与硬斑。光线的代价主要在可控性与自然度之间。中午顶光不是不能用，但要接受眼窝阴影和地面反光，或用柔光布遮挡把硬光转软。逆光很美，但背景一亮主体就成剪影，要么补光要么索性把剪影做彻底。混合光源（窗光加暖色灯）最容易出脏色，处理方式是统一白平衡后局部修，而不是整图拉色温。别用滤镜掩盖光比失控——光比错了，滤镜只会让画面更假。"},{"h":"怎么判断到位","p":"今天的判据：是反光板当第二光源，不是越近越好。先问：主光方向能一句话说清吗？再问：暗部还有细节吗，还是死黑一片？最后问：这个光比是我选的，还是现场刚好这样？三问答完，再看画面是否「好看」，因为好看常常是光对了的副产品。"}],"points":["是反光板当第二光源，不是越近越好","今天只验证这一个变量：能用一块反光板改善脸部光比"],"pitfalls":["银色反光板贴脸，出现油光与硬斑"],"quiz":[{"q":"「反光板与柔光」的判断要点是什么？先说结论再谈理由。","a":"是反光板当第二光源，不是越近越好","why":"白面柔和色中性"},{"q":"有人说：银色反光板贴脸，出现油光与硬斑。这样对吗？","a":"不对。是反光板当第二光源，不是越近越好","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"用白面与银面各补一次，比较强度与色偏｜机位固定（三脚架或靠墙），只移动光源 / 反光板 / 站位","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主光方向一致、暗部有细节、无双影（每项 5 分制，任一不达标记 3 分以下）","表达 35%：光比与软硬服从表达（是选择不是意外）","规范 20%：未用滤镜掩盖光比失控"]}},"M04-K01":{"title":"取景框与减法","anchor":"是构图先是排除，不是往里塞","source":"参考：《摄影师的视界》 · 构图与视觉语言（按目录对应）","sections":[{"h":"为什么是这样","p":"取景框是选择器，构图的第一个动作是排除：走两步、蹲下、换焦段，把电线、垃圾桶、路人移出画外。判断标准是这个元素对表达有没有帮助，没有就删。拍完再裁是补救，不是方法。构图的目的不是好看，是可读。一张照片应该在两秒内让人明白看什么、为什么看。做到这点靠三件事：主体的位置与体量、主体与背景的对比（明暗、色彩、虚实）、视线与线条的引导方向。三分法解决的是别总放中间，但画面本身缺少对比时，放哪都不成立。先确保有对比，再谈位置。"},{"h":"操作路径","p":"今天的练习：同一主体连拍五张，每张只减少一个干扰元素。同一场景至少拍三种构图再走：中心对称、偏侧留白、低角度或高角度，每种都先把画面四边检查一遍。用四角扫视法：上、下、左、右依次看有没有杂物。移动一步往往比变焦更有效——换机位改变的是透视，变焦只改变裁切。拍完当场删掉明显废片，减少后期判断负担。"},{"h":"边界与代价","p":"典型翻车：什么都想放进去，画面无重点。稳定与张力是一对取舍。对称、水平、居中都稳，但容易呆；对角、倾斜、切边都有张力，但容易乱。广角近拍有冲击力，代价是边缘拉伸与比例失真；长焦压缩背景好看，但会把前后景挤在一起，失去空间感。一组照片里所有画面同一构图，只能说明拍摄时没在看。"},{"h":"怎么判断到位","p":"今天的判据：是构图先是排除，不是往里塞。自检三问：两秒内能看出主体吗？三种方案里我是不是只试了一种？四边都扫过了吗？"}],"points":["是构图先是排除，不是往里塞","今天只验证这一个变量：能在拍摄前删掉画面里多余元素"],"pitfalls":["什么都想放进去，画面无重点"],"quiz":[{"q":"「取景框与减法」的判断要点是什么？先说结论再谈理由。","a":"是构图先是排除，不是往里塞","why":"取景框是选择器，构图的第一个动作是排除：走两步、蹲下、换焦段，把电线、垃圾桶、路人移出画外"},{"q":"有人说：什么都想放进去，画面无重点。这样对吗？","a":"不对。是构图先是排除，不是往里塞","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"同一主体连拍五张，每张只减少一个干扰元素｜同机位同焦段连拍，一次只改一个构图元素","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主体在预定视觉位、边缘无意外切割、地平线水平（每项 5 分制，任一不达标记 3 分以下）","表达 35%：视线与引导方向自洽，主体不被边缘挤","规范 20%：未裁掉主体关键部位、未过度重构"]}},"M04-K02":{"title":"三分法与黄金分割","anchor":"是交点放重点，不是必须三分","source":"参考：《摄影师的视界》 · 构图与视觉语言（按目录对应）","sections":[{"h":"为什么是这样","p":"三分法把画面分成三乘三，四个交点与四条线是视线停留较多处，适合有明确主体的场景；黄金分割约零点六一八更接近自然比例。两者只是起点：对称、中心、极简留白同样有效。判断依据是你想让观众先看哪里。构图的目的不是好看，是可读。一张照片应该在两秒内让人明白看什么、为什么看。做到这点靠三件事：主体的位置与体量、主体与背景的对比（明暗、色彩、虚实）、视线与线条的引导方向。三分法解决的是别总放中间，但画面本身缺少对比时，放哪都不成立。先确保有对比，再谈位置。"},{"h":"操作路径","p":"今天的练习：同一场景用中心构图与三分构图各拍一张比较。同一场景至少拍三种构图再走：中心对称、偏侧留白、低角度或高角度，每种都先把画面四边检查一遍。用四角扫视法：上、下、左、右依次看有没有杂物。移动一步往往比变焦更有效——换机位改变的是透视，变焦只改变裁切。拍完当场删掉明显废片，减少后期判断负担。"},{"h":"边界与代价","p":"典型翻车：无脑三分，主体永远在右下角。稳定与张力是一对取舍。对称、水平、居中都稳，但容易呆；对角、倾斜、切边都有张力，但容易乱。广角近拍有冲击力，代价是边缘拉伸与比例失真；长焦压缩背景好看，但会把前后景挤在一起，失去空间感。一组照片里所有画面同一构图，只能说明拍摄时没在看。"},{"h":"怎么判断到位","p":"今天的判据：是交点放重点，不是必须三分。自检三问：两秒内能看出主体吗？三种方案里我是不是只试了一种？四边都扫过了吗？"}],"points":["是交点放重点，不是必须三分","今天只验证这一个变量：能把主体放在视觉重点位上并说出理由"],"pitfalls":["无脑三分，主体永远在右下角"],"quiz":[{"q":"「三分法与黄金分割」的判断要点是什么？先说结论再谈理由。","a":"是交点放重点，不是必须三分","why":"三分法把画面分成三乘三，四个交点与四条线是视线停留较多处，适合有明确主体的场景"},{"q":"有人说：无脑三分，主体永远在右下角。这样对吗？","a":"不对。是交点放重点，不是必须三分","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"同一场景用中心构图与三分构图各拍一张比较｜同机位同焦段连拍，一次只改一个构图元素","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主体在预定视觉位、边缘无意外切割、地平线水平（每项 5 分制，任一不达标记 3 分以下）","表达 35%：视线与引导方向自洽，主体不被边缘挤","规范 20%：未裁掉主体关键部位、未过度重构"]}},"M04-K03":{"title":"中心构图与对称","anchor":"是中心适合稳定与对称，不是过时","source":"参考：《摄影师的视界》 · 构图与视觉语言（按目录对应）","sections":[{"h":"为什么是这样","p":"中心构图把主体放正中，稳定、正式，适合正面人像、建筑正面、静物；配合严格对称（水面倒影、镜面、走廊）能获得强秩序感。要求是精确：中线误差超过百分之一就显得随意，需要前期对齐或后期微调。构图的目的不是好看，是可读。一张照片应该在两秒内让人明白看什么、为什么看。做到这点靠三件事：主体的位置与体量、主体与背景的对比（明暗、色彩、虚实）、视线与线条的引导方向。三分法解决的是别总放中间，但画面本身缺少对比时，放哪都不成立。先确保有对比，再谈位置。"},{"h":"操作路径","p":"今天的练习：拍一张严格对称的建筑或静物，检查左右误差。同一场景至少拍三种构图再走：中心对称、偏侧留白、低角度或高角度，每种都先把画面四边检查一遍。用四角扫视法：上、下、左、右依次看有没有杂物。移动一步往往比变焦更有效——换机位改变的是透视，变焦只改变裁切。拍完当场删掉明显废片，减少后期判断负担。"},{"h":"边界与代价","p":"典型翻车：想拍对称却站歪，一眼看出斜。稳定与张力是一对取舍。对称、水平、居中都稳，但容易呆；对角、倾斜、切边都有张力，但容易乱。广角近拍有冲击力，代价是边缘拉伸与比例失真；长焦压缩背景好看，但会把前后景挤在一起，失去空间感。一组照片里所有画面同一构图，只能说明拍摄时没在看。"},{"h":"怎么判断到位","p":"今天的判据：是中心适合稳定与对称，不是过时。自检三问：两秒内能看出主体吗？三种方案里我是不是只试了一种？四边都扫过了吗？"}],"points":["是中心适合稳定与对称，不是过时","今天只验证这一个变量：能用中心构图与对称建立秩序"],"pitfalls":["想拍对称却站歪，一眼看出斜"],"quiz":[{"q":"「中心构图与对称」的判断要点是什么？先说结论再谈理由。","a":"是中心适合稳定与对称，不是过时","why":"中心构图把主体放正中，稳定、正式，适合正面人像、建筑正面、静物"},{"q":"有人说：想拍对称却站歪，一眼看出斜。这样对吗？","a":"不对。是中心适合稳定与对称，不是过时","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"拍一张严格对称的建筑或静物，检查左右误差｜同机位同焦段连拍，一次只改一个构图元素","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主体在预定视觉位、边缘无意外切割、地平线水平（每项 5 分制，任一不达标记 3 分以下）","表达 35%：视线与引导方向自洽，主体不被边缘挤","规范 20%：未裁掉主体关键部位、未过度重构"]}},"M04-K04":{"title":"引导线与视觉动线","anchor":"是线要有去向，不是有线条就行","source":"参考：《摄影师的视界》 · 构图与视觉语言（按目录对应）","sections":[{"h":"为什么是这样","p":"引导线（道路、铁轨、栏杆、光影边界、河流）能建立纵深并牵引视线。有效引导线的终点应落在主体或消失点上；把观众带出画面就是干扰。曲线比直线柔和，重复斜线产生节奏。拍前先问线从哪里来到哪里去。构图是把观看顺序强加给观者的技术。人眼在画面里寻找的第一样东西是高对比、高饱和、人脸与直线汇聚处，构图就是安排这些线索，让观者先看主体、再看陪体、最后离开画面或回到主体。三分法只是众多排布工具之一，它好用是因为把主体偏离中心能产生张力，但它不是法则。真正稳定画面的是层次：前景、中景、背景各司其职，以及画面四条边与四个角有没有被无意切断。"},{"h":"操作路径","p":"今天的练习：用道路或栏杆做引导线，检查线是否指向主体。构图练习必须同机位进行：架好机位、锁死焦段，一次只改一个元素——挪主体、换前景、压地平线、改留白方向，然后连拍一组并排对比。拍之前先做减法：画面里删掉所有与表达无关的东西，再考虑加。地平线与垂直线先校平，这是最廉价也最有效的品质提升。取景时把画面四个边扫一遍，检查有没有半截人手、半根电线杆、恰好压线的头部。留白不是空，是给视线留的呼吸区，方向要留给主体看向的那一侧。"},{"h":"边界与代价","p":"典型翻车：引导线把视线引出画面。构图的代价是自由度与信息量的冲突。极简画面干净，但可能空到没有内容；信息密集的画面丰富，但容易让主体淹没。对称构图稳，但缺张力；强对角动态足，但容易失衡。广角贴脸拍有冲击力，代价是边缘拉伸变形，人脸尤其明显。别把所有照片都套同一个模板——那说明你在套公式而不是在看。也别用后期大幅重构来弥补拍摄时的随意，裁切会损失分辨率并放大噪点。"},{"h":"怎么判断到位","p":"今天的判据：是线要有去向，不是有线条就行。先问：观者第一眼会看哪里，那是不是我想让他看的？再问：画面四个边缘有没有意外切割，地平线平不平？最后问：如果只删掉一个元素，画面会更好吗？如果答案是「会」，说明减法还没做完。"}],"points":["是线要有去向，不是有线条就行","今天只验证这一个变量：能用线条把视线引向主体"],"pitfalls":["引导线把视线引出画面"],"quiz":[{"q":"「引导线与视觉动线」的判断要点是什么？先说结论再谈理由。","a":"是线要有去向，不是有线条就行","why":"引导线（道路、铁轨、栏杆、光影边界、河流）能建立纵深并牵引视线"},{"q":"有人说：引导线把视线引出画面。这样对吗？","a":"不对。是线要有去向，不是有线条就行","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"用道路或栏杆做引导线，检查线是否指向主体｜同机位同焦段连拍，一次只改一个构图元素","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主体在预定视觉位、边缘无意外切割、地平线水平（每项 5 分制，任一不达标记 3 分以下）","表达 35%：视线与引导方向自洽，主体不被边缘挤","规范 20%：未裁掉主体关键部位、未过度重构"]}},"M04-K05":{"title":"前景中景背景","anchor":"是层次靠距离差，不是靠虚化","source":"参考：《摄影师的视界》 · 构图与视觉语言（按目录对应）","sections":[{"h":"为什么是这样","p":"前景、中景、背景三层能建立空间感。前景不必清晰，虚化的枝叶、窗框、栏杆都能增加纵深与氛围。做法是蹲下找低机位让近处物体进入画面边缘，或后退用长焦把远景拉近形成压缩。构图的目的不是好看，是可读。一张照片应该在两秒内让人明白看什么、为什么看。做到这点靠三件事：主体的位置与体量、主体与背景的对比（明暗、色彩、虚实）、视线与线条的引导方向。三分法解决的是别总放中间，但画面本身缺少对比时，放哪都不成立。先确保有对比，再谈位置。"},{"h":"操作路径","p":"今天的练习：同一主体拍有前景与无前景两张。同一场景至少拍三种构图再走：中心对称、偏侧留白、低角度或高角度，每种都先把画面四边检查一遍。用四角扫视法：上、下、左、右依次看有没有杂物。移动一步往往比变焦更有效——换机位改变的是透视，变焦只改变裁切。拍完当场删掉明显废片，减少后期判断负担。"},{"h":"边界与代价","p":"典型翻车：画面只有主体和远背景，扁平。稳定与张力是一对取舍。对称、水平、居中都稳，但容易呆；对角、倾斜、切边都有张力，但容易乱。广角近拍有冲击力，代价是边缘拉伸与比例失真；长焦压缩背景好看，但会把前后景挤在一起，失去空间感。一组照片里所有画面同一构图，只能说明拍摄时没在看。"},{"h":"怎么判断到位","p":"今天的判据：是层次靠距离差，不是靠虚化。自检三问：两秒内能看出主体吗？三种方案里我是不是只试了一种？四边都扫过了吗？"}],"points":["是层次靠距离差，不是靠虚化","今天只验证这一个变量：能用三层结构建立纵深"],"pitfalls":["画面只有主体和远背景，扁平"],"quiz":[{"q":"「前景中景背景」的判断要点是什么？先说结论再谈理由。","a":"是层次靠距离差，不是靠虚化","why":"前景、中景、背景三层能建立空间感"},{"q":"有人说：画面只有主体和远背景，扁平。这样对吗？","a":"不对。是层次靠距离差，不是靠虚化","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"同一主体拍有前景与无前景两张｜同机位同焦段连拍，一次只改一个构图元素","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主体在预定视觉位、边缘无意外切割、地平线水平（每项 5 分制，任一不达标记 3 分以下）","表达 35%：视线与引导方向自洽，主体不被边缘挤","规范 20%：未裁掉主体关键部位、未过度重构"]}},"M04-K06":{"title":"留白与呼吸感","anchor":"是空白也要有内容，不是大面积空","source":"参考：《摄影师的视界》 · 构图与视觉语言（按目录对应）","sections":[{"h":"为什么是这样","p":"留白给主体呼吸空间，强化孤独、安静、高级的情绪。有效留白需要有质感：天空渐变、墙面肌理、雾、水面；纯死白或死黑会显得空洞。主体在留白中的位置决定情绪方向：朝向侧留白多则舒展，背向侧多则压抑。构图的目的不是好看，是可读。一张照片应该在两秒内让人明白看什么、为什么看。做到这点靠三件事：主体的位置与体量、主体与背景的对比（明暗、色彩、虚实）、视线与线条的引导方向。三分法解决的是别总放中间，但画面本身缺少对比时，放哪都不成立。先确保有对比，再谈位置。"},{"h":"操作路径","p":"今天的练习：拍极简主体，让空白占画面六成以上。同一场景至少拍三种构图再走：中心对称、偏侧留白、低角度或高角度，每种都先把画面四边检查一遍。用四角扫视法：上、下、左、右依次看有没有杂物。移动一步往往比变焦更有效——换机位改变的是透视，变焦只改变裁切。拍完当场删掉明显废片，减少后期判断负担。"},{"h":"边界与代价","p":"典型翻车：主体贴边，看着憋。稳定与张力是一对取舍。对称、水平、居中都稳，但容易呆；对角、倾斜、切边都有张力，但容易乱。广角近拍有冲击力，代价是边缘拉伸与比例失真；长焦压缩背景好看，但会把前后景挤在一起，失去空间感。一组照片里所有画面同一构图，只能说明拍摄时没在看。"},{"h":"怎么判断到位","p":"今天的判据：是空白也要有内容，不是大面积空。自检三问：两秒内能看出主体吗？三种方案里我是不是只试了一种？四边都扫过了吗？"}],"points":["是空白也要有内容，不是大面积空","今天只验证这一个变量：能在画面中留出有效空白"],"pitfalls":["主体贴边，看着憋"],"quiz":[{"q":"「留白与呼吸感」的判断要点是什么？先说结论再谈理由。","a":"是空白也要有内容，不是大面积空","why":"留白给主体呼吸空间，强化孤独、安静、高级的情绪"},{"q":"有人说：主体贴边，看着憋。这样对吗？","a":"不对。是空白也要有内容，不是大面积空","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"拍极简主体，让空白占画面六成以上｜同机位同焦段连拍，一次只改一个构图元素","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主体在预定视觉位、边缘无意外切割、地平线水平（每项 5 分制，任一不达标记 3 分以下）","表达 35%：视线与引导方向自洽，主体不被边缘挤","规范 20%：未裁掉主体关键部位、未过度重构"]}},"M04-K07":{"title":"视线与朝向留空","anchor":"是朝向侧多留空间，不是居中对称","source":"参考：《摄影师的视界》 · 构图与视觉语言（按目录对应）","sections":[{"h":"为什么是这样","p":"主体有方向性（视线、运动、风的朝向）时，朝向侧要留出更多空间，画面才不憋；留空少会制造压迫或即将走出画面的紧张。静物与正面人像不受此限，用中心或对称更稳。口诀是给要去的地方留位置。构图是把观看顺序强加给观者的技术。人眼在画面里寻找的第一样东西是高对比、高饱和、人脸与直线汇聚处，构图就是安排这些线索，让观者先看主体、再看陪体、最后离开画面或回到主体。三分法只是众多排布工具之一，它好用是因为把主体偏离中心能产生张力，但它不是法则。真正稳定画面的是层次：前景、中景、背景各司其职，以及画面四条边与四个角有没有被无意切断。"},{"h":"操作路径","p":"今天的练习：同一人像在朝向侧留三分之一与贴边各拍一张。构图练习必须同机位进行：架好机位、锁死焦段，一次只改一个元素——挪主体、换前景、压地平线、改留白方向，然后连拍一组并排对比。拍之前先做减法：画面里删掉所有与表达无关的东西，再考虑加。地平线与垂直线先校平，这是最廉价也最有效的品质提升。取景时把画面四个边扫一遍，检查有没有半截人手、半根电线杆、恰好压线的头部。留白不是空，是给视线留的呼吸区，方向要留给主体看向的那一侧。"},{"h":"边界与代价","p":"典型翻车：人朝右看，右边没空间，像要撞墙。构图的代价是自由度与信息量的冲突。极简画面干净，但可能空到没有内容；信息密集的画面丰富，但容易让主体淹没。对称构图稳，但缺张力；强对角动态足，但容易失衡。广角贴脸拍有冲击力，代价是边缘拉伸变形，人脸尤其明显。别把所有照片都套同一个模板——那说明你在套公式而不是在看。也别用后期大幅重构来弥补拍摄时的随意，裁切会损失分辨率并放大噪点。"},{"h":"怎么判断到位","p":"今天的判据：是朝向侧多留空间，不是居中对称。先问：观者第一眼会看哪里，那是不是我想让他看的？再问：画面四个边缘有没有意外切割，地平线平不平？最后问：如果只删掉一个元素，画面会更好吗？如果答案是「会」，说明减法还没做完。"}],"points":["是朝向侧多留空间，不是居中对称","今天只验证这一个变量：能按主体朝向分配画面空间"],"pitfalls":["人朝右看，右边没空间，像要撞墙"],"quiz":[{"q":"「视线与朝向留空」的判断要点是什么？先说结论再谈理由。","a":"是朝向侧多留空间，不是居中对称","why":"主体有方向性（视线、运动、风的朝向）时，朝向侧要留出更多空间，画面才不憋"},{"q":"有人说：人朝右看，右边没空间，像要撞墙。这样对吗？","a":"不对。是朝向侧多留空间，不是居中对称","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"同一人像在朝向侧留三分之一与贴边各拍一张｜同机位同焦段连拍，一次只改一个构图元素","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主体在预定视觉位、边缘无意外切割、地平线水平（每项 5 分制，任一不达标记 3 分以下）","表达 35%：视线与引导方向自洽，主体不被边缘挤","规范 20%：未裁掉主体关键部位、未过度重构"]}},"M04-K08":{"title":"边缘管理与裁切","anchor":"是边缘决定成败，不是中心对了就行","source":"参考：《摄影师的视界》 · 构图与视觉语言（按目录对应）","sections":[{"h":"为什么是这样","p":"边缘是最容易失分的地方：切手指、切脚踝、切头顶、背景电线穿过头部、亮块贴边抢视线。拍摄时先扫一遍四条边再看主体。裁切原则上不切关节（肘、膝、踝），人像留少量头顶空间，除非刻意紧裁。构图是把观看顺序强加给观者的技术。人眼在画面里寻找的第一样东西是高对比、高饱和、人脸与直线汇聚处，构图就是安排这些线索，让观者先看主体、再看陪体、最后离开画面或回到主体。三分法只是众多排布工具之一，它好用是因为把主体偏离中心能产生张力，但它不是法则。真正稳定画面的是层次：前景、中景、背景各司其职，以及画面四条边与四个角有没有被无意切断。"},{"h":"操作路径","p":"今天的练习：拍人像检查四肢与头顶是否被切，逐张修。构图练习必须同机位进行：架好机位、锁死焦段，一次只改一个元素——挪主体、换前景、压地平线、改留白方向，然后连拍一组并排对比。拍之前先做减法：画面里删掉所有与表达无关的东西，再考虑加。地平线与垂直线先校平，这是最廉价也最有效的品质提升。取景时把画面四个边扫一遍，检查有没有半截人手、半根电线杆、恰好压线的头部。留白不是空，是给视线留的呼吸区，方向要留给主体看向的那一侧。"},{"h":"边界与代价","p":"典型翻车：手指被切掉一截，脚被裁在关节上。构图的代价是自由度与信息量的冲突。极简画面干净，但可能空到没有内容；信息密集的画面丰富，但容易让主体淹没。对称构图稳，但缺张力；强对角动态足，但容易失衡。广角贴脸拍有冲击力，代价是边缘拉伸变形，人脸尤其明显。别把所有照片都套同一个模板——那说明你在套公式而不是在看。也别用后期大幅重构来弥补拍摄时的随意，裁切会损失分辨率并放大噪点。"},{"h":"怎么判断到位","p":"今天的判据：是边缘决定成败，不是中心对了就行。先问：观者第一眼会看哪里，那是不是我想让他看的？再问：画面四个边缘有没有意外切割，地平线平不平？最后问：如果只删掉一个元素，画面会更好吗？如果答案是「会」，说明减法还没做完。"}],"points":["是边缘决定成败，不是中心对了就行","今天只验证这一个变量：能避免边缘切割主体与意外闯入"],"pitfalls":["手指被切掉一截，脚被裁在关节上"],"quiz":[{"q":"「边缘管理与裁切」的判断要点是什么？先说结论再谈理由。","a":"是边缘决定成败，不是中心对了就行","why":"边缘是最容易失分的地方：切手指、切脚踝、切头顶、背景电线穿过头部、亮块贴边抢视线"},{"q":"有人说：手指被切掉一截，脚被裁在关节上。这样对吗？","a":"不对。是边缘决定成败，不是中心对了就行","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"拍人像检查四肢与头顶是否被切，逐张修｜同机位同焦段连拍，一次只改一个构图元素","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主体在预定视觉位、边缘无意外切割、地平线水平（每项 5 分制，任一不达标记 3 分以下）","表达 35%：视线与引导方向自洽，主体不被边缘挤","规范 20%：未裁掉主体关键部位、未过度重构"]}},"M05-K01":{"title":"白平衡与色温色调","anchor":"是白平衡定基准偏色是表达","source":"参考：《新摄影笔记》 · 色彩与后期（按目录对应）","sections":[{"h":"为什么是这样","p":"色温控制蓝黄、色调控制绿品红，共同决定白平衡。数值越低越偏蓝（3200K 适合白炽灯），越高越偏黄（6500K 阴天）。日出日落故意用高色温强化暖调，夜景用低色温压黄光。拍 RAW 可后期统一，拍 JPEG 要先设对。色彩管理是一条链：光源色温（拍）→ 白平衡与原始数据（存）→ 显示与软打样（看）→ 输出色彩空间（出）。任何一环错位，最后看到的颜色都不是真实的。白平衡的本质是告诉软件「什么颜色算白」，一旦定错，全图色偏且无法用单点校色完美救回。饱和度与明度是两件事：颜色发灰多半是明度不够而非饱和度不足，先提对比再谈饱和。同组照片的色彩一致性，比单张的惊艳更重要。"},{"h":"操作路径","p":"今天的练习：同场景用自动、日光、阴天、白炽灯各拍一张。拍摄环节优先拍 RAW，白平衡可以先自动但要留一张灰卡或白纸参照，后期一次性同步到同组。后期先定白平衡，再调曝光与对比，最后才碰饱和度与 HSL；顺序颠倒会让每次调整都推翻前一步。同一场景分别用自动白平衡与手动白平衡各拍一张，回看时会立刻明白相机的判断逻辑。导出前确认色彩空间：屏幕看用 sRGB，印刷才考虑 Adobe RGB，混用会导致色彩发灰或过艳。"},{"h":"边界与代价","p":"典型翻车：一组照片色温不一致。色彩最大的代价出现在「过度」。饱和拉满会溢出成色块，肤色一变就假，天空一拉就出断层。冷暖对比好看，但两张照片冷暖打架会让组照散架。混合光源下不要指望一个白平衡值解决全部，需要分区处理，而这会牺牲一致性。也要接受有些场景就是脏——阴天加雾霾加路灯，硬调成通透反而违背现场，纪实类尤其如此。"},{"h":"怎么判断到位","p":"今天的判据：是白平衡定基准偏色是表达。先问：这张的白平衡参照是什么，是相机猜的还是我定的？再问：肤色或已知中性色在画面里正常吗？最后问：把它和同组其他照片并排看，色彩是否是一个体系？色彩过关的标准是「成组一致、单张不脏」，而不是单张最艳。"}],"points":["是白平衡定基准偏色是表达","今天只验证这一个变量：能按场景设白平衡并知道何时故意偏色"],"pitfalls":["一组照片色温不一致"],"quiz":[{"q":"「白平衡与色温色调」的判断要点是什么？先说结论再谈理由。","a":"是白平衡定基准偏色是表达","why":"色温控制蓝黄、色调控制绿品红，共同决定白平衡"},{"q":"有人说：一组照片色温不一致。这样对吗？","a":"不对。是白平衡定基准偏色是表达","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"同场景用自动、日光、阴天、白炽灯各拍一张｜同一场景拍 RAW，白平衡分别设自动与手动各一张","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 50%：白平衡一致、肤色自然、无过饱和溢出（每项 5 分制，任一不达标记 3 分以下）","表达 30%：色调服务情绪，同组一致","规范 20%：色彩空间正确、未超出显示范围"]}},"M05-K02":{"title":"色彩三属性","anchor":"是饱和度不是越高越好","source":"参考：《新摄影笔记》 · 色彩与后期（按目录对应）","sections":[{"h":"为什么是这样","p":"色相、饱和度、明度三属性独立可控。全局提饱和会让肤色先崩，正确做法是用 HSL 只调特定色相；降低整体饱和再局部提亮主体色，比整体加饱和更高级。判断标准是肤色自然、暗部不脏、亮部不溢出。色彩管理是一条链：光源色温（拍）→ 白平衡与原始数据（存）→ 显示与软打样（看）→ 输出色彩空间（出）。任何一环错位，最后看到的颜色都不是真实的。白平衡的本质是告诉软件「什么颜色算白」，一旦定错，全图色偏且无法用单点校色完美救回。饱和度与明度是两件事：颜色发灰多半是明度不够而非饱和度不足，先提对比再谈饱和。同组照片的色彩一致性，比单张的惊艳更重要。"},{"h":"操作路径","p":"今天的练习：同一张图做低饱和、正常、高饱和三版比较。拍摄环节优先拍 RAW，白平衡可以先自动但要留一张灰卡或白纸参照，后期一次性同步到同组。后期先定白平衡，再调曝光与对比，最后才碰饱和度与 HSL；顺序颠倒会让每次调整都推翻前一步。同一场景分别用自动白平衡与手动白平衡各拍一张，回看时会立刻明白相机的判断逻辑。导出前确认色彩空间：屏幕看用 sRGB，印刷才考虑 Adobe RGB，混用会导致色彩发灰或过艳。"},{"h":"边界与代价","p":"典型翻车：全局拉饱和，肤色发橙发脏。色彩最大的代价出现在「过度」。饱和拉满会溢出成色块，肤色一变就假，天空一拉就出断层。冷暖对比好看，但两张照片冷暖打架会让组照散架。混合光源下不要指望一个白平衡值解决全部，需要分区处理，而这会牺牲一致性。也要接受有些场景就是脏——阴天加雾霾加路灯，硬调成通透反而违背现场，纪实类尤其如此。"},{"h":"怎么判断到位","p":"今天的判据：是饱和度不是越高越好。先问：这张的白平衡参照是什么，是相机猜的还是我定的？再问：肤色或已知中性色在画面里正常吗？最后问：把它和同组其他照片并排看，色彩是否是一个体系？色彩过关的标准是「成组一致、单张不脏」，而不是单张最艳。"}],"points":["是饱和度不是越高越好","今天只验证这一个变量：能分别控制明度、纯度与色相"],"pitfalls":["全局拉饱和，肤色发橙发脏"],"quiz":[{"q":"「色彩三属性」的判断要点是什么？先说结论再谈理由。","a":"是饱和度不是越高越好","why":"色相、饱和度、明度三属性独立可控"},{"q":"有人说：全局拉饱和，肤色发橙发脏。这样对吗？","a":"不对。是饱和度不是越高越好","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"同一张图做低饱和、正常、高饱和三版比较｜同一场景拍 RAW，白平衡分别设自动与手动各一张","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 50%：白平衡一致、肤色自然、无过饱和溢出（每项 5 分制，任一不达标记 3 分以下）","表达 30%：色调服务情绪，同组一致","规范 20%：色彩空间正确、未超出显示范围"]}},"M05-K03":{"title":"RAW 调整顺序","anchor":"是先影调后色彩再局部","source":"参考：《新摄影笔记》 · 色彩与后期（按目录对应）","sections":[{"h":"为什么是这样","p":"推荐顺序：校正镜头与透视、定白平衡、调曝光与高光阴影、加对比与曲线、调 HSL、局部蒙版、锐化降噪、裁切输出。原理是先修信息（曝光色彩）再修观感（对比锐化），反过来会放大噪点与色偏。后期的本质是把拍摄时的取舍补完，而不是重造一张照片。它的合法区间由原始数据决定：RAW 保留了传感器的宽容度，能救回一到两挡的高光与暗部；JPEG 已经被压缩过，可操作空间很小。调整顺序有讲究：先几何校正（水平、透视、裁切），再全局影调（曝光、对比、黑白场），再局部（蒙版、渐变、径向），最后锐化与降噪。顺序对了，每一步都在前一步的基础上做加法；顺序错了，就会不断推翻重来。"},{"h":"操作路径","p":"今天的练习：按曝光、白平衡、高光暗部、对比、色彩、局部的顺序修一张。练习方式是同一张 RAW 走两条路径：一条只做全局调整，一条加局部蒙版，导出后并排看差异，判断局部调整是否真的必要。每张照片的调整控制在五步以内，超出就说明拍摄时的判断有问题，要回头补拍而不是硬修。保存两个版本：一个可回溯的带调整记录的工程文件，一个导出成片用于发布。批量处理时先定一张基准，其余同步后再逐张微调，效率远高于一张张从零开始。"},{"h":"边界与代价","p":"典型翻车：一上来猛拉饱和与清晰度。后期的代价是可信度。暗部硬拉三挡以上会出现色噪与灰雾，天空拉回会导致边缘出现光晕，去雾拉满会让画面发灰发硬。人像磨皮一旦抹掉皮肤纹理，人物就塑料化了；锐化过量会让高对比边缘出现白边。也要防止后期成为拍摄随意的借口——「反正能修」是学习期最危险的想法，因为修不回来的东西远比能修的多。"},{"h":"怎么判断到位","p":"今天的判据：是先影调后色彩再局部。先问：这次调整解决的是拍摄时的哪个失误，还是纯表达选择？再问：关掉所有局部调整，画面还成立吗？最后问：同一套参数能复现到另一张同场景照片上吗？能做到「克制、可复现、不掩盖问题」，后期就算合格。"}],"points":["是先影调后色彩再局部","今天只验证这一个变量：能按合理顺序完成基础调整"],"pitfalls":["一上来猛拉饱和与清晰度"],"quiz":[{"q":"「RAW 调整顺序」的判断要点是什么？先说结论再谈理由。","a":"是先影调后色彩再局部","why":"推荐顺序：校正镜头与透视、定白平衡、调曝光与高光阴影、加对比与曲线、调 HSL、局部蒙版、锐化降噪、裁切输出"},{"q":"有人说：一上来猛拉饱和与清晰度。这样对吗？","a":"不对。是先影调后色彩再局部","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"按曝光、白平衡、高光暗部、对比、色彩、局部的顺序修一张｜同一张 RAW 走两条调整路径，导出后对比","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 50%：高光与阴影可恢复、无明显噪点与光晕（每项 5 分制，任一不达标记 3 分以下）","表达 30%：调整克制、保留现场感","规范 20%：流程可复现、参数可回溯"]}},"M05-K04":{"title":"输出尺寸与格式","anchor":"是按用途定尺寸，不是一律原图","source":"参考：《新摄影笔记》 · 色彩与后期（按目录对应）","sections":[{"h":"为什么是这样","p":"网络分享长边 1600 到 2048 像素、sRGB、JPEG 质量 80 到 85 足够；冲印按 300dpi 计算，六寸约 1800 乘 1200；投稿看征稿要求。水印放角落低透明度，别压主体。导出前统一命名（日期-题材-序号）便于归档。后期的本质是把拍摄时的取舍补完，而不是重造一张照片。它的合法区间由原始数据决定：RAW 保留了传感器的宽容度，能救回一到两挡的高光与暗部；JPEG 已经被压缩过，可操作空间很小。调整顺序有讲究：先几何校正（水平、透视、裁切），再全局影调（曝光、对比、黑白场），再局部（蒙版、渐变、径向），最后锐化与降噪。顺序对了，每一步都在前一步的基础上做加法；顺序错了，就会不断推翻重来。"},{"h":"操作路径","p":"今天的练习：同一张图导出网络长边两千像素版与打印版对比。练习方式是同一张 RAW 走两条路径：一条只做全局调整，一条加局部蒙版，导出后并排看差异，判断局部调整是否真的必要。每张照片的调整控制在五步以内，超出就说明拍摄时的判断有问题，要回头补拍而不是硬修。保存两个版本：一个可回溯的带调整记录的工程文件，一个导出成片用于发布。批量处理时先定一张基准，其余同步后再逐张微调，效率远高于一张张从零开始。"},{"h":"边界与代价","p":"典型翻车：发网用六千像素原图，加载慢还易被盗。后期的代价是可信度。暗部硬拉三挡以上会出现色噪与灰雾，天空拉回会导致边缘出现光晕，去雾拉满会让画面发灰发硬。人像磨皮一旦抹掉皮肤纹理，人物就塑料化了；锐化过量会让高对比边缘出现白边。也要防止后期成为拍摄随意的借口——「反正能修」是学习期最危险的想法，因为修不回来的东西远比能修的多。"},{"h":"怎么判断到位","p":"今天的判据：是按用途定尺寸，不是一律原图。先问：这次调整解决的是拍摄时的哪个失误，还是纯表达选择？再问：关掉所有局部调整，画面还成立吗？最后问：同一套参数能复现到另一张同场景照片上吗？能做到「克制、可复现、不掩盖问题」，后期就算合格。"}],"points":["是按用途定尺寸，不是一律原图","今天只验证这一个变量：能按用途导出合适尺寸与格式"],"pitfalls":["发网用六千像素原图，加载慢还易被盗"],"quiz":[{"q":"「输出尺寸与格式」的判断要点是什么？先说结论再谈理由。","a":"是按用途定尺寸，不是一律原图","why":"网络分享长边 1600 到 2048 像素、sRGB、JPEG 质量 80 到 85 足够"},{"q":"有人说：发网用六千像素原图，加载慢还易被盗。这样对吗？","a":"不对。是按用途定尺寸，不是一律原图","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"同一张图导出网络长边两千像素版与打印版对比｜同一张 RAW 走两条调整路径，导出后对比","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 50%：高光与阴影可恢复、无明显噪点与光晕（每项 5 分制，任一不达标记 3 分以下）","表达 30%：调整克制、保留现场感","规范 20%：流程可复现、参数可回溯"]}},"M06-K01":{"title":"人像焦段选择","anchor":"是焦段配拍摄距离，不是 85 最好","source":"参考：《新摄影笔记》 · 人像专题（按目录对应）","sections":[{"h":"为什么是这样","p":"35mm 适合环境人像与室内，需要靠近；50mm 中性自然，适合半身与日常；85 到 135mm 压缩背景、脸型最讨喜，适合户外半身与特写。焦段的本质是拍摄距离：太近透视变形，太远压缩扁平。人像的核心不是把人拍清楚，而是让被摄者看起来像他自己、而且状态松弛。技术上要控制三件事：焦段带来的透视（35mm 带环境、50mm 接近观感、85mm 起压缩背景）、光圈带来的景深（f/2 前后能分离背景，f/5.6 交代环境）、光线带来的皮肤质感（大面积柔光最讨喜，硬光强调结构但会放大瑕疵）。人像的成败一半在沟通：让对方有事可做、有处可看，僵硬感就会消失。"},{"h":"操作路径","p":"今天的练习：同一个人用 35、50、85 各拍半身，比较脸型与背景。拍摄流程：先定环境与机位，让背景干净或有明确层次；再定光——窗光让被摄者侧对窗口 45 度，室内用白墙补暗部；然后对焦到近侧眼睛，用单点对焦并确认对焦点真的落在眼睛上。光圈从 f/2.8 起试，太虚就往回收。沟通上给具体指令而非抽象要求：不要说「自然一点」，要说「手扶一下领口，看我这边，呼气」。连拍抓状态，但每十张停下来给对方看一张，反馈会让后半段明显更好。"},{"h":"边界与代价","p":"典型翻车：用 24mm 拍半身，鼻子变大。人像的代价集中在「过」与「假」。磨皮过度会抹掉皮肤纹理与年龄特征，人物变成塑料；瘦脸液化过度会让背景线条弯曲穿帮；大光圈全开会让近侧眼睛在焦而远侧眼睛糊掉，正面拍尤其明显。逆光人像不补光就只剩剪影，补光过强又失去氛围。还要尊重边界：未经同意不发布、不修图改人、不拍让人不适的角度，这既是伦理也是专业底线。"},{"h":"怎么判断到位","p":"今天的判据：是焦段配拍摄距离，不是 85 最好。先问：近侧眼睛在焦内吗，放大到 100% 看还锐吗？再问：被摄者的姿态和视线是有意的还是僵的？最后问：背景是在交代环境还是在抢主体？三问过后再看肤色与整体，人像的合格线是「自然、有神、不假」。"}],"points":["是焦段配拍摄距离，不是 85 最好","今天只验证这一个变量：能按场景选 35、50、85"],"pitfalls":["用 24mm 拍半身，鼻子变大"],"quiz":[{"q":"「人像焦段选择」的判断要点是什么？先说结论再谈理由。","a":"是焦段配拍摄距离，不是 85 最好","why":"35mm 适合环境人像与室内，需要靠近"},{"q":"有人说：用 24mm 拍半身，鼻子变大。这样对吗？","a":"不对。是焦段配拍摄距离，不是 85 最好","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"同一个人用 35、50、85 各拍半身，比较脸型与背景｜定焦 35/50/85 任一，f/2–2.8，对焦人眼，窗光 45 度侧对","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 35%：近侧眼睛在焦内、肤色自然、无红眼（每项 5 分制，任一不达标记 3 分以下）","表达 45%：姿态不僵硬、视线有意、背景不抢","规范 20%：未过度磨皮、未拉伸变形"]}},"M06-K02":{"title":"窗光人像","anchor":"是侧对窗，不是正对窗","source":"参考：《新摄影笔记》 · 人像专题（按目录对应）","sections":[{"h":"为什么是这样","p":"窗光是天然大柔光箱。让模特与窗成四十五度，亮面朝窗、暗面靠室内反射，形成自然立体；退后一步过渡更柔，靠近更强。背景选暗处可突出轮廓，注意别让窗框切头。阴天窗光更均匀，晴天要避直射。人像的技术分层是先保底线、再谈风格。底线三条：焦在近侧眼睛、肤色不发绿不发灰、背景不穿过头顶。上层才是风格：环境人像还是特写、亮调还是低调、正面还是侧背。拍摄前先问清用途——证件、社交头像、家庭记录、作品集，四种用途对构图、光比、后期程度的要求完全不同，先定用途能省掉一半返工。人像的难处在被摄者，不在相机。"},{"h":"操作路径","p":"今天的练习：让模特侧对窗四十五度，正对与侧对各拍一张。让被摄者先做动作再定格，而不是先站好再摆姿势。走动、转身、整理衣领、抬手挡光，这些动作之间的中间帧最自然。机位高度决定观感：略高于眼位显瘦、与眼平显自然、略低显气场但易露鼻孔。每换一个位置先拍一张测试帧，确认曝光与对焦再正式拍。一组控制在二十分钟内，注意力衰减后效率会断崖下跌，宁可分两次拍。"},{"h":"边界与代价","p":"典型翻车：正对窗户，脸平无立体。人像的边界是尊重：不要求被摄者做让其不适的动作、不在未同意时发布、不把改变其身体特征当作默认操作。技术上的边界是景深——f/1.4 全开时眼睛与鼻尖都不在同一焦平面，正面近摄尤其明显，必要时收到 f/2.8 换容错。环境人像若背景信息过多，主体会被稀释，必须在「交代环境」与「不抢主体」之间选一边站。"},{"h":"怎么判断到位","p":"今天的判据：是侧对窗，不是正对窗。自检三问：底线三条（对焦、肤色、背景）都过了吗？机位高度是有意选的吗？这组照片的用途决定了我的取舍吗？"}],"points":["是侧对窗，不是正对窗","今天只验证这一个变量：能用一扇窗完成柔和立体的人像"],"pitfalls":["正对窗户，脸平无立体"],"quiz":[{"q":"「窗光人像」的判断要点是什么？先说结论再谈理由。","a":"是侧对窗，不是正对窗","why":"窗光是天然大柔光箱"},{"q":"有人说：正对窗户，脸平无立体。这样对吗？","a":"不对。是侧对窗，不是正对窗","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"让模特侧对窗四十五度，正对与侧对各拍一张｜定焦 35/50/85 任一，f/2–2.8，对焦人眼，窗光 45 度侧对","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 35%：近侧眼睛在焦内、肤色自然、无红眼（每项 5 分制，任一不达标记 3 分以下）","表达 45%：姿态不僵硬、视线有意、背景不抢","规范 20%：未过度磨皮、未拉伸变形"]}},"M06-K03":{"title":"眼神光与眼部对焦","anchor":"是眼睛才是焦点，不是脸清楚就行","source":"参考：《新摄影笔记》 · 人像专题（按目录对应）","sections":[{"h":"为什么是这样","p":"人像的焦点标准是近侧眼睛，大光圈下睫毛与瞳孔都要在焦内，必要时收一档。眼神光是瞳孔里的高光点，来自窗、灯、反光板，缺时用一小块白纸或手机屏幕补一个光点。拍完放大检查眼睛。人像的核心不是把人拍清楚，而是让被摄者看起来像他自己、而且状态松弛。技术上要控制三件事：焦段带来的透视（35mm 带环境、50mm 接近观感、85mm 起压缩背景）、光圈带来的景深（f/2 前后能分离背景，f/5.6 交代环境）、光线带来的皮肤质感（大面积柔光最讨喜，硬光强调结构但会放大瑕疵）。人像的成败一半在沟通：让对方有事可做、有处可看，僵硬感就会消失。"},{"h":"操作路径","p":"今天的练习：拍三张不同光源位置的人像，看瞳孔光点。拍摄流程：先定环境与机位，让背景干净或有明确层次；再定光——窗光让被摄者侧对窗口 45 度，室内用白墙补暗部；然后对焦到近侧眼睛，用单点对焦并确认对焦点真的落在眼睛上。光圈从 f/2.8 起试，太虚就往回收。沟通上给具体指令而非抽象要求：不要说「自然一点」，要说「手扶一下领口，看我这边，呼气」。连拍抓状态，但每十张停下来给对方看一张，反馈会让后半段明显更好。"},{"h":"边界与代价","p":"典型翻车：焦点在鼻尖，眼睛发虚。人像的代价集中在「过」与「假」。磨皮过度会抹掉皮肤纹理与年龄特征，人物变成塑料；瘦脸液化过度会让背景线条弯曲穿帮；大光圈全开会让近侧眼睛在焦而远侧眼睛糊掉，正面拍尤其明显。逆光人像不补光就只剩剪影，补光过强又失去氛围。还要尊重边界：未经同意不发布、不修图改人、不拍让人不适的角度，这既是伦理也是专业底线。"},{"h":"怎么判断到位","p":"今天的判据：是眼睛才是焦点，不是脸清楚就行。先问：近侧眼睛在焦内吗，放大到 100% 看还锐吗？再问：被摄者的姿态和视线是有意的还是僵的？最后问：背景是在交代环境还是在抢主体？三问过后再看肤色与整体，人像的合格线是「自然、有神、不假」。"}],"points":["是眼睛才是焦点，不是脸清楚就行","今天只验证这一个变量：能保证眼睛清晰且有光点"],"pitfalls":["焦点在鼻尖，眼睛发虚"],"quiz":[{"q":"「眼神光与眼部对焦」的判断要点是什么？先说结论再谈理由。","a":"是眼睛才是焦点，不是脸清楚就行","why":"人像的焦点标准是近侧眼睛，大光圈下睫毛与瞳孔都要在焦内，必要时收一档"},{"q":"有人说：焦点在鼻尖，眼睛发虚。这样对吗？","a":"不对。是眼睛才是焦点，不是脸清楚就行","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"拍三张不同光源位置的人像，看瞳孔光点｜定焦 35/50/85 任一，f/2–2.8，对焦人眼，窗光 45 度侧对","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 35%：近侧眼睛在焦内、肤色自然、无红眼（每项 5 分制，任一不达标记 3 分以下）","表达 45%：姿态不僵硬、视线有意、背景不抢","规范 20%：未过度磨皮、未拉伸变形"]}},"M06-K04":{"title":"姿态与体态","anchor":"是给动作不给摆姿","source":"参考：《新摄影笔记》 · 人像专题（按目录对应）","sections":[{"h":"为什么是这样","p":"僵硬来自对称与用力。做法是重心移到一条腿、肩膀一高一低、手臂与身体留缝（避免贴合显粗）、下巴略前伸消除双下巴、手找事做（扶帽、拨发、拿杯）。给动作而不是姿势，人在运动中更自然。人像的核心不是把人拍清楚，而是让被摄者看起来像他自己、而且状态松弛。技术上要控制三件事：焦段带来的透视（35mm 带环境、50mm 接近观感、85mm 起压缩背景）、光圈带来的景深（f/2 前后能分离背景，f/5.6 交代环境）、光线带来的皮肤质感（大面积柔光最讨喜，硬光强调结构但会放大瑕疵）。人像的成败一半在沟通：让对方有事可做、有处可看，僵硬感就会消失。"},{"h":"操作路径","p":"今天的练习：用三个口令拍同一人：重心移一侧、手找事做、下巴前伸。拍摄流程：先定环境与机位，让背景干净或有明确层次；再定光——窗光让被摄者侧对窗口 45 度，室内用白墙补暗部；然后对焦到近侧眼睛，用单点对焦并确认对焦点真的落在眼睛上。光圈从 f/2.8 起试，太虚就往回收。沟通上给具体指令而非抽象要求：不要说「自然一点」，要说「手扶一下领口，看我这边，呼气」。连拍抓状态，但每十张停下来给对方看一张，反馈会让后半段明显更好。"},{"h":"边界与代价","p":"典型翻车：直挺站着，肩膀僵硬。人像的代价集中在「过」与「假」。磨皮过度会抹掉皮肤纹理与年龄特征，人物变成塑料；瘦脸液化过度会让背景线条弯曲穿帮；大光圈全开会让近侧眼睛在焦而远侧眼睛糊掉，正面拍尤其明显。逆光人像不补光就只剩剪影，补光过强又失去氛围。还要尊重边界：未经同意不发布、不修图改人、不拍让人不适的角度，这既是伦理也是专业底线。"},{"h":"怎么判断到位","p":"今天的判据：是给动作不给摆姿。先问：近侧眼睛在焦内吗，放大到 100% 看还锐吗？再问：被摄者的姿态和视线是有意的还是僵的？最后问：背景是在交代环境还是在抢主体？三问过后再看肤色与整体，人像的合格线是「自然、有神、不假」。"}],"points":["是给动作不给摆姿","今天只验证这一个变量：能用口令调整体态避免僵硬"],"pitfalls":["直挺站着，肩膀僵硬"],"quiz":[{"q":"「姿态与体态」的判断要点是什么？先说结论再谈理由。","a":"是给动作不给摆姿","why":"僵硬来自对称与用力"},{"q":"有人说：直挺站着，肩膀僵硬。这样对吗？","a":"不对。是给动作不给摆姿","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"用三个口令拍同一人：重心移一侧、手找事做、下巴前伸｜定焦 35/50/85 任一，f/2–2.8，对焦人眼，窗光 45 度侧对","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 35%：近侧眼睛在焦内、肤色自然、无红眼（每项 5 分制，任一不达标记 3 分以下）","表达 45%：姿态不僵硬、视线有意、背景不抢","规范 20%：未过度磨皮、未拉伸变形"]}},"M07-K01":{"title":"风光前期规划","anchor":"是看光线与天气，不是看景点","source":"参考：《新摄影笔记》 · 风光与建筑（按目录对应）","sections":[{"h":"为什么是这样","p":"风光三要素是光线、天气、机位。查日出日落与蓝调时刻、云量与能见度，判断有无戏剧性天空；提前在地图与实景照片上定机位与构图，留三十分钟余量。阴天可拍长曝与细节，晴天拍日出日落，雨后常有通透与倒影。风光摄影拍的是光，不是景。同一个地点在日出前二十分钟、日出后十分钟、正午、蓝调时刻是完全不同的四张照片。技术上要处理三件事：光比（天空与地面差三到五挡是常态）、景深（f/8 到 f/11 通常是画质与景深的平衡点）、稳定性（长曝必须三脚架加延时或遥控）。构图上靠前景建立纵深，让观者的视线有落脚点，再用中景与远景形成层次，而不是把一座山摆在画面中间就完事。"},{"h":"操作路径","p":"今天的练习：用天气与日出日落时间规划一次拍摄。流程：提前踩点或用软件查日出日落方位与时间，提前四十分钟到位；架三脚架、关防抖、用 f/8 起、ISO 100、开实时取景放大十倍手动对焦到超焦距或前中景；先拍一张看直方图，确保高光不溢出（宁欠勿过），必要时包围曝光三张。构图先定地平线位置（决定天空与地面的权重），再找前景，最后检查四角有没有杂物。蓝调时刻前后各留十分钟，那往往是色彩最干净的时候。"},{"h":"边界与代价","p":"典型翻车：到了现场光已过，白跑一趟。风光的代价是真实性。多张合成、换天、拉回高光，都会让画面偏离现场，作为表达可以，但要自己心里清楚并在需要时说明。过度 HDR 会让云层发灰、边缘出光晕；长曝把水面抹成丝绸很美，但也抹掉了波浪的质感信息。天气不配合是常态，阴天拍不出通透就该换题材，而不是硬拉对比把画面调脏。景区拍摄还要注意不越界、不破坏植被、不影响他人。"},{"h":"怎么判断到位","p":"今天的判据：是看光线与天气，不是看景点。先问：这张的光是等来的还是碰上的，能说出它是什么时段吗？再问：前景、中景、背景三层都有内容吗？最后问：高光有没有死白，地平线平不平？风光片的及格线是「光对、层清、不过火」。"}],"points":["是看光线与天气，不是看景点","今天只验证这一个变量：能在出门前判断拍摄可行性"],"pitfalls":["到了现场光已过，白跑一趟"],"quiz":[{"q":"「风光前期规划」的判断要点是什么？先说结论再谈理由。","a":"是看光线与天气，不是看景点","why":"风光三要素是光线、天气、机位"},{"q":"有人说：到了现场光已过，白跑一趟。这样对吗？","a":"不对。是看光线与天气，不是看景点","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"用天气与日出日落时间规划一次拍摄｜广角 + 三脚架，f/8–f/11，ISO 100，蓝调时刻前后 30 分钟","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：高光有层次、地平线水平、景深覆盖前后景（每项 5 分制，任一不达标记 3 分以下）","表达 35%：前景与远景有纵深、光比有取舍","规范 20%：未过度合成、未换天"]}},"M07-K02":{"title":"三脚架与长曝","anchor":"是关防抖上架锁死，不是架上就稳","source":"参考：《新摄影笔记》 · 风光与建筑（按目录对应）","sections":[{"h":"为什么是这样","p":"长曝要点：关镜头防抖（防抖自身会抖）、接受长曝降噪的处理时间、用快门线或两秒延时、避免中轴升高、风大挂重物、把脚管压稳。三十秒以上可用 B 门。检查方式是放大到百分之百看远处细节是否扎实。风光摄影拍的是光，不是景。同一个地点在日出前二十分钟、日出后十分钟、正午、蓝调时刻是完全不同的四张照片。技术上要处理三件事：光比（天空与地面差三到五挡是常态）、景深（f/8 到 f/11 通常是画质与景深的平衡点）、稳定性（长曝必须三脚架加延时或遥控）。构图上靠前景建立纵深，让观者的视线有落脚点，再用中景与远景形成层次，而不是把一座山摆在画面中间就完事。"},{"h":"操作路径","p":"今天的练习：用两秒与三十秒各拍一张水面。流程：提前踩点或用软件查日出日落方位与时间，提前四十分钟到位；架三脚架、关防抖、用 f/8 起、ISO 100、开实时取景放大十倍手动对焦到超焦距或前中景；先拍一张看直方图，确保高光不溢出（宁欠勿过），必要时包围曝光三张。构图先定地平线位置（决定天空与地面的权重），再找前景，最后检查四角有没有杂物。蓝调时刻前后各留十分钟，那往往是色彩最干净的时候。"},{"h":"边界与代价","p":"典型翻车：架上仍糊，忘关防抖或用轻架。风光的代价是真实性。多张合成、换天、拉回高光，都会让画面偏离现场，作为表达可以，但要自己心里清楚并在需要时说明。过度 HDR 会让云层发灰、边缘出光晕；长曝把水面抹成丝绸很美，但也抹掉了波浪的质感信息。天气不配合是常态，阴天拍不出通透就该换题材，而不是硬拉对比把画面调脏。景区拍摄还要注意不越界、不破坏植被、不影响他人。"},{"h":"怎么判断到位","p":"今天的判据：是关防抖上架锁死，不是架上就稳。先问：这张的光是等来的还是碰上的，能说出它是什么时段吗？再问：前景、中景、背景三层都有内容吗？最后问：高光有没有死白，地平线平不平？风光片的及格线是「光对、层清、不过火」。"}],"points":["是关防抖上架锁死，不是架上就稳","今天只验证这一个变量：能用三脚架完成一秒以上曝光"],"pitfalls":["架上仍糊，忘关防抖或用轻架"],"quiz":[{"q":"「三脚架与长曝」的判断要点是什么？先说结论再谈理由。","a":"是关防抖上架锁死，不是架上就稳","why":"长曝要点：关镜头防抖（防抖自身会抖）、接受长曝降噪的处理时间、用快门线或两秒延时、避免中轴升高、风大挂重物、把脚管压稳"},{"q":"有人说：架上仍糊，忘关防抖或用轻架。这样对吗？","a":"不对。是关防抖上架锁死，不是架上就稳","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"用两秒与三十秒各拍一张水面｜广角 + 三脚架，f/8–f/11，ISO 100，蓝调时刻前后 30 分钟","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：高光有层次、地平线水平、景深覆盖前后景（每项 5 分制，任一不达标记 3 分以下）","表达 35%：前景与远景有纵深、光比有取舍","规范 20%：未过度合成、未换天"]}},"M08-K01":{"title":"街拍心态与存在感","anchor":"是降低存在感不躲藏","source":"参考：《新摄影笔记》 · 街拍与纪实（按目录对应）","sections":[{"h":"为什么是这样","p":"街拍的难点是心理不是技术。做法是先站定观察几分钟，让周围人习惯你的存在；相机挂胸前预设参数，抬手即拍；被注意时点头微笑，多数人不在意。躲躲藏藏反而引人注意。广角贴近拍比长焦远吊更自然。街拍的成品率由看的顺序决定：先看光，再看背景，最后才看人。光决定这块地方值不值得等，背景决定画面结构是否干净，人只是最后填入的内容。多数街拍失败不是没拍到人，而是背景本身就是一团乱，人进去只会更乱。所以先找「舞台」，再等「演员」，最后才是按快门。"},{"h":"操作路径","p":"今天的练习：在同一条街站二十分钟只观察不拍，再开始拍。把相机预设成抬手即拍：光圈优先 f/8、最低快门 1/500、ISO 自动上限 6400、区域对焦、静音快门、关掉回放。走位时让画面里有一条明确的水平或垂直线可依靠。用腰平或胸前机位减少压迫感，拍完不要立刻低头看屏，既暴露意图也错过下一个瞬间。每次出门带一个具体命题，收工只挑三张，其余归档不删，半年后回看会有新判断。"},{"h":"边界与代价","p":"典型翻车：举机就跑，照片全虚。街拍最大的风险不是拍不到，是越界。可识别的私人场景、儿童、医疗与宗教场所、明显不愿被拍的姿态，都应主动放弃。用长焦远距离偷拍、用连拍扫射人群、把抓拍说成摆拍，都是对这个题材的伤害。技术上要接受错过：好瞬间出现而参数不对是常态，解法是让参数长期处于待发状态，而不是事后惋惜。"},{"h":"怎么判断到位","p":"今天的判据：是降低存在感不躲藏。自检三问：这块背景我先看过再等人的吗？参数是不是一直处于待发状态？这张的拍摄方式我能公开说明吗？"}],"points":["是降低存在感不躲藏","今天只验证这一个变量：能在街头稳定地拍到人"],"pitfalls":["举机就跑，照片全虚"],"quiz":[{"q":"「街拍心态与存在感」的判断要点是什么？先说结论再谈理由。","a":"是降低存在感不躲藏","why":"街拍的难点是心理不是技术"},{"q":"有人说：举机就跑，照片全虚。这样对吗？","a":"不对。是降低存在感不躲藏","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"在同一条街站二十分钟只观察不拍，再开始拍｜等效 35mm，f/8，1/500，ISO 自动上限 6400，区域对焦","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 30%：焦点落在主体、曝光在容错范围内（每项 5 分制，任一不达标记 3 分以下）","表达 55%：主体与背景有关系、瞬间有意味","规范 15%：未摆拍冒充纪实、未越过伦理边界"]}},"M08-K02":{"title":"街拍快速设置","anchor":"是预设好等机会，不是现场调","source":"参考：《新摄影笔记》 · 街拍与纪实（按目录对应）","sections":[{"h":"为什么是这样","p":"常用组合：f8 保证景深、快门 1/500 冻结行人、ISO 自动上限 6400、对焦用区域或超焦距（手动对到三到五米，f8 下两米到无穷都在焦内）、连拍开低速。手机则锁定曝光与对焦，抬手即拍。街拍是在不可控的环境里做可控的判断。它的技术含量不高，判断含量极高：要在零点几秒内看出「这个人、这个背景、这一瞬间」三者能不能拼成一个有意味的画面。技术上通常预设好参数——光圈 f/8 保证容错景深、快门 1/500 冻结动作、ISO 自动上限 6400、区域对焦或超焦距，让相机不需要思考，把注意力全部留给观察。构图靠预判：先找到好背景，再等合适的人走进来。"},{"h":"操作路径","p":"今天的练习：预设 f8、1/500、自动 ISO，用区域对焦扫街。流程：先走一遍街区找三到五个“舞台”——有光、有层次、有重复结构的背景；在舞台旁站定，参数预设好，等主体进入预定位置再按快门。距离控制在两到四米，用广角带环境或 35mm 等效视角，太近会让被摄者警觉、太远会失去关系。遇到好瞬间可以先拍再沟通，被质疑时坦诚说明并删除，这是最低的伦理要求。每次出门定一个小主题（雨、影子、橱窗、背影），比漫无目的扫街收成高得多。"},{"h":"边界与代价","p":"典型翻车：现场还在改参数，机会已过。街拍的代价是伦理与法律的边界。公共场所拍摄通常可行，但涉及可识别的个人、尤其是弱势群体、儿童、私密场景时应避免；商业使用需要肖像授权。用摆拍冒充抓拍是欺骗，用长焦偷拍是越界。技术上也要接受大量废片：一个下午出一张能看的就算正常，追求百分之百成功率只会让你不敢按快门。别为了戏剧性去干预现场，纪实的价值来自真实。"},{"h":"怎么判断到位","p":"今天的判据：是预设好等机会，不是现场调。先问：这张照片里主体和背景有关系吗，换个人站那儿还成立吗？再问：这个瞬间是不可重复的吗？最后问：如果被摄者当场问我为什么拍，我能坦然解释吗？三问都过，这张才值得留。"}],"points":["是预设好等机会，不是现场调","今天只验证这一个变量：能在三秒内完成拍摄准备"],"pitfalls":["现场还在改参数，机会已过"],"quiz":[{"q":"「街拍快速设置」的判断要点是什么？先说结论再谈理由。","a":"是预设好等机会，不是现场调","why":"常用组合：f8 保证景深、快门 1/500 冻结行人、ISO 自动上限 6400、对焦用区域或超焦距（手动对到三到五米，f8 下两米到无穷都在焦内）、连拍开低速"},{"q":"有人说：现场还在改参数，机会已过。这样对吗？","a":"不对。是预设好等机会，不是现场调","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"预设 f8、1/500、自动 ISO，用区域对焦扫街｜等效 35mm，f/8，1/500，ISO 自动上限 6400，区域对焦","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 30%：焦点落在主体、曝光在容错范围内（每项 5 分制，任一不达标记 3 分以下）","表达 55%：主体与背景有关系、瞬间有意味","规范 15%：未摆拍冒充纪实、未越过伦理边界"]}},"M09-K01":{"title":"选片标准","anchor":"是先淘汰，不是挑最喜欢的","source":"参考：《新摄影笔记》 · 选片输出与作品集（按目录对应）","sections":[{"h":"为什么是这样","p":"选片先设硬门槛：焦点是否在关键位置、曝光是否可救、构图有无硬伤（切头、倾斜、干扰物）。过门槛后按信息量排序：有情绪、有故事、有独特视角的优先。同一场景只留最好一张。淘汰比选择更能提升整体水平。输出是把照片变成作品集的最后一道工序，也是最多人忽略的一环。技术上要处理三件事：尺寸与用途（屏幕观看长边 2048px 足够，打印按 300dpi 折算实际尺寸）、锐度（输出锐化与屏幕锐化不是一回事，过量会在印刷上出现白边）、色彩空间（屏幕用 sRGB，印刷才用 Adobe RGB，混用会导致偏色）。成组呈现还要考虑顺序：第一张定调、中间有节奏起伏、最后一张收束。"},{"h":"操作路径","p":"今天的练习：从两百张里按三条硬标准筛到二十张。流程：先按用途定导出规格并存成预设，避免每次手动设置出错；导出前逐张检查高光溢出、噪点、水平与边缘杂物；命名规范统一（日期_主题_序号），方便回溯；成组挑选时先做联系表通看，删掉重复表达，控制在十二到二十张；最后写一段三百字以内的自述，说明拍什么、为什么这么拍，文字与照片要能互相支撑而不是互相解释。上传前压缩到平台要求的尺寸，避免二次压缩导致糊。"},{"h":"边界与代价","p":"典型翻车：全留，作品集没有重点。输出的代价是「多而不精」。把三百张原片一股脑发出去，观者只会记住最差的那几张；选片的核心能力是删，而不是留。过度锐化与过度降噪在屏幕上不易察觉，一打印就暴露。不同平台的压缩算法差异很大，同一张图在手机上鲜、在电脑上灰，发布前要在目标设备上实看一次。也别为了凑数放重复构图的照片，一组里两张相似的照片会互相削弱。"},{"h":"怎么判断到位","p":"今天的判据：是先淘汰，不是挑最喜欢的。先问：这组照片给谁看、在哪看，规格匹配吗？再问：删到只剩十张，我会留下哪十张？最后问：这套顺序能让观者看完最后一张吗？输出的及格线是「规格对、删得狠、顺序顺」。"}],"points":["是先淘汰，不是挑最喜欢的","今天只验证这一个变量：能用统一标准淘汰照片"],"pitfalls":["全留，作品集没有重点"],"quiz":[{"q":"「选片标准」的判断要点是什么？先说结论再谈理由。","a":"是先淘汰，不是挑最喜欢的","why":"选片先设硬门槛：焦点是否在关键位置、曝光是否可救、构图有无硬伤（切头、倾斜、干扰物）"},{"q":"有人说：全留，作品集没有重点。这样对吗？","a":"不对。是先淘汰，不是挑最喜欢的","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"从两百张里按三条硬标准筛到二十张｜按用途导出（社交长边 2048px / 打印 300dpi），sRGB","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 40%：尺寸与用途匹配、锐度适中（每项 5 分制，任一不达标记 3 分以下）","表达 40%：成组风格统一、选片有取舍","规范 20%：色彩空间与命名规范"]}},"M09-K02":{"title":"成组与编排","anchor":"是节奏与呼应，不是按时间排","source":"参考：《新摄影笔记》 · 选片输出与作品集（按目录对应）","sections":[{"h":"为什么是这样","p":"编排考虑景别交替（远中近）、色调呼应、情绪起伏、首尾强度。开场用有代入感的，中段放最强一张（约三分之二处），结尾留余味。避免连续三张同色同构图。成组后整体看一遍，像听一段音乐。输出是把照片变成作品集的最后一道工序，也是最多人忽略的一环。技术上要处理三件事：尺寸与用途（屏幕观看长边 2048px 足够，打印按 300dpi 折算实际尺寸）、锐度（输出锐化与屏幕锐化不是一回事，过量会在印刷上出现白边）、色彩空间（屏幕用 sRGB，印刷才用 Adobe RGB，混用会导致偏色）。成组呈现还要考虑顺序：第一张定调、中间有节奏起伏、最后一张收束。"},{"h":"操作路径","p":"今天的练习：把十张照片排出三种顺序比较观感。流程：先按用途定导出规格并存成预设，避免每次手动设置出错；导出前逐张检查高光溢出、噪点、水平与边缘杂物；命名规范统一（日期_主题_序号），方便回溯；成组挑选时先做联系表通看，删掉重复表达，控制在十二到二十张；最后写一段三百字以内的自述，说明拍什么、为什么这么拍，文字与照片要能互相支撑而不是互相解释。上传前压缩到平台要求的尺寸，避免二次压缩导致糊。"},{"h":"边界与代价","p":"典型翻车：相似照片挨在一起，看着重复。输出的代价是「多而不精」。把三百张原片一股脑发出去，观者只会记住最差的那几张；选片的核心能力是删，而不是留。过度锐化与过度降噪在屏幕上不易察觉，一打印就暴露。不同平台的压缩算法差异很大，同一张图在手机上鲜、在电脑上灰，发布前要在目标设备上实看一次。也别为了凑数放重复构图的照片，一组里两张相似的照片会互相削弱。"},{"h":"怎么判断到位","p":"今天的判据：是节奏与呼应，不是按时间排。先问：这组照片给谁看、在哪看，规格匹配吗？再问：删到只剩十张，我会留下哪十张？最后问：这套顺序能让观者看完最后一张吗？输出的及格线是「规格对、删得狠、顺序顺」。"}],"points":["是节奏与呼应，不是按时间排","今天只验证这一个变量：能排出有节奏的作品集顺序"],"pitfalls":["相似照片挨在一起，看着重复"],"quiz":[{"q":"「成组与编排」的判断要点是什么？先说结论再谈理由。","a":"是节奏与呼应，不是按时间排","why":"编排考虑景别交替（远中近）、色调呼应、情绪起伏、首尾强度"},{"q":"有人说：相似照片挨在一起，看着重复。这样对吗？","a":"不对。是节奏与呼应，不是按时间排","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"把十张照片排出三种顺序比较观感｜按用途导出（社交长边 2048px / 打印 300dpi），sRGB","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 40%：尺寸与用途匹配、锐度适中（每项 5 分制，任一不达标记 3 分以下）","表达 40%：成组风格统一、选片有取舍","规范 20%：色彩空间与命名规范"]}},"M09-K03":{"title":"作品集自述","anchor":"是说意图不说设备","source":"参考：《新摄影笔记》 · 选片输出与作品集（按目录对应）","sections":[{"h":"为什么是这样","p":"自述回答三件事：为什么拍这个（动机）、怎么拍（方法与条件）、希望观者看到什么（意图）。避免技术参数与形容词堆砌，具体细节比宏大表述可信。摄影集、投稿、展览都需要这段文字，写得早还能反过来指导拍摄。输出是把照片变成作品集的最后一道工序，也是最多人忽略的一环。技术上要处理三件事：尺寸与用途（屏幕观看长边 2048px 足够，打印按 300dpi 折算实际尺寸）、锐度（输出锐化与屏幕锐化不是一回事，过量会在印刷上出现白边）、色彩空间（屏幕用 sRGB，印刷才用 Adobe RGB，混用会导致偏色）。成组呈现还要考虑顺序：第一张定调、中间有节奏起伏、最后一张收束。"},{"h":"操作路径","p":"今天的练习：为你的组照写两百字自述。流程：先按用途定导出规格并存成预设，避免每次手动设置出错；导出前逐张检查高光溢出、噪点、水平与边缘杂物；命名规范统一（日期_主题_序号），方便回溯；成组挑选时先做联系表通看，删掉重复表达，控制在十二到二十张；最后写一段三百字以内的自述，说明拍什么、为什么这么拍，文字与照片要能互相支撑而不是互相解释。上传前压缩到平台要求的尺寸，避免二次压缩导致糊。"},{"h":"边界与代价","p":"典型翻车：通篇写用了什么镜头什么光圈。输出的代价是「多而不精」。把三百张原片一股脑发出去，观者只会记住最差的那几张；选片的核心能力是删，而不是留。过度锐化与过度降噪在屏幕上不易察觉，一打印就暴露。不同平台的压缩算法差异很大，同一张图在手机上鲜、在电脑上灰，发布前要在目标设备上实看一次。也别为了凑数放重复构图的照片，一组里两张相似的照片会互相削弱。"},{"h":"怎么判断到位","p":"今天的判据：是说意图不说设备。先问：这组照片给谁看、在哪看，规格匹配吗？再问：删到只剩十张，我会留下哪十张？最后问：这套顺序能让观者看完最后一张吗？输出的及格线是「规格对、删得狠、顺序顺」。"}],"points":["是说意图不说设备","今天只验证这一个变量：能写两百字说清拍什么为什么拍"],"pitfalls":["通篇写用了什么镜头什么光圈"],"quiz":[{"q":"「作品集自述」的判断要点是什么？先说结论再谈理由。","a":"是说意图不说设备","why":"自述回答三件事：为什么拍这个（动机）、怎么拍（方法与条件）、希望观者看到什么（意图）"},{"q":"有人说：通篇写用了什么镜头什么光圈。这样对吗？","a":"不对。是说意图不说设备","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"为你的组照写两百字自述｜按用途导出（社交长边 2048px / 打印 300dpi），sRGB","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 40%：尺寸与用途匹配、锐度适中（每项 5 分制，任一不达标记 3 分以下）","表达 40%：成组风格统一、选片有取舍","规范 20%：色彩空间与命名规范"]}},"M09-K04":{"title":"发布与版权","anchor":"是发布前想清楚授权","source":"参考：《新摄影笔记》 · 选片输出与作品集（按目录对应）","sections":[{"h":"为什么是这样","p":"发布前确认：是否含可识别他人（需同意，商业用途尤其）、是否泄露住址与行程（EXIF 定位）、平台授权条款（部分平台获得商用权）。署名与版权声明可选，但保留原始文件与拍摄时间是最有效的权利证明。参赛注意主办方使用条款。输出是把照片变成作品集的最后一道工序，也是最多人忽略的一环。技术上要处理三件事：尺寸与用途（屏幕观看长边 2048px 足够，打印按 300dpi 折算实际尺寸）、锐度（输出锐化与屏幕锐化不是一回事，过量会在印刷上出现白边）、色彩空间（屏幕用 sRGB，印刷才用 Adobe RGB，混用会导致偏色）。成组呈现还要考虑顺序：第一张定调、中间有节奏起伏、最后一张收束。"},{"h":"操作路径","p":"今天的练习：检查一组图的肖像与地点信息再发布。流程：先按用途定导出规格并存成预设，避免每次手动设置出错；导出前逐张检查高光溢出、噪点、水平与边缘杂物；命名规范统一（日期_主题_序号），方便回溯；成组挑选时先做联系表通看，删掉重复表达，控制在十二到二十张；最后写一段三百字以内的自述，说明拍什么、为什么这么拍，文字与照片要能互相支撑而不是互相解释。上传前压缩到平台要求的尺寸，避免二次压缩导致糊。"},{"h":"边界与代价","p":"典型翻车：未经同意发布可识别人物的照片。输出的代价是「多而不精」。把三百张原片一股脑发出去，观者只会记住最差的那几张；选片的核心能力是删，而不是留。过度锐化与过度降噪在屏幕上不易察觉，一打印就暴露。不同平台的压缩算法差异很大，同一张图在手机上鲜、在电脑上灰，发布前要在目标设备上实看一次。也别为了凑数放重复构图的照片，一组里两张相似的照片会互相削弱。"},{"h":"怎么判断到位","p":"今天的判据：是发布前想清楚授权。先问：这组照片给谁看、在哪看，规格匹配吗？再问：删到只剩十张，我会留下哪十张？最后问：这套顺序能让观者看完最后一张吗？输出的及格线是「规格对、删得狠、顺序顺」。"}],"points":["是发布前想清楚授权","今天只验证这一个变量：能安全地发布作品并保护权利"],"pitfalls":["未经同意发布可识别人物的照片"],"quiz":[{"q":"「发布与版权」的判断要点是什么？先说结论再谈理由。","a":"是发布前想清楚授权","why":"发布前确认：是否含可识别他人（需同意，商业用途尤其）、是否泄露住址与行程（EXIF 定位）、平台授权条款（部分平台获得商用权）"},{"q":"有人说：未经同意发布可识别人物的照片。这样对吗？","a":"不对。是发布前想清楚授权","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"检查一组图的肖像与地点信息再发布｜按用途导出（社交长边 2048px / 打印 300dpi），sRGB","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 40%：尺寸与用途匹配、锐度适中（每项 5 分制，任一不达标记 3 分以下）","表达 40%：成组风格统一、选片有取舍","规范 20%：色彩空间与命名规范"]}}};
