<script>
(function(){
'use strict';
var PFX = 'ph.';
var $ = function(s){ return document.querySelector(s); };

function lsGet(k, d){ try{ var v = localStorage.getItem(PFX+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(PFX+k, JSON.stringify(v)); return true; }catch(e){ banner(); return false; } }
var _bannerDone = false;
function banner(){
  if (_bannerDone) return; _bannerDone = true;
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:64px;left:12px;right:12px;z-index:99;background:#a63a3a;color:#fff;padding:8px 12px;border-radius:10px;font-size:13px';
  d.textContent = '本次进度不会保存（存储不可用）';
  document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 5000);
}
function pad(n){ return n < 10 ? '0' + n : '' + n; }
function iso(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function today(){ return iso(new Date()); }
function parseISO(s){ var a = s.split('-'); return new Date(+a[0], +a[1]-1, +a[2]); }
function wd(s){ return ['周日','周一','周二','周三','周四','周五','周六'][parseISO(s).getDay()]; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

// ---------- 计划索引 ----------
var MODIDX = {"器材与基本操作": 1, "曝光与测光": 2, "光线与用光": 3, "构图与视觉语言": 4, "色彩与后期": 5, "人像专题": 6, "风光与建筑": 7, "街拍与纪实": 8, "选片输出与作品集": 9};
var MODTOTAL = {"器材与基本操作": 8, "曝光与测光": 10, "光线与用光": 6, "构图与视觉语言": 8, "色彩与后期": 4, "人像专题": 4, "风光与建筑": 2, "街拍与纪实": 2, "选片输出与作品集": 4};
var BYDAY = {};          // 日期 -> 行
var REV = {};            // 日期 -> [{key,title,stage,from}]
var NEWROW = {};         // key -> 行

function keyOf(r){
  var mIdx = MODIDX[r[4]];
  var kIdx = 0;
  for (var j = 0; j < PLAN.length; j++) {
    if (PLAN[j][4] === r[4]) { kIdx++; if (PLAN[j] === r) break; }
  }
  return 'M' + pad(mIdx) + '-K' + pad(kIdx);
}

PLAN.forEach(function(r){
  BYDAY[r[0]] = r;
  if (r[3] === '新知识点') {
    var key = keyOf(r);
    NEWROW[key] = r;
    for (var i = 11; i <= 15; i++) {
      if (!r[i]) continue;
      (REV[r[i]] = REV[r[i]] || []).push({key: key, title: r[5], stage: ['D1','D3','D7','D14','D30'][i-11], from: r[0], tag: r[17]});
    }
  }
});
function keyOf(r){
  var mIdx = MODIDX[r[4]];
  var kIdx = 0;
  for (var j = 0; j < PLAN.length; j++) {
    if (PLAN[j][4] === r[4]) { kIdx++; if (PLAN[j] === r) break; }
  }
  return 'M' + pad(mIdx) + '-K' + pad(kIdx);
}
var MODTOTAL2 = MODTOTAL;

function dayInfo(){
  var t = today();
  if (BYDAY[t]) return {date: t, row: BYDAY[t], real: true};
  var first = PLAN[0][0];
  if (t < first) return {date: t, row: PLAN[0], real: false, early: true};
  return {date: t, row: PLAN[PLAN.length-1], real: false, late: true};
}

// ---------- 视图 ----------
var state = {tab: 'today', quiz: [], qi: 0, matOpen: null};

function render(){
  document.querySelectorAll('nav button').forEach(function(b){
    b.classList.toggle('on', b.dataset.t === state.tab);
  });
  $('#hd').textContent = ('0' + APP_VER).slice(-5);
  if (state.tab === 'today') vToday();
  else if (state.tab === 'quiz') vQuiz();
  else if (state.tab === 'cards') vCards();
  else if (state.tab === 'stats') vStats();
  else vMats();
}

function vToday(){
  var di = dayInfo(), r = di.row, v = $('#view'), t = today();
  var done = lsGet('done.' + t, null);
  var due = REV[t] || [];
  var h = '';
  if (!di.real) {
    h += '<div class="card" style="border-color:var(--warn)"><h2>计划区间外</h2><p class="muted" style="margin:0">' +
      (di.early ? '计划尚未开始，先看首日预览。' : '主周期已结束，已为你停在最后一天；请进入长期循环（见使用说明）。') +
      '</p></div>';
  }
  h += '<div class="card hero"><div class="k">第 ' + r[2] + ' 天 · ' + r[1] + ' · ' + r[3] + '</div>' +
       '<div class="t">' + esc(r[5]) + '</div>' +
       '<div class="s">' + esc(r[4]) + ' · ' + esc(r[6]) + '</div>' +
       '<div style="margin-top:10px"><span class="pill ' + (r[16]||'B').toLowerCase() + '">优先级 ' + esc(r[16]) + '</span>' +
       '<span class="pill">' + esc(r[17] || '综合') + '</span></div></div>';

  if (r[3] === '新知识点') {
    h += '<div class="card"><h2>今天要验证的一个变量</h2><p class="v" style="margin-bottom:0">' +
         esc((MATERIALS[keyOf(r)] || {}).anchor || r[8]) + '</p></div>';
    h += '<div class="card"><h2>学习目标</h2><p class="v" style="margin-bottom:0">' + esc(r[7]) + '</p></div>';
    h += '<div class="card"><h2>练习任务</h2><p class="v" style="margin-bottom:0">' + esc(r[9]) + '</p></div>';
    h += '<div class="card"><h2>任务卡</h2>' + taskCardHTML(keyOf(r)) + '</div>';
    h += '<div class="card"><h2>今日动作</h2><div class="row">' +
         '<button class="btn primary" id="bopen">打开精讲</button>' +
         '<button class="btn ' + (done ? '' : 'primary') + '" id="bdone">' + (done ? '已完成 ✓' : '标记完成') + '</button>' +
         '</div><p class="muted" style="margin:8px 0 0">完成标准：有交付物（成片 1–3 张 + 失败对照 1 张），不看时长。</p></div>';
  } else {
    h += '<div class="card"><h2>今日动作</h2><p class="v">' + esc(r[9]) + '</p>' +
         '<div class="row"><button class="btn primary" id="bdone">' + (done ? '已完成 ✓' : '标记完成') + '</button>' +
         '<button class="btn" id="btostats">看统计</button></div></div>';
  }

  if (due.length) {
    h += '<div class="card"><h2>到期复习 · ' + due.length + ' 条</h2><ul class="clean">';
    due.forEach(function(d){
      h += '<li>' + esc(d.stage) + ' · ' + esc(d.title) + '<span class="tag">' + esc(d.tag || '') + '</span></li>';
    });
    h += '</ul><div class="row"><button class="btn" id="bquiz">去答题</button></div></div>';
  }
  v.innerHTML = h;

  var bo = $('#bopen'); if (bo) bo.onclick = function(){ openReader(keyOf(r)); };
  var bd = $('#bdone'); if (bd) bd.onclick = function(){
    var m = lsGet('done.' + t, {});
    m.new = true; m.minutes = m.minutes || 60; m.date = t;
    lsSet('done.' + t, m);
    toast('已记录');
    render();
  };
  var bq = $('#bquiz'); if (bq) bq.onclick = function(){ state.tab = 'quiz'; state.quiz = []; render(); };
  var bs = $('#btostats'); if (bs) bs.onclick = function(){ state.tab = 'stats'; render(); };
}

function taskCardHTML(key){
  var m = MATERIALS[key] || {};
  var tc = m.task_card;
  if (!tc) return '<p class="muted">暂无任务卡</p>';
  var h = '<p class="k">设定</p><p class="v">' + esc(tc.setup) + '</p>' +
          '<p class="k">交付</p><p class="v">' + esc(tc.deliverable) + '</p>' +
          '<p class="k">评分（三维）</p><ul class="clean">';
  (tc.rubric || []).forEach(function(x){ h += '<li>' + esc(x) + '</li>'; });
  h += '</ul>';
  if (m.pitfalls && m.pitfalls.length)
    h += '<p class="k" style="margin-top:10px">失败样本</p><p class="v" style="margin-bottom:0">' + esc(m.pitfalls[0]) + '</p>';
  return h;
}

function vQuiz(){
  var t = today(), v = $('#view');
  if (!state.quiz.length) {
    var di = dayInfo();
    var pool = [];
    if (di.row[3] === '新知识点') pool.push(keyOf(di.row));
    (REV[t] || []).forEach(function(d){ if (pool.indexOf(d.key) < 0) pool.push(d.key); });
    if (!pool.length) {
      v.innerHTML = '<div class="card"><h2>今天没有待答的题</h2><p class="muted" style="margin:0">当日无新知识点也没有到期复习。可以去「材料」页自由复习。</p></div>';
      return;
    }
    state.quiz = pool.slice(0, 5); state.qi = 0;
  }
  var key = state.quiz[state.qi], m = MATERIALS[key] || {};
  var qs = (m.quiz || []).slice(0, 2);
  var rec = lsGet('quiz.' + t, []);
  var mine = null;
  rec.forEach(function(x){ if (x.key === key) mine = x.self; });
  var h = '<div class="card"><div class="k">第 ' + (state.qi+1) + ' / ' + state.quiz.length + ' 题 · ' + esc(key) + '</div>' +
          '<h2>' + esc(m.title || key) + '</h2>';
  if (!qs.length) h += '<p class="muted">该点暂无自测题</p>';
  qs.forEach(function(q){
    h += '<div class="q"><p class="stem">' + esc(q.q) + '</p>' +
         '<button class="btn ghost" style="min-height:36px;font-size:13px;padding:0 10px" onclick="var p=this.parentNode;p.classList.toggle(\'open\')">显示答案</button>' +
         '<p class="ans"><b>答：</b>' + esc(q.a) + '<br><b>为什么：</b>' + esc(q.why) + '</p></div>';
  });
  h += '<p class="k" style="margin-top:12px">三档自评</p><div class="tri">' +
       ['会','模糊','不会'].map(function(s){
         return '<button data-s="' + s + '" class="' + (mine === s ? 'on' : '') + '">' + s + '</button>';
       }).join('') + '</div>' +
       '<p class="muted" style="margin:10px 0 0">规则：会→进入下一档；模糊→间隔减半；不会→回到 D1 并进错题本。</p>';
  h += '</div><div class="row"><button class="btn" id="bprev"' + (state.qi === 0 ? ' disabled' : '') + '>上一题</button>' +
       '<button class="btn primary" id="bnext">' + (state.qi === state.quiz.length-1 ? '完成' : '下一题') + '</button></div>';
  v.innerHTML = h;
  v.querySelectorAll('.tri button').forEach(function(b){
    b.onclick = function(){
      var arr = lsGet('quiz.' + t, []);
      var found = false;
      arr.forEach(function(x){ if (x.key === key) { x.self = b.dataset.s; found = true; } });
      if (!found) arr.push({key: key, self: b.dataset.s, at: t});
      lsSet('quiz.' + t, arr);
      v.querySelectorAll('.tri button').forEach(function(z){ z.classList.remove('on'); });
      b.classList.add('on');
      toast('已记录：' + b.dataset.s);
    };
  });
  $('#bprev').onclick = function(){ if (state.qi > 0) { state.qi--; render(); } };
  $('#bnext').onclick = function(){
    if (state.qi < state.quiz.length-1) { state.qi++; render(); }
    else { state.quiz = []; state.tab = 'today'; toast('答题完成'); render(); }
  };
}

function vCards(){
  var t = today(), v = $('#view');
  var all = [];
  Object.keys(NEWROW).forEach(function(k){
    var r = NEWROW[k];
    all.push({key: k, title: r[5], mod: r[4], tag: r[17]});
  });
  var reads = lsGet('read', {});
  var quiz = lsGet('quiz.' + t, []);
  var selfMap = {};
  Object.keys(lsGet('allquiz', {})).forEach(function(d){
    lsGet('allquiz', {})[d].forEach(function(x){ selfMap[x.key] = x.self; });
  });
  quiz.forEach(function(x){ selfMap[x.key] = x.self; });
  var h = '<div class="card"><h2>卡片库 · ' + all.length + ' 张</h2>' +
    '<p class="muted" style="margin:0 0 10px">只读展示；导出为 CSV（key/正面/背面/标签/自评）。</p>' +
    '<div class="row"><button class="btn" id="bexp">导出 CSV</button>' +
    '<button class="btn" id="bexpjson">导出进度 JSON</button>' +
    '<button class="btn" id="bimp">导入 JSON</button></div></div>';
  h += '<div class="card"><table><thead><tr><th>知识点</th><th>自评</th><th>已读</th></tr></thead><tbody>';
  all.forEach(function(c){
    var m = MATERIALS[c.key] || {};
    h += '<tr><td>' + esc(c.title) + '<div class="muted">' + esc(c.tag) + '</div></td>' +
         '<td>' + esc(selfMap[c.key] || '—') + '</td>' +
         '<td>' + (reads[c.key] ? '✓' : '') + '</td></tr>';
  });
  h += '</tbody></table></div>';
  v.innerHTML = h;
  $('#bexp').onclick = function(){
    var rows = [['key','正面','背面','标签','自评']];
    all.forEach(function(c){
      var m = MATERIALS[c.key] || {};
      rows.push([c.key, '「' + c.title + '」的判断要点是什么？', (m.anchor || '') + '｜' + ((m.pitfalls||[])[0] || ''), c.tag || '', selfMap[c.key] || '']);
    });
    download('卡片库-' + SCHEME + '.csv', '\ufeff' + rows.map(function(r){ return r.map(function(x){ return '"' + String(x).replace(/"/g,'""') + '"'; }).join(','); }).join('\r\n'), 'text/csv');
  };
  $('#bexpjson').onclick = function(){
    var dump = {meta:{ver: APP_VER, scheme: SCHEME, exported: new Date().toISOString()}, data:{}};
    try{
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k.indexOf(PFX) === 0) dump.data[k.slice(PFX.length)] = JSON.parse(localStorage.getItem(k));
      }
    }catch(e){}
    download('进度-' + SCHEME + '-' + today() + '.json', JSON.stringify(dump, null, 1), 'application/json');
  };
  $('#bimp').onclick = function(){
    var inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json';
    inp.onchange = function(){
      var f = inp.files[0]; if (!f) return;
      var rd = new FileReader();
      rd.onload = function(){
        try{
          var o = JSON.parse(rd.result);
          if (!o.data) throw new Error('格式不符');
          Object.keys(o.data).forEach(function(k){ lsSet(k, o.data[k]); });
          toast('已导入');
          render();
        }catch(e){ toast('导入失败：' + e.message); }
      };
      rd.readAsText(f, 'utf-8');
    };
    inp.click();
  };
}

function vStats(){
  var v = $('#view'), done = lsGet('doneMap', {});
  var doneDates = [];
  Object.keys(localStorage).forEach(function(k){
    if (k.indexOf(PFX + 'done.') === 0) doneDates.push(k.slice((PFX + 'done.').length));
  });
  var started = PLAN[0][0], t = today();
  var elapsed = Math.max(1, Math.round((parseISO(t) - parseISO(started))/86400000) + 1);
  var totalPlan = PLAN.length;
  var doneN = doneDates.length;
  var streak = 0, cur = new Date();
  for (var i = 0; i < 400; i++) {
    var k2 = 'done.' + iso(cur);
    var has = false;
    try{ has = !!localStorage.getItem(PFX + k2); }catch(e){}
    if (has) { streak++; cur.setDate(cur.getDate() - 1); }
    else if (i === 0) { cur.setDate(cur.getDate() - 1); }
    else break;
  }
  // 逾期积压
  var backlog = 0;
  Object.keys(REV).forEach(function(d){
    if (d < t && d >= started) {
      var r = BYDAY[d];
      if (!r) return;
      var rec = lsGet('quiz.' + d, null);
      if (!rec) backlog += REV[d].length;
    }
  });
  // 方向矩阵
  var agg = {};
  Object.keys(localStorage).forEach(function(k){
    if (k.indexOf(PFX + 'quiz.') !== 0) return;
    var d = k.slice((PFX+'quiz.').length);
    try{
      JSON.parse(localStorage.getItem(k)).forEach(function(x){
        var r0 = NEWROW[x.key]; if (!r0) return;
        var tag = r0[17] || '综合';
        var s = x.self === '会' ? 5 : x.self === '模糊' ? 3 : 1;
        (agg[tag] = agg[tag] || {n: 0, s: 0}).n++;
        agg[tag].s += s;
      });
    }catch(e){}
  });
  var h = '<div class="grid">' +
    '<div class="stat"><div class="n">' + doneN + '</div><div class="l">已完成天数</div></div>' +
    '<div class="stat"><div class="n">' + Math.min(100, Math.round(doneN/Math.max(elapsed,1)*100)) + '%</div><div class="l">区间完成率</div></div>' +
    '<div class="stat"><div class="n">' + streak + '</div><div class="l">连续天数</div></div>' +
    '<div class="stat"><div class="n">' + backlog + '</div><div class="l">逾期复习条数</div></div>' +
    '</div>';
  h += '<div class="card"><h2>模块掌握</h2>';
  Object.keys(MODIDX).forEach(function(mod){
    var tot = MODTOTAL[mod] || 0;
    var dn = 0;
    Object.keys(NEWROW).forEach(function(k){
      if (NEWROW[k][4] === mod) {
        try{ if (localStorage.getItem(PFX + 'done.' + NEWROW[k][0])) dn++; }catch(e){}
      }
    });
    var p = tot ? Math.round(dn/tot*100) : 0;
    h += '<div style="margin:0 0 10px"><div style="display:flex;justify-content:space-between;font-size:14px">' +
         '<span>' + esc(mod) + '</span><span class="muted">' + dn + '/' + tot + '</span></div>' +
         '<div class="bar-o"><div class="bar-i" style="width:' + p + '%"></div></div></div>';
  });
  h += '</div>';
  h += '<div class="card"><h2>题材 × 自评矩阵</h2>';
  var keys = Object.keys(agg);
  if (!keys.length) h += '<p class="muted" style="margin:0">还没有答题记录</p>';
  else {
    h += '<table><thead><tr><th>题材</th><th>答题数</th><th>均分</th></tr></thead><tbody>';
    keys.sort(function(a,b){ return agg[a].s/agg[a].n - agg[b].s/agg[b].n; }).forEach(function(k3){
      h += '<tr><td>' + esc(k3) + '</td><td>' + agg[k3].n + '</td><td>' + (agg[k3].s/agg[k3].n).toFixed(1) + '</td></tr>';
    });
    h += '</tbody></table><p class="muted" style="margin:8px 0 0">均分最低的两题材进下周复盘重点。</p>';
  }
  h += '</div>';
  v.innerHTML = h;
}

function vMats(){
  var v = $('#view');
  var reads = lsGet('read', {});
  var h = '<div class="card"><h2>材料 · 按模块</h2><p class="muted" style="margin:0">点击进入阅读层；读完点「标记已读」。</p></div>';
  Object.keys(MODIDX).forEach(function(mod){
    var ks = Object.keys(NEWROW).filter(function(k){ return NEWROW[k][4] === mod; });
    if (!ks.length) return;
    h += '<div class="card"><h2>' + esc(mod) + ' <span class="muted">' + ks.filter(function(k){return reads[k];}).length + '/' + ks.length + '</span></h2><ul class="clean">';
    ks.forEach(function(k){
      h += '<li><a href="#" data-k="' + k + '" style="color:var(--fg);text-decoration:none">' +
        (reads[k] ? '✓ ' : '') + esc(NEWROW[k][5]) + '</a><span class="tag">' + esc(NEWROW[k][17]||'') + '</span></li>';
    });
    h += '</ul></div>';
  });
  v.innerHTML = h;
  v.querySelectorAll('a[data-k]').forEach(function(a){
    a.onclick = function(e){ e.preventDefault(); openReader(a.dataset.k); };
  });
}

function openReader(key){
  var m = MATERIALS[key] || {};
  var r = NEWROW[key];
  $('#rtitle').textContent = m.title || (r ? r[5] : key);
  var h = '<h2>' + esc(m.title || key) + '</h2><p class="muted">' + esc(m.source || '') + ' · ' + esc(key) + '</p>';
  if (m.anchor) h += '<p style="border-left:3px solid var(--accent);padding-left:12px;color:var(--accent)">' + esc(m.anchor) + '</p>';
  (m.sections || []).forEach(function(s){ h += '<h3>' + esc(s.h) + '</h3><p>' + esc(s.p) + '</p>'; });
  if (m.points && m.points.length) {
    h += '<h3>要点</h3><ul class="clean">' + m.points.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
  }
  if (m.pitfalls && m.pitfalls.length) {
    h += '<h3>易错与失败样本</h3><ul class="clean">' + m.pitfalls.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
  }
  if (m.task_card) {
    h += '<h3>任务卡</h3><p><b>设定：</b>' + esc(m.task_card.setup) + '</p><p><b>交付：</b>' + esc(m.task_card.deliverable) + '</p>';
    h += '<ul class="clean">' + m.task_card.rubric.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
  }
  if (m.quiz && m.quiz.length) {
    h += '<h3>自测</h3>';
    m.quiz.forEach(function(q){
      h += '<p><b>' + esc(q.q) + '</b><br>' + esc(q.a) + '<br><span class="muted">' + esc(q.why) + '</span></p>';
    });
  }
  $('#rbody').innerHTML = h;
  $('#rbody').scrollTop = 0;
  $('#reader').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  $('#rdone').onclick = function(){
    var reads = lsGet('read', {}); reads[key] = 1; lsSet('read', reads);
    toast('已标记已读');
  };
}
$('#rback').onclick = function(){
  $('#reader').classList.add('hidden');
  document.body.style.overflow = '';
  render();
};

function toast(msg){
  var d = document.createElement('div');
  d.textContent = msg;
  d.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + max(env(safe-area-inset-bottom),10px));z-index:99;background:rgba(20,22,26,.9);color:#fff;padding:8px 14px;border-radius:10px;font-size:14px';
  document.body.appendChild(d);
  setTimeout(function(){ d.remove(); }, 1600);
}
function download(name, text, mime){
  var b = new Blob([text], {type: mime + ';charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
}

// 主题
var th = lsGet('theme', null);
if (th) document.documentElement.setAttribute('data-theme', th);
$('#theme').onclick = function(){
  var cur = document.documentElement.getAttribute('data-theme');
  var next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  lsSet('theme', next);
};
document.querySelectorAll('nav button').forEach(function(b){
  b.onclick = function(){ state.tab = b.dataset.t; state.quiz = []; state.qi = 0; render(); window.scrollTo(0,0); };
});
render();
})();
</script>
<style>
/* 工具页自带底部常驻提示条（#bktoday）时，浮动按钮组上移避让，避免遮住「回到今天」 */
#pvBar{transition:bottom .18s ease}
#bktoday:not([hidden])~#pvBar{bottom:calc(132px + env(safe-area-inset-bottom))!important}
</style>
<div id="pvBar" style="position:fixed;bottom:14px;right:12px;z-index:9999;display:flex;flex-direction:column;gap:8px;">
  <a id="pvHome" href="../index.html" aria-label="返回项目清单" style="display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:rgba(120,120,128,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;text-decoration:none;font-size:16px;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.22);">&#8962;</a>
  <button class="btn sm" id="pvUpd" type="button" aria-label="检查并更新到最新版本" style="width:36px;height:36px;border:none;border-radius:50%;background:rgba(120,120,128,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font-size:15px;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.22);">&#8635;</button>
</div>
<script>
/* 「更新」按钮：比对 version.json 的 build，不一致即清缓存+注销 SW+硬重载 */
(function(){
  var b=document.getElementById('pvUpd'); if(!b) return;
  var m=document.querySelector('meta[name="pv-build"]'); var local=m?m.getAttribute('content'):'';
  var t0=b.textContent;
  function say(t,ms){ b.textContent=t; setTimeout(function(){ b.textContent=t0; }, ms||1600); }
  function hard(){
    try{ if('caches' in window){ caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }).catch(function(){}); } }catch(e){}
    try{ if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){ navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ try{ r.unregister(); }catch(e){} }); }); } }catch(e){}
    setTimeout(function(){ var u=location.href.split('#')[0]; var sep=u.indexOf('?')>=0?'&':'?'; try{ location.replace(u+sep+'t='+Date.now()); }catch(e){ location.reload(); } },150);
  }
  b.addEventListener('click', function(){
    if(!/^https?:/i.test(location.protocol)){ hard(); return; }
    var base = location.pathname.indexOf('/tools/') >= 0 ? '../' : '';
    say('检查中');
    fetch(base+'version.json?t='+Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(j){
      if(j && j.build && j.build !== local){ say('更新中'); hard(); } else { say('已最新'); }
    }).catch(function(){ hard(); });
  });
})();
</script>
