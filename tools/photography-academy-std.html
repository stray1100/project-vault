度是两件事：颜色发灰多半是明度不够而非饱和度不足，先提对比再谈饱和。同组照片的色彩一致性，比单张的惊艳更重要。"},{"h":"操作路径","p":"今天的练习：查相机色彩空间与导出设置是否一致。拍摄环节优先拍 RAW，白平衡可以先自动但要留一张灰卡或白纸参照，后期一次性同步到同组。后期先定白平衡，再调曝光与对比，最后才碰饱和度与 HSL；顺序颠倒会让每次调整都推翻前一步。同一场景分别用自动白平衡与手动白平衡各拍一张，回看时会立刻明白相机的判断逻辑。导出前确认色彩空间：屏幕看用 sRGB，印刷才考虑 Adobe RGB，混用会导致色彩发灰或过艳。"},{"h":"边界与代价","p":"典型翻车：广色域图直接发网上，颜色发灰。色彩最大的代价出现在「过度」。饱和拉满会溢出成色块，肤色一变就假，天空一拉就出断层。冷暖对比好看，但两张照片冷暖打架会让组照散架。混合光源下不要指望一个白平衡值解决全部，需要分区处理，而这会牺牲一致性。也要接受有些场景就是脏——阴天加雾霾加路灯，硬调成通透反而违背现场，纪实类尤其如此。"},{"h":"怎么判断到位","p":"今天的判据：是网络用 sRGB 印刷用广色域。先问：这张的白平衡参照是什么，是相机猜的还是我定的？再问：肤色或已知中性色在画面里正常吗？最后问：把它和同组其他照片并排看，色彩是否是一个体系？色彩过关的标准是「成组一致、单张不脏」，而不是单张最艳。"}],"points":["是网络用 sRGB 印刷用广色域","今天只验证这一个变量：能说清 sRGB 与 AdobeRGB 的适用"],"pitfalls":["广色域图直接发网上，颜色发灰"],"quiz":[{"q":"「色彩管理与色彩空间」的判断要点是什么？先说结论再谈理由。","a":"是网络用 sRGB 印刷用广色域","why":"sRGB 是网络与多数屏幕的通用空间，AdobeRGB 色域更广适合印刷"},{"q":"有人说：广色域图直接发网上，颜色发灰。这样对吗？","a":"不对。是网络用 sRGB 印刷用广色域","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"查相机色彩空间与导出设置是否一致｜同一场景拍 RAW，白平衡分别设自动与手动各一张","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 50%：白平衡一致、肤色自然、无过饱和溢出（每项 5 分制，任一不达标记 3 分以下）","表达 30%：色调服务情绪，同组一致","规范 20%：色彩空间正确、未超出显示范围"]}},"M05-K05":{"title":"RAW 调整顺序","anchor":"是先影调后色彩再局部","source":"参考：《数字摄影基础教程》 · 色彩与后期（按目录对应）","sections":[{"h":"为什么是这样","p":"推荐顺序：校正镜头与透视、定白平衡、调曝光与高光阴影、加对比与曲线、调 HSL、局部蒙版、锐化降噪、裁切输出。原理是先修信息（曝光色彩）再修观感（对比锐化），反过来会放大噪点与色偏。后期的本质是把拍摄时的取舍补完，而不是重造一张照片。它的合法区间由原始数据决定：RAW 保留了传感器的宽容度，能救回一到两挡的高光与暗部；JPEG 已经被压缩过，可操作空间很小。调整顺序有讲究：先几何校正（水平、透视、裁切），再全局影调（曝光、对比、黑白场），再局部（蒙版、渐变、径向），最后锐化与降噪。顺序对了，每一步都在前一步的基础上做加法；顺序错了，就会不断推翻重来。"},{"h":"操作路径","p":"今天的练习：按曝光、白平衡、高光暗部、对比、色彩、局部的顺序修一张。练习方式是同一张 RAW 走两条路径：一条只做全局调整，一条加局部蒙版，导出后并排看差异，判断局部调整是否真的必要。每张照片的调整控制在五步以内，超出就说明拍摄时的判断有问题，要回头补拍而不是硬修。保存两个版本：一个可回溯的带调整记录的工程文件，一个导出成片用于发布。批量处理时先定一张基准，其余同步后再逐张微调，效率远高于一张张从零开始。"},{"h":"边界与代价","p":"典型翻车：一上来猛拉饱和与清晰度。后期的代价是可信度。暗部硬拉三挡以上会出现色噪与灰雾，天空拉回会导致边缘出现光晕，去雾拉满会让画面发灰发硬。人像磨皮一旦抹掉皮肤纹理，人物就塑料化了；锐化过量会让高对比边缘出现白边。也要防止后期成为拍摄随意的借口——「反正能修」是学习期最危险的想法，因为修不回来的东西远比能修的多。"},{"h":"怎么判断到位","p":"今天的判据：是先影调后色彩再局部。先问：这次调整解决的是拍摄时的哪个失误，还是纯表达选择？再问：关掉所有局部调整，画面还成立吗？最后问：同一套参数能复现到另一张同场景照片上吗？能做到「克制、可复现、不掩盖问题」，后期就算合格。"}],"points":["是先影调后色彩再局部","今天只验证这一个变量：能按合理顺序完成基础调整"],"pitfalls":["一上来猛拉饱和与清晰度"],"quiz":[{"q":"「RAW 调整顺序」的判断要点是什么？先说结论再谈理由。","a":"是先影调后色彩再局部","why":"推荐顺序：校正镜头与透视、定白平衡、调曝光与高光阴影、加对比与曲线、调 HSL、局部蒙版、锐化降噪、裁切输出"},{"q":"有人说：一上来猛拉饱和与清晰度。这样对吗？","a":"不对。是先影调后色彩再局部","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"按曝光、白平衡、高光暗部、对比、色彩、局部的顺序修一张｜同一张 RAW 走两条调整路径，导出后对比","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 50%：高光与阴影可恢复、无明显噪点与光晕（每项 5 分制，任一不达标记 3 分以下）","表达 30%：调整克制、保留现场感","规范 20%：流程可复现、参数可回溯"]}},"M05-K06":{"title":"曲线与影调分区","anchor":"是曲线分区控制，不是只会拉 S 形","source":"参考：《数字摄影基础教程》 · 色彩与后期（按目录对应）","sections":[{"h":"为什么是这样","p":"曲线横轴输入纵轴输出，左端暗部右端高光。只动中段等于只提中间调；在暗部加控制点锁住可保护黑场。S 形增对比，反 S 降对比。要点是先锁住两端再动中间，避免整体偏移；蒙版局部曲线比全局更精准。后期是减法式精修：先去掉不该有的（偏色、脏点、歪斜），再强化该有的（主体对比、色彩关系），最后统一整组风格。有效的调整幅度通常很小，因为大部分问题在拍摄阶段就该解决。判断一张图是否修过头，最简单的办法是隔一天再看——当场看只会越看越顺眼。"},{"h":"操作路径","p":"今天的练习：用曲线只提亮中间调不动高光，观察变化。建立固定处理顺序并存成预设：镜头校正→白平衡→曝光与黑白场→对比与清晰度→色彩→局部→锐化降噪→导出。同场景第一张调好后，其余只做曝光微调，保证组内一致。局部调整能不用就不用，一张图超过三个蒙版就该反思构图。导出前在手机上看一次，因为多数观者是在手机上看。"},{"h":"边界与代价","p":"典型翻车：一键 S 曲线，暗部死黑高光溢出。后期的天花板由数据决定，RAW 也救不回全毁的高光。过度锐化在高对比边缘产生白边，过度降噪把纹理抹平，过度提亮让暗部浮灰。人像类边界更严：磨皮可以，改脸型比例就要谨慎并说明。纪实与新闻类原则上不做内容性修改，这是行业底线。"},{"h":"怎么判断到位","p":"今天的判据：是曲线分区控制，不是只会拉 S 形。自检三问：这套调整解决的是缺陷还是表达？同组其他照片能套用吗？隔一天看还成立吗？"}],"points":["是曲线分区控制，不是只会拉 S 形","今天只验证这一个变量：能用曲线分别控制高光中间调暗部"],"pitfalls":["一键 S 曲线，暗部死黑高光溢出"],"quiz":[{"q":"「曲线与影调分区」的判断要点是什么？先说结论再谈理由。","a":"是曲线分区控制，不是只会拉 S 形","why":"曲线横轴输入纵轴输出，左端暗部右端高光"},{"q":"有人说：一键 S 曲线，暗部死黑高光溢出。这样对吗？","a":"不对。是曲线分区控制，不是只会拉 S 形","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"用曲线只提亮中间调不动高光，观察变化｜同一张 RAW 走两条调整路径，导出后对比","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 50%：高光与阴影可恢复、无明显噪点与光晕（每项 5 分制，任一不达标记 3 分以下）","表达 30%：调整克制、保留现场感","规范 20%：流程可复现、参数可回溯"]}},"M05-K07":{"title":"HSL 与局部色彩","anchor":"是按色相分别调，不是全局","source":"参考：《数字摄影基础教程》 · 色彩与后期（按目录对应）","sections":[{"h":"为什么是这样","p":"HSL 按红橙黄绿青蓝紫品红分色相控制。人像减橙色饱和并提亮橙色明度可美白皮肤；天空加蓝饱和并压明度更通透；统一杂色时降低无关色相饱和。风险是相邻色相互相影响（红与橙、黄与绿），改完要检查肤色。后期的本质是把拍摄时的取舍补完，而不是重造一张照片。它的合法区间由原始数据决定：RAW 保留了传感器的宽容度，能救回一到两挡的高光与暗部；JPEG 已经被压缩过，可操作空间很小。调整顺序有讲究：先几何校正（水平、透视、裁切），再全局影调（曝光、对比、黑白场），再局部（蒙版、渐变、径向），最后锐化与降噪。顺序对了，每一步都在前一步的基础上做加法；顺序错了，就会不断推翻重来。"},{"h":"操作路径","p":"今天的练习：把画面里一件红衣改成橙色再改回，观察肤色是否受影响。练习方式是同一张 RAW 走两条路径：一条只做全局调整，一条加局部蒙版，导出后并排看差异，判断局部调整是否真的必要。每张照片的调整控制在五步以内，超出就说明拍摄时的判断有问题，要回头补拍而不是硬修。保存两个版本：一个可回溯的带调整记录的工程文件，一个导出成片用于发布。批量处理时先定一张基准，其余同步后再逐张微调，效率远高于一张张从零开始。"},{"h":"边界与代价","p":"典型翻车：调红色把肤色一起改了。后期的代价是可信度。暗部硬拉三挡以上会出现色噪与灰雾，天空拉回会导致边缘出现光晕，去雾拉满会让画面发灰发硬。人像磨皮一旦抹掉皮肤纹理，人物就塑料化了；锐化过量会让高对比边缘出现白边。也要防止后期成为拍摄随意的借口——「反正能修」是学习期最危险的想法，因为修不回来的东西远比能修的多。"},{"h":"怎么判断到位","p":"今天的判据：是按色相分别调，不是全局。先问：这次调整解决的是拍摄时的哪个失误，还是纯表达选择？再问：关掉所有局部调整，画面还成立吗？最后问：同一套参数能复现到另一张同场景照片上吗？能做到「克制、可复现、不掩盖问题」，后期就算合格。"}],"points":["是按色相分别调，不是全局","今天只验证这一个变量：能只改某一颜色的三项属性"],"pitfalls":["调红色把肤色一起改了"],"quiz":[{"q":"「HSL 与局部色彩」的判断要点是什么？先说结论再谈理由。","a":"是按色相分别调，不是全局","why":"HSL 按红橙黄绿青蓝紫品红分色相控制"},{"q":"有人说：调红色把肤色一起改了。这样对吗？","a":"不对。是按色相分别调，不是全局","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"把画面里一件红衣改成橙色再改回，观察肤色是否受影响｜同一张 RAW 走两条调整路径，导出后对比","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 50%：高光与阴影可恢复、无明显噪点与光晕（每项 5 分制，任一不达标记 3 分以下）","表达 30%：调整克制、保留现场感","规范 20%：流程可复现、参数可回溯"]}},"M05-K08":{"title":"蒙版与局部调整","anchor":"是局部调整胜过全局","source":"参考：《数字摄影基础教程》 · 色彩与后期（按目录对应）","sections":[{"h":"为什么是这样","p":"局部工具有线性渐变（压天空、加暗角）、径向（突出主体）、画笔（精修）、主体与天空自动选择。原则是先想清楚要改哪块改成什么样，再选工具，改完检查边缘过渡是否自然。风光与建筑几乎都要渐变压天空。后期的本质是把拍摄时的取舍补完，而不是重造一张照片。它的合法区间由原始数据决定：RAW 保留了传感器的宽容度，能救回一到两挡的高光与暗部；JPEG 已经被压缩过，可操作空间很小。调整顺序有讲究：先几何校正（水平、透视、裁切），再全局影调（曝光、对比、黑白场），再局部（蒙版、渐变、径向），最后锐化与降噪。顺序对了，每一步都在前一步的基础上做加法；顺序错了，就会不断推翻重来。"},{"h":"操作路径","p":"今天的练习：用线性渐变压暗天空，用径向提亮主体。练习方式是同一张 RAW 走两条路径：一条只做全局调整，一条加局部蒙版，导出后并排看差异，判断局部调整是否真的必要。每张照片的调整控制在五步以内，超出就说明拍摄时的判断有问题，要回头补拍而不是硬修。保存两个版本：一个可回溯的带调整记录的工程文件，一个导出成片用于发布。批量处理时先定一张基准，其余同步后再逐张微调，效率远高于一张张从零开始。"},{"h":"边界与代价","p":"典型翻车：全局提亮，天空一起过曝。后期的代价是可信度。暗部硬拉三挡以上会出现色噪与灰雾，天空拉回会导致边缘出现光晕，去雾拉满会让画面发灰发硬。人像磨皮一旦抹掉皮肤纹理，人物就塑料化了；锐化过量会让高对比边缘出现白边。也要防止后期成为拍摄随意的借口——「反正能修」是学习期最危险的想法，因为修不回来的东西远比能修的多。"},{"h":"怎么判断到位","p":"今天的判据：是局部调整胜过全局。先问：这次调整解决的是拍摄时的哪个失误，还是纯表达选择？再问：关掉所有局部调整，画面还成立吗？最后问：同一套参数能复现到另一张同场景照片上吗？能做到「克制、可复现、不掩盖问题」，后期就算合格。"}],"points":["是局部调整胜过全局","今天只验证这一个变量：能把调整限制在指定区域"],"pitfalls":["全局提亮，天空一起过曝"],"quiz":[{"q":"「蒙版与局部调整」的判断要点是什么？先说结论再谈理由。","a":"是局部调整胜过全局","why":"局部工具有线性渐变（压天空、加暗角）、径向（突出主体）、画笔（精修）、主体与天空自动选择"},{"q":"有人说：全局提亮，天空一起过曝。这样对吗？","a":"不对。是局部调整胜过全局","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"用线性渐变压暗天空，用径向提亮主体｜同一张 RAW 走两条调整路径，导出后对比","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 50%：高光与阴影可恢复、无明显噪点与光晕（每项 5 分制，任一不达标记 3 分以下）","表达 30%：调整克制、保留现场感","规范 20%：流程可复现、参数可回溯"]}},"M05-K09":{"title":"锐化与降噪","anchor":"是锐化有边界降噪会损细节","source":"参考：《数字摄影基础教程》 · 色彩与后期（按目录对应）","sections":[{"h":"为什么是这样","p":"锐化提升边缘对比，过量产生白边与颗粒；降噪抹平噪点同时抹掉细节。顺序是先降噪后锐化，并分区处理：天空与暗部多降噪，主体边缘适度锐化。输出尺寸越小越要少锐化。判断要放大到百分之百才准。后期是减法式精修：先去掉不该有的（偏色、脏点、歪斜），再强化该有的（主体对比、色彩关系），最后统一整组风格。有效的调整幅度通常很小，因为大部分问题在拍摄阶段就该解决。判断一张图是否修过头，最简单的办法是隔一天再看——当场看只会越看越顺眼。"},{"h":"操作路径","p":"今天的练习：一张高感图做轻度与重度降噪对比细节。建立固定处理顺序并存成预设：镜头校正→白平衡→曝光与黑白场→对比与清晰度→色彩→局部→锐化降噪→导出。同场景第一张调好后，其余只做曝光微调，保证组内一致。局部调整能不用就不用，一张图超过三个蒙版就该反思构图。导出前在手机上看一次，因为多数观者是在手机上看。"},{"h":"边界与代价","p":"典型翻车：锐化拉满，出现白边与噪点强化。后期的天花板由数据决定，RAW 也救不回全毁的高光。过度锐化在高对比边缘产生白边，过度降噪把纹理抹平，过度提亮让暗部浮灰。人像类边界更严：磨皮可以，改脸型比例就要谨慎并说明。纪实与新闻类原则上不做内容性修改，这是行业底线。"},{"h":"怎么判断到位","p":"今天的判据：是锐化有边界降噪会损细节。自检三问：这套调整解决的是缺陷还是表达？同组其他照片能套用吗？隔一天看还成立吗？"}],"points":["是锐化有边界降噪会损细节","今天只验证这一个变量：能分别对边缘与噪点做处理"],"pitfalls":["锐化拉满，出现白边与噪点强化"],"quiz":[{"q":"「锐化与降噪」的判断要点是什么？先说结论再谈理由。","a":"是锐化有边界降噪会损细节","why":"锐化提升边缘对比，过量产生白边与颗粒"},{"q":"有人说：锐化拉满，出现白边与噪点强化。这样对吗？","a":"不对。是锐化有边界降噪会损细节","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"一张高感图做轻度与重度降噪对比细节｜同一张 RAW 走两条调整路径，导出后对比","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 50%：高光与阴影可恢复、无明显噪点与光晕（每项 5 分制，任一不达标记 3 分以下）","表达 30%：调整克制、保留现场感","规范 20%：流程可复现、参数可回溯"]}},"M05-K10":{"title":"输出尺寸与格式","anchor":"是按用途定尺寸，不是一律原图","source":"参考：《数字摄影基础教程》 · 色彩与后期（按目录对应）","sections":[{"h":"为什么是这样","p":"网络分享长边 1600 到 2048 像素、sRGB、JPEG 质量 80 到 85 足够；冲印按 300dpi 计算，六寸约 1800 乘 1200；投稿看征稿要求。水印放角落低透明度，别压主体。导出前统一命名（日期-题材-序号）便于归档。后期的本质是把拍摄时的取舍补完，而不是重造一张照片。它的合法区间由原始数据决定：RAW 保留了传感器的宽容度，能救回一到两挡的高光与暗部；JPEG 已经被压缩过，可操作空间很小。调整顺序有讲究：先几何校正（水平、透视、裁切），再全局影调（曝光、对比、黑白场），再局部（蒙版、渐变、径向），最后锐化与降噪。顺序对了，每一步都在前一步的基础上做加法；顺序错了，就会不断推翻重来。"},{"h":"操作路径","p":"今天的练习：同一张图导出网络长边两千像素版与打印版对比。练习方式是同一张 RAW 走两条路径：一条只做全局调整，一条加局部蒙版，导出后并排看差异，判断局部调整是否真的必要。每张照片的调整控制在五步以内，超出就说明拍摄时的判断有问题，要回头补拍而不是硬修。保存两个版本：一个可回溯的带调整记录的工程文件，一个导出成片用于发布。批量处理时先定一张基准，其余同步后再逐张微调，效率远高于一张张从零开始。"},{"h":"边界与代价","p":"典型翻车：发网用六千像素原图，加载慢还易被盗。后期的代价是可信度。暗部硬拉三挡以上会出现色噪与灰雾，天空拉回会导致边缘出现光晕，去雾拉满会让画面发灰发硬。人像磨皮一旦抹掉皮肤纹理，人物就塑料化了；锐化过量会让高对比边缘出现白边。也要防止后期成为拍摄随意的借口——「反正能修」是学习期最危险的想法，因为修不回来的东西远比能修的多。"},{"h":"怎么判断到位","p":"今天的判据：是按用途定尺寸，不是一律原图。先问：这次调整解决的是拍摄时的哪个失误，还是纯表达选择？再问：关掉所有局部调整，画面还成立吗？最后问：同一套参数能复现到另一张同场景照片上吗？能做到「克制、可复现、不掩盖问题」，后期就算合格。"}],"points":["是按用途定尺寸，不是一律原图","今天只验证这一个变量：能按用途导出合适尺寸与格式"],"pitfalls":["发网用六千像素原图，加载慢还易被盗"],"quiz":[{"q":"「输出尺寸与格式」的判断要点是什么？先说结论再谈理由。","a":"是按用途定尺寸，不是一律原图","why":"网络分享长边 1600 到 2048 像素、sRGB、JPEG 质量 80 到 85 足够"},{"q":"有人说：发网用六千像素原图，加载慢还易被盗。这样对吗？","a":"不对。是按用途定尺寸，不是一律原图","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"同一张图导出网络长边两千像素版与打印版对比｜同一张 RAW 走两条调整路径，导出后对比","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 50%：高光与阴影可恢复、无明显噪点与光晕（每项 5 分制，任一不达标记 3 分以下）","表达 30%：调整克制、保留现场感","规范 20%：流程可复现、参数可回溯"]}},"M06-K01":{"title":"人像焦段选择","anchor":"是焦段配拍摄距离，不是 85 最好","source":"参考：《美国摄影教程》第12版 · 人像 · 人像专题（按目录对应）","sections":[{"h":"为什么是这样","p":"35mm 适合环境人像与室内，需要靠近；50mm 中性自然，适合半身与日常；85 到 135mm 压缩背景、脸型最讨喜，适合户外半身与特写。焦段的本质是拍摄距离：太近透视变形，太远压缩扁平。人像的核心不是把人拍清楚，而是让被摄者看起来像他自己、而且状态松弛。技术上要控制三件事：焦段带来的透视（35mm 带环境、50mm 接近观感、85mm 起压缩背景）、光圈带来的景深（f/2 前后能分离背景，f/5.6 交代环境）、光线带来的皮肤质感（大面积柔光最讨喜，硬光强调结构但会放大瑕疵）。人像的成败一半在沟通：让对方有事可做、有处可看，僵硬感就会消失。"},{"h":"操作路径","p":"今天的练习：同一个人用 35、50、85 各拍半身，比较脸型与背景。拍摄流程：先定环境与机位，让背景干净或有明确层次；再定光——窗光让被摄者侧对窗口 45 度，室内用白墙补暗部；然后对焦到近侧眼睛，用单点对焦并确认对焦点真的落在眼睛上。光圈从 f/2.8 起试，太虚就往回收。沟通上给具体指令而非抽象要求：不要说「自然一点」，要说「手扶一下领口，看我这边，呼气」。连拍抓状态，但每十张停下来给对方看一张，反馈会让后半段明显更好。"},{"h":"边界与代价","p":"典型翻车：用 24mm 拍半身，鼻子变大。人像的代价集中在「过」与「假」。磨皮过度会抹掉皮肤纹理与年龄特征，人物变成塑料；瘦脸液化过度会让背景线条弯曲穿帮；大光圈全开会让近侧眼睛在焦而远侧眼睛糊掉，正面拍尤其明显。逆光人像不补光就只剩剪影，补光过强又失去氛围。还要尊重边界：未经同意不发布、不修图改人、不拍让人不适的角度，这既是伦理也是专业底线。"},{"h":"怎么判断到位","p":"今天的判据：是焦段配拍摄距离，不是 85 最好。先问：近侧眼睛在焦内吗，放大到 100% 看还锐吗？再问：被摄者的姿态和视线是有意的还是僵的？最后问：背景是在交代环境还是在抢主体？三问过后再看肤色与整体，人像的合格线是「自然、有神、不假」。"}],"points":["是焦段配拍摄距离，不是 85 最好","今天只验证这一个变量：能按场景选 35、50、85"],"pitfalls":["用 24mm 拍半身，鼻子变大"],"quiz":[{"q":"「人像焦段选择」的判断要点是什么？先说结论再谈理由。","a":"是焦段配拍摄距离，不是 85 最好","why":"35mm 适合环境人像与室内，需要靠近"},{"q":"有人说：用 24mm 拍半身，鼻子变大。这样对吗？","a":"不对。是焦段配拍摄距离，不是 85 最好","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"同一个人用 35、50、85 各拍半身，比较脸型与背景｜定焦 35/50/85 任一，f/2–2.8，对焦人眼，窗光 45 度侧对","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 35%：近侧眼睛在焦内、肤色自然、无红眼（每项 5 分制，任一不达标记 3 分以下）","表达 45%：姿态不僵硬、视线有意、背景不抢","规范 20%：未过度磨皮、未拉伸变形"]}},"M06-K02":{"title":"窗光人像","anchor":"是侧对窗，不是正对窗","source":"参考：《美国摄影教程》第12版 · 人像 · 人像专题（按目录对应）","sections":[{"h":"为什么是这样","p":"窗光是天然大柔光箱。让模特与窗成四十五度，亮面朝窗、暗面靠室内反射，形成自然立体；退后一步过渡更柔，靠近更强。背景选暗处可突出轮廓，注意别让窗框切头。阴天窗光更均匀，晴天要避直射。人像的技术分层是先保底线、再谈风格。底线三条：焦在近侧眼睛、肤色不发绿不发灰、背景不穿过头顶。上层才是风格：环境人像还是特写、亮调还是低调、正面还是侧背。拍摄前先问清用途——证件、社交头像、家庭记录、作品集，四种用途对构图、光比、后期程度的要求完全不同，先定用途能省掉一半返工。人像的难处在被摄者，不在相机。"},{"h":"操作路径","p":"今天的练习：让模特侧对窗四十五度，正对与侧对各拍一张。让被摄者先做动作再定格，而不是先站好再摆姿势。走动、转身、整理衣领、抬手挡光，这些动作之间的中间帧最自然。机位高度决定观感：略高于眼位显瘦、与眼平显自然、略低显气场但易露鼻孔。每换一个位置先拍一张测试帧，确认曝光与对焦再正式拍。一组控制在二十分钟内，注意力衰减后效率会断崖下跌，宁可分两次拍。"},{"h":"边界与代价","p":"典型翻车：正对窗户，脸平无立体。人像的边界是尊重：不要求被摄者做让其不适的动作、不在未同意时发布、不把改变其身体特征当作默认操作。技术上的边界是景深——f/1.4 全开时眼睛与鼻尖都不在同一焦平面，正面近摄尤其明显，必要时收到 f/2.8 换容错。环境人像若背景信息过多，主体会被稀释，必须在「交代环境」与「不抢主体」之间选一边站。"},{"h":"怎么判断到位","p":"今天的判据：是侧对窗，不是正对窗。自检三问：底线三条（对焦、肤色、背景）都过了吗？机位高度是有意选的吗？这组照片的用途决定了我的取舍吗？"}],"points":["是侧对窗，不是正对窗","今天只验证这一个变量：能用一扇窗完成柔和立体的人像"],"pitfalls":["正对窗户，脸平无立体"],"quiz":[{"q":"「窗光人像」的判断要点是什么？先说结论再谈理由。","a":"是侧对窗，不是正对窗","why":"窗光是天然大柔光箱"},{"q":"有人说：正对窗户，脸平无立体。这样对吗？","a":"不对。是侧对窗，不是正对窗","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"让模特侧对窗四十五度，正对与侧对各拍一张｜定焦 35/50/85 任一，f/2–2.8，对焦人眼，窗光 45 度侧对","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 35%：近侧眼睛在焦内、肤色自然、无红眼（每项 5 分制，任一不达标记 3 分以下）","表达 45%：姿态不僵硬、视线有意、背景不抢","规范 20%：未过度磨皮、未拉伸变形"]}},"M06-K03":{"title":"眼神光与眼部对焦","anchor":"是眼睛才是焦点，不是脸清楚就行","source":"参考：《美国摄影教程》第12版 · 人像 · 人像专题（按目录对应）","sections":[{"h":"为什么是这样","p":"人像的焦点标准是近侧眼睛，大光圈下睫毛与瞳孔都要在焦内，必要时收一档。眼神光是瞳孔里的高光点，来自窗、灯、反光板，缺时用一小块白纸或手机屏幕补一个光点。拍完放大检查眼睛。人像的核心不是把人拍清楚，而是让被摄者看起来像他自己、而且状态松弛。技术上要控制三件事：焦段带来的透视（35mm 带环境、50mm 接近观感、85mm 起压缩背景）、光圈带来的景深（f/2 前后能分离背景，f/5.6 交代环境）、光线带来的皮肤质感（大面积柔光最讨喜，硬光强调结构但会放大瑕疵）。人像的成败一半在沟通：让对方有事可做、有处可看，僵硬感就会消失。"},{"h":"操作路径","p":"今天的练习：拍三张不同光源位置的人像，看瞳孔光点。拍摄流程：先定环境与机位，让背景干净或有明确层次；再定光——窗光让被摄者侧对窗口 45 度，室内用白墙补暗部；然后对焦到近侧眼睛，用单点对焦并确认对焦点真的落在眼睛上。光圈从 f/2.8 起试，太虚就往回收。沟通上给具体指令而非抽象要求：不要说「自然一点」，要说「手扶一下领口，看我这边，呼气」。连拍抓状态，但每十张停下来给对方看一张，反馈会让后半段明显更好。"},{"h":"边界与代价","p":"典型翻车：焦点在鼻尖，眼睛发虚。人像的代价集中在「过」与「假」。磨皮过度会抹掉皮肤纹理与年龄特征，人物变成塑料；瘦脸液化过度会让背景线条弯曲穿帮；大光圈全开会让近侧眼睛在焦而远侧眼睛糊掉，正面拍尤其明显。逆光人像不补光就只剩剪影，补光过强又失去氛围。还要尊重边界：未经同意不发布、不修图改人、不拍让人不适的角度，这既是伦理也是专业底线。"},{"h":"怎么判断到位","p":"今天的判据：是眼睛才是焦点，不是脸清楚就行。先问：近侧眼睛在焦内吗，放大到 100% 看还锐吗？再问：被摄者的姿态和视线是有意的还是僵的？最后问：背景是在交代环境还是在抢主体？三问过后再看肤色与整体，人像的合格线是「自然、有神、不假」。"}],"points":["是眼睛才是焦点，不是脸清楚就行","今天只验证这一个变量：能保证眼睛清晰且有光点"],"pitfalls":["焦点在鼻尖，眼睛发虚"],"quiz":[{"q":"「眼神光与眼部对焦」的判断要点是什么？先说结论再谈理由。","a":"是眼睛才是焦点，不是脸清楚就行","why":"人像的焦点标准是近侧眼睛，大光圈下睫毛与瞳孔都要在焦内，必要时收一档"},{"q":"有人说：焦点在鼻尖，眼睛发虚。这样对吗？","a":"不对。是眼睛才是焦点，不是脸清楚就行","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"拍三张不同光源位置的人像，看瞳孔光点｜定焦 35/50/85 任一，f/2–2.8，对焦人眼，窗光 45 度侧对","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 35%：近侧眼睛在焦内、肤色自然、无红眼（每项 5 分制，任一不达标记 3 分以下）","表达 45%：姿态不僵硬、视线有意、背景不抢","规范 20%：未过度磨皮、未拉伸变形"]}},"M06-K04":{"title":"姿态与体态","anchor":"是给动作不给摆姿","source":"参考：《美国摄影教程》第12版 · 人像 · 人像专题（按目录对应）","sections":[{"h":"为什么是这样","p":"僵硬来自对称与用力。做法是重心移到一条腿、肩膀一高一低、手臂与身体留缝（避免贴合显粗）、下巴略前伸消除双下巴、手找事做（扶帽、拨发、拿杯）。给动作而不是姿势，人在运动中更自然。人像的核心不是把人拍清楚，而是让被摄者看起来像他自己、而且状态松弛。技术上要控制三件事：焦段带来的透视（35mm 带环境、50mm 接近观感、85mm 起压缩背景）、光圈带来的景深（f/2 前后能分离背景，f/5.6 交代环境）、光线带来的皮肤质感（大面积柔光最讨喜，硬光强调结构但会放大瑕疵）。人像的成败一半在沟通：让对方有事可做、有处可看，僵硬感就会消失。"},{"h":"操作路径","p":"今天的练习：用三个口令拍同一人：重心移一侧、手找事做、下巴前伸。拍摄流程：先定环境与机位，让背景干净或有明确层次；再定光——窗光让被摄者侧对窗口 45 度，室内用白墙补暗部；然后对焦到近侧眼睛，用单点对焦并确认对焦点真的落在眼睛上。光圈从 f/2.8 起试，太虚就往回收。沟通上给具体指令而非抽象要求：不要说「自然一点」，要说「手扶一下领口，看我这边，呼气」。连拍抓状态，但每十张停下来给对方看一张，反馈会让后半段明显更好。"},{"h":"边界与代价","p":"典型翻车：直挺站着，肩膀僵硬。人像的代价集中在「过」与「假」。磨皮过度会抹掉皮肤纹理与年龄特征，人物变成塑料；瘦脸液化过度会让背景线条弯曲穿帮；大光圈全开会让近侧眼睛在焦而远侧眼睛糊掉，正面拍尤其明显。逆光人像不补光就只剩剪影，补光过强又失去氛围。还要尊重边界：未经同意不发布、不修图改人、不拍让人不适的角度，这既是伦理也是专业底线。"},{"h":"怎么判断到位","p":"今天的判据：是给动作不给摆姿。先问：近侧眼睛在焦内吗，放大到 100% 看还锐吗？再问：被摄者的姿态和视线是有意的还是僵的？最后问：背景是在交代环境还是在抢主体？三问过后再看肤色与整体，人像的合格线是「自然、有神、不假」。"}],"points":["是给动作不给摆姿","今天只验证这一个变量：能用口令调整体态避免僵硬"],"pitfalls":["直挺站着，肩膀僵硬"],"quiz":[{"q":"「姿态与体态」的判断要点是什么？先说结论再谈理由。","a":"是给动作不给摆姿","why":"僵硬来自对称与用力"},{"q":"有人说：直挺站着，肩膀僵硬。这样对吗？","a":"不对。是给动作不给摆姿","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"用三个口令拍同一人：重心移一侧、手找事做、下巴前伸｜定焦 35/50/85 任一，f/2–2.8，对焦人眼，窗光 45 度侧对","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 35%：近侧眼睛在焦内、肤色自然、无红眼（每项 5 分制，任一不达标记 3 分以下）","表达 45%：姿态不僵硬、视线有意、背景不抢","规范 20%：未过度磨皮、未拉伸变形"]}},"M06-K05":{"title":"表情与情绪引导","anchor":"是制造情境，不是喊笑一个","source":"参考：《美国摄影教程》第12版 · 人像 · 人像专题（按目录对应）","sections":[{"h":"为什么是这样","p":"真实表情来自情境而非指令。可用让对方讲开心事、回忆尴尬瞬间、突然数数、走动中回头、假装被叫住。连拍抓过渡瞬间比单张摆拍有效。眼神方向决定情绪：看镜头是交流，看画外是叙事。人像的技术分层是先保底线、再谈风格。底线三条：焦在近侧眼睛、肤色不发绿不发灰、背景不穿过头顶。上层才是风格：环境人像还是特写、亮调还是低调、正面还是侧背。拍摄前先问清用途——证件、社交头像、家庭记录、作品集，四种用途对构图、光比、后期程度的要求完全不同，先定用途能省掉一半返工。人像的难处在被摄者，不在相机。"},{"h":"操作路径","p":"今天的练习：用提问或小动作逗出三次真实笑。让被摄者先做动作再定格，而不是先站好再摆姿势。走动、转身、整理衣领、抬手挡光，这些动作之间的中间帧最自然。机位高度决定观感：略高于眼位显瘦、与眼平显自然、略低显气场但易露鼻孔。每换一个位置先拍一张测试帧，确认曝光与对焦再正式拍。一组控制在二十分钟内，注意力衰减后效率会断崖下跌，宁可分两次拍。"},{"h":"边界与代价","p":"典型翻车：一直喊笑，得到僵硬露牙。人像的边界是尊重：不要求被摄者做让其不适的动作、不在未同意时发布、不把改变其身体特征当作默认操作。技术上的边界是景深——f/1.4 全开时眼睛与鼻尖都不在同一焦平面，正面近摄尤其明显，必要时收到 f/2.8 换容错。环境人像若背景信息过多，主体会被稀释，必须在「交代环境」与「不抢主体」之间选一边站。"},{"h":"怎么判断到位","p":"今天的判据：是制造情境，不是喊笑一个。自检三问：底线三条（对焦、肤色、背景）都过了吗？机位高度是有意选的吗？这组照片的用途决定了我的取舍吗？"}],"points":["是制造情境，不是喊笑一个","今天只验证这一个变量：能引导出真实表情而非假笑"],"pitfalls":["一直喊笑，得到僵硬露牙"],"quiz":[{"q":"「表情与情绪引导」的判断要点是什么？先说结论再谈理由。","a":"是制造情境，不是喊笑一个","why":"真实表情来自情境而非指令"},{"q":"有人说：一直喊笑，得到僵硬露牙。这样对吗？","a":"不对。是制造情境，不是喊笑一个","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"用提问或小动作逗出三次真实笑｜定焦 35/50/85 任一，f/2–2.8，对焦人眼，窗光 45 度侧对","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 35%：近侧眼睛在焦内、肤色自然、无红眼（每项 5 分制，任一不达标记 3 分以下）","表达 45%：姿态不僵硬、视线有意、背景不抢","规范 20%：未过度磨皮、未拉伸变形"]}},"M06-K06":{"title":"环境人像与背景","anchor":"是背景要有关联，不是找最干净","source":"参考：《美国摄影教程》第12版 · 人像 · 人像专题（按目录对应）","sections":[{"h":"为什么是这样","p":"环境人像用背景交代职业、性格、场景，比纯虚化更有信息量。做法是选与人物有关的元素（书、工具、街景），用大光圈分离但保留可辨识轮廓，避开高亮块与穿头电线。背景可以乱但不能抢：眯眼看第一眼落在哪。人像的核心不是把人拍清楚，而是让被摄者看起来像他自己、而且状态松弛。技术上要控制三件事：焦段带来的透视（35mm 带环境、50mm 接近观感、85mm 起压缩背景）、光圈带来的景深（f/2 前后能分离背景，f/5.6 交代环境）、光线带来的皮肤质感（大面积柔光最讨喜，硬光强调结构但会放大瑕疵）。人像的成败一半在沟通：让对方有事可做、有处可看，僵硬感就会消失。"},{"h":"操作路径","p":"今天的练习：同一人在杂乱与有序背景各拍一张。拍摄流程：先定环境与机位，让背景干净或有明确层次；再定光——窗光让被摄者侧对窗口 45 度，室内用白墙补暗部；然后对焦到近侧眼睛，用单点对焦并确认对焦点真的落在眼睛上。光圈从 f/2.8 起试，太虚就往回收。沟通上给具体指令而非抽象要求：不要说「自然一点」，要说「手扶一下领口，看我这边，呼气」。连拍抓状态，但每十张停下来给对方看一张，反馈会让后半段明显更好。"},{"h":"边界与代价","p":"典型翻车：背景有亮块或行人抢视线。人像的代价集中在「过」与「假」。磨皮过度会抹掉皮肤纹理与年龄特征，人物变成塑料；瘦脸液化过度会让背景线条弯曲穿帮；大光圈全开会让近侧眼睛在焦而远侧眼睛糊掉，正面拍尤其明显。逆光人像不补光就只剩剪影，补光过强又失去氛围。还要尊重边界：未经同意不发布、不修图改人、不拍让人不适的角度，这既是伦理也是专业底线。"},{"h":"怎么判断到位","p":"今天的判据：是背景要有关联，不是找最干净。先问：近侧眼睛在焦内吗，放大到 100% 看还锐吗？再问：被摄者的姿态和视线是有意的还是僵的？最后问：背景是在交代环境还是在抢主体？三问过后再看肤色与整体，人像的合格线是「自然、有神、不假」。"}],"points":["是背景要有关联，不是找最干净","今天只验证这一个变量：能让背景交代身份而不抢主体"],"pitfalls":["背景有亮块或行人抢视线"],"quiz":[{"q":"「环境人像与背景」的判断要点是什么？先说结论再谈理由。","a":"是背景要有关联，不是找最干净","why":"环境人像用背景交代职业、性格、场景，比纯虚化更有信息量"},{"q":"有人说：背景有亮块或行人抢视线。这样对吗？","a":"不对。是背景要有关联，不是找最干净","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"同一人在杂乱与有序背景各拍一张｜定焦 35/50/85 任一，f/2–2.8，对焦人眼，窗光 45 度侧对","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 35%：近侧眼睛在焦内、肤色自然、无红眼（每项 5 分制，任一不达标记 3 分以下）","表达 45%：姿态不僵硬、视线有意、背景不抢","规范 20%：未过度磨皮、未拉伸变形"]}},"M06-K07":{"title":"户外人像时段与地点","anchor":"是选时段选背景方向，不是到了就拍","source":"参考：《美国摄影教程》第12版 · 人像 · 人像专题（按目录对应）","sections":[{"h":"为什么是这样","p":"优先黄金时段或阴天；正午要找阴影边缘（树荫、建筑阴影）当柔光，或用反光板补。地点看三点：背景层次、地面颜色（浅色反光好看）、有无遮挡物制造光影。提前踩点比现场找角度省时。人像的核心不是把人拍清楚，而是让被摄者看起来像他自己、而且状态松弛。技术上要控制三件事：焦段带来的透视（35mm 带环境、50mm 接近观感、85mm 起压缩背景）、光圈带来的景深（f/2 前后能分离背景，f/5.6 交代环境）、光线带来的皮肤质感（大面积柔光最讨喜，硬光强调结构但会放大瑕疵）。人像的成败一半在沟通：让对方有事可做、有处可看，僵硬感就会消失。"},{"h":"操作路径","p":"今天的练习：在黄金时段找一处逆光机位拍一组。拍摄流程：先定环境与机位，让背景干净或有明确层次；再定光——窗光让被摄者侧对窗口 45 度，室内用白墙补暗部；然后对焦到近侧眼睛，用单点对焦并确认对焦点真的落在眼睛上。光圈从 f/2.8 起试，太虚就往回收。沟通上给具体指令而非抽象要求：不要说「自然一点」，要说「手扶一下领口，看我这边，呼气」。连拍抓状态，但每十张停下来给对方看一张，反馈会让后半段明显更好。"},{"h":"边界与代价","p":"典型翻车：正午在水泥地拍，脸上阴影硬。人像的代价集中在「过」与「假」。磨皮过度会抹掉皮肤纹理与年龄特征，人物变成塑料；瘦脸液化过度会让背景线条弯曲穿帮；大光圈全开会让近侧眼睛在焦而远侧眼睛糊掉，正面拍尤其明显。逆光人像不补光就只剩剪影，补光过强又失去氛围。还要尊重边界：未经同意不发布、不修图改人、不拍让人不适的角度，这既是伦理也是专业底线。"},{"h":"怎么判断到位","p":"今天的判据：是选时段选背景方向，不是到了就拍。先问：近侧眼睛在焦内吗，放大到 100% 看还锐吗？再问：被摄者的姿态和视线是有意的还是僵的？最后问：背景是在交代环境还是在抢主体？三问过后再看肤色与整体，人像的合格线是「自然、有神、不假」。"}],"points":["是选时段选背景方向，不是到了就拍","今天只验证这一个变量：能规划一次户外人像的时间与机位"],"pitfalls":["正午在水泥地拍，脸上阴影硬"],"quiz":[{"q":"「户外人像时段与地点」的判断要点是什么？先说结论再谈理由。","a":"是选时段选背景方向，不是到了就拍","why":"优先黄金时段或阴天"},{"q":"有人说：正午在水泥地拍，脸上阴影硬。这样对吗？","a":"不对。是选时段选背景方向，不是到了就拍","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"在黄金时段找一处逆光机位拍一组｜定焦 35/50/85 任一，f/2–2.8，对焦人眼，窗光 45 度侧对","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 35%：近侧眼睛在焦内、肤色自然、无红眼（每项 5 分制，任一不达标记 3 分以下）","表达 45%：姿态不僵硬、视线有意、背景不抢","规范 20%：未过度磨皮、未拉伸变形"]}},"M06-K08":{"title":"肤色还原","anchor":"是橙色的明度与饱和决定肤色","source":"参考：《美国摄影教程》第12版 · 人像 · 人像专题（按目录对应）","sections":[{"h":"为什么是这样","p":"肤色主色相在橙红之间。健康肤色是橙色饱和适中、明度略高于环境；发黄多为色温偏暖或橙色饱和过高，发红是品红偏移或红饱和过高。后期用 HSL 微调橙色并局部提亮面部暗沉区，比全局改色温安全。拍摄阶段靠白平衡与补光解决大半。人像的技术分层是先保底线、再谈风格。底线三条：焦在近侧眼睛、肤色不发绿不发灰、背景不穿过头顶。上层才是风格：环境人像还是特写、亮调还是低调、正面还是侧背。拍摄前先问清用途——证件、社交头像、家庭记录、作品集，四种用途对构图、光比、后期程度的要求完全不同，先定用途能省掉一半返工。人像的难处在被摄者，不在相机。"},{"h":"操作路径","p":"今天的练习：用 HSL 只调橙色，比较肤色变化。让被摄者先做动作再定格，而不是先站好再摆姿势。走动、转身、整理衣领、抬手挡光，这些动作之间的中间帧最自然。机位高度决定观感：略高于眼位显瘦、与眼平显自然、略低显气场但易露鼻孔。每换一个位置先拍一张测试帧，确认曝光与对焦再正式拍。一组控制在二十分钟内，注意力衰减后效率会断崖下跌，宁可分两次拍。"},{"h":"边界与代价","p":"典型翻车：整体加暖，脸发黄发橙。人像的边界是尊重：不要求被摄者做让其不适的动作、不在未同意时发布、不把改变其身体特征当作默认操作。技术上的边界是景深——f/1.4 全开时眼睛与鼻尖都不在同一焦平面，正面近摄尤其明显，必要时收到 f/2.8 换容错。环境人像若背景信息过多，主体会被稀释，必须在「交代环境」与「不抢主体」之间选一边站。"},{"h":"怎么判断到位","p":"今天的判据：是橙色的明度与饱和决定肤色。自检三问：底线三条（对焦、肤色、背景）都过了吗？机位高度是有意选的吗？这组照片的用途决定了我的取舍吗？"}],"points":["是橙色的明度与饱和决定肤色","今天只验证这一个变量：能让人像肤色自然不脏"],"pitfalls":["整体加暖，脸发黄发橙"],"quiz":[{"q":"「肤色还原」的判断要点是什么？先说结论再谈理由。","a":"是橙色的明度与饱和决定肤色","why":"肤色主色相在橙红之间"},{"q":"有人说：整体加暖，脸发黄发橙。这样对吗？","a":"不对。是橙色的明度与饱和决定肤色","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"用 HSL 只调橙色，比较肤色变化｜定焦 35/50/85 任一，f/2–2.8，对焦人眼，窗光 45 度侧对","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 35%：近侧眼睛在焦内、肤色自然、无红眼（每项 5 分制，任一不达标记 3 分以下）","表达 45%：姿态不僵硬、视线有意、背景不抢","规范 20%：未过度磨皮、未拉伸变形"]}},"M07-K01":{"title":"风光前期规划","anchor":"是看光线与天气，不是看景点","source":"参考：《美国摄影教程》第12版 · 风光与建筑 · 风光与建筑（按目录对应）","sections":[{"h":"为什么是这样","p":"风光三要素是光线、天气、机位。查日出日落与蓝调时刻、云量与能见度，判断有无戏剧性天空；提前在地图与实景照片上定机位与构图，留三十分钟余量。阴天可拍长曝与细节，晴天拍日出日落，雨后常有通透与倒影。风光摄影拍的是光，不是景。同一个地点在日出前二十分钟、日出后十分钟、正午、蓝调时刻是完全不同的四张照片。技术上要处理三件事：光比（天空与地面差三到五挡是常态）、景深（f/8 到 f/11 通常是画质与景深的平衡点）、稳定性（长曝必须三脚架加延时或遥控）。构图上靠前景建立纵深，让观者的视线有落脚点，再用中景与远景形成层次，而不是把一座山摆在画面中间就完事。"},{"h":"操作路径","p":"今天的练习：用天气与日出日落时间规划一次拍摄。流程：提前踩点或用软件查日出日落方位与时间，提前四十分钟到位；架三脚架、关防抖、用 f/8 起、ISO 100、开实时取景放大十倍手动对焦到超焦距或前中景；先拍一张看直方图，确保高光不溢出（宁欠勿过），必要时包围曝光三张。构图先定地平线位置（决定天空与地面的权重），再找前景，最后检查四角有没有杂物。蓝调时刻前后各留十分钟，那往往是色彩最干净的时候。"},{"h":"边界与代价","p":"典型翻车：到了现场光已过，白跑一趟。风光的代价是真实性。多张合成、换天、拉回高光，都会让画面偏离现场，作为表达可以，但要自己心里清楚并在需要时说明。过度 HDR 会让云层发灰、边缘出光晕；长曝把水面抹成丝绸很美，但也抹掉了波浪的质感信息。天气不配合是常态，阴天拍不出通透就该换题材，而不是硬拉对比把画面调脏。景区拍摄还要注意不越界、不破坏植被、不影响他人。"},{"h":"怎么判断到位","p":"今天的判据：是看光线与天气，不是看景点。先问：这张的光是等来的还是碰上的，能说出它是什么时段吗？再问：前景、中景、背景三层都有内容吗？最后问：高光有没有死白，地平线平不平？风光片的及格线是「光对、层清、不过火」。"}],"points":["是看光线与天气，不是看景点","今天只验证这一个变量：能在出门前判断拍摄可行性"],"pitfalls":["到了现场光已过，白跑一趟"],"quiz":[{"q":"「风光前期规划」的判断要点是什么？先说结论再谈理由。","a":"是看光线与天气，不是看景点","why":"风光三要素是光线、天气、机位"},{"q":"有人说：到了现场光已过，白跑一趟。这样对吗？","a":"不对。是看光线与天气，不是看景点","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"用天气与日出日落时间规划一次拍摄｜广角 + 三脚架，f/8–f/11，ISO 100，蓝调时刻前后 30 分钟","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：高光有层次、地平线水平、景深覆盖前后景（每项 5 分制，任一不达标记 3 分以下）","表达 35%：前景与远景有纵深、光比有取舍","规范 20%：未过度合成、未换天"]}},"M07-K02":{"title":"三脚架与长曝","anchor":"是关防抖上架锁死，不是架上就稳","source":"参考：《美国摄影教程》第12版 · 风光与建筑 · 风光与建筑（按目录对应）","sections":[{"h":"为什么是这样","p":"长曝要点：关镜头防抖（防抖自身会抖）、接受长曝降噪的处理时间、用快门线或两秒延时、避免中轴升高、风大挂重物、把脚管压稳。三十秒以上可用 B 门。检查方式是放大到百分之百看远处细节是否扎实。风光摄影拍的是光，不是景。同一个地点在日出前二十分钟、日出后十分钟、正午、蓝调时刻是完全不同的四张照片。技术上要处理三件事：光比（天空与地面差三到五挡是常态）、景深（f/8 到 f/11 通常是画质与景深的平衡点）、稳定性（长曝必须三脚架加延时或遥控）。构图上靠前景建立纵深，让观者的视线有落脚点，再用中景与远景形成层次，而不是把一座山摆在画面中间就完事。"},{"h":"操作路径","p":"今天的练习：用两秒与三十秒各拍一张水面。流程：提前踩点或用软件查日出日落方位与时间，提前四十分钟到位；架三脚架、关防抖、用 f/8 起、ISO 100、开实时取景放大十倍手动对焦到超焦距或前中景；先拍一张看直方图，确保高光不溢出（宁欠勿过），必要时包围曝光三张。构图先定地平线位置（决定天空与地面的权重），再找前景，最后检查四角有没有杂物。蓝调时刻前后各留十分钟，那往往是色彩最干净的时候。"},{"h":"边界与代价","p":"典型翻车：架上仍糊，忘关防抖或用轻架。风光的代价是真实性。多张合成、换天、拉回高光，都会让画面偏离现场，作为表达可以，但要自己心里清楚并在需要时说明。过度 HDR 会让云层发灰、边缘出光晕；长曝把水面抹成丝绸很美，但也抹掉了波浪的质感信息。天气不配合是常态，阴天拍不出通透就该换题材，而不是硬拉对比把画面调脏。景区拍摄还要注意不越界、不破坏植被、不影响他人。"},{"h":"怎么判断到位","p":"今天的判据：是关防抖上架锁死，不是架上就稳。先问：这张的光是等来的还是碰上的，能说出它是什么时段吗？再问：前景、中景、背景三层都有内容吗？最后问：高光有没有死白，地平线平不平？风光片的及格线是「光对、层清、不过火」。"}],"points":["是关防抖上架锁死，不是架上就稳","今天只验证这一个变量：能用三脚架完成一秒以上曝光"],"pitfalls":["架上仍糊，忘关防抖或用轻架"],"quiz":[{"q":"「三脚架与长曝」的判断要点是什么？先说结论再谈理由。","a":"是关防抖上架锁死，不是架上就稳","why":"长曝要点：关镜头防抖（防抖自身会抖）、接受长曝降噪的处理时间、用快门线或两秒延时、避免中轴升高、风大挂重物、把脚管压稳"},{"q":"有人说：架上仍糊，忘关防抖或用轻架。这样对吗？","a":"不对。是关防抖上架锁死，不是架上就稳","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"用两秒与三十秒各拍一张水面｜广角 + 三脚架，f/8–f/11，ISO 100，蓝调时刻前后 30 分钟","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：高光有层次、地平线水平、景深覆盖前后景（每项 5 分制，任一不达标记 3 分以下）","表达 35%：前景与远景有纵深、光比有取舍","规范 20%：未过度合成、未换天"]}},"M07-K03":{"title":"ND 与渐变镜","anchor":"是 ND 减全画面渐变减局部","source":"参考：《美国摄影教程》第12版 · 风光与建筑 · 风光与建筑（按目录对应）","sections":[{"h":"为什么是这样","p":"ND 减光镜整体减光，用于白天长曝（流水、云、空街）；圆渐变压天空，但地平线不平时会露痕迹；反向渐变适合日出日落，最亮处在地平线。用渐变前先想：包围合成或后期蒙版往往更灵活。风光摄影拍的是光，不是景。同一个地点在日出前二十分钟、日出后十分钟、正午、蓝调时刻是完全不同的四张照片。技术上要处理三件事：光比（天空与地面差三到五挡是常态）、景深（f/8 到 f/11 通常是画质与景深的平衡点）、稳定性（长曝必须三脚架加延时或遥控）。构图上靠前景建立纵深，让观者的视线有落脚点，再用中景与远景形成层次，而不是把一座山摆在画面中间就完事。"},{"h":"操作路径","p":"今天的练习：用十档 ND 把白天流水拍成丝滑。流程：提前踩点或用软件查日出日落方位与时间，提前四十分钟到位；架三脚架、关防抖、用 f/8 起、ISO 100、开实时取景放大十倍手动对焦到超焦距或前中景；先拍一张看直方图，确保高光不溢出（宁欠勿过），必要时包围曝光三张。构图先定地平线位置（决定天空与地面的权重），再找前景，最后检查四角有没有杂物。蓝调时刻前后各留十分钟，那往往是色彩最干净的时候。"},{"h":"边界与代价","p":"典型翻车：用渐变镜拍有树的天际线，出现暗边。风光的代价是真实性。多张合成、换天、拉回高光，都会让画面偏离现场，作为表达可以，但要自己心里清楚并在需要时说明。过度 HDR 会让云层发灰、边缘出光晕；长曝把水面抹成丝绸很美，但也抹掉了波浪的质感信息。天气不配合是常态，阴天拍不出通透就该换题材，而不是硬拉对比把画面调脏。景区拍摄还要注意不越界、不破坏植被、不影响他人。"},{"h":"怎么判断到位","p":"今天的判据：是 ND 减全画面渐变减局部。先问：这张的光是等来的还是碰上的，能说出它是什么时段吗？再问：前景、中景、背景三层都有内容吗？最后问：高光有没有死白，地平线平不平？风光片的及格线是「光对、层清、不过火」。"}],"points":["是 ND 减全画面渐变减局部","今天只验证这一个变量：能用 ND 与渐变控制进光与天空"],"pitfalls":["用渐变镜拍有树的天际线，出现暗边"],"quiz":[{"q":"「ND 与渐变镜」的判断要点是什么？先说结论再谈理由。","a":"是 ND 减全画面渐变减局部","why":"ND 减光镜整体减光，用于白天长曝（流水、云、空街）"},{"q":"有人说：用渐变镜拍有树的天际线，出现暗边。这样对吗？","a":"不对。是 ND 减全画面渐变减局部","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"用十档 ND 把白天流水拍成丝滑｜广角 + 三脚架，f/8–f/11，ISO 100，蓝调时刻前后 30 分钟","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：高光有层次、地平线水平、景深覆盖前后景（每项 5 分制，任一不达标记 3 分以下）","表达 35%：前景与远景有纵深、光比有取舍","规范 20%：未过度合成、未换天"]}},"M07-K04":{"title":"风光前景与纵深","anchor":"是前景建立纵深，不是只要好看","source":"参考：《美国摄影教程》第12版 · 风光与建筑 · 风光与建筑（按目录对应）","sections":[{"h":"为什么是这样","p":"风光最怕远山一片平。前景（石头、花草、水洼、栏杆）建立纵深与尺度，最好与远景有视觉关联（同色、同形、同方向）。低机位让前景靠近镜头并虚化，能形成层次。没有前景时用长焦压缩找图案。风光摄影拍的是光，不是景。同一个地点在日出前二十分钟、日出后十分钟、正午、蓝调时刻是完全不同的四张照片。技术上要处理三件事：光比（天空与地面差三到五挡是常态）、景深（f/8 到 f/11 通常是画质与景深的平衡点）、稳定性（长曝必须三脚架加延时或遥控）。构图上靠前景建立纵深，让观者的视线有落脚点，再用中景与远景形成层次，而不是把一座山摆在画面中间就完事。"},{"h":"操作路径","p":"今天的练习：同一机位有前景与无前景各拍一张。流程：提前踩点或用软件查日出日落方位与时间，提前四十分钟到位；架三脚架、关防抖、用 f/8 起、ISO 100、开实时取景放大十倍手动对焦到超焦距或前中景；先拍一张看直方图，确保高光不溢出（宁欠勿过），必要时包围曝光三张。构图先定地平线位置（决定天空与地面的权重），再找前景，最后检查四角有没有杂物。蓝调时刻前后各留十分钟，那往往是色彩最干净的时候。"},{"h":"边界与代价","p":"典型翻车：前景与主体无关，纯占面积。风光的代价是真实性。多张合成、换天、拉回高光，都会让画面偏离现场，作为表达可以，但要自己心里清楚并在需要时说明。过度 HDR 会让云层发灰、边缘出光晕；长曝把水面抹成丝绸很美，但也抹掉了波浪的质感信息。天气不配合是常态，阴天拍不出通透就该换题材，而不是硬拉对比把画面调脏。景区拍摄还要注意不越界、不破坏植被、不影响他人。"},{"h":"怎么判断到位","p":"今天的判据：是前景建立纵深，不是只要好看。先问：这张的光是等来的还是碰上的，能说出它是什么时段吗？再问：前景、中景、背景三层都有内容吗？最后问：高光有没有死白，地平线平不平？风光片的及格线是「光对、层清、不过火」。"}],"points":["是前景建立纵深，不是只要好看","今天只验证这一个变量：能为风光找到有效前景"],"pitfalls":["前景与主体无关，纯占面积"],"quiz":[{"q":"「风光前景与纵深」的判断要点是什么？先说结论再谈理由。","a":"是前景建立纵深，不是只要好看","why":"风光最怕远山一片平"},{"q":"有人说：前景与主体无关，纯占面积。这样对吗？","a":"不对。是前景建立纵深，不是只要好看","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"同一机位有前景与无前景各拍一张｜广角 + 三脚架，f/8–f/11，ISO 100，蓝调时刻前后 30 分钟","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：高光有层次、地平线水平、景深覆盖前后景（每项 5 分制，任一不达标记 3 分以下）","表达 35%：前景与远景有纵深、光比有取舍","规范 20%：未过度合成、未换天"]}},"M07-K05":{"title":"建筑垂直线与透视校正","anchor":"是保持水平再校正，不是广角硬拍","source":"参考：《美国摄影教程》第12版 · 风光与建筑 · 风光与建筑（按目录对应）","sections":[{"h":"为什么是这样","p":"广角仰拍会让垂直线向上收拢形成梯形畸变。做法是尽量站在与建筑中段等高的位置（移轴镜头更佳），或后期用透视校正拉直，代价是裁掉边缘。手机的建筑模式可自动校正，校正后检查是否有拉伸感。建筑摄影的第一原则是控制线：垂直的墙要拍成垂直，水平的线要拍成水平。人眼会自我校正，镜头不会——机身上仰或俯冲，垂直线立刻变成汇聚线。技术上要处理三件事：透视（机身保持水平，靠移轴或后期校正）、几何秩序（对称、重复、节奏本身就是内容）、光线（侧光强调体量与质感，正面光抹平一切）。画质上广角边缘容易畸变，收一挡光圈能明显改善。"},{"h":"操作路径","p":"今天的练习：仰拍一栋楼，再用后期校正比较效果。流程：先绕场一周找视点，判断是正面单点透视、还是斜角双点透视；机身保持水平，把要保留的透视余量拍进画面，方便后期裁切校正；用 f/8 保证景深，广角贴得太近时注意边缘拉伸。拍室内要关掉混合光源中的一种，或用白平衡统一后局部处理。构图上优先找线、面、节奏：框、梯、柱、窗格都是天然的构图骨架，把人作为尺度参照放进画面往往能让建筑显得更真实。"},{"h":"边界与代价","p":"典型翻车：广角仰拍，楼往中间倒。建筑的代价是「校正过度」与「失真」。透视拉得太狠，建筑会像比萨斜塔一样怪异；广角贴脸会让近处柱子粗得离谱。长曝消除行人看着干净，但会失去人气，人文类建筑摄影反而需要人。室内混合光源（暖灯加窗光）容易出脏色，硬统一白平衡会让窗外发蓝。还有边界问题：商业建筑内部拍摄可能涉及管理方规定，需事先确认。"},{"h":"怎么判断到位","p":"今天的判据：是保持水平再校正，不是广角硬拍。先问：画面里的垂直线真的垂直吗？再问：这个视角是想展示体量、质感还是秩序？最后问：校正之后比例还自然吗？建筑片的及格线是「线直、秩序清、不过校」。"}],"points":["是保持水平再校正，不是广角硬拍","今天只验证这一个变量：能让建筑垂直线平行"],"pitfalls":["广角仰拍，楼往中间倒"],"quiz":[{"q":"「建筑垂直线与透视校正」的判断要点是什么？先说结论再谈理由。","a":"是保持水平再校正，不是广角硬拍","why":"广角仰拍会让垂直线向上收拢形成梯形畸变"},{"q":"有人说：广角仰拍，楼往中间倒。这样对吗？","a":"不对。是保持水平再校正，不是广角硬拍","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"仰拍一栋楼，再用后期校正比较效果｜广角，机身保持水平，四周留校正余量，f/8","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 50%：垂直线平行、透视无异常、边缘无明显畸变（每项 5 分制，任一不达标记 3 分以下）","表达 35%：几何秩序清晰、视角有意图","规范 15%：校正自然、未拉伸出怪比例"]}},"M07-K06":{"title":"建筑几何与秩序","anchor":"是找结构不是拍全景","source":"参考：《美国摄影教程》第12版 · 风光与建筑 · 风光与建筑（按目录对应）","sections":[{"h":"为什么是这样","p":"建筑的视觉资源是线、面、重复、对称、光影切分。拍局部比拍全景更容易出效果：一面墙的窗格、楼梯的螺旋、玻璃的反光、柱列的透视。等光是关键：侧光让立面有明暗层次，正午顶光适合拍几何平面。建筑摄影的第一原则是控制线：垂直的墙要拍成垂直，水平的线要拍成水平。人眼会自我校正，镜头不会——机身上仰或俯冲，垂直线立刻变成汇聚线。技术上要处理三件事：透视（机身保持水平，靠移轴或后期校正）、几何秩序（对称、重复、节奏本身就是内容）、光线（侧光强调体量与质感，正面光抹平一切）。画质上广角边缘容易畸变，收一挡光圈能明显改善。"},{"h":"操作路径","p":"今天的练习：在同一建筑找三种几何构图：对称、重复、斜线。流程：先绕场一周找视点，判断是正面单点透视、还是斜角双点透视；机身保持水平，把要保留的透视余量拍进画面，方便后期裁切校正；用 f/8 保证景深，广角贴得太近时注意边缘拉伸。拍室内要关掉混合光源中的一种，或用白平衡统一后局部处理。构图上优先找线、面、节奏：框、梯、柱、窗格都是天然的构图骨架，把人作为尺度参照放进画面往往能让建筑显得更真实。"},{"h":"边界与代价","p":"典型翻车：只会正面全景，画面扁平。建筑的代价是「校正过度」与「失真」。透视拉得太狠，建筑会像比萨斜塔一样怪异；广角贴脸会让近处柱子粗得离谱。长曝消除行人看着干净，但会失去人气，人文类建筑摄影反而需要人。室内混合光源（暖灯加窗光）容易出脏色，硬统一白平衡会让窗外发蓝。还有边界问题：商业建筑内部拍摄可能涉及管理方规定，需事先确认。"},{"h":"怎么判断到位","p":"今天的判据：是找结构不是拍全景。先问：画面里的垂直线真的垂直吗？再问：这个视角是想展示体量、质感还是秩序？最后问：校正之后比例还自然吗？建筑片的及格线是「线直、秩序清、不过校」。"}],"points":["是找结构不是拍全景","今天只验证这一个变量：能用几何结构组织画面"],"pitfalls":["只会正面全景，画面扁平"],"quiz":[{"q":"「建筑几何与秩序」的判断要点是什么？先说结论再谈理由。","a":"是找结构不是拍全景","why":"建筑的视觉资源是线、面、重复、对称、光影切分"},{"q":"有人说：只会正面全景，画面扁平。这样对吗？","a":"不对。是找结构不是拍全景","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"在同一建筑找三种几何构图：对称、重复、斜线｜广角，机身保持水平，四周留校正余量，f/8","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 50%：垂直线平行、透视无异常、边缘无明显畸变（每项 5 分制，任一不达标记 3 分以下）","表达 35%：几何秩序清晰、视角有意图","规范 15%：校正自然、未拉伸出怪比例"]}},"M07-K07":{"title":"室内建筑与混合光","anchor":"是统一色温或保留对比","source":"参考：《美国摄影教程》第12版 · 风光与建筑 · 风光与建筑（按目录对应）","sections":[{"h":"为什么是这样","p":"室内常见窗光约 5500K 与暖灯 2700 到 3200K 共存。方案有三：以窗光为基准让灯光偏暖（自然）、以灯光为基准让窗外偏蓝（冷调）、用闪灯加滤色片统一。上架长曝可保留窗外细节，配包围或 HDR。建筑摄影的第一原则是控制线：垂直的墙要拍成垂直，水平的线要拍成水平。人眼会自我校正，镜头不会——机身上仰或俯冲，垂直线立刻变成汇聚线。技术上要处理三件事：透视（机身保持水平，靠移轴或后期校正）、几何秩序（对称、重复、节奏本身就是内容）、光线（侧光强调体量与质感，正面光抹平一切）。画质上广角边缘容易畸变，收一挡光圈能明显改善。"},{"h":"操作路径","p":"今天的练习：拍一间房，按窗光与灯光各设白平衡比较。流程：先绕场一周找视点，判断是正面单点透视、还是斜角双点透视；机身保持水平，把要保留的透视余量拍进画面，方便后期裁切校正；用 f/8 保证景深，广角贴得太近时注意边缘拉伸。拍室内要关掉混合光源中的一种，或用白平衡统一后局部处理。构图上优先找线、面、节奏：框、梯、柱、窗格都是天然的构图骨架，把人作为尺度参照放进画面往往能让建筑显得更真实。"},{"h":"边界与代价","p":"典型翻车：窗光偏蓝灯光偏黄，画面脏。建筑的代价是「校正过度」与「失真」。透视拉得太狠，建筑会像比萨斜塔一样怪异；广角贴脸会让近处柱子粗得离谱。长曝消除行人看着干净，但会失去人气，人文类建筑摄影反而需要人。室内混合光源（暖灯加窗光）容易出脏色，硬统一白平衡会让窗外发蓝。还有边界问题：商业建筑内部拍摄可能涉及管理方规定，需事先确认。"},{"h":"怎么判断到位","p":"今天的判据：是统一色温或保留对比。先问：画面里的垂直线真的垂直吗？再问：这个视角是想展示体量、质感还是秩序？最后问：校正之后比例还自然吗？建筑片的及格线是「线直、秩序清、不过校」。"}],"points":["是统一色温或保留对比","今天只验证这一个变量：能在室内处理窗光与灯光共存"],"pitfalls":["窗光偏蓝灯光偏黄，画面脏"],"quiz":[{"q":"「室内建筑与混合光」的判断要点是什么？先说结论再谈理由。","a":"是统一色温或保留对比","why":"室内常见窗光约 5500K 与暖灯 2700 到 3200K 共存"},{"q":"有人说：窗光偏蓝灯光偏黄，画面脏。这样对吗？","a":"不对。是统一色温或保留对比","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"拍一间房，按窗光与灯光各设白平衡比较｜广角，机身保持水平，四周留校正余量，f/8","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 50%：垂直线平行、透视无异常、边缘无明显畸变（每项 5 分制，任一不达标记 3 分以下）","表达 35%：几何秩序清晰、视角有意图","规范 15%：校正自然、未拉伸出怪比例"]}},"M07-K08":{"title":"城市夜景时机","anchor":"是日落后二十到四十分钟","source":"参考：《美国摄影教程》第12版 · 风光与建筑 · 风光与建筑（按目录对应）","sections":[{"h":"为什么是这样","p":"蓝调时刻天空仍有深蓝余晖，与城市暖灯形成冷暖对比，是城市夜景最佳窗口，通常只有二十到四十分钟。此时以天空为基准曝光并让灯光略过曝，或用包围合成。天全黑后天空死黑，只剩孤立灯光。夜景的技术难点是极暗环境下的三重约束：进光量、稳定性、噪点。城市夜景的亮度差异巨大——路灯与广告牌可能比暗部亮十几挡，所以高光保护优先于暗部提亮。技术上通常走三脚架加低 ISO 加长曝的路线，快门从两秒到三十秒按场景选；光源里有频闪时，长曝可能出现色带，需要试拍确认。天空不是纯黑，蓝调时刻的天空有层次，比全黑好看得多。"},{"h":"操作路径","p":"今天的练习：日落后连拍五张不同时刻，比较天空与灯光平衡。流程：日落前到场，先定机位与构图，把三脚架压稳、挂重物防风、关防抖；光圈 f/5.6 到 f/8、ISO 100 起、快门从 2s 试到 15s，看直方图定曝光；白平衡手动设 3200 到 4000K 让灯光偏暖、天空偏冷；用两秒延时或遥控快门避免机身震动。拍城市天际线优先在蓝调时刻，天空还有余辉时灯光已亮，是明暗最均衡的十分钟。手持时则反过来：开大光圈、提 ISO、保快门在 1/60s 以上，先拍得到再谈画质。"},{"h":"边界与代价","p":"典型翻车：等天全黑才拍，天空死黑灯光过曝。夜景的代价是「脏」与「平」。降噪拉满会把细节抹成蜡像，暗部一提亮就浮出色噪和色斑；高光溢出会让灯牌变成纯白块，无法恢复。长曝会抹掉云与水的动态，也会让走动的人变成鬼影。构图上天黑后层次容易塌，必须靠前景或灯光线条建立纵深。安全与合规也要注意：三脚架在部分场所被禁止，拍摄他人住宅与商业设施需谨慎。"},{"h":"怎么判断到位","p":"今天的判据：是日落后二十到四十分钟。先问：高光有没有死白，灯牌还有层次吗？再问：天空是纯黑还是有过渡？最后问：放大看暗部，噪点是否已经吃掉细节？夜景的及格线是「稳、亮得住、暗部不脏」。"}],"points":["是日落后二十到四十分钟","今天只验证这一个变量：能抓住蓝调时刻拍城市"],"pitfalls":["等天全黑才拍，天空死黑灯光过曝"],"quiz":[{"q":"「城市夜景时机」的判断要点是什么？先说结论再谈理由。","a":"是日落后二十到四十分钟","why":"蓝调时刻天空仍有深蓝余晖，与城市暖灯形成冷暖对比，是城市夜景最佳窗口，通常只有二十到四十分钟"},{"q":"有人说：等天全黑才拍，天空死黑灯光过曝。这样对吗？","a":"不对。是日落后二十到四十分钟","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"日落后连拍五张不同时刻，比较天空与灯光平衡｜三脚架，f/5.6–f/8，ISO 100–400，快门 2–15s，白平衡 3200–4000K","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 50%：天空有层次、灯光不过曝、无手抖（每项 5 分制，任一不达标记 3 分以下）","表达 35%：冷暖对比有意、主体明确","规范 15%：未过度降噪抹平细节"]}},"M08-K01":{"title":"街拍心态与存在感","anchor":"是降低存在感不躲藏","source":"参考：《美国摄影教程》第12版 · 纪实 · 街拍与纪实（按目录对应）","sections":[{"h":"为什么是这样","p":"街拍的难点是心理不是技术。做法是先站定观察几分钟，让周围人习惯你的存在；相机挂胸前预设参数，抬手即拍；被注意时点头微笑，多数人不在意。躲躲藏藏反而引人注意。广角贴近拍比长焦远吊更自然。街拍的成品率由看的顺序决定：先看光，再看背景，最后才看人。光决定这块地方值不值得等，背景决定画面结构是否干净，人只是最后填入的内容。多数街拍失败不是没拍到人，而是背景本身就是一团乱，人进去只会更乱。所以先找「舞台」，再等「演员」，最后才是按快门。"},{"h":"操作路径","p":"今天的练习：在同一条街站二十分钟只观察不拍，再开始拍。把相机预设成抬手即拍：光圈优先 f/8、最低快门 1/500、ISO 自动上限 6400、区域对焦、静音快门、关掉回放。走位时让画面里有一条明确的水平或垂直线可依靠。用腰平或胸前机位减少压迫感，拍完不要立刻低头看屏，既暴露意图也错过下一个瞬间。每次出门带一个具体命题，收工只挑三张，其余归档不删，半年后回看会有新判断。"},{"h":"边界与代价","p":"典型翻车：举机就跑，照片全虚。街拍最大的风险不是拍不到，是越界。可识别的私人场景、儿童、医疗与宗教场所、明显不愿被拍的姿态，都应主动放弃。用长焦远距离偷拍、用连拍扫射人群、把抓拍说成摆拍，都是对这个题材的伤害。技术上要接受错过：好瞬间出现而参数不对是常态，解法是让参数长期处于待发状态，而不是事后惋惜。"},{"h":"怎么判断到位","p":"今天的判据：是降低存在感不躲藏。自检三问：这块背景我先看过再等人的吗？参数是不是一直处于待发状态？这张的拍摄方式我能公开说明吗？"}],"points":["是降低存在感不躲藏","今天只验证这一个变量：能在街头稳定地拍到人"],"pitfalls":["举机就跑，照片全虚"],"quiz":[{"q":"「街拍心态与存在感」的判断要点是什么？先说结论再谈理由。","a":"是降低存在感不躲藏","why":"街拍的难点是心理不是技术"},{"q":"有人说：举机就跑，照片全虚。这样对吗？","a":"不对。是降低存在感不躲藏","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"在同一条街站二十分钟只观察不拍，再开始拍｜等效 35mm，f/8，1/500，ISO 自动上限 6400，区域对焦","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 30%：焦点落在主体、曝光在容错范围内（每项 5 分制，任一不达标记 3 分以下）","表达 55%：主体与背景有关系、瞬间有意味","规范 15%：未摆拍冒充纪实、未越过伦理边界"]}},"M08-K02":{"title":"预判与决定性瞬间","anchor":"是提前等，不是看到才按","source":"参考：《美国摄影教程》第12版 · 纪实 · 街拍与纪实（按目录对应）","sections":[{"h":"为什么是这样","p":"决定性瞬间是构图元素在某一刻达到最佳关系。做法是先把背景与光线选好，等主体进入预定位置（提前构图等主体）；用连拍抓动作峰值；预判人的走向与视线。快门延迟与对焦延迟要提前算进去。街拍是在不可控的环境里做可控的判断。它的技术含量不高，判断含量极高：要在零点几秒内看出「这个人、这个背景、这一瞬间」三者能不能拼成一个有意味的画面。技术上通常预设好参数——光圈 f/8 保证容错景深、快门 1/500 冻结动作、ISO 自动上限 6400、区域对焦或超焦距，让相机不需要思考，把注意力全部留给观察。构图靠预判：先找到好背景，再等合适的人走进来。"},{"h":"操作路径","p":"今天的练习：选一个有规律经过的街口，等主体进入光区。流程：先走一遍街区找三到五个“舞台”——有光、有层次、有重复结构的背景；在舞台旁站定，参数预设好，等主体进入预定位置再按快门。距离控制在两到四米，用广角带环境或 35mm 等效视角，太近会让被摄者警觉、太远会失去关系。遇到好瞬间可以先拍再沟通，被质疑时坦诚说明并删除，这是最低的伦理要求。每次出门定一个小主题（雨、影子、橱窗、背影），比漫无目的扫街收成高得多。"},{"h":"边界与代价","p":"典型翻车：看到再按，总是晚半拍。街拍的代价是伦理与法律的边界。公共场所拍摄通常可行，但涉及可识别的个人、尤其是弱势群体、儿童、私密场景时应避免；商业使用需要肖像授权。用摆拍冒充抓拍是欺骗，用长焦偷拍是越界。技术上也要接受大量废片：一个下午出一张能看的就算正常，追求百分之百成功率只会让你不敢按快门。别为了戏剧性去干预现场，纪实的价值来自真实。"},{"h":"怎么判断到位","p":"今天的判据：是提前等，不是看到才按。先问：这张照片里主体和背景有关系吗，换个人站那儿还成立吗？再问：这个瞬间是不可重复的吗？最后问：如果被摄者当场问我为什么拍，我能坦然解释吗？三问都过，这张才值得留。"}],"points":["是提前等，不是看到才按","今天只验证这一个变量：能在动作发生前按下快门"],"pitfalls":["看到再按，总是晚半拍"],"quiz":[{"q":"「预判与决定性瞬间」的判断要点是什么？先说结论再谈理由。","a":"是提前等，不是看到才按","why":"决定性瞬间是构图元素在某一刻达到最佳关系"},{"q":"有人说：看到再按，总是晚半拍。这样对吗？","a":"不对。是提前等，不是看到才按","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"选一个有规律经过的街口，等主体进入光区｜等效 35mm，f/8，1/500，ISO 自动上限 6400，区域对焦","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 30%：焦点落在主体、曝光在容错范围内（每项 5 分制，任一不达标记 3 分以下）","表达 55%：主体与背景有关系、瞬间有意味","规范 15%：未摆拍冒充纪实、未越过伦理边界"]}},"M08-K03":{"title":"街拍快速设置","anchor":"是预设好等机会，不是现场调","source":"参考：《美国摄影教程》第12版 · 纪实 · 街拍与纪实（按目录对应）","sections":[{"h":"为什么是这样","p":"常用组合：f8 保证景深、快门 1/500 冻结行人、ISO 自动上限 6400、对焦用区域或超焦距（手动对到三到五米，f8 下两米到无穷都在焦内）、连拍开低速。手机则锁定曝光与对焦，抬手即拍。街拍是在不可控的环境里做可控的判断。它的技术含量不高，判断含量极高：要在零点几秒内看出「这个人、这个背景、这一瞬间」三者能不能拼成一个有意味的画面。技术上通常预设好参数——光圈 f/8 保证容错景深、快门 1/500 冻结动作、ISO 自动上限 6400、区域对焦或超焦距，让相机不需要思考，把注意力全部留给观察。构图靠预判：先找到好背景，再等合适的人走进来。"},{"h":"操作路径","p":"今天的练习：预设 f8、1/500、自动 ISO，用区域对焦扫街。流程：先走一遍街区找三到五个“舞台”——有光、有层次、有重复结构的背景；在舞台旁站定，参数预设好，等主体进入预定位置再按快门。距离控制在两到四米，用广角带环境或 35mm 等效视角，太近会让被摄者警觉、太远会失去关系。遇到好瞬间可以先拍再沟通，被质疑时坦诚说明并删除，这是最低的伦理要求。每次出门定一个小主题（雨、影子、橱窗、背影），比漫无目的扫街收成高得多。"},{"h":"边界与代价","p":"典型翻车：现场还在改参数，机会已过。街拍的代价是伦理与法律的边界。公共场所拍摄通常可行，但涉及可识别的个人、尤其是弱势群体、儿童、私密场景时应避免；商业使用需要肖像授权。用摆拍冒充抓拍是欺骗，用长焦偷拍是越界。技术上也要接受大量废片：一个下午出一张能看的就算正常，追求百分之百成功率只会让你不敢按快门。别为了戏剧性去干预现场，纪实的价值来自真实。"},{"h":"怎么判断到位","p":"今天的判据：是预设好等机会，不是现场调。先问：这张照片里主体和背景有关系吗，换个人站那儿还成立吗？再问：这个瞬间是不可重复的吗？最后问：如果被摄者当场问我为什么拍，我能坦然解释吗？三问都过，这张才值得留。"}],"points":["是预设好等机会，不是现场调","今天只验证这一个变量：能在三秒内完成拍摄准备"],"pitfalls":["现场还在改参数，机会已过"],"quiz":[{"q":"「街拍快速设置」的判断要点是什么？先说结论再谈理由。","a":"是预设好等机会，不是现场调","why":"常用组合：f8 保证景深、快门 1/500 冻结行人、ISO 自动上限 6400、对焦用区域或超焦距（手动对到三到五米，f8 下两米到无穷都在焦内）、连拍开低速"},{"q":"有人说：现场还在改参数，机会已过。这样对吗？","a":"不对。是预设好等机会，不是现场调","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"预设 f8、1/500、自动 ISO，用区域对焦扫街｜等效 35mm，f/8，1/500，ISO 自动上限 6400，区域对焦","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 30%：焦点落在主体、曝光在容错范围内（每项 5 分制，任一不达标记 3 分以下）","表达 55%：主体与背景有关系、瞬间有意味","规范 15%：未摆拍冒充纪实、未越过伦理边界"]}},"M08-K04":{"title":"隐蔽性与伦理边界","anchor":"是公共场合也有边界","source":"参考：《美国摄影教程》第12版 · 纪实 · 街拍与纪实（按目录对应）","sections":[{"h":"为什么是这样","p":"街拍伦理底线：不拍隐私部位与私密场景、不拍摄并传播可识别的弱势者困境（除非有明确公共价值）、不尾随、不进入私人空间、被明确拒绝就停。肖像权与隐私权在多数法域受保护，商业使用需授权。技术上隐蔽，伦理上坦荡。街拍的成品率由看的顺序决定：先看光，再看背景，最后才看人。光决定这块地方值不值得等，背景决定画面结构是否干净，人只是最后填入的内容。多数街拍失败不是没拍到人，而是背景本身就是一团乱，人进去只会更乱。所以先找「舞台」，再等「演员」，最后才是按快门。"},{"h":"操作路径","p":"今天的练习：列出三种你会主动放弃的拍摄情形。把相机预设成抬手即拍：光圈优先 f/8、最低快门 1/500、ISO 自动上限 6400、区域对焦、静音快门、关掉回放。走位时让画面里有一条明确的水平或垂直线可依靠。用腰平或胸前机位减少压迫感，拍完不要立刻低头看屏，既暴露意图也错过下一个瞬间。每次出门带一个具体命题，收工只挑三张，其余归档不删，半年后回看会有新判断。"},{"h":"边界与代价","p":"典型翻车：拍完被要求删除仍强行保留。街拍最大的风险不是拍不到，是越界。可识别的私人场景、儿童、医疗与宗教场所、明显不愿被拍的姿态，都应主动放弃。用长焦远距离偷拍、用连拍扫射人群、把抓拍说成摆拍，都是对这个题材的伤害。技术上要接受错过：好瞬间出现而参数不对是常态，解法是让参数长期处于待发状态，而不是事后惋惜。"},{"h":"怎么判断到位","p":"今天的判据：是公共场合也有边界。自检三问：这块背景我先看过再等人的吗？参数是不是一直处于待发状态？这张的拍摄方式我能公开说明吗？"}],"points":["是公共场合也有边界","今天只验证这一个变量：能判断哪些拍摄不合适"],"pitfalls":["拍完被要求删除仍强行保留"],"quiz":[{"q":"「隐蔽性与伦理边界」的判断要点是什么？先说结论再谈理由。","a":"是公共场合也有边界","why":"街拍伦理底线：不拍隐私部位与私密场景、不拍摄并传播可识别的弱势者困境（除非有明确公共价值）、不尾随、不进入私人空间、被明确拒绝就停"},{"q":"有人说：拍完被要求删除仍强行保留。这样对吗？","a":"不对。是公共场合也有边界","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"列出三种你会主动放弃的拍摄情形｜等效 35mm，f/8，1/500，ISO 自动上限 6400，区域对焦","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 30%：焦点落在主体、曝光在容错范围内（每项 5 分制，任一不达标记 3 分以下）","表达 55%：主体与背景有关系、瞬间有意味","规范 15%：未摆拍冒充纪实、未越过伦理边界"]}},"M08-K05":{"title":"街拍构图手法","anchor":"是关系产生意义，不是拍到人就行","source":"参考：《美国摄影教程》第12版 · 纪实 · 街拍与纪实（按目录对应）","sections":[{"h":"为什么是这样","p":"街拍常用手法：并置（广告人物与真人形成对照）、借位（远近物体看似接触）、反光（橱窗、水洼、镜面）、影子（长影与本体）、框架（门洞、车窗）。核心是元素之间的关系，不是单个元素好看。街拍是在不可控的环境里做可控的判断。它的技术含量不高，判断含量极高：要在零点几秒内看出「这个人、这个背景、这一瞬间」三者能不能拼成一个有意味的画面。技术上通常预设好参数——光圈 f/8 保证容错景深、快门 1/500 冻结动作、ISO 自动上限 6400、区域对焦或超焦距，让相机不需要思考，把注意力全部留给观察。构图靠预判：先找到好背景，再等合适的人走进来。"},{"h":"操作路径","p":"今天的练习：找一处反光或广告牌，等行人进入形成关系。流程：先走一遍街区找三到五个“舞台”——有光、有层次、有重复结构的背景；在舞台旁站定，参数预设好，等主体进入预定位置再按快门。距离控制在两到四米，用广角带环境或 35mm 等效视角，太近会让被摄者警觉、太远会失去关系。遇到好瞬间可以先拍再沟通，被质疑时坦诚说明并删除，这是最低的伦理要求。每次出门定一个小主题（雨、影子、橱窗、背影），比漫无目的扫街收成高得多。"},{"h":"边界与代价","p":"典型翻车：每张都是单人背影，无信息。街拍的代价是伦理与法律的边界。公共场所拍摄通常可行，但涉及可识别的个人、尤其是弱势群体、儿童、私密场景时应避免；商业使用需要肖像授权。用摆拍冒充抓拍是欺骗，用长焦偷拍是越界。技术上也要接受大量废片：一个下午出一张能看的就算正常，追求百分之百成功率只会让你不敢按快门。别为了戏剧性去干预现场，纪实的价值来自真实。"},{"h":"怎么判断到位","p":"今天的判据：是关系产生意义，不是拍到人就行。先问：这张照片里主体和背景有关系吗，换个人站那儿还成立吗？再问：这个瞬间是不可重复的吗？最后问：如果被摄者当场问我为什么拍，我能坦然解释吗？三问都过，这张才值得留。"}],"points":["是关系产生意义，不是拍到人就行","今天只验证这一个变量：能用并置借位反光制造意味"],"pitfalls":["每张都是单人背影，无信息"],"quiz":[{"q":"「街拍构图手法」的判断要点是什么？先说结论再谈理由。","a":"是关系产生意义，不是拍到人就行","why":"街拍常用手法：并置（广告人物与真人形成对照）、借位（远近物体看似接触）、反光（橱窗、水洼、镜面）、影子（长影与本体）、框架（门洞、车窗）"},{"q":"有人说：每张都是单人背影，无信息。这样对吗？","a":"不对。是关系产生意义，不是拍到人就行","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"找一处反光或广告牌，等行人进入形成关系｜等效 35mm，f/8，1/500，ISO 自动上限 6400，区域对焦","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 30%：焦点落在主体、曝光在容错范围内（每项 5 分制，任一不达标记 3 分以下）","表达 55%：主体与背景有关系、瞬间有意味","规范 15%：未摆拍冒充纪实、未越过伦理边界"]}},"M08-K06":{"title":"组照与叙事","anchor":"是有开头有转折有落点，不是拼好图","source":"参考：《美国摄影教程》第12版 · 纪实 · 街拍与纪实（按目录对应）","sections":[{"h":"为什么是这样","p":"组照要有主题、节奏与落点：开场交代场景，中段展开人物与细节，加入一两张转折（情绪或视角突变），结尾收束。编排避免连续同景别同色调；说明补充时间地点，不超过两句。判断标准是删掉任何一张是否影响叙事。纪实与街拍的区别在结构：街拍是单张的瞬间，纪实是成组的叙事。一组纪实照片要有起、承、转、合——建立环境、引入人物、展开冲突或细节、收束情绪，单张服从整组而不是各自为战。技术上要求一致性：同一组内曝光倾向、色调、画幅比例应尽量统一，观者才会把它当成一个整体读。拍摄上要求克制：先观察、再进入、最后才按快门，理解比技巧更稀缺。"},{"h":"操作路径","p":"今天的练习：选十二张同一主题照片排出顺序并写一句说明。流程：先做功课，明确要拍的人或事、为什么值得拍；到场先不拍，走一圈建立信任，跟关键人物聊清楚你在做什么、照片会用在哪；拍摄时覆盖三类画面——交代环境的大景、人物状态的中景、情绪与细节的特写，缺一类叙事就会断；每组至少留一张「不完美但有信息」的照片。整理时按时间或逻辑排序，做一张联系表通看，再挑出十到二十张成组。文字说明要写清时间、地点、背景，不做文学加工。"},{"h":"边界与代价","p":"典型翻车：每张都精彩但互不相关。纪实的代价是介入与客观的张力。完全旁观可能拍不到关键，深度介入又可能改变被摄者行为；摆拍、引导、事后重建都属于越界。涉及负面处境、疾病、贫困的题材必须取得知情同意，并考虑发表后对被摄者的影响。也别为了「有故事」而挑选、裁剪、配文扭曲事实，那已经不是纪实。技术上，追求完美画质常常让位于「拍到」，这是这个题材特有的取舍。"},{"h":"怎么判断到位","p":"今天的判据：是有开头有转折有落点，不是拼好图。先问：这组照片讲了一件什么事，能用一句话说清吗？再问：单张拿出来是否服从整组的调性？最后问：被摄者知道照片会用在哪，并同意了吗？纪实片的及格线是「真实、成组、有交代」。"}],"points":["是有开头有转折有落点，不是拼好图","今天只验证这一个变量：能把六到十二张编成一个故事"],"pitfalls":["每张都精彩但互不相关"],"quiz":[{"q":"「组照与叙事」的判断要点是什么？先说结论再谈理由。","a":"是有开头有转折有落点，不是拼好图","why":"组照要有主题、节奏与落点：开场交代场景，中段展开人物与细节，加入一两张转折（情绪或视角突变），结尾收束"},{"q":"有人说：每张都精彩但互不相关。这样对吗？","a":"不对。是有开头有转折有落点，不是拼好图","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"选十二张同一主题照片排出顺序并写一句说明｜轻便一机一镜，静音快门，先观察十分钟再拍摄","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 25%：组照曝光与色调统一、关键瞬间清晰（每项 5 分制，任一不达标记 3 分以下）","表达 60%：叙事有起承转合、单张服从整组","规范 15%：未干预现场、未伪造情境"]}},"M08-K07":{"title":"纪实项目选题与跟进","anchor":"是选可反复到达的场景，不是等灵感","source":"参考：《美国摄影教程》第12版 · 纪实 · 街拍与纪实（按目录对应）","sections":[{"h":"为什么是这样","p":"好选题的三个条件：可反复到达、有明确边界、有变化空间（一条街的早市、一家修车铺、一个家庭的周末）。跟进靠约定与信任：固定时间出现、带照片回访、先交朋友再拍。周期内至少到场八到十次才能出组照。纪实与街拍的区别在结构：街拍是单张的瞬间，纪实是成组的叙事。一组纪实照片要有起、承、转、合——建立环境、引入人物、展开冲突或细节、收束情绪，单张服从整组而不是各自为战。技术上要求一致性：同一组内曝光倾向、色调、画幅比例应尽量统一，观者才会把它当成一个整体读。拍摄上要求克制：先观察、再进入、最后才按快门，理解比技巧更稀缺。"},{"h":"操作路径","p":"今天的练习：写下一个四周内能去四次的选题。流程：先做功课，明确要拍的人或事、为什么值得拍；到场先不拍，走一圈建立信任，跟关键人物聊清楚你在做什么、照片会用在哪；拍摄时覆盖三类画面——交代环境的大景、人物状态的中景、情绪与细节的特写，缺一类叙事就会断；每组至少留一张「不完美但有信息」的照片。整理时按时间或逻辑排序，做一张联系表通看，再挑出十到二十张成组。文字说明要写清时间、地点、背景，不做文学加工。"},{"h":"边界与代价","p":"典型翻车：选题太大（城市生活），无从下手。纪实的代价是介入与客观的张力。完全旁观可能拍不到关键，深度介入又可能改变被摄者行为；摆拍、引导、事后重建都属于越界。涉及负面处境、疾病、贫困的题材必须取得知情同意，并考虑发表后对被摄者的影响。也别为了「有故事」而挑选、裁剪、配文扭曲事实，那已经不是纪实。技术上，追求完美画质常常让位于「拍到」，这是这个题材特有的取舍。"},{"h":"怎么判断到位","p":"今天的判据：是选可反复到达的场景，不是等灵感。先问：这组照片讲了一件什么事，能用一句话说清吗？再问：单张拿出来是否服从整组的调性？最后问：被摄者知道照片会用在哪，并同意了吗？纪实片的及格线是「真实、成组、有交代」。"}],"points":["是选可反复到达的场景，不是等灵感","今天只验证这一个变量：能设计一个可执行的长期拍摄项目"],"pitfalls":["选题太大（城市生活），无从下手"],"quiz":[{"q":"「纪实项目选题与跟进」的判断要点是什么？先说结论再谈理由。","a":"是选可反复到达的场景，不是等灵感","why":"好选题的三个条件：可反复到达、有明确边界、有变化空间（一条街的早市、一家修车铺、一个家庭的周末）"},{"q":"有人说：选题太大（城市生活），无从下手。这样对吗？","a":"不对。是选可反复到达的场景，不是等灵感","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"写下一个四周内能去四次的选题｜轻便一机一镜，静音快门，先观察十分钟再拍摄","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 25%：组照曝光与色调统一、关键瞬间清晰（每项 5 分制，任一不达标记 3 分以下）","表达 60%：叙事有起承转合、单张服从整组","规范 15%：未干预现场、未伪造情境"]}},"M08-K08":{"title":"纪实后期克制","anchor":"是少动色彩多调影调","source":"参考：《美国摄影教程》第12版 · 纪实 · 街拍与纪实（按目录对应）","sections":[{"h":"为什么是这样","p":"纪实后期允许校正曝光、白平衡、裁切与轻度对比，不允许移动、擦除、拼接或大幅改色，这涉及真实性底线。风格上偏低饱和、保留环境杂色与颗粒，比商业修图耐看。统一一组照片的色调比单张精修重要。纪实与街拍的区别在结构：街拍是单张的瞬间，纪实是成组的叙事。一组纪实照片要有起、承、转、合——建立环境、引入人物、展开冲突或细节、收束情绪，单张服从整组而不是各自为战。技术上要求一致性：同一组内曝光倾向、色调、画幅比例应尽量统一，观者才会把它当成一个整体读。拍摄上要求克制：先观察、再进入、最后才按快门，理解比技巧更稀缺。"},{"h":"操作路径","p":"今天的练习：同一张纪实照片做重度与轻度后期对比。流程：先做功课，明确要拍的人或事、为什么值得拍；到场先不拍，走一圈建立信任，跟关键人物聊清楚你在做什么、照片会用在哪；拍摄时覆盖三类画面——交代环境的大景、人物状态的中景、情绪与细节的特写，缺一类叙事就会断；每组至少留一张「不完美但有信息」的照片。整理时按时间或逻辑排序，做一张联系表通看，再挑出十到二十张成组。文字说明要写清时间、地点、背景，不做文学加工。"},{"h":"边界与代价","p":"典型翻车：大改颜色与擦除元素，失去真实性。纪实的代价是介入与客观的张力。完全旁观可能拍不到关键，深度介入又可能改变被摄者行为；摆拍、引导、事后重建都属于越界。涉及负面处境、疾病、贫困的题材必须取得知情同意，并考虑发表后对被摄者的影响。也别为了「有故事」而挑选、裁剪、配文扭曲事实，那已经不是纪实。技术上，追求完美画质常常让位于「拍到」，这是这个题材特有的取舍。"},{"h":"怎么判断到位","p":"今天的判据：是少动色彩多调影调。先问：这组照片讲了一件什么事，能用一句话说清吗？再问：单张拿出来是否服从整组的调性？最后问：被摄者知道照片会用在哪，并同意了吗？纪实片的及格线是「真实、成组、有交代」。"}],"points":["是少动色彩多调影调","今天只验证这一个变量：能保留现场真实感"],"pitfalls":["大改颜色与擦除元素，失去真实性"],"quiz":[{"q":"「纪实后期克制」的判断要点是什么？先说结论再谈理由。","a":"是少动色彩多调影调","why":"纪实后期允许校正曝光、白平衡、裁切与轻度对比，不允许移动、擦除、拼接或大幅改色，这涉及真实性底线"},{"q":"有人说：大改颜色与擦除元素，失去真实性。这样对吗？","a":"不对。是少动色彩多调影调","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"同一张纪实照片做重度与轻度后期对比｜轻便一机一镜，静音快门，先观察十分钟再拍摄","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 25%：组照曝光与色调统一、关键瞬间清晰（每项 5 分制，任一不达标记 3 分以下）","表达 60%：叙事有起承转合、单张服从整组","规范 15%：未干预现场、未伪造情境"]}},"M09-K01":{"title":"选片标准","anchor":"是先淘汰，不是挑最喜欢的","source":"参考：《摄影师的视界》 · 编辑与输出 · 选片输出与作品集（按目录对应）","sections":[{"h":"为什么是这样","p":"选片先设硬门槛：焦点是否在关键位置、曝光是否可救、构图有无硬伤（切头、倾斜、干扰物）。过门槛后按信息量排序：有情绪、有故事、有独特视角的优先。同一场景只留最好一张。淘汰比选择更能提升整体水平。输出是把照片变成作品集的最后一道工序，也是最多人忽略的一环。技术上要处理三件事：尺寸与用途（屏幕观看长边 2048px 足够，打印按 300dpi 折算实际尺寸）、锐度（输出锐化与屏幕锐化不是一回事，过量会在印刷上出现白边）、色彩空间（屏幕用 sRGB，印刷才用 Adobe RGB，混用会导致偏色）。成组呈现还要考虑顺序：第一张定调、中间有节奏起伏、最后一张收束。"},{"h":"操作路径","p":"今天的练习：从两百张里按三条硬标准筛到二十张。流程：先按用途定导出规格并存成预设，避免每次手动设置出错；导出前逐张检查高光溢出、噪点、水平与边缘杂物；命名规范统一（日期_主题_序号），方便回溯；成组挑选时先做联系表通看，删掉重复表达，控制在十二到二十张；最后写一段三百字以内的自述，说明拍什么、为什么这么拍，文字与照片要能互相支撑而不是互相解释。上传前压缩到平台要求的尺寸，避免二次压缩导致糊。"},{"h":"边界与代价","p":"典型翻车：全留，作品集没有重点。输出的代价是「多而不精」。把三百张原片一股脑发出去，观者只会记住最差的那几张；选片的核心能力是删，而不是留。过度锐化与过度降噪在屏幕上不易察觉，一打印就暴露。不同平台的压缩算法差异很大，同一张图在手机上鲜、在电脑上灰，发布前要在目标设备上实看一次。也别为了凑数放重复构图的照片，一组里两张相似的照片会互相削弱。"},{"h":"怎么判断到位","p":"今天的判据：是先淘汰，不是挑最喜欢的。先问：这组照片给谁看、在哪看，规格匹配吗？再问：删到只剩十张，我会留下哪十张？最后问：这套顺序能让观者看完最后一张吗？输出的及格线是「规格对、删得狠、顺序顺」。"}],"points":["是先淘汰，不是挑最喜欢的","今天只验证这一个变量：能用统一标准淘汰照片"],"pitfalls":["全留，作品集没有重点"],"quiz":[{"q":"「选片标准」的判断要点是什么？先说结论再谈理由。","a":"是先淘汰，不是挑最喜欢的","why":"选片先设硬门槛：焦点是否在关键位置、曝光是否可救、构图有无硬伤（切头、倾斜、干扰物）"},{"q":"有人说：全留，作品集没有重点。这样对吗？","a":"不对。是先淘汰，不是挑最喜欢的","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"从两百张里按三条硬标准筛到二十张｜按用途导出（社交长边 2048px / 打印 300dpi），sRGB","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 40%：尺寸与用途匹配、锐度适中（每项 5 分制，任一不达标记 3 分以下）","表达 40%：成组风格统一、选片有取舍","规范 20%：色彩空间与命名规范"]}},"M09-K02":{"title":"成组与编排","anchor":"是节奏与呼应，不是按时间排","source":"参考：《摄影师的视界》 · 编辑与输出 · 选片输出与作品集（按目录对应）","sections":[{"h":"为什么是这样","p":"编排考虑景别交替（远中近）、色调呼应、情绪起伏、首尾强度。开场用有代入感的，中段放最强一张（约三分之二处），结尾留余味。避免连续三张同色同构图。成组后整体看一遍，像听一段音乐。输出是把照片变成作品集的最后一道工序，也是最多人忽略的一环。技术上要处理三件事：尺寸与用途（屏幕观看长边 2048px 足够，打印按 300dpi 折算实际尺寸）、锐度（输出锐化与屏幕锐化不是一回事，过量会在印刷上出现白边）、色彩空间（屏幕用 sRGB，印刷才用 Adobe RGB，混用会导致偏色）。成组呈现还要考虑顺序：第一张定调、中间有节奏起伏、最后一张收束。"},{"h":"操作路径","p":"今天的练习：把十张照片排出三种顺序比较观感。流程：先按用途定导出规格并存成预设，避免每次手动设置出错；导出前逐张检查高光溢出、噪点、水平与边缘杂物；命名规范统一（日期_主题_序号），方便回溯；成组挑选时先做联系表通看，删掉重复表达，控制在十二到二十张；最后写一段三百字以内的自述，说明拍什么、为什么这么拍，文字与照片要能互相支撑而不是互相解释。上传前压缩到平台要求的尺寸，避免二次压缩导致糊。"},{"h":"边界与代价","p":"典型翻车：相似照片挨在一起，看着重复。输出的代价是「多而不精」。把三百张原片一股脑发出去，观者只会记住最差的那几张；选片的核心能力是删，而不是留。过度锐化与过度降噪在屏幕上不易察觉，一打印就暴露。不同平台的压缩算法差异很大，同一张图在手机上鲜、在电脑上灰，发布前要在目标设备上实看一次。也别为了凑数放重复构图的照片，一组里两张相似的照片会互相削弱。"},{"h":"怎么判断到位","p":"今天的判据：是节奏与呼应，不是按时间排。先问：这组照片给谁看、在哪看，规格匹配吗？再问：删到只剩十张，我会留下哪十张？最后问：这套顺序能让观者看完最后一张吗？输出的及格线是「规格对、删得狠、顺序顺」。"}],"points":["是节奏与呼应，不是按时间排","今天只验证这一个变量：能排出有节奏的作品集顺序"],"pitfalls":["相似照片挨在一起，看着重复"],"quiz":[{"q":"「成组与编排」的判断要点是什么？先说结论再谈理由。","a":"是节奏与呼应，不是按时间排","why":"编排考虑景别交替（远中近）、色调呼应、情绪起伏、首尾强度"},{"q":"有人说：相似照片挨在一起，看着重复。这样对吗？","a":"不对。是节奏与呼应，不是按时间排","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"把十张照片排出三种顺序比较观感｜按用途导出（社交长边 2048px / 打印 300dpi），sRGB","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 40%：尺寸与用途匹配、锐度适中（每项 5 分制，任一不达标记 3 分以下）","表达 40%：成组风格统一、选片有取舍","规范 20%：色彩空间与命名规范"]}},"M09-K03":{"title":"作品集自述","anchor":"是说意图不说设备","source":"参考：《摄影师的视界》 · 编辑与输出 · 选片输出与作品集（按目录对应）","sections":[{"h":"为什么是这样","p":"自述回答三件事：为什么拍这个（动机）、怎么拍（方法与条件）、希望观者看到什么（意图）。避免技术参数与形容词堆砌，具体细节比宏大表述可信。摄影集、投稿、展览都需要这段文字，写得早还能反过来指导拍摄。输出是把照片变成作品集的最后一道工序，也是最多人忽略的一环。技术上要处理三件事：尺寸与用途（屏幕观看长边 2048px 足够，打印按 300dpi 折算实际尺寸）、锐度（输出锐化与屏幕锐化不是一回事，过量会在印刷上出现白边）、色彩空间（屏幕用 sRGB，印刷才用 Adobe RGB，混用会导致偏色）。成组呈现还要考虑顺序：第一张定调、中间有节奏起伏、最后一张收束。"},{"h":"操作路径","p":"今天的练习：为你的组照写两百字自述。流程：先按用途定导出规格并存成预设，避免每次手动设置出错；导出前逐张检查高光溢出、噪点、水平与边缘杂物；命名规范统一（日期_主题_序号），方便回溯；成组挑选时先做联系表通看，删掉重复表达，控制在十二到二十张；最后写一段三百字以内的自述，说明拍什么、为什么这么拍，文字与照片要能互相支撑而不是互相解释。上传前压缩到平台要求的尺寸，避免二次压缩导致糊。"},{"h":"边界与代价","p":"典型翻车：通篇写用了什么镜头什么光圈。输出的代价是「多而不精」。把三百张原片一股脑发出去，观者只会记住最差的那几张；选片的核心能力是删，而不是留。过度锐化与过度降噪在屏幕上不易察觉，一打印就暴露。不同平台的压缩算法差异很大，同一张图在手机上鲜、在电脑上灰，发布前要在目标设备上实看一次。也别为了凑数放重复构图的照片，一组里两张相似的照片会互相削弱。"},{"h":"怎么判断到位","p":"今天的判据：是说意图不说设备。先问：这组照片给谁看、在哪看，规格匹配吗？再问：删到只剩十张，我会留下哪十张？最后问：这套顺序能让观者看完最后一张吗？输出的及格线是「规格对、删得狠、顺序顺」。"}],"points":["是说意图不说设备","今天只验证这一个变量：能写两百字说清拍什么为什么拍"],"pitfalls":["通篇写用了什么镜头什么光圈"],"quiz":[{"q":"「作品集自述」的判断要点是什么？先说结论再谈理由。","a":"是说意图不说设备","why":"自述回答三件事：为什么拍这个（动机）、怎么拍（方法与条件）、希望观者看到什么（意图）"},{"q":"有人说：通篇写用了什么镜头什么光圈。这样对吗？","a":"不对。是说意图不说设备","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"为你的组照写两百字自述｜按用途导出（社交长边 2048px / 打印 300dpi），sRGB","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 40%：尺寸与用途匹配、锐度适中（每项 5 分制，任一不达标记 3 分以下）","表达 40%：成组风格统一、选片有取舍","规范 20%：色彩空间与命名规范"]}},"M09-K04":{"title":"打印与色彩校样","anchor":"是屏幕亮纸面暗，不是所见即所得","source":"参考：《摄影师的视界》 · 编辑与输出 · 选片输出与作品集（按目录对应）","sections":[{"h":"为什么是这样","p":"屏幕发光纸反光，同一文件打印通常偏暗一档左右。做法是把屏幕亮度调到 100 到 120 尼特并校色，打印小样后按偏差统一调整再批量输出。纸张（光面绒面）影响对比与黑色深度，选纸也是表达的一部分。输出是把照片变成作品集的最后一道工序，也是最多人忽略的一环。技术上要处理三件事：尺寸与用途（屏幕观看长边 2048px 足够，打印按 300dpi 折算实际尺寸）、锐度（输出锐化与屏幕锐化不是一回事，过量会在印刷上出现白边）、色彩空间（屏幕用 sRGB，印刷才用 Adobe RGB，混用会导致偏色）。成组呈现还要考虑顺序：第一张定调、中间有节奏起伏、最后一张收束。"},{"h":"操作路径","p":"今天的练习：打印一张小样与屏幕对比并调整。流程：先按用途定导出规格并存成预设，避免每次手动设置出错；导出前逐张检查高光溢出、噪点、水平与边缘杂物；命名规范统一（日期_主题_序号），方便回溯；成组挑选时先做联系表通看，删掉重复表达，控制在十二到二十张；最后写一段三百字以内的自述，说明拍什么、为什么这么拍，文字与照片要能互相支撑而不是互相解释。上传前压缩到平台要求的尺寸，避免二次压缩导致糊。"},{"h":"边界与代价","p":"典型翻车：屏幕看着正好，打印出来发暗。输出的代价是「多而不精」。把三百张原片一股脑发出去，观者只会记住最差的那几张；选片的核心能力是删，而不是留。过度锐化与过度降噪在屏幕上不易察觉，一打印就暴露。不同平台的压缩算法差异很大，同一张图在手机上鲜、在电脑上灰，发布前要在目标设备上实看一次。也别为了凑数放重复构图的照片，一组里两张相似的照片会互相削弱。"},{"h":"怎么判断到位","p":"今天的判据：是屏幕亮纸面暗，不是所见即所得。先问：这组照片给谁看、在哪看，规格匹配吗？再问：删到只剩十张，我会留下哪十张？最后问：这套顺序能让观者看完最后一张吗？输出的及格线是「规格对、删得狠、顺序顺」。"}],"points":["是屏幕亮纸面暗，不是所见即所得","今天只验证这一个变量：能完成一次可用的输出"],"pitfalls":["屏幕看着正好，打印出来发暗"],"quiz":[{"q":"「打印与色彩校样」的判断要点是什么？先说结论再谈理由。","a":"是屏幕亮纸面暗，不是所见即所得","why":"屏幕发光纸反光，同一文件打印通常偏暗一档左右"},{"q":"有人说：屏幕看着正好，打印出来发暗。这样对吗？","a":"不对。是屏幕亮纸面暗，不是所见即所得","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"打印一张小样与屏幕对比并调整｜按用途导出（社交长边 2048px / 打印 300dpi），sRGB","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 40%：尺寸与用途匹配、锐度适中（每项 5 分制，任一不达标记 3 分以下）","表达 40%：成组风格统一、选片有取舍","规范 20%：色彩空间与命名规范"]}},"M09-K05":{"title":"发布与版权","anchor":"是发布前想清楚授权","source":"参考：《摄影师的视界》 · 编辑与输出 · 选片输出与作品集（按目录对应）","sections":[{"h":"为什么是这样","p":"发布前确认：是否含可识别他人（需同意，商业用途尤其）、是否泄露住址与行程（EXIF 定位）、平台授权条款（部分平台获得商用权）。署名与版权声明可选，但保留原始文件与拍摄时间是最有效的权利证明。参赛注意主办方使用条款。输出是把照片变成作品集的最后一道工序，也是最多人忽略的一环。技术上要处理三件事：尺寸与用途（屏幕观看长边 2048px 足够，打印按 300dpi 折算实际尺寸）、锐度（输出锐化与屏幕锐化不是一回事，过量会在印刷上出现白边）、色彩空间（屏幕用 sRGB，印刷才用 Adobe RGB，混用会导致偏色）。成组呈现还要考虑顺序：第一张定调、中间有节奏起伏、最后一张收束。"},{"h":"操作路径","p":"今天的练习：检查一组图的肖像与地点信息再发布。流程：先按用途定导出规格并存成预设，避免每次手动设置出错；导出前逐张检查高光溢出、噪点、水平与边缘杂物；命名规范统一（日期_主题_序号），方便回溯；成组挑选时先做联系表通看，删掉重复表达，控制在十二到二十张；最后写一段三百字以内的自述，说明拍什么、为什么这么拍，文字与照片要能互相支撑而不是互相解释。上传前压缩到平台要求的尺寸，避免二次压缩导致糊。"},{"h":"边界与代价","p":"典型翻车：未经同意发布可识别人物的照片。输出的代价是「多而不精」。把三百张原片一股脑发出去，观者只会记住最差的那几张；选片的核心能力是删，而不是留。过度锐化与过度降噪在屏幕上不易察觉，一打印就暴露。不同平台的压缩算法差异很大，同一张图在手机上鲜、在电脑上灰，发布前要在目标设备上实看一次。也别为了凑数放重复构图的照片，一组里两张相似的照片会互相削弱。"},{"h":"怎么判断到位","p":"今天的判据：是发布前想清楚授权。先问：这组照片给谁看、在哪看，规格匹配吗？再问：删到只剩十张，我会留下哪十张？最后问：这套顺序能让观者看完最后一张吗？输出的及格线是「规格对、删得狠、顺序顺」。"}],"points":["是发布前想清楚授权","今天只验证这一个变量：能安全地发布作品并保护权利"],"pitfalls":["未经同意发布可识别人物的照片"],"quiz":[{"q":"「发布与版权」的判断要点是什么？先说结论再谈理由。","a":"是发布前想清楚授权","why":"发布前确认：是否含可识别他人（需同意，商业用途尤其）、是否泄露住址与行程（EXIF 定位）、平台授权条款（部分平台获得商用权）"},{"q":"有人说：未经同意发布可识别人物的照片。这样对吗？","a":"不对。是发布前想清楚授权","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"检查一组图的肖像与地点信息再发布｜按用途导出（社交长边 2048px / 打印 300dpi），sRGB","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 40%：尺寸与用途匹配、锐度适中（每项 5 分制，任一不达标记 3 分以下）","表达 40%：成组风格统一、选片有取舍","规范 20%：色彩空间与命名规范"]}},"M09-K06":{"title":"自我评估与长期进步","anchor":"是用同一标准打分，不是感觉进步","source":"参考：《摄影师的视界》 · 编辑与输出 · 选片输出与作品集（按目录对应）","sections":[{"h":"为什么是这样","p":"长期进步靠可比较的评估：固定三维（技术、表达、规范）与固定题材，每季度给新作打分并与上季对比；找出得分最低维频次最高的项作为下季重点。点赞受题材与发布时间影响，不能当能力指标。每半年重评旧作会看到盲区。输出是把照片变成作品集的最后一道工序，也是最多人忽略的一环。技术上要处理三件事：尺寸与用途（屏幕观看长边 2048px 足够，打印按 300dpi 折算实际尺寸）、锐度（输出锐化与屏幕锐化不是一回事，过量会在印刷上出现白边）、色彩空间（屏幕用 sRGB，印刷才用 Adobe RGB，混用会导致偏色）。成组呈现还要考虑顺序：第一张定调、中间有节奏起伏、最后一张收束。"},{"h":"操作路径","p":"今天的练习：每季度用同一评分表给自己十张新作打分。流程：先按用途定导出规格并存成预设，避免每次手动设置出错；导出前逐张检查高光溢出、噪点、水平与边缘杂物；命名规范统一（日期_主题_序号），方便回溯；成组挑选时先做联系表通看，删掉重复表达，控制在十二到二十张；最后写一段三百字以内的自述，说明拍什么、为什么这么拍，文字与照片要能互相支撑而不是互相解释。上传前压缩到平台要求的尺寸，避免二次压缩导致糊。"},{"h":"边界与代价","p":"典型翻车：只看点赞数判断水平。输出的代价是「多而不精」。把三百张原片一股脑发出去，观者只会记住最差的那几张；选片的核心能力是删，而不是留。过度锐化与过度降噪在屏幕上不易察觉，一打印就暴露。不同平台的压缩算法差异很大，同一张图在手机上鲜、在电脑上灰，发布前要在目标设备上实看一次。也别为了凑数放重复构图的照片，一组里两张相似的照片会互相削弱。"},{"h":"怎么判断到位","p":"今天的判据：是用同一标准打分，不是感觉进步。先问：这组照片给谁看、在哪看，规格匹配吗？再问：删到只剩十张，我会留下哪十张？最后问：这套顺序能让观者看完最后一张吗？输出的及格线是「规格对、删得狠、顺序顺」。"}],"points":["是用同一标准打分，不是感觉进步","今天只验证这一个变量：能每季度评估自己真实水平"],"pitfalls":["只看点赞数判断水平"],"quiz":[{"q":"「自我评估与长期进步」的判断要点是什么？先说结论再谈理由。","a":"是用同一标准打分，不是感觉进步","why":"长期进步靠可比较的评估：固定三维（技术、表达、规范）与固定题材，每季度给新作打分并与上季对比"},{"q":"有人说：只看点赞数判断水平。这样对吗？","a":"不对。是用同一标准打分，不是感觉进步","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"每季度用同一评分表给自己十张新作打分｜按用途导出（社交长边 2048px / 打印 300dpi），sRGB","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 40%：尺寸与用途匹配、锐度适中（每项 5 分制，任一不达标记 3 分以下）","表达 40%：成组风格统一、选片有取舍","规范 20%：色彩空间与命名规范"]}}};

// ---------- 计划索引 ----------
var MODIDX = {"器材与基本操作": 1, "曝光与测光": 2, "光线与用光": 3, "构图与视觉语言": 4, "色彩与后期": 5, "人像专题": 6, "风光与建筑": 7, "街拍与纪实": 8, "选片输出与作品集": 9};

var BYDAY = {};          // 日期 -> 行
var REV = {};            // 日期 -> [{key,title,stage,from}]
var NEWROW = {};         // key -> 行

function keyOf(r){
  var mIdx = MODIDX[r[4]];
  var kIdx = 0;
  for (var j = 0; j < PLAN.length; j++) {
    if (PLAN[j][4] === r[4]) { kIdx++; if (PLAN[j] === r) break; }
  }
  return 'M' + pad(mIdx) + '-K' + pad(kIdx);
}

PLAN.forEach(function(r){
  BYDAY[r[0]] = r;
  if (r[3] === '新知识点') {
    var key = keyOf(r);
    NEWROW[key] = r;
    for (var i = 11; i <= 15; i++) {
      if (!r[i]) continue;
      (REV[r[i]] = REV[r[i]] || []).push({key: key, title: r[5], stage: ['D1','D3','D7','D14','D30'][i-11], from: r[0], tag: r[17]});
    }
  }
});
function keyOf(r){
  var mIdx = MODIDX[r[4]];
  var kIdx = 0;
  for (var j = 0; j < PLAN.length; j++) {
    if (PLAN[j][4] === r[4]) { kIdx++; if (PLAN[j] === r) break; }
  }
  return 'M' + pad(mIdx) + '-K' + pad(kIdx);
}
var MODTOTAL2 = MODTOTAL;

function dayInfo(){
  var t = today();
  if (BYDAY[t]) return {date: t, row: BYDAY[t], real: true};
  var first = PLAN[0][0];
  if (t < first) return {date: t, row: PLAN[0], real: false, early: true};
  return {date: t, row: PLAN[PLAN.length-1], real: false, late: true};
}

// ---------- 视图 ----------
var state = {tab: 'today', quiz: [], qi: 0, matOpen: null};

function render(){
  document.querySelectorAll('nav button').forEach(function(b){
    b.classList.toggle('on', b.dataset.t === state.tab);
  });
  $('#hd').textContent = ('0' + APP_VER).slice(-5);
  if (state.tab === 'today') vToday();
  else if (state.tab === 'quiz') vQuiz();
  else if (state.tab === 'cards') vCards();
  else if (state.tab === 'stats') vStats();
  else vMats();
}

function vToday(){
  var di = dayInfo(), r = di.row, v = $('#view'), t = today();
  var done = lsGet('done.' + t, null);
  var due = REV[t] || [];
  var h = '';
  if (!di.real) {
    h += '<div class="card" style="border-color:var(--warn)"><h2>计划区间外</h2><p class="muted" style="margin:0">' +
      (di.early ? '计划尚未开始，先看首日预览。' : '主周期已结束，已为你停在最后一天；请进入长期循环（见使用说明）。') +
      '</p></div>';
  }
  h += '<div class="card hero"><div class="k">第 ' + r[2] + ' 天 · ' + r[1] + ' · ' + r[3] + '</div>' +
       '<div class="t">' + esc(r[5]) + '</div>' +
       '<div class="s">' + esc(r[4]) + ' · ' + esc(r[6]) + '</div>' +
       '<div style="margin-top:10px"><span class="pill ' + (r[16]||'B').toLowerCase() + '">优先级 ' + esc(r[16]) + '</span>' +
       '<span class="pill">' + esc(r[17] || '综合') + '</span></div></div>';

  if (r[3] === '新知识点') {
    h += '<div class="card"><h2>今天要验证的一个变量</h2><p class="v" style="margin-bottom:0">' +
         esc((MATERIALS[keyOf(r)] || {}).anchor || r[8]) + '</p></div>';
    h += '<div class="card"><h2>学习目标</h2><p class="v" style="margin-bottom:0">' + esc(r[7]) + '</p></div>';
    h += '<div class="card"><h2>练习任务</h2><p class="v" style="margin-bottom:0">' + esc(r[9]) + '</p></div>';
    h += '<div class="card"><h2>任务卡</h2>' + taskCardHTML(keyOf(r)) + '</div>';
    h += '<div class="card"><h2>今日动作</h2><div class="row">' +
         '<button class="btn primary" id="bopen">打开精讲</button>' +
         '<button class="btn ' + (done ? '' : 'primary') + '" id="bdone">' + (done ? '已完成 ✓' : '标记完成') + '</button>' +
         '</div><p class="muted" style="margin:8px 0 0">完成标准：有交付物（成片 1–3 张 + 失败对照 1 张），不看时长。</p></div>';
  } else {
    h += '<div class="card"><h2>今日动作</h2><p class="v">' + esc(r[9]) + '</p>' +
         '<div class="row"><button class="btn primary" id="bdone">' + (done ? '已完成 ✓' : '标记完成') + '</button>' +
         '<button class="btn" id="btostats">看统计</button></div></div>';
  }

  if (due.length) {
    h += '<div class="card"><h2>到期复习 · ' + due.length + ' 条</h2><ul class="clean">';
    due.forEach(function(d){
      h += '<li>' + esc(d.stage) + ' · ' + esc(d.title) + '<span class="tag">' + esc(d.tag || '') + '</span></li>';
    });
    h += '</ul><div class="row"><button class="btn" id="bquiz">去答题</button></div></div>';
  }
  v.innerHTML = h;

  var bo = $('#bopen'); if (bo) bo.onclick = function(){ openReader(keyOf(r)); };
  var bd = $('#bdone'); if (bd) bd.onclick = function(){
    var m = lsGet('done.' + t, {});
    m.new = true; m.minutes = m.minutes || 60; m.date = t;
    lsSet('done.' + t, m);
    toast('已记录');
    render();
  };
  var bq = $('#bquiz'); if (bq) bq.onclick = function(){ state.tab = 'quiz'; state.quiz = []; render(); };
  var bs = $('#btostats'); if (bs) bs.onclick = function(){ state.tab = 'stats'; render(); };
}

function taskCardHTML(key){
  var m = MATERIALS[key] || {};
  var tc = m.task_card;
  if (!tc) return '<p class="muted">暂无任务卡</p>';
  var h = '<p class="k">设定</p><p class="v">' + esc(tc.setup) + '</p>' +
          '<p class="k">交付</p><p class="v">' + esc(tc.deliverable) + '</p>' +
          '<p class="k">评分（三维）</p><ul class="clean">';
  (tc.rubric || []).forEach(function(x){ h += '<li>' + esc(x) + '</li>'; });
  h += '</ul>';
  if (m.pitfalls && m.pitfalls.length)
    h += '<p class="k" style="margin-top:10px">失败样本</p><p class="v" style="margin-bottom:0">' + esc(m.pitfalls[0]) + '</p>';
  return h;
}

function vQuiz(){
  var t = today(), v = $('#view');
  if (!state.quiz.length) {
    var di = dayInfo();
    var pool = [];
    if (di.row[3] === '新知识点') pool.push(keyOf(di.row));
    (REV[t] || []).forEach(function(d){ if (pool.indexOf(d.key) < 0) pool.push(d.key); });
    if (!pool.length) {
      v.innerHTML = '<div class="card"><h2>今天没有待答的题</h2><p class="muted" style="margin:0">当日无新知识点也没有到期复习。可以去「材料」页自由复习。</p></div>';
      return;
    }
    state.quiz = pool.slice(0, 5); state.qi = 0;
  }
  var key = state.quiz[state.qi], m = MATERIALS[key] || {};
  var qs = (m.quiz || []).slice(0, 2);
  var rec = lsGet('quiz.' + t, []);
  var mine = null;
  rec.forEach(function(x){ if (x.key === key) mine = x.self; });
  var h = '<div class="card"><div class="k">第 ' + (state.qi+1) + ' / ' + state.quiz.length + ' 题 · ' + esc(key) + '</div>' +
          '<h2>' + esc(m.title || key) + '</h2>';
  if (!qs.length) h += '<p class="muted">该点暂无自测题</p>';
  qs.forEach(function(q){
    h += '<div class="q"><p class="stem">' + esc(q.q) + '</p>' +
         '<button class="btn ghost" style="min-height:36px;font-size:13px;padding:0 10px" onclick="var p=this.parentNode;p.classList.toggle(\'open\')">显示答案</button>' +
         '<p class="ans"><b>答：</b>' + esc(q.a) + '<br><b>为什么：</b>' + esc(q.why) + '</p></div>';
  });
  h += '<p class="k" style="margin-top:12px">三档自评</p><div class="tri">' +
       ['会','模糊','不会'].map(function(s){
         return '<button data-s="' + s + '" class="' + (mine === s ? 'on' : '') + '">' + s + '</button>';
       }).join('') + '</div>' +
       '<p class="muted" style="margin:10px 0 0">规则：会→进入下一档；模糊→间隔减半；不会→回到 D1 并进错题本。</p>';
  h += '</div><div class="row"><button class="btn" id="bprev"' + (state.qi === 0 ? ' disabled' : '') + '>上一题</button>' +
       '<button class="btn primary" id="bnext">' + (state.qi === state.quiz.length-1 ? '完成' : '下一题') + '</button></div>';
  v.innerHTML = h;
  v.querySelectorAll('.tri button').forEach(function(b){
    b.onclick = function(){
      var arr = lsGet('quiz.' + t, []);
      var found = false;
      arr.forEach(function(x){ if (x.key === key) { x.self = b.dataset.s; found = true; } });
      if (!found) arr.push({key: key, self: b.dataset.s, at: t});
      lsSet('quiz.' + t, arr);
      v.querySelectorAll('.tri button').forEach(function(z){ z.classList.remove('on'); });
      b.classList.add('on');
      toast('已记录：' + b.dataset.s);
    };
  });
  $('#bprev').onclick = function(){ if (state.qi > 0) { state.qi--; render(); } };
  $('#bnext').onclick = function(){
    if (state.qi < state.quiz.length-1) { state.qi++; render(); }
    else { state.quiz = []; state.tab = 'today'; toast('答题完成'); render(); }
  };
}

function vCards(){
  var t = today(), v = $('#view');
  var all = [];
  Object.keys(NEWROW).forEach(function(k){
    var r = NEWROW[k];
    all.push({key: k, title: r[5], mod: r[4], tag: r[17]});
  });
  var reads = lsGet('read', {});
  var quiz = lsGet('quiz.' + t, []);
  var selfMap = {};
  Object.keys(lsGet('allquiz', {})).forEach(function(d){
    lsGet('allquiz', {})[d].forEach(function(x){ selfMap[x.key] = x.self; });
  });
  quiz.forEach(function(x){ selfMap[x.key] = x.self; });
  var h = '<div class="card"><h2>卡片库 · ' + all.length + ' 张</h2>' +
    '<p class="muted" style="margin:0 0 10px">只读展示；导出为 CSV（key/正面/背面/标签/自评）。</p>' +
    '<div class="row"><button class="btn" id="bexp">导出 CSV</button>' +
    '<button class="btn" id="bexpjson">导出进度 JSON</button>' +
    '<button class="btn" id="bimp">导入 JSON</button></div></div>';
  h += '<div class="card"><table><thead><tr><th>知识点</th><th>自评</th><th>已读</th></tr></thead><tbody>';
  all.forEach(function(c){
    var m = MATERIALS[c.key] || {};
    h += '<tr><td>' + esc(c.title) + '<div class="muted">' + esc(c.tag) + '</div></td>' +
         '<td>' + esc(selfMap[c.key] || '—') + '</td>' +
         '<td>' + (reads[c.key] ? '✓' : '') + '</td></tr>';
  });
  h += '</tbody></table></div>';
  v.innerHTML = h;
  $('#bexp').onclick = function(){
    var rows = [['key','正面','背面','标签','自评']];
    all.forEach(function(c){
      var m = MATERIALS[c.key] || {};
      rows.push([c.key, '「' + c.title + '」的判断要点是什么？', (m.anchor || '') + '｜' + ((m.pitfalls||[])[0] || ''), c.tag || '', selfMap[c.key] || '']);
    });
    download('卡片库-' + SCHEME + '.csv', '\ufeff' + rows.map(function(r){ return r.map(function(x){ return '"' + String(x).replace(/"/g,'""') + '"'; }).join(','); }).join('\r\n'), 'text/csv');
  };
  $('#bexpjson').onclick = function(){
    var dump = {meta:{ver: APP_VER, scheme: SCHEME, exported: new Date().toISOString()}, data:{}};
    try{
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k.indexOf(PFX) === 0) dump.data[k.slice(PFX.length)] = JSON.parse(localStorage.getItem(k));
      }
    }catch(e){}
    download('进度-' + SCHEME + '-' + today() + '.json', JSON.stringify(dump, null, 1), 'application/json');
  };
  $('#bimp').onclick = function(){
    var inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json';
    inp.onchange = function(){
      var f = inp.files[0]; if (!f) return;
      var rd = new FileReader();
      rd.onload = function(){
        try{
          var o = JSON.parse(rd.result);
          if (!o.data) throw new Error('格式不符');
          Object.keys(o.data).forEach(function(k){ lsSet(k, o.data[k]); });
          toast('已导入');
          render();
        }catch(e){ toast('导入失败：' + e.message); }
      };
      rd.readAsText(f, 'utf-8');
    };
    inp.click();
  };
}

function vStats(){
  var v = $('#view'), done = lsGet('doneMap', {});
  var doneDates = [];
  Object.keys(localStorage).forEach(function(k){
    if (k.indexOf(PFX + 'done.') === 0) doneDates.push(k.slice((PFX + 'done.').length));
  });
  var started = PLAN[0][0], t = today();
  var elapsed = Math.max(1, Math.round((parseISO(t) - parseISO(started))/86400000) + 1);
  var totalPlan = PLAN.length;
  var doneN = doneDates.length;
  var streak = 0, cur = new Date();
  for (var i = 0; i < 400; i++) {
    var k2 = 'done.' + iso(cur);
    var has = false;
    try{ has = !!localStorage.getItem(PFX + k2); }catch(e){}
    if (has) { streak++; cur.setDate(cur.getDate() - 1); }
    else if (i === 0) { cur.setDate(cur.getDate() - 1); }
    else break;
  }
  // 逾期积压
  var backlog = 0;
  Object.keys(REV).forEach(function(d){
    if (d < t && d >= started) {
      var r = BYDAY[d];
      if (!r) return;
      var rec = lsGet('quiz.' + d, null);
      if (!rec) backlog += REV[d].length;
    }
  });
  // 方向矩阵
  var agg = {};
  Object.keys(localStorage).forEach(function(k){
    if (k.indexOf(PFX + 'quiz.') !== 0) return;
    var d = k.slice((PFX+'quiz.').length);
    try{
      JSON.parse(localStorage.getItem(k)).forEach(function(x){
        var r0 = NEWROW[x.key]; if (!r0) return;
        var tag = r0[17] || '综合';
        var s = x.self === '会' ? 5 : x.self === '模糊' ? 3 : 1;
        (agg[tag] = agg[tag] || {n: 0, s: 0}).n++;
        agg[tag].s += s;
      });
    }catch(e){}
  });
  var h = '<div class="grid">' +
    '<div class="stat"><div class="n">' + doneN + '</div><div class="l">已完成天数</div></div>' +
    '<div class="stat"><div class="n">' + Math.min(100, Math.round(doneN/Math.max(elapsed,1)*100)) + '%</div><div class="l">区间完成率</div></div>' +
    '<div class="stat"><div class="n">' + streak + '</div><div class="l">连续天数</div></div>' +
    '<div class="stat"><div class="n">' + backlog + '</div><div class="l">逾期复习条数</div></div>' +
    '</div>';
  h += '<div class="card"><h2>模块掌握</h2>';
  Object.keys(MODIDX).forEach(function(mod){
    var tot = MODTOTAL[mod] || 0;
    var dn = 0;
    Object.keys(NEWROW).forEach(function(k){
      if (NEWROW[k][4] === mod) {
        try{ if (localStorage.getItem(PFX + 'done.' + NEWROW[k][0])) dn++; }catch(e){}
      }
    });
    var p = tot ? Math.round(dn/tot*100) : 0;
    h += '<div style="margin:0 0 10px"><div style="display:flex;justify-content:space-between;font-size:14px">' +
         '<span>' + esc(mod) + '</span><span class="muted">' + dn + '/' + tot + '</span></div>' +
         '<div class="bar-o"><div class="bar-i" style="width:' + p + '%"></div></div></div>';
  });
  h += '</div>';
  h += '<div class="card"><h2>题材 × 自评矩阵</h2>';
  var keys = Object.keys(agg);
  if (!keys.length) h += '<p class="muted" style="margin:0">还没有答题记录</p>';
  else {
    h += '<table><thead><tr><th>题材</th><th>答题数</th><th>均分</th></tr></thead><tbody>';
    keys.sort(function(a,b){ return agg[a].s/agg[a].n - agg[b].s/agg[b].n; }).forEach(function(k3){
      h += '<tr><td>' + esc(k3) + '</td><td>' + agg[k3].n + '</td><td>' + (agg[k3].s/agg[k3].n).toFixed(1) + '</td></tr>';
    });
    h += '</tbody></table><p class="muted" style="margin:8px 0 0">均分最低的两题材进下周复盘重点。</p>';
  }
  h += '</div>';
  v.innerHTML = h;
}

function vMats(){
  var v = $('#view');
  var reads = lsGet('read', {});
  var h = '<div class="card"><h2>材料 · 按模块</h2><p class="muted" style="margin:0">点击进入阅读层；读完点「标记已读」。</p></div>';
  Object.keys(MODIDX).forEach(function(mod){
    var ks = Object.keys(NEWROW).filter(function(k){ return NEWROW[k][4] === mod; });
    if (!ks.length) return;
    h += '<div class="card"><h2>' + esc(mod) + ' <span class="muted">' + ks.filter(function(k){return reads[k];}).length + '/' + ks.length + '</span></h2><ul class="clean">';
    ks.forEach(function(k){
      h += '<li><a href="#" data-k="' + k + '" style="color:var(--fg);text-decoration:none">' +
        (reads[k] ? '✓ ' : '') + esc(NEWROW[k][5]) + '</a><span class="tag">' + esc(NEWROW[k][17]||'') + '</span></li>';
    });
    h += '</ul></div>';
  });
  v.innerHTML = h;
  v.querySelectorAll('a[data-k]').forEach(function(a){
    a.onclick = function(e){ e.preventDefault(); openReader(a.dataset.k); };
  });
}

function openReader(key){
  var m = MATERIALS[key] || {};
  var r = NEWROW[key];
  $('#rtitle').textContent = m.title || (r ? r[5] : key);
  var h = '<h2>' + esc(m.title || key) + '</h2><p class="muted">' + esc(m.source || '') + ' · ' + esc(key) + '</p>';
  if (m.anchor) h += '<p style="border-left:3px solid var(--accent);padding-left:12px;color:var(--accent)">' + esc(m.anchor) + '</p>';
  (m.sections || []).forEach(function(s){ h += '<h3>' + esc(s.h) + '</h3><p>' + esc(s.p) + '</p>'; });
  if (m.points && m.points.length) {
    h += '<h3>要点</h3><ul class="clean">' + m.points.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
  }
  if (m.pitfalls && m.pitfalls.length) {
    h += '<h3>易错与失败样本</h3><ul class="clean">' + m.pitfalls.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
  }
  if (m.task_card) {
    h += '<h3>任务卡</h3><p><b>设定：</b>' + esc(m.task_card.setup) + '</p><p><b>交付：</b>' + esc(m.task_card.deliverable) + '</p>';
    h += '<ul class="clean">' + m.task_card.rubric.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
  }
  if (m.quiz && m.quiz.length) {
    h += '<h3>自测</h3>';
    m.quiz.forEach(function(q){
      h += '<p><b>' + esc(q.q) + '</b><br>' + esc(q.a) + '<br><span class="muted">' + esc(q.why) + '</span></p>';
    });
  }
  $('#rbody').innerHTML = h;
  $('#rbody').scrollTop = 0;
  $('#reader').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  $('#rdone').onclick = function(){
    var reads = lsGet('read', {}); reads[key] = 1; lsSet('read', reads);
    toast('已标记已读');
  };
}
$('#rback').onclick = function(){
  $('#reader').classList.add('hidden');
  document.body.style.overflow = '';
  render();
};

function toast(msg){
  var d = document.createElement('div');
  d.textContent = msg;
  d.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + max(env(safe-area-inset-bottom),10px));z-index:99;background:rgba(20,22,26,.9);color:#fff;padding:8px 14px;border-radius:10px;font-size:14px';
  document.body.appendChild(d);
  setTimeout(function(){ d.remove(); }, 1600);
}
function download(name, text, mime){
  var b = new Blob([text], {type: mime + ';charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
}

// 主题
var th = lsGet('theme', null);
if (th) document.documentElement.setAttribute('data-theme', th);
$('#theme').onclick = function(){
  var cur = document.documentElement.getAttribute('data-theme');
  var next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  lsSet('theme', next);
};
document.querySelectorAll('nav button').forEach(function(b){
  b.onclick = function(){ state.tab = b.dataset.t; state.quiz = []; state.qi = 0; render(); window.scrollTo(0,0); };
});
render();
})();
</script>
<style>
/* 工具页自带底部常驻提示条（#bktoday）时，浮动按钮组上移避让，避免遮住「回到今天」 */
#pvBar{transition:bottom .18s ease}
#bktoday:not([hidden])~#pvBar{bottom:calc(132px + env(safe-area-inset-bottom))!important}
</style>
<div id="pvBar" style="position:fixed;bottom:14px;right:12px;z-index:9999;display:flex;flex-direction:column;gap:8px;">
  <a id="pvHome" href="../index.html" aria-label="返回项目清单" style="display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:rgba(120,120,128,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;text-decoration:none;font-size:16px;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.22);">&#8962;</a>
  <button class="btn sm" id="pvUpd" type="button" aria-label="检查并更新到最新版本" style="width:36px;height:36px;border:none;border-radius:50%;background:rgba(120,120,128,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font-size:15px;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.22);">&#8635;</button>
</div>
<script>
/* 「更新」按钮：比对 version.json 的 build，不一致即清缓存+注销 SW+硬重载 */
(function(){
  var b=document.getElementById('pvUpd'); if(!b) return;
  var m=document.querySelector('meta[name="pv-build"]'); var local=m?m.getAttribute('content'):'';
  var t0=b.textContent;
  function say(t,ms){ b.textContent=t; setTimeout(function(){ b.textContent=t0; }, ms||1600); }
  function hard(){
    try{ if('caches' in window){ caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }).catch(function(){}); } }catch(e){}
    try{ if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){ navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ try{ r.unregister(); }catch(e){} }); }); } }catch(e){}
    setTimeout(function(){ var u=location.href.split('#')[0]; var sep=u.indexOf('?')>=0?'&':'?'; try{ location.replace(u+sep+'t='+Date.now()); }catch(e){ location.reload(); } },150);
  }
  b.addEventListener('click', function(){
    if(!/^https?:/i.test(location.protocol)){ hard(); return; }
    var base = location.pathname.indexOf('/tools/') >= 0 ? '../' : '';
    say('检查中');
    fetch(base+'version.json?t='+Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(j){
      if(j && j.build && j.build !== local){ say('更新中'); hard(); } else { say('已最新'); }
    }).catch(function(){ hard(); });
  });
})();
</script>
