<style>
:root{

}
html[data-theme="dark"]{--bg:#111318; --fg:#e8eaee; --sub:#9aa3ae; --line:#282c34; --card:#171a20; --accent:#7aa7d6; --accent-2:#d6a87a; --ok:#6fbf94; --warn:#e0b060; --bad:#e08585; --shadow:none;}
html[data-theme="light"]{--bg:#f7f7f5; --fg:#1a1c20; --sub:#5c626b; --line:#e2e2dd; --card:#ffffff; --accent:#2f5d8a; --accent-2:#8a5a2f; --ok:#2e7d5b; --warn:#a8731b; --bad:#a63a3a; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);

body{padding-bottom:74px;padding-bottom:calc(64px + max(env(safe-area-inset-bottom),10px))}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);

header h1{font-size:17px;line-height:1.4;margin:0;flex:1;font-weight:650;letter-spacing:.2px}

.btn:active{transform:scale(.99)}

main{padding:14px 16px 8px;max-width:760px;margin:0 auto}

.v{font-size:16px;margin:0 0 10px}
.v.mono{font-variant-numeric:tabular-nums}

.pill.c{border-color:var(--sub);color:var(--sub)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
ul.clean{margin:0;padding-left:18px}

.tag{font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px}

nav button{flex:1;border:0;background:transparent;color:var(--sub);font-size:12px;min-height:48px;

nav button .ic{font-size:18px;line-height:1}
nav button.on{color:var(--accent);font-weight:650}
.hidden{display:none!important}
.reader{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.reader .bar{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);
  padding:10px 16px;display:flex;gap:8px;align-items:center}
.reader .body{padding:16px 18px calc(40px + max(env(safe-area-inset-bottom),10px));max-width:720px;margin:0 auto;font-size:17px;line-height:1.78}
.reader .body h2{font-size:19px;margin:0 0 4px}
.reader .body h3{font-size:15px;margin:20px 0 6px;color:var(--accent)}
.reader .body p{margin:0 0 1em}
.q{border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px;background:var(--card)}
.q .stem{font-size:16px;margin:0 0 8px}
.q .ans{font-size:15px;color:var(--sub);margin:8px 0 0;display:none}
.q.open .ans{display:block}
.tri{display:flex;gap:6px;margin-top:10px}
.tri button{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;
  color:var(--fg);font-size:14px;cursor:pointer}
.tri button.on{background:var(--accent);color:#fff;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat .n{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--sub)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--sub);font-weight:600;font-size:13px}
.bar-o{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.bar-i{height:100%;background:var(--accent)}
.muted{color:var(--sub);font-size:13px}
.hero{padding:18px 16px}
.hero .t{font-size:22px;font-weight:700;line-height:1.35}
.hero .s{font-size:14px;color:var(--sub);margin-top:6px}
select{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;

@media (max-width:360px){main{padding:12px}header h1{font-size:16px}}
</style>
</head>

var MATERIALS = {"M01-K01":{"title":"机身与镜头的分工","anchor":"是镜头定视角机身定响应，不是贵机身出好片","source":"参考：《美国摄影教程》第12版 · 器材与基本操作（按目录对应）","sections":[{"h":"为什么是这样","p":"机身决定对焦速度、连拍、高感噪点与取景方式；镜头决定视角、透视压缩与最大光圈。判断缺什么：拍不到是焦段不够，拍不清是对焦慢或噪点多，画面平是光位与视角问题。先把钱花在镜头上，通常比换机身见效快。器材的真实边界由传感器尺寸、镜头光学与机身响应共同决定，而不由参数表上的最大值决定。传感器尺寸决定了同样视角下的景深与高感表现：小底在高 ISO 下暗部先出色噪，大底则能把可用区间再往上推一挡半。焦距改变的不只是取景范围，更是透视关系——广角把近处推远、把纵深夸大，长焦压缩前后景、让背景靠近主体。这些差异在拍摄前就该心里有数，而不是拍完再猜为什么画面不对。"},{"h":"操作路径","p":"今天的练习：用同一机身换两支焦段拍同一主体，比较画面变化。器材练习的关键是控制变量：同一机位、同一光线、同一被摄体，只换焦距或只换光圈，然后并排看差异。出门前把三件事做完——清空存储卡、确认电池余量、把常用参数存成自定义档位。手持时肘部贴紧躯干、在呼气末按快门；一旦上三脚架，先关掉镜头或机身防抖，否则防抖在稳定环境下反而引入微抖。收工后回到同一菜单把参数复位，避免下一次带着上一场的设定出门。"},{"h":"边界与代价","p":"典型翻车：画面不对就想着换机身。器材从来不在瓶颈的前三位。预算优先投给能常带出门的那支镜头，而不是参数更漂亮却常年躺在包里的那支。别拿升级器材替代基本功：换机身治不好测光判断错误、构图无序和快门时机滞后。也要警惕参数洁癖——为追极致锐度把光圈收到 f/16，衍射反而让画面发软；为追虚化全开光圈，结果主体边缘薄得像纸。设备的价值在于它被带出去多少次，而不是它标称多少像素。"},{"h":"怎么判断到位","p":"今天的判据：是镜头定视角机身定响应，不是贵机身出好片。先问：这套参数是我决定的，还是相机的自动档替我决定的？再问：同一场景换一挡光圈或一挡焦距，画面差异我能提前预判吗？最后问：所有设备状态（电量、存储、防抖、色彩设置）我都确认过了吗？三问都能答清，才算真的掌握了器材。"}],"points":["是镜头定视角机身定响应，不是贵机身出好片","今天只验证这一个变量：能判断自己缺的是焦段还是机身能力"],"pitfalls":["画面不对就想着换机身"],"quiz":[{"q":"「机身与镜头的分工」的判断要点是什么？先说结论再谈理由。","a":"是镜头定视角机身定响应，不是贵机身出好片","why":"机身决定对焦速度、连拍、高感噪点与取景方式"},{"q":"有人说：画面不对就想着换机身。这样对吗？","a":"不对。是镜头定视角机身定响应，不是贵机身出好片","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"用同一机身换两支焦段拍同一主体，比较画面变化｜相机：光圈优先、f/5.6、ISO 自动上限 3200、单点对焦；手机：专业模式锁定 ISO 与对焦","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：参数按设定执行、对焦落在预定位置、手持 1/30s 可读（每项 5 分制，任一不达标记 3 分以下）","表达 25%：主体可辨、无意外遮挡","规范 15%：参数记录完整、未用后期掩盖操作失误"]}},"M01-K02":{"title":"画幅与等效焦距","anchor":"是对角线换算不是长边，APS-C 约乘 1.5","source":"参考：《美国摄影教程》第12版 · 器材与基本操作（按目录对应）","sections":[{"h":"为什么是这样","p":"等效焦距等于实际焦距乘裁切系数（全幅 1.0、APS-C 约 1.5、M43 为 2.0）。它只换算视角，不改变透视，透视只由拍摄距离决定。所以 APS-C 赚长焦只是裁切，压缩感与全幅同焦段并不相同。换算的意义是预判取景范围。器材的真实边界由传感器尺寸、镜头光学与机身响应共同决定，而不由参数表上的最大值决定。传感器尺寸决定了同样视角下的景深与高感表现：小底在高 ISO 下暗部先出色噪，大底则能把可用区间再往上推一挡半。焦距改变的不只是取景范围，更是透视关系——广角把近处推远、把纵深夸大，长焦压缩前后景、让背景靠近主体。这些差异在拍摄前就该心里有数，而不是拍完再猜为什么画面不对。"},{"h":"操作路径","p":"今天的练习：查自己设备裁切系数，把常用三支镜头换算成等效焦距。器材练习的关键是控制变量：同一机位、同一光线、同一被摄体，只换焦距或只换光圈，然后并排看差异。出门前把三件事做完——清空存储卡、确认电池余量、把常用参数存成自定义档位。手持时肘部贴紧躯干、在呼气末按快门；一旦上三脚架，先关掉镜头或机身防抖，否则防抖在稳定环境下反而引入微抖。收工后回到同一菜单把参数复位，避免下一次带着上一场的设定出门。"},{"h":"边界与代价","p":"典型翻车：拿 APS-C 的 50mm 当全幅 50mm 用，拍完发现偏窄。器材从来不在瓶颈的前三位。预算优先投给能常带出门的那支镜头，而不是参数更漂亮却常年躺在包里的那支。别拿升级器材替代基本功：换机身治不好测光判断错误、构图无序和快门时机滞后。也要警惕参数洁癖——为追极致锐度把光圈收到 f/16，衍射反而让画面发软；为追虚化全开光圈，结果主体边缘薄得像纸。设备的价值在于它被带出去多少次，而不是它标称多少像素。"},{"h":"怎么判断到位","p":"今天的判据：是对角线换算不是长边，APS-C 约乘 1.5。先问：这套参数是我决定的，还是相机的自动档替我决定的？再问：同一场景换一挡光圈或一挡焦距，画面差异我能提前预判吗？最后问：所有设备状态（电量、存储、防抖、色彩设置）我都确认过了吗？三问都能答清，才算真的掌握了器材。"}],"points":["是对角线换算不是长边，APS-C 约乘 1.5","今天只验证这一个变量：能把手上设备焦距换算成等效视角"],"pitfalls":["拿 APS-C 的 50mm 当全幅 50mm 用，拍完发现偏窄"],"quiz":[{"q":"「画幅与等效焦距」的判断要点是什么？先说结论再谈理由。","a":"是对角线换算不是长边，APS-C 约乘 1.5","why":"等效焦距等于实际焦距乘裁切系数（全幅 1.0、APS-C 约 1.5、M43 为 2.0）"},{"q":"有人说：拿 APS-C 的 50mm 当全幅 50mm 用，拍完发现偏窄。这样对吗？","a":"不对。是对角线换算不是长边，APS-C 约乘 1.5","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"查自己设备裁切系数，把常用三支镜头换算成等效焦距｜相机：光圈优先、f/5.6、ISO 自动上限 3200、单点对焦；手机：专业模式锁定 ISO 与对焦","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：参数按设定执行、对焦落在预定位置、手持 1/30s 可读（每项 5 分制，任一不达标记 3 分以下）","表达 25%：主体可辨、无意外遮挡","规范 15%：参数记录完整、未用后期掩盖操作失误"]}},"M01-K03":{"title":"焦距分段与视角","anchor":"是焦段决定透视与压缩，不是远近靠走","source":"参考：《美国摄影教程》第12版 · 器材与基本操作（按目录对应）","sections":[{"h":"为什么是这样","p":"24mm 以下强调前后关系、边缘拉伸；35mm 接近双人眼视野，适合环境人像与街拍；50mm 中性少变形；85-135mm 压缩背景，适合人像与细节。想让背景更干净，往往不是换更广，而是换更长并后退。器材的真实边界由传感器尺寸、镜头光学与机身响应共同决定，而不由参数表上的最大值决定。传感器尺寸决定了同样视角下的景深与高感表现：小底在高 ISO 下暗部先出色噪，大底则能把可用区间再往上推一挡半。焦距改变的不只是取景范围，更是透视关系——广角把近处推远、把纵深夸大，长焦压缩前后景、让背景靠近主体。这些差异在拍摄前就该心里有数，而不是拍完再猜为什么画面不对。"},{"h":"操作路径","p":"今天的练习：固定主体，用 24/50/135 三个焦段各拍一张并保持主体同大。器材练习的关键是控制变量：同一机位、同一光线、同一被摄体，只换焦距或只换光圈，然后并排看差异。出门前把三件事做完——清空存储卡、确认电池余量、把常用参数存成自定义档位。手持时肘部贴紧躯干、在呼气末按快门；一旦上三脚架，先关掉镜头或机身防抖，否则防抖在稳定环境下反而引入微抖。收工后回到同一菜单把参数复位，避免下一次带着上一场的设定出门。"},{"h":"边界与代价","p":"典型翻车：用广角拍人像靠太近，脸变形。器材从来不在瓶颈的前三位。预算优先投给能常带出门的那支镜头，而不是参数更漂亮却常年躺在包里的那支。别拿升级器材替代基本功：换机身治不好测光判断错误、构图无序和快门时机滞后。也要警惕参数洁癖——为追极致锐度把光圈收到 f/16，衍射反而让画面发软；为追虚化全开光圈，结果主体边缘薄得像纸。设备的价值在于它被带出去多少次，而不是它标称多少像素。"},{"h":"怎么判断到位","p":"今天的判据：是焦段决定透视与压缩，不是远近靠走。先问：这套参数是我决定的，还是相机的自动档替我决定的？再问：同一场景换一挡光圈或一挡焦距，画面差异我能提前预判吗？最后问：所有设备状态（电量、存储、防抖、色彩设置）我都确认过了吗？三问都能答清，才算真的掌握了器材。"}],"points":["是焦段决定透视与压缩，不是远近靠走","今天只验证这一个变量：能按题材选焦段而不是靠走动补"],"pitfalls":["用广角拍人像靠太近，脸变形"],"quiz":[{"q":"「焦距分段与视角」的判断要点是什么？先说结论再谈理由。","a":"是焦段决定透视与压缩，不是远近靠走","why":"24mm 以下强调前后关系、边缘拉伸"},{"q":"有人说：用广角拍人像靠太近，脸变形。这样对吗？","a":"不对。是焦段决定透视与压缩，不是远近靠走","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"固定主体，用 24/50/135 三个焦段各拍一张并保持主体同大｜相机：光圈优先、f/5.6、ISO 自动上限 3200、单点对焦；手机：专业模式锁定 ISO 与对焦","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：参数按设定执行、对焦落在预定位置、手持 1/30s 可读（每项 5 分制，任一不达标记 3 分以下）","表达 25%：主体可辨、无意外遮挡","规范 15%：参数记录完整、未用后期掩盖操作失误"]}},"M01-K04":{"title":"定焦与变焦取舍","anchor":"是定焦练视角变焦练效率，不是定焦更高级","source":"参考：《美国摄影教程》第12版 · 器材与基本操作（按目录对应）","sections":[{"h":"为什么是这样","p":"定焦强制走位，逼出对距离与透视的感觉，光圈大体积小；变焦覆盖广、应变快。学习期用一支 35 或 50 定焦做一天一镜，实战期用变焦保成功率。没形成视角感之前依赖变焦，构图会停在原地。器材的真实边界由传感器尺寸、镜头光学与机身响应共同决定，而不由参数表上的最大值决定。传感器尺寸决定了同样视角下的景深与高感表现：小底在高 ISO 下暗部先出色噪，大底则能把可用区间再往上推一挡半。焦距改变的不只是取景范围，更是透视关系——广角把近处推远、把纵深夸大，长焦压缩前后景、让背景靠近主体。这些差异在拍摄前就该心里有数，而不是拍完再猜为什么画面不对。"},{"h":"操作路径","p":"今天的练习：一支定焦拍一整天，只用走动改变构图。器材练习的关键是控制变量：同一机位、同一光线、同一被摄体，只换焦距或只换光圈，然后并排看差异。出门前把三件事做完——清空存储卡、确认电池余量、把常用参数存成自定义档位。手持时肘部贴紧躯干、在呼气末按快门；一旦上三脚架，先关掉镜头或机身防抖，否则防抖在稳定环境下反而引入微抖。收工后回到同一菜单把参数复位，避免下一次带着上一场的设定出门。"},{"h":"边界与代价","p":"典型翻车：全程变焦，最后不知道自己站在哪。器材从来不在瓶颈的前三位。预算优先投给能常带出门的那支镜头，而不是参数更漂亮却常年躺在包里的那支。别拿升级器材替代基本功：换机身治不好测光判断错误、构图无序和快门时机滞后。也要警惕参数洁癖——为追极致锐度把光圈收到 f/16，衍射反而让画面发软；为追虚化全开光圈，结果主体边缘薄得像纸。设备的价值在于它被带出去多少次，而不是它标称多少像素。"},{"h":"怎么判断到位","p":"今天的判据：是定焦练视角变焦练效率，不是定焦更高级。先问：这套参数是我决定的，还是相机的自动档替我决定的？再问：同一场景换一挡光圈或一挡焦距，画面差异我能提前预判吗？最后问：所有设备状态（电量、存储、防抖、色彩设置）我都确认过了吗？三问都能答清，才算真的掌握了器材。"}],"points":["是定焦练视角变焦练效率，不是定焦更高级","今天只验证这一个变量：能说出自己当前阶段该用哪种"],"pitfalls":["全程变焦，最后不知道自己站在哪"],"quiz":[{"q":"「定焦与变焦取舍」的判断要点是什么？先说结论再谈理由。","a":"是定焦练视角变焦练效率，不是定焦更高级","why":"定焦强制走位，逼出对距离与透视的感觉，光圈大体积小"},{"q":"有人说：全程变焦，最后不知道自己站在哪。这样对吗？","a":"不对。是定焦练视角变焦练效率，不是定焦更高级","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"一支定焦拍一整天，只用走动改变构图｜相机：光圈优先、f/5.6、ISO 自动上限 3200、单点对焦；手机：专业模式锁定 ISO 与对焦","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：参数按设定执行、对焦落在预定位置、手持 1/30s 可读（每项 5 分制，任一不达标记 3 分以下）","表达 25%：主体可辨、无意外遮挡","规范 15%：参数记录完整、未用后期掩盖操作失误"]}},"M01-K05":{"title":"最大光圈与焦外","anchor":"是大光圈同时买来虚化和像差，不是越大越好","source":"参考：《美国摄影教程》第12版 · 器材与基本操作（按目录对应）","sections":[{"h":"为什么是这样","p":"光圈越大景深越浅、焦外越柔，但边缘锐度下降、色散与暗角增加。人像常把最大光圈收一档（f1.4 用 f2）让睫毛与耳廓同时在焦内。判断标准不是虚化多不多，而是该清楚的地方有没有清楚。器材的真实边界由传感器尺寸、镜头光学与机身响应共同决定，而不由参数表上的最大值决定。传感器尺寸决定了同样视角下的景深与高感表现：小底在高 ISO 下暗部先出色噪，大底则能把可用区间再往上推一挡半。焦距改变的不只是取景范围，更是透视关系——广角把近处推远、把纵深夸大，长焦压缩前后景、让背景靠近主体。这些差异在拍摄前就该心里有数，而不是拍完再猜为什么画面不对。"},{"h":"操作路径","p":"今天的练习：同一主体用 f1.4、f2.8、f5.6 各拍一张比较。器材练习的关键是控制变量：同一机位、同一光线、同一被摄体，只换焦距或只换光圈，然后并排看差异。出门前把三件事做完——清空存储卡、确认电池余量、把常用参数存成自定义档位。手持时肘部贴紧躯干、在呼气末按快门；一旦上三脚架，先关掉镜头或机身防抖，否则防抖在稳定环境下反而引入微抖。收工后回到同一菜单把参数复位，避免下一次带着上一场的设定出门。"},{"h":"边界与代价","p":"典型翻车：全开光圈拍人像，眼睛清楚睫毛糊。器材从来不在瓶颈的前三位。预算优先投给能常带出门的那支镜头，而不是参数更漂亮却常年躺在包里的那支。别拿升级器材替代基本功：换机身治不好测光判断错误、构图无序和快门时机滞后。也要警惕参数洁癖——为追极致锐度把光圈收到 f/16，衍射反而让画面发软；为追虚化全开光圈，结果主体边缘薄得像纸。设备的价值在于它被带出去多少次，而不是它标称多少像素。"},{"h":"怎么判断到位","p":"今天的判据：是大光圈同时买来虚化和像差，不是越大越好。先问：这套参数是我决定的，还是相机的自动档替我决定的？再问：同一场景换一挡光圈或一挡焦距，画面差异我能提前预判吗？最后问：所有设备状态（电量、存储、防抖、色彩设置）我都确认过了吗？三问都能答清，才算真的掌握了器材。"}],"points":["是大光圈同时买来虚化和像差，不是越大越好","今天只验证这一个变量：能预判光圈对焦外与画质的影响"],"pitfalls":["全开光圈拍人像，眼睛清楚睫毛糊"],"quiz":[{"q":"「最大光圈与焦外」的判断要点是什么？先说结论再谈理由。","a":"是大光圈同时买来虚化和像差，不是越大越好","why":"光圈越大景深越浅、焦外越柔，但边缘锐度下降、色散与暗角增加"},{"q":"有人说：全开光圈拍人像，眼睛清楚睫毛糊。这样对吗？","a":"不对。是大光圈同时买来虚化和像差，不是越大越好","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"同一主体用 f1.4、f2.8、f5.6 各拍一张比较｜相机：光圈优先、f/5.6、ISO 自动上限 3200、单点对焦；手机：专业模式锁定 ISO 与对焦","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：参数按设定执行、对焦落在预定位置、手持 1/30s 可读（每项 5 分制，任一不达标记 3 分以下）","表达 25%：主体可辨、无意外遮挡","规范 15%：参数记录完整、未用后期掩盖操作失误"]}},"M01-K06":{"title":"对焦模式选择","anchor":"是静态用单次动态用连续，不是一直用连续","source":"参考：《美国摄影教程》第12版 · 器材与基本操作（按目录对应）","sections":[{"h":"为什么是这样","p":"单次对焦合焦即锁定，适合静物、风光、摆拍；连续对焦持续追焦，适合运动、走动、宠物。混合场景用单次锁焦再构图往往比让机器猜更稳。合焦提示音不可靠，要看合焦框并放大回放。器材的真实边界由传感器尺寸、镜头光学与机身响应共同决定，而不由参数表上的最大值决定。传感器尺寸决定了同样视角下的景深与高感表现：小底在高 ISO 下暗部先出色噪，大底则能把可用区间再往上推一挡半。焦距改变的不只是取景范围，更是透视关系——广角把近处推远、把纵深夸大，长焦压缩前后景、让背景靠近主体。这些差异在拍摄前就该心里有数，而不是拍完再猜为什么画面不对。"},{"h":"操作路径","p":"今天的练习：分别用单次与连续对焦拍走动的人，统计废片率。器材练习的关键是控制变量：同一机位、同一光线、同一被摄体，只换焦距或只换光圈，然后并排看差异。出门前把三件事做完——清空存储卡、确认电池余量、把常用参数存成自定义档位。手持时肘部贴紧躯干、在呼气末按快门；一旦上三脚架，先关掉镜头或机身防抖，否则防抖在稳定环境下反而引入微抖。收工后回到同一菜单把参数复位，避免下一次带着上一场的设定出门。"},{"h":"边界与代价","p":"典型翻车：拍静物用连续对焦，焦点来回抽。器材从来不在瓶颈的前三位。预算优先投给能常带出门的那支镜头，而不是参数更漂亮却常年躺在包里的那支。别拿升级器材替代基本功：换机身治不好测光判断错误、构图无序和快门时机滞后。也要警惕参数洁癖——为追极致锐度把光圈收到 f/16，衍射反而让画面发软；为追虚化全开光圈，结果主体边缘薄得像纸。设备的价值在于它被带出去多少次，而不是它标称多少像素。"},{"h":"怎么判断到位","p":"今天的判据：是静态用单次动态用连续，不是一直用连续。先问：这套参数是我决定的，还是相机的自动档替我决定的？再问：同一场景换一挡光圈或一挡焦距，画面差异我能提前预判吗？最后问：所有设备状态（电量、存储、防抖、色彩设置）我都确认过了吗？三问都能答清，才算真的掌握了器材。"}],"points":["是静态用单次动态用连续，不是一直用连续","今天只验证这一个变量：能按动与静主体选对焦模式"],"pitfalls":["拍静物用连续对焦，焦点来回抽"],"quiz":[{"q":"「对焦模式选择」的判断要点是什么？先说结论再谈理由。","a":"是静态用单次动态用连续，不是一直用连续","why":"单次对焦合焦即锁定，适合静物、风光、摆拍"},{"q":"有人说：拍静物用连续对焦，焦点来回抽。这样对吗？","a":"不对。是静态用单次动态用连续，不是一直用连续","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"分别用单次与连续对焦拍走动的人，统计废片率｜相机：光圈优先、f/5.6、ISO 自动上限 3200、单点对焦；手机：专业模式锁定 ISO 与对焦","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：参数按设定执行、对焦落在预定位置、手持 1/30s 可读（每项 5 分制，任一不达标记 3 分以下）","表达 25%：主体可辨、无意外遮挡","规范 15%：参数记录完整、未用后期掩盖操作失误"]}},"M01-K07":{"title":"对焦点选择与人眼识别","anchor":"是对焦点跟着主体走，不是中心对焦再构图","source":"参考：《美国摄影教程》第12版 · 器材与基本操作（按目录对应）","sections":[{"h":"为什么是这样","p":"浅景深下中心对焦再平移，会因余弦误差让焦点前后偏移，f1.4 近距离尤其明显。正确做法是把对焦点直接移到主体眼睛；现代机型用眼部识别更稳。对焦区域要小于主体，别把整片背景交给相机猜。器材的真实边界由传感器尺寸、镜头光学与机身响应共同决定，而不由参数表上的最大值决定。传感器尺寸决定了同样视角下的景深与高感表现：小底在高 ISO 下暗部先出色噪，大底则能把可用区间再往上推一挡半。焦距改变的不只是取景范围，更是透视关系——广角把近处推远、把纵深夸大，长焦压缩前后景、让背景靠近主体。这些差异在拍摄前就该心里有数，而不是拍完再猜为什么画面不对。"},{"h":"操作路径","p":"今天的练习：用单点对焦把焦点放在画面边缘主体上，对比中心对焦再构图。器材练习的关键是控制变量：同一机位、同一光线、同一被摄体，只换焦距或只换光圈，然后并排看差异。出门前把三件事做完——清空存储卡、确认电池余量、把常用参数存成自定义档位。手持时肘部贴紧躯干、在呼气末按快门；一旦上三脚架，先关掉镜头或机身防抖，否则防抖在稳定环境下反而引入微抖。收工后回到同一菜单把参数复位，避免下一次带着上一场的设定出门。"},{"h":"边界与代价","p":"典型翻车：大光圈中心对焦后半按平移，焦点后移到耳朵。器材从来不在瓶颈的前三位。预算优先投给能常带出门的那支镜头，而不是参数更漂亮却常年躺在包里的那支。别拿升级器材替代基本功：换机身治不好测光判断错误、构图无序和快门时机滞后。也要警惕参数洁癖——为追极致锐度把光圈收到 f/16，衍射反而让画面发软；为追虚化全开光圈，结果主体边缘薄得像纸。设备的价值在于它被带出去多少次，而不是它标称多少像素。"},{"h":"怎么判断到位","p":"今天的判据：是对焦点跟着主体走，不是中心对焦再构图。先问：这套参数是我决定的，还是相机的自动档替我决定的？再问：同一场景换一挡光圈或一挡焦距，画面差异我能提前预判吗？最后问：所有设备状态（电量、存储、防抖、色彩设置）我都确认过了吗？三问都能答清，才算真的掌握了器材。"}],"points":["是对焦点跟着主体走，不是中心对焦再构图","今天只验证这一个变量：能选对焦点位置并说明理由"],"pitfalls":["大光圈中心对焦后半按平移，焦点后移到耳朵"],"quiz":[{"q":"「对焦点选择与人眼识别」的判断要点是什么？先说结论再谈理由。","a":"是对焦点跟着主体走，不是中心对焦再构图","why":"浅景深下中心对焦再平移，会因余弦误差让焦点前后偏移，f1.4 近距离尤其明显"},{"q":"有人说：大光圈中心对焦后半按平移，焦点后移到耳朵。这样对吗？","a":"不对。是对焦点跟着主体走，不是中心对焦再构图","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"用单点对焦把焦点放在画面边缘主体上，对比中心对焦再构图｜相机：光圈优先、f/5.6、ISO 自动上限 3200、单点对焦；手机：专业模式锁定 ISO 与对焦","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：参数按设定执行、对焦落在预定位置、手持 1/30s 可读（每项 5 分制，任一不达标记 3 分以下）","表达 25%：主体可辨、无意外遮挡","规范 15%：参数记录完整、未用后期掩盖操作失误"]}},"M01-K08":{"title":"快门与机震","anchor":"是安全快门看等效焦距，不是固定 1/60","source":"参考：《美国摄影教程》第12版 · 器材与基本操作（按目录对应）","sections":[{"h":"为什么是这样","p":"经验值是 1 除以等效焦距；有防抖可降 2-3 档但只对静止主体有效。走动的人需 1/250 以上，跑动 1/500 以上。机震只有在放大到 100% 才看得出来，别用缩略图判断清晰度。器材的真实边界由传感器尺寸、镜头光学与机身响应共同决定，而不由参数表上的最大值决定。传感器尺寸决定了同样视角下的景深与高感表现：小底在高 ISO 下暗部先出色噪，大底则能把可用区间再往上推一挡半。焦距改变的不只是取景范围，更是透视关系——广角把近处推远、把纵深夸大，长焦压缩前后景、让背景靠近主体。这些差异在拍摄前就该心里有数，而不是拍完再猜为什么画面不对。"},{"h":"操作路径","p":"今天的练习：用 1/15、1/60、1/250 各拍 5 张手持，放大看糊片率。器材练习的关键是控制变量：同一机位、同一光线、同一被摄体，只换焦距或只换光圈，然后并排看差异。出门前把三件事做完——清空存储卡、确认电池余量、把常用参数存成自定义档位。手持时肘部贴紧躯干、在呼气末按快门；一旦上三脚架，先关掉镜头或机身防抖，否则防抖在稳定环境下反而引入微抖。收工后回到同一菜单把参数复位，避免下一次带着上一场的设定出门。"},{"h":"边界与代价","p":"典型翻车：24mm 用 1/30 以为安全，放大全软。器材从来不在瓶颈的前三位。预算优先投给能常带出门的那支镜头，而不是参数更漂亮却常年躺在包里的那支。别拿升级器材替代基本功：换机身治不好测光判断错误、构图无序和快门时机滞后。也要警惕参数洁癖——为追极致锐度把光圈收到 f/16，衍射反而让画面发软；为追虚化全开光圈，结果主体边缘薄得像纸。设备的价值在于它被带出去多少次，而不是它标称多少像素。"},{"h":"怎么判断到位","p":"今天的判据：是安全快门看等效焦距，不是固定 1/60。先问：这套参数是我决定的，还是相机的自动档替我决定的？再问：同一场景换一挡光圈或一挡焦距，画面差异我能提前预判吗？最后问：所有设备状态（电量、存储、防抖、色彩设置）我都确认过了吗？三问都能答清，才算真的掌握了器材。"}],"points":["是安全快门看等效焦距，不是固定 1/60","今天只验证这一个变量：能算出自己镜头的安全快门"],"pitfalls":["24mm 用 1/30 以为安全，放大全软"],"quiz":[{"q":"「快门与机震」的判断要点是什么？先说结论再谈理由。","a":"是安全快门看等效焦距，不是固定 1/60","why":"经验值是 1 除以等效焦距"},{"q":"有人说：24mm 用 1/30 以为安全，放大全软。这样对吗？","a":"不对。是安全快门看等效焦距，不是固定 1/60","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"用 1/15、1/60、1/250 各拍 5 张手持，放大看糊片率｜相机：光圈优先、f/5.6、ISO 自动上限 3200、单点对焦；手机：专业模式锁定 ISO 与对焦","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：参数按设定执行、对焦落在预定位置、手持 1/30s 可读（每项 5 分制，任一不达标记 3 分以下）","表达 25%：主体可辨、无意外遮挡","规范 15%：参数记录完整、未用后期掩盖操作失误"]}},"M01-K09":{"title":"ISO 与噪点","anchor":"是 ISO 为画质成本，不是亮度补充","source":"参考：《美国摄影教程》第12版 · 器材与基本操作（按目录对应）","sections":[{"h":"为什么是这样","p":"ISO 放大信号也放大噪声，代价是暗部细节、色彩纯度与动态范围。原则是先保证快门与光圈，再让 ISO 兜底；噪点能后期降，糊片救不回。多数现代机身 1600-3200 仍可用，光线差宁可稍高 ISO 也别欠曝，欠曝再提亮噪点更重。曝光是光圈、快门、ISO 三者的等价交换：任何一项变化都必须由另一项补偿，画面亮度才能保持不变。真正要决定的不是「正确亮度」，而是「哪一项优先」——拍人像优先快门安全与景深可控，拍流水优先快门速度，拍星空优先最大进光量。测光表给出的只是把画面平均成中灰的建议值，遇到大面积雪或大面积暗部必然偏移，所以始终要用直方图与高光警告复核，而不是相信背屏在强光下的观感。"},{"h":"操作路径","p":"今天的练习：同场景用 ISO200/1600/6400 各拍一张，比较暗部与色彩。练习时把手动模式当默认：ISO 先固定，按「要凝固还是要拖影」定快门，按「要多厚景深」定光圈，最后看直方图决定是否提 ISO 或补光。每拍一张记录三个参数，事后必须能说出「这一张为什么这么定」。手机端用专业模式锁住 ISO 与对焦，只动曝光补偿，理解补偿值背后的等效关系。养成先看直方图右端、再看左端的顺序——高光溢出不可恢复，暗部通常还有救。同一场景连拍三张，分别正常、减一挡、加一挡，是最快的建立直觉的方式。"},{"h":"边界与代价","p":"典型翻车：怕噪点把 ISO 锁 100，结果快门过慢全糊。最常见的误判是把「亮」当成「对」。高调画面允许溢出、低调画面允许整体偏暗，属于表达选择；但在没有表达意图时让高光糊成一片白，就是失误。另一个代价是噪点与手抖的取舍：为了压低 ISO 把快门拖到 1/15s，手持抖动会把锐度全部吃掉，不如提高 ISO 换稳定。宽容度同样不是无限的，后期硬拉三挡以上，暗部会浮出色噪、色偏和灰雾，画面看着「提亮」了其实已经脏了。"},{"h":"怎么判断到位","p":"今天的判据：是 ISO 为画质成本，不是亮度补充。先问：这三个参数里，哪个是我今天刻意固定的，哪个是让步的？再问：直方图两端有没有不可恢复的截断？最后问：如果重拍一次，我会改哪一个数字、为什么？能答出「改哪个、为什么」，曝光才算从碰运气变成可控。"}],"points":["是 ISO 为画质成本，不是亮度补充","今天只验证这一个变量：能按场景设定 ISO 上限"],"pitfalls":["怕噪点把 ISO 锁 100，结果快门过慢全糊"],"quiz":[{"q":"「ISO 与噪点」的判断要点是什么？先说结论再谈理由。","a":"是 ISO 为画质成本，不是亮度补充","why":"ISO 放大信号也放大噪声，代价是暗部细节、色彩纯度与动态范围"},{"q":"有人说：怕噪点把 ISO 锁 100，结果快门过慢全糊。这样对吗？","a":"不对。是 ISO 为画质成本，不是亮度补充","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"同场景用 ISO200/1600/6400 各拍一张，比较暗部与色彩｜相机：手动模式，ISO 固定，每次只动一个参数；手机：专业模式锁 ISO、动曝光补偿","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：高光无溢出（直方图右端不堆积）、暗部保留细节（每项 5 分制，任一不达标记 3 分以下）","表达 25%：明暗关系服从主体，不是全图平均亮","规范 15%：未靠拉回高光硬救、未过度提亮暗部"]}},"M01-K10":{"title":"RAW 与 JPEG","anchor":"是 RAW 留信息 JPEG 交付，不是 RAW 一定更好","source":"参考：《美国摄影教程》第12版 · 器材与基本操作（按目录对应）","sections":[{"h":"为什么是这样","p":"RAW 保留 12-14 位数据，白平衡与曝光可后期重设，高光暗部容错大；JPEG 改动空间小但直出快体积小。重要场景与需精修的用 RAW，即时分享与大批量连拍可用 JPEG。手机 ProRAW 同理，注意体积是几倍。输出是把照片变成作品集的最后一道工序，也是最多人忽略的一环。技术上要处理三件事：尺寸与用途（屏幕观看长边 2048px 足够，打印按 300dpi 折算实际尺寸）、锐度（输出锐化与屏幕锐化不是一回事，过量会在印刷上出现白边）、色彩空间（屏幕用 sRGB，印刷才用 Adobe RGB，混用会导致偏色）。成组呈现还要考虑顺序：第一张定调、中间有节奏起伏、最后一张收束。"},{"h":"操作路径","p":"今天的练习：同场景各拍一张，把过曝一档的图各拉回来比较。流程：先按用途定导出规格并存成预设，避免每次手动设置出错；导出前逐张检查高光溢出、噪点、水平与边缘杂物；命名规范统一（日期_主题_序号），方便回溯；成组挑选时先做联系表通看，删掉重复表达，控制在十二到二十张；最后写一段三百字以内的自述，说明拍什么、为什么这么拍，文字与照片要能互相支撑而不是互相解释。上传前压缩到平台要求的尺寸，避免二次压缩导致糊。"},{"h":"边界与代价","p":"典型翻车：只用 JPEG 拍逆光，高光全丢。输出的代价是「多而不精」。把三百张原片一股脑发出去，观者只会记住最差的那几张；选片的核心能力是删，而不是留。过度锐化与过度降噪在屏幕上不易察觉，一打印就暴露。不同平台的压缩算法差异很大，同一张图在手机上鲜、在电脑上灰，发布前要在目标设备上实看一次。也别为了凑数放重复构图的照片，一组里两张相似的照片会互相削弱。"},{"h":"怎么判断到位","p":"今天的判据：是 RAW 留信息 JPEG 交付，不是 RAW 一定更好。先问：这组照片给谁看、在哪看，规格匹配吗？再问：删到只剩十张，我会留下哪十张？最后问：这套顺序能让观者看完最后一张吗？输出的及格线是「规格对、删得狠、顺序顺」。"}],"points":["是 RAW 留信息 JPEG 交付，不是 RAW 一定更好","今天只验证这一个变量：能按用途选记录格式"],"pitfalls":["只用 JPEG 拍逆光，高光全丢"],"quiz":[{"q":"「RAW 与 JPEG」的判断要点是什么？先说结论再谈理由。","a":"是 RAW 留信息 JPEG 交付，不是 RAW 一定更好","why":"RAW 保留 12-14 位数据，白平衡与曝光可后期重设，高光暗部容错大"},{"q":"有人说：只用 JPEG 拍逆光，高光全丢。这样对吗？","a":"不对。是 RAW 留信息 JPEG 交付，不是 RAW 一定更好","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"同场景各拍一张，把过曝一档的图各拉回来比较｜按用途导出（社交长边 2048px / 打印 300dpi），sRGB","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 40%：尺寸与用途匹配、锐度适中（每项 5 分制，任一不达标记 3 分以下）","表达 40%：成组风格统一、选片有取舍","规范 20%：色彩空间与命名规范"]}},"M02-K01":{"title":"曝光量与三要素","anchor":"是曝光量等于光强乘时间，不是参数随便配","source":"参考：《理解曝光》第4版 · 曝光与测光（按目录对应）","sections":[{"h":"为什么是这样","p":"光圈开大一档光强翻倍，快门就要减半；ISO 不改变进光只放大信号。等价曝光只保证亮度一致，景深、运动模糊、噪点完全不同，这正是选择的意义。先定不能牺牲的那个：人像定光圈、运动定快门、手持定安全快门。曝光判断的本质是哪一部分必须保住。保高光就压曝光，保暗部就提曝光，两者不可兼得时按表达取舍——高调片保高光、低调片保暗部。评价测光是把画面分块加权，遇到强逆光或大面积亮背景会误判，此时切点测光对主体测光更可靠。理解这一点，就不会总抱怨相机测光不准，而是知道什么时候该接管判断。"},{"h":"操作路径","p":"今天的练习：固定场景拍 f2.8-1/500、f5.6-1/125、f11-1/30 三张并记录。先用光圈优先拍一组并记录相机给的快门，再切手动用同一组参数回拍，比较两者差异，这是建立参数直觉最快的方法。逆光时先对主体点测光，再减 0.7 挡保住高光边缘。雪景加一挡、大面积深色减一挡，这两条只作起点，最终仍以直方图为准。拍完立刻看直方图右端贴不贴边，贴边就减，不贴边就保。"},{"h":"边界与代价","p":"典型翻车：以为等价曝光画面就一样。宽容度不是无限的，而且不同机身差异很大。同一场景用两种曝光各拍一张，后期各拉一挡对比，就能摸清自己机身的真实余量。另一个边界是场景动态：人的动作、水流形态、云的位置都在变，参数一旦为了画质牺牲快门，就会同时牺牲内容。宁可噪一点，不要糊一片。"},{"h":"怎么判断到位","p":"今天的判据：是曝光量等于光强乘时间，不是参数随便配。自检三问：我保的是高光还是暗部，为什么？测光方式是相机替我选的还是我选的？机身余量我心里有数吗？"}],"points":["是曝光量等于光强乘时间，不是参数随便配","今天只验证这一个变量：能对同一场景给出三组等价曝光并说明取舍"],"pitfalls":["以为等价曝光画面就一样"],"quiz":[{"q":"「曝光量与三要素」的判断要点是什么？先说结论再谈理由。","a":"是曝光量等于光强乘时间，不是参数随便配","why":"光圈开大一档光强翻倍，快门就要减半"},{"q":"有人说：以为等价曝光画面就一样。这样对吗？","a":"不对。是曝光量等于光强乘时间，不是参数随便配","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"固定场景拍 f2.8-1/500、f5.6-1/125、f11-1/30 三张并记录｜相机：手动模式，ISO 固定，每次只动一个参数；手机：专业模式锁 ISO、动曝光补偿","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：高光无溢出（直方图右端不堆积）、暗部保留细节（每项 5 分制，任一不达标记 3 分以下）","表达 25%：明暗关系服从主体，不是全图平均亮","规范 15%：未靠拉回高光硬救、未过度提亮暗部"]}},"M02-K02":{"title":"互易关系与档位口算","anchor":"是一档换三项各一档，不是随便加减","source":"参考：《理解曝光》第4版 · 曝光与测光（按目录对应）","sections":[{"h":"为什么是这样","p":"标准档位：光圈 1.4-2-2.8-4-5.6-8-11-16；快门 1/1000 到 1/15 逐档减半；ISO 100-200-400-800。相邻各差一档。相机可设三分之一档步进，此时三格为一档。口算熟练后现场就能预判而不必试拍。曝光判断的本质是哪一部分必须保住。保高光就压曝光，保暗部就提曝光，两者不可兼得时按表达取舍——高调片保高光、低调片保暗部。评价测光是把画面分块加权，遇到强逆光或大面积亮背景会误判，此时切点测光对主体测光更可靠。理解这一点，就不会总抱怨相机测光不准，而是知道什么时候该接管判断。"},{"h":"操作路径","p":"今天的练习：把 f4-1/125-ISO200 换成五种等价组合并实拍验证。先用光圈优先拍一组并记录相机给的快门，再切手动用同一组参数回拍，比较两者差异，这是建立参数直觉最快的方法。逆光时先对主体点测光，再减 0.7 挡保住高光边缘。雪景加一挡、大面积深色减一挡，这两条只作起点，最终仍以直方图为准。拍完立刻看直方图右端贴不贴边，贴边就减，不贴边就保。"},{"h":"边界与代价","p":"典型翻车：把一档算成半档，三张亮度差一档。宽容度不是无限的，而且不同机身差异很大。同一场景用两种曝光各拍一张，后期各拉一挡对比，就能摸清自己机身的真实余量。另一个边界是场景动态：人的动作、水流形态、云的位置都在变，参数一旦为了画质牺牲快门，就会同时牺牲内容。宁可噪一点，不要糊一片。"},{"h":"怎么判断到位","p":"今天的判据：是一档换三项各一档，不是随便加减。自检三问：我保的是高光还是暗部，为什么？测光方式是相机替我选的还是我选的？机身余量我心里有数吗？"}],"points":["是一档换三项各一档，不是随便加减","今天只验证这一个变量：能在一秒内完成一档互换的口算"],"pitfalls":["把一档算成半档，三张亮度差一档"],"quiz":[{"q":"「互易关系与档位口算」的判断要点是什么？先说结论再谈理由。","a":"是一档换三项各一档，不是随便加减","why":"标准档位：光圈 1.4-2-2.8-4-5.6-8-11-16"},{"q":"有人说：把一档算成半档，三张亮度差一档。这样对吗？","a":"不对。是一档换三项各一档，不是随便加减","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"把 f4-1/125-ISO200 换成五种等价组合并实拍验证｜相机：手动模式，ISO 固定，每次只动一个参数；手机：专业模式锁 ISO、动曝光补偿","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：高光无溢出（直方图右端不堆积）、暗部保留细节（每项 5 分制，任一不达标记 3 分以下）","表达 25%：明暗关系服从主体，不是全图平均亮","规范 15%：未靠拉回高光硬救、未过度提亮暗部"]}},"M02-K03":{"title":"曝光补偿与步进","anchor":"是以三分之一档为步进，不是整数跳","source":"参考：《理解曝光》第4版 · 曝光与测光（按目录对应）","sections":[{"h":"为什么是这样","p":"机身 EV 标尺一格常为三分之一档，三格为一档即亮度翻倍。逆光人像常需 +0.7 到 +1.3，雪景需 +1 到 +2，深色主体需 -0.7 左右。步进设三分之一便于微调；需要大改时按住加减键转主拨盘。曝光是光圈、快门、ISO 三者的等价交换：任何一项变化都必须由另一项补偿，画面亮度才能保持不变。真正要决定的不是「正确亮度」，而是「哪一项优先」——拍人像优先快门安全与景深可控，拍流水优先快门速度，拍星空优先最大进光量。测光表给出的只是把画面平均成中灰的建议值，遇到大面积雪或大面积暗部必然偏移，所以始终要用直方图与高光警告复核，而不是相信背屏在强光下的观感。"},{"h":"操作路径","p":"今天的练习：把步进改成三分之一档，用 +0.3 与 +0.7 各拍一张。练习时把手动模式当默认：ISO 先固定，按「要凝固还是要拖影」定快门，按「要多厚景深」定光圈，最后看直方图决定是否提 ISO 或补光。每拍一张记录三个参数，事后必须能说出「这一张为什么这么定」。手机端用专业模式锁住 ISO 与对焦，只动曝光补偿，理解补偿值背后的等效关系。养成先看直方图右端、再看左端的顺序——高光溢出不可恢复，暗部通常还有救。同一场景连拍三张，分别正常、减一挡、加一挡，是最快的建立直觉的方式。"},{"h":"边界与代价","p":"典型翻车：以为 +1 和 +0.3 差不多。最常见的误判是把「亮」当成「对」。高调画面允许溢出、低调画面允许整体偏暗，属于表达选择；但在没有表达意图时让高光糊成一片白，就是失误。另一个代价是噪点与手抖的取舍：为了压低 ISO 把快门拖到 1/15s，手持抖动会把锐度全部吃掉，不如提高 ISO 换稳定。宽容度同样不是无限的，后期硬拉三挡以上，暗部会浮出色噪、色偏和灰雾，画面看着「提亮」了其实已经脏了。"},{"h":"怎么判断到位","p":"今天的判据：是以三分之一档为步进，不是整数跳。先问：这三个参数里，哪个是我今天刻意固定的，哪个是让步的？再问：直方图两端有没有不可恢复的截断？最后问：如果重拍一次，我会改哪一个数字、为什么？能答出「改哪个、为什么」，曝光才算从碰运气变成可控。"}],"points":["是以三分之一档为步进，不是整数跳","今天只验证这一个变量：能看懂机身正负三档标尺"],"pitfalls":["以为 +1 和 +0.3 差不多"],"quiz":[{"q":"「曝光补偿与步进」的判断要点是什么？先说结论再谈理由。","a":"是以三分之一档为步进，不是整数跳","why":"机身 EV 标尺一格常为三分之一档，三格为一档即亮度翻倍"},{"q":"有人说：以为 +1 和 +0.3 差不多。这样对吗？","a":"不对。是以三分之一档为步进，不是整数跳","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"把步进改成三分之一档，用 +0.3 与 +0.7 各拍一张｜相机：手动模式，ISO 固定，每次只动一个参数；手机：专业模式锁 ISO、动曝光补偿","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：高光无溢出（直方图右端不堆积）、暗部保留细节（每项 5 分制，任一不达标记 3 分以下）","表达 25%：明暗关系服从主体，不是全图平均亮","规范 15%：未靠拉回高光硬救、未过度提亮暗部"]}},"M02-K04":{"title":"测光模式","anchor":"是点测光测主体评价测光测平均","source":"参考：《理解曝光》第4版 · 曝光与测光（按目录对应）","sections":[{"h":"为什么是这样","p":"评价测光按全画面加权并参考场景库，适合光线均匀；中央重点偏重中心；点测光只读测光点附近百分之几的区域，适合逆光、舞台、雪地强反差场景。点测光的难点是测哪里：要测主体，并知道它比中灰亮还是暗。曝光是光圈、快门、ISO 三者的等价交换：任何一项变化都必须由另一项补偿，画面亮度才能保持不变。真正要决定的不是「正确亮度」，而是「哪一项优先」——拍人像优先快门安全与景深可控，拍流水优先快门速度，拍星空优先最大进光量。测光表给出的只是把画面平均成中灰的建议值，遇到大面积雪或大面积暗部必然偏移，所以始终要用直方图与高光警告复核，而不是相信背屏在强光下的观感。"},{"h":"操作路径","p":"今天的练习：逆光人脸分别用评价与点测光各拍一张比较。练习时把手动模式当默认：ISO 先固定，按「要凝固还是要拖影」定快门，按「要多厚景深」定光圈，最后看直方图决定是否提 ISO 或补光。每拍一张记录三个参数，事后必须能说出「这一张为什么这么定」。手机端用专业模式锁住 ISO 与对焦，只动曝光补偿，理解补偿值背后的等效关系。养成先看直方图右端、再看左端的顺序——高光溢出不可恢复，暗部通常还有救。同一场景连拍三张，分别正常、减一挡、加一挡，是最快的建立直觉的方式。"},{"h":"边界与代价","p":"典型翻车：逆光用评价测光，人黑背景白。最常见的误判是把「亮」当成「对」。高调画面允许溢出、低调画面允许整体偏暗，属于表达选择；但在没有表达意图时让高光糊成一片白，就是失误。另一个代价是噪点与手抖的取舍：为了压低 ISO 把快门拖到 1/15s，手持抖动会把锐度全部吃掉，不如提高 ISO 换稳定。宽容度同样不是无限的，后期硬拉三挡以上，暗部会浮出色噪、色偏和灰雾，画面看着「提亮」了其实已经脏了。"},{"h":"怎么判断到位","p":"今天的判据：是点测光测主体评价测光测平均。先问：这三个参数里，哪个是我今天刻意固定的，哪个是让步的？再问：直方图两端有没有不可恢复的截断？最后问：如果重拍一次，我会改哪一个数字、为什么？能答出「改哪个、为什么」，曝光才算从碰运气变成可控。"}],"points":["是点测光测主体评价测光测平均","今天只验证这一个变量：能按主体占画面比例选测光模式"],"pitfalls":["逆光用评价测光，人黑背景白"],"quiz":[{"q":"「测光模式」的判断要点是什么？先说结论再谈理由。","a":"是点测光测主体评价测光测平均","why":"评价测光按全画面加权并参考场景库，适合光线均匀"},{"q":"有人说：逆光用评价测光，人黑背景白。这样对吗？","a":"不对。是点测光测主体评价测光测平均","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"逆光人脸分别用评价与点测光各拍一张比较｜相机：手动模式，ISO 固定，每次只动一个参数；手机：专业模式锁 ISO、动曝光补偿","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：高光无溢出（直方图右端不堆积）、暗部保留细节（每项 5 分制，任一不达标记 3 分以下）","表达 25%：明暗关系服从主体，不是全图平均亮","规范 15%：未靠拉回高光硬救、未过度提亮暗部"]}},"M02-K05":{"title":"中灰与反射率误判","anchor":"是相机把测光区还原成中灰，不是还原成原色","source":"参考：《理解曝光》第4版 · 曝光与测光（按目录对应）","sections":[{"h":"为什么是这样","p":"反射式测光的目标是把测光区还原为百分之十八中灰。白墙反射率高，相机会压暗拍成灰；黑衣反射率低，相机会提亮拍成灰。修正就是曝光补偿：白加黑减。懂原理后不必背场景，直接判断这块比中灰亮还是暗。曝光是光圈、快门、ISO 三者的等价交换：任何一项变化都必须由另一项补偿，画面亮度才能保持不变。真正要决定的不是「正确亮度」，而是「哪一项优先」——拍人像优先快门安全与景深可控，拍流水优先快门速度，拍星空优先最大进光量。测光表给出的只是把画面平均成中灰的建议值，遇到大面积雪或大面积暗部必然偏移，所以始终要用直方图与高光警告复核，而不是相信背屏在强光下的观感。"},{"h":"操作路径","p":"今天的练习：对白墙与黑衣服各用点测光拍一张，看偏灰方向。练习时把手动模式当默认：ISO 先固定，按「要凝固还是要拖影」定快门，按「要多厚景深」定光圈，最后看直方图决定是否提 ISO 或补光。每拍一张记录三个参数，事后必须能说出「这一张为什么这么定」。手机端用专业模式锁住 ISO 与对焦，只动曝光补偿，理解补偿值背后的等效关系。养成先看直方图右端、再看左端的顺序——高光溢出不可恢复，暗部通常还有救。同一场景连拍三张，分别正常、减一挡、加一挡，是最快的建立直觉的方式。"},{"h":"边界与代价","p":"典型翻车：拍雪景发灰，拍黑猫发亮。最常见的误判是把「亮」当成「对」。高调画面允许溢出、低调画面允许整体偏暗，属于表达选择；但在没有表达意图时让高光糊成一片白，就是失误。另一个代价是噪点与手抖的取舍：为了压低 ISO 把快门拖到 1/15s，手持抖动会把锐度全部吃掉，不如提高 ISO 换稳定。宽容度同样不是无限的，后期硬拉三挡以上，暗部会浮出色噪、色偏和灰雾，画面看着「提亮」了其实已经脏了。"},{"h":"怎么判断到位","p":"今天的判据：是相机把测光区还原成中灰，不是还原成原色。先问：这三个参数里，哪个是我今天刻意固定的，哪个是让步的？再问：直方图两端有没有不可恢复的截断？最后问：如果重拍一次，我会改哪一个数字、为什么？能答出「改哪个、为什么」，曝光才算从碰运气变成可控。"}],"points":["是相机把测光区还原成中灰，不是还原成原色","今天只验证这一个变量：能预判测光对白与黑主体的偏差方向"],"pitfalls":["拍雪景发灰，拍黑猫发亮"],"quiz":[{"q":"「中灰与反射率误判」的判断要点是什么？先说结论再谈理由。","a":"是相机把测光区还原成中灰，不是还原成原色","why":"反射式测光的目标是把测光区还原为百分之十八中灰"},{"q":"有人说：拍雪景发灰，拍黑猫发亮。这样对吗？","a":"不对。是相机把测光区还原成中灰，不是还原成原色","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"对白墙与黑衣服各用点测光拍一张，看偏灰方向｜相机：手动模式，ISO 固定，每次只动一个参数；手机：专业模式锁 ISO、动曝光补偿","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：高光无溢出（直方图右端不堆积）、暗部保留细节（每项 5 分制，任一不达标记 3 分以下）","表达 25%：明暗关系服从主体，不是全图平均亮","规范 15%：未靠拉回高光硬救、未过度提亮暗部"]}},"M02-K06":{"title":"直方图判读","anchor":"是看两端堆积不看形状美丑","source":"参考：《理解曝光》第4版 · 曝光与测光（按目录对应）","sections":[{"h":"为什么是这样","p":"横轴是亮度 0 到 255，纵轴是像素数量。右端贴壁表示高光溢出，左端贴壁表示暗部死黑。形状由场景决定：雪景本就偏右、夜景偏左，不必追求中间隆起。只看重要区域有没有触壁：云层、白纱、皮肤高光最容易丢。曝光是光圈、快门、ISO 三者的等价交换：任何一项变化都必须由另一项补偿，画面亮度才能保持不变。真正要决定的不是「正确亮度」，而是「哪一项优先」——拍人像优先快门安全与景深可控，拍流水优先快门速度，拍星空优先最大进光量。测光表给出的只是把画面平均成中灰的建议值，遇到大面积雪或大面积暗部必然偏移，所以始终要用直方图与高光警告复核，而不是相信背屏在强光下的观感。"},{"h":"操作路径","p":"今天的练习：拍欠曝、正常、过曝三张，对比直方图左右端。练习时把手动模式当默认：ISO 先固定，按「要凝固还是要拖影」定快门，按「要多厚景深」定光圈，最后看直方图决定是否提 ISO 或补光。每拍一张记录三个参数，事后必须能说出「这一张为什么这么定」。手机端用专业模式锁住 ISO 与对焦，只动曝光补偿，理解补偿值背后的等效关系。养成先看直方图右端、再看左端的顺序——高光溢出不可恢复，暗部通常还有救。同一场景连拍三张，分别正常、减一挡、加一挡，是最快的建立直觉的方式。"},{"h":"边界与代价","p":"典型翻车：只看屏幕亮度判断曝光。最常见的误判是把「亮」当成「对」。高调画面允许溢出、低调画面允许整体偏暗，属于表达选择；但在没有表达意图时让高光糊成一片白，就是失误。另一个代价是噪点与手抖的取舍：为了压低 ISO 把快门拖到 1/15s，手持抖动会把锐度全部吃掉，不如提高 ISO 换稳定。宽容度同样不是无限的，后期硬拉三挡以上，暗部会浮出色噪、色偏和灰雾，画面看着「提亮」了其实已经脏了。"},{"h":"怎么判断到位","p":"今天的判据：是看两端堆积不看形状美丑。先问：这三个参数里，哪个是我今天刻意固定的，哪个是让步的？再问：直方图两端有没有不可恢复的截断？最后问：如果重拍一次，我会改哪一个数字、为什么？能答出「改哪个、为什么」，曝光才算从碰运气变成可控。"}],"points":["是看两端堆积不看形状美丑","今天只验证这一个变量：能从直方图判断过曝欠曝与对比"],"pitfalls":["只看屏幕亮度判断曝光"],"quiz":[{"q":"「直方图判读」的判断要点是什么？先说结论再谈理由。","a":"是看两端堆积不看形状美丑","why":"横轴是亮度 0 到 255，纵轴是像素数量"},{"q":"有人说：只看屏幕亮度判断曝光。这样对吗？","a":"不对。是看两端堆积不看形状美丑","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"拍欠曝、正常、过曝三张，对比直方图左右端｜相机：手动模式，ISO 固定，每次只动一个参数；手机：专业模式锁 ISO、动曝光补偿","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：高光无溢出（直方图右端不堆积）、暗部保留细节（每项 5 分制，任一不达标记 3 分以下）","表达 25%：明暗关系服从主体，不是全图平均亮","规范 15%：未靠拉回高光硬救、未过度提亮暗部"]}},"M02-K07":{"title":"高光警告与不可逆过曝","anchor":"是高光溢出无法恢复，不是都能拉回","source":"参考：《理解曝光》第4版 · 曝光与测光（按目录对应）","sections":[{"h":"为什么是这样","p":"传感器过曝到最大值后没有信息，后期拉回只会得到一片无细节的灰白。RAW 一般能救回 1 到 1.5 档高光，暗部能提 3 到 5 档但噪点上升。原则是宁可暗部欠一点，也别让天空或白纱死白。高光警告比看直方图更直观。曝光判断的本质是哪一部分必须保住。保高光就压曝光，保暗部就提曝光，两者不可兼得时按表达取舍——高调片保高光、低调片保暗部。评价测光是把画面分块加权，遇到强逆光或大面积亮背景会误判，此时切点测光对主体测光更可靠。理解这一点，就不会总抱怨相机测光不准，而是知道什么时候该接管判断。"},{"h":"操作路径","p":"今天的练习：开高光警告拍逆光，从 -1EV 到 +1EV 各拍一张看闪烁范围。先用光圈优先拍一组并记录相机给的快门，再切手动用同一组参数回拍，比较两者差异，这是建立参数直觉最快的方法。逆光时先对主体点测光，再减 0.7 挡保住高光边缘。雪景加一挡、大面积深色减一挡，这两条只作起点，最终仍以直方图为准。拍完立刻看直方图右端贴不贴边，贴边就减，不贴边就保。"},{"h":"边界与代价","p":"典型翻车：以为 RAW 什么都能救。宽容度不是无限的，而且不同机身差异很大。同一场景用两种曝光各拍一张，后期各拉一挡对比，就能摸清自己机身的真实余量。另一个边界是场景动态：人的动作、水流形态、云的位置都在变，参数一旦为了画质牺牲快门，就会同时牺牲内容。宁可噪一点，不要糊一片。"},{"h":"怎么判断到位","p":"今天的判据：是高光溢出无法恢复，不是都能拉回。自检三问：我保的是高光还是暗部，为什么？测光方式是相机替我选的还是我选的？机身余量我心里有数吗？"}],"points":["是高光溢出无法恢复，不是都能拉回","今天只验证这一个变量：能开启高光警告并据此调整"],"pitfalls":["以为 RAW 什么都能救"],"quiz":[{"q":"「高光警告与不可逆过曝」的判断要点是什么？先说结论再谈理由。","a":"是高光溢出无法恢复，不是都能拉回","why":"传感器过曝到最大值后没有信息，后期拉回只会得到一片无细节的灰白"},{"q":"有人说：以为 RAW 什么都能救。这样对吗？","a":"不对。是高光溢出无法恢复，不是都能拉回","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"开高光警告拍逆光，从 -1EV 到 +1EV 各拍一张看闪烁范围｜相机：手动模式，ISO 固定，每次只动一个参数；手机：专业模式锁 ISO、动曝光补偿","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：高光无溢出（直方图右端不堆积）、暗部保留细节（每项 5 分制，任一不达标记 3 分以下）","表达 25%：明暗关系服从主体，不是全图平均亮","规范 15%：未靠拉回高光硬救、未过度提亮暗部"]}},"M02-K08":{"title":"曝光补偿的加减","anchor":"是白加黑减，不是固定归零","source":"参考：《理解曝光》第4版 · 曝光与测光（按目录对应）","sections":[{"h":"为什么是这样","p":"白加黑减源于测光表把一切当中灰。经验值：雪景 +1 到 +2，白纱 +0.7 到 +1.3，深色皮肤 -0.3 到 -0.7，黑衣服约 -1，逆光人像 +1 以上。用实时取景加直方图验证比记数字可靠，手机专业模式同样有 EV 滑杆。曝光判断的本质是哪一部分必须保住。保高光就压曝光，保暗部就提曝光，两者不可兼得时按表达取舍——高调片保高光、低调片保暗部。评价测光是把画面分块加权，遇到强逆光或大面积亮背景会误判，此时切点测光对主体测光更可靠。理解这一点，就不会总抱怨相机测光不准，而是知道什么时候该接管判断。"},{"h":"操作路径","p":"今天的练习：拍白墙、灰卡、黑衣各三张，用 +1、0、-1 找出正确档。先用光圈优先拍一组并记录相机给的快门，再切手动用同一组参数回拍，比较两者差异，这是建立参数直觉最快的方法。逆光时先对主体点测光，再减 0.7 挡保住高光边缘。雪景加一挡、大面积深色减一挡，这两条只作起点，最终仍以直方图为准。拍完立刻看直方图右端贴不贴边，贴边就减，不贴边就保。"},{"h":"边界与代价","p":"典型翻车：全程零补偿，白场景发灰黑场景发亮。宽容度不是无限的，而且不同机身差异很大。同一场景用两种曝光各拍一张，后期各拉一挡对比，就能摸清自己机身的真实余量。另一个边界是场景动态：人的动作、水流形态、云的位置都在变，参数一旦为了画质牺牲快门，就会同时牺牲内容。宁可噪一点，不要糊一片。"},{"h":"怎么判断到位","p":"今天的判据：是白加黑减，不是固定归零。自检三问：我保的是高光还是暗部，为什么？测光方式是相机替我选的还是我选的？机身余量我心里有数吗？"}],"points":["是白加黑减，不是固定归零","今天只验证这一个变量：能按主体明暗正确加减补偿"],"pitfalls":["全程零补偿，白场景发灰黑场景发亮"],"quiz":[{"q":"「曝光补偿的加减」的判断要点是什么？先说结论再谈理由。","a":"是白加黑减，不是固定归零","why":"白加黑减源于测光表把一切当中灰"},{"q":"有人说：全程零补偿，白场景发灰黑场景发亮。这样对吗？","a":"不对。是白加黑减，不是固定归零","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"拍白墙、灰卡、黑衣各三张，用 +1、0、-1 找出正确档｜相机：手动模式，ISO 固定，每次只动一个参数；手机：专业模式锁 ISO、动曝光补偿","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：高光无溢出（直方图右端不堆积）、暗部保留细节（每项 5 分制，任一不达标记 3 分以下）","表达 25%：明暗关系服从主体，不是全图平均亮","规范 15%：未靠拉回高光硬救、未过度提亮暗部"]}},"M02-K09":{"title":"宽容度与动态范围","anchor":"是动态范围有上限，不是所有光比都能一次拍下","source":"参考：《理解曝光》第4版 · 曝光与测光（按目录对应）","sections":[{"h":"为什么是这样","p":"动态范围是同时记录最亮与最暗的能力，全幅约 13-14 档、APS-C 约 12-13 档、手机多帧合成更高但可能有合成痕迹。室内外光比常超十档，超出就要取舍：保高光让室内偏暗后期提，或保暗部让窗外死白，或用包围合成与补光。曝光是光圈、快门、ISO 三者的等价交换：任何一项变化都必须由另一项补偿，画面亮度才能保持不变。真正要决定的不是「正确亮度」，而是「哪一项优先」——拍人像优先快门安全与景深可控，拍流水优先快门速度，拍星空优先最大进光量。测光表给出的只是把画面平均成中灰的建议值，遇到大面积雪或大面积暗部必然偏移，所以始终要用直方图与高光警告复核，而不是相信背屏在强光下的观感。"},{"h":"操作路径","p":"今天的练习：拍正午窗内外，看窗外是否死白室内是否死黑。练习时把手动模式当默认：ISO 先固定，按「要凝固还是要拖影」定快门，按「要多厚景深」定光圈，最后看直方图决定是否提 ISO 或补光。每拍一张记录三个参数，事后必须能说出「这一张为什么这么定」。手机端用专业模式锁住 ISO 与对焦，只动曝光补偿，理解补偿值背后的等效关系。养成先看直方图右端、再看左端的顺序——高光溢出不可恢复，暗部通常还有救。同一场景连拍三张，分别正常、减一挡、加一挡，是最快的建立直觉的方式。"},{"h":"边界与代价","p":"典型翻车：硬拍强光比场景，后期两头都救不回。最常见的误判是把「亮」当成「对」。高调画面允许溢出、低调画面允许整体偏暗，属于表达选择；但在没有表达意图时让高光糊成一片白，就是失误。另一个代价是噪点与手抖的取舍：为了压低 ISO 把快门拖到 1/15s，手持抖动会把锐度全部吃掉，不如提高 ISO 换稳定。宽容度同样不是无限的，后期硬拉三挡以上，暗部会浮出色噪、色偏和灰雾，画面看着「提亮」了其实已经脏了。"},{"h":"怎么判断到位","p":"今天的判据：是动态范围有上限，不是所有光比都能一次拍下。先问：这三个参数里，哪个是我今天刻意固定的，哪个是让步的？再问：直方图两端有没有不可恢复的截断？最后问：如果重拍一次，我会改哪一个数字、为什么？能答出「改哪个、为什么」，曝光才算从碰运气变成可控。"}],"points":["是动态范围有上限，不是所有光比都能一次拍下","今天只验证这一个变量：能判断场景是否超出设备能力"],"pitfalls":["硬拍强光比场景，后期两头都救不回"],"quiz":[{"q":"「宽容度与动态范围」的判断要点是什么？先说结论再谈理由。","a":"是动态范围有上限，不是所有光比都能一次拍下","why":"动态范围是同时记录最亮与最暗的能力，全幅约 13-14 档、APS-C 约 12-13 档、手机多帧合成更高但可能有合成痕迹"},{"q":"有人说：硬拍强光比场景，后期两头都救不回。这样对吗？","a":"不对。是动态范围有上限，不是所有光比都能一次拍下","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"拍正午窗内外，看窗外是否死白室内是否死黑｜相机：手动模式，ISO 固定，每次只动一个参数；手机：专业模式锁 ISO、动曝光补偿","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：高光无溢出（直方图右端不堆积）、暗部保留细节（每项 5 分制，任一不达标记 3 分以下）","表达 25%：明暗关系服从主体，不是全图平均亮","规范 15%：未靠拉回高光硬救、未过度提亮暗部"]}},"M02-K10":{"title":"向右曝光 ETTR","anchor":"是尽量右但不触壁，不是一律过曝","source":"参考：《理解曝光》第4版 · 曝光与测光（按目录对应）","sections":[{"h":"为什么是这样","p":"传感器在亮部记录的量化级数更多，把曝光推到右端但不溢出，后期拉回可得到更干净的暗部。前提是低 ISO、可后期、场景有高光余量。拍 JPEG、需要直出或高光重要（白纱、舞台灯）时不适用。曝光判断的本质是哪一部分必须保住。保高光就压曝光，保暗部就提曝光，两者不可兼得时按表达取舍——高调片保高光、低调片保暗部。评价测光是把画面分块加权，遇到强逆光或大面积亮背景会误判，此时切点测光对主体测光更可靠。理解这一点，就不会总抱怨相机测光不准，而是知道什么时候该接管判断。"},{"h":"操作路径","p":"今天的练习：分别按中间与右端不溢出各拍一张，后期统一亮度比噪点。先用光圈优先拍一组并记录相机给的快门，再切手动用同一组参数回拍，比较两者差异，这是建立参数直觉最快的方法。逆光时先对主体点测光，再减 0.7 挡保住高光边缘。雪景加一挡、大面积深色减一挡，这两条只作起点，最终仍以直方图为准。拍完立刻看直方图右端贴不贴边，贴边就减，不贴边就保。"},{"h":"边界与代价","p":"典型翻车：无脑右推导致高光溢出。宽容度不是无限的，而且不同机身差异很大。同一场景用两种曝光各拍一张，后期各拉一挡对比，就能摸清自己机身的真实余量。另一个边界是场景动态：人的动作、水流形态、云的位置都在变，参数一旦为了画质牺牲快门，就会同时牺牲内容。宁可噪一点，不要糊一片。"},{"h":"怎么判断到位","p":"今天的判据：是尽量右但不触壁，不是一律过曝。自检三问：我保的是高光还是暗部，为什么？测光方式是相机替我选的还是我选的？机身余量我心里有数吗？"}],"points":["是尽量右但不触壁，不是一律过曝","今天只验证这一个变量：能在低 ISO 下把直方图推到右端不溢出"],"pitfalls":["无脑右推导致高光溢出"],"quiz":[{"q":"「向右曝光 ETTR」的判断要点是什么？先说结论再谈理由。","a":"是尽量右但不触壁，不是一律过曝","why":"传感器在亮部记录的量化级数更多，把曝光推到右端但不溢出，后期拉回可得到更干净的暗部"},{"q":"有人说：无脑右推导致高光溢出。这样对吗？","a":"不对。是尽量右但不触壁，不是一律过曝","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"分别按中间与右端不溢出各拍一张，后期统一亮度比噪点｜相机：手动模式，ISO 固定，每次只动一个参数；手机：专业模式锁 ISO、动曝光补偿","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：高光无溢出（直方图右端不堆积）、暗部保留细节（每项 5 分制，任一不达标记 3 分以下）","表达 25%：明暗关系服从主体，不是全图平均亮","规范 15%：未靠拉回高光硬救、未过度提亮暗部"]}},"M02-K11":{"title":"包围曝光","anchor":"是为合成与保险，不是替代判断","source":"参考：《理解曝光》第4版 · 曝光与测光（按目录对应）","sections":[{"h":"为什么是这样","p":"包围按设定连拍多档，常见三张正负一档、五张正负一档、七张正负三分之二档。用途一是合成 HDR，二是重要场景保一张正确曝光。合成必须上三脚架或高快门连拍，否则对齐后边缘发虚。单张能拍对就不必开。曝光判断的本质是哪一部分必须保住。保高光就压曝光，保暗部就提曝光，两者不可兼得时按表达取舍——高调片保高光、低调片保暗部。评价测光是把画面分块加权，遇到强逆光或大面积亮背景会误判，此时切点测光对主体测光更可靠。理解这一点，就不会总抱怨相机测光不准，而是知道什么时候该接管判断。"},{"h":"操作路径","p":"今天的练习：设置正负一档三张，拍逆光场景比较取舍。先用光圈优先拍一组并记录相机给的快门，再切手动用同一组参数回拍，比较两者差异，这是建立参数直觉最快的方法。逆光时先对主体点测光，再减 0.7 挡保住高光边缘。雪景加一挡、大面积深色减一挡，这两条只作起点，最终仍以直方图为准。拍完立刻看直方图右端贴不贴边，贴边就减，不贴边就保。"},{"h":"边界与代价","p":"典型翻车：手持包围，合成时边缘错位。宽容度不是无限的，而且不同机身差异很大。同一场景用两种曝光各拍一张，后期各拉一挡对比，就能摸清自己机身的真实余量。另一个边界是场景动态：人的动作、水流形态、云的位置都在变，参数一旦为了画质牺牲快门，就会同时牺牲内容。宁可噪一点，不要糊一片。"},{"h":"怎么判断到位","p":"今天的判据：是为合成与保险，不是替代判断。自检三问：我保的是高光还是暗部，为什么？测光方式是相机替我选的还是我选的？机身余量我心里有数吗？"}],"points":["是为合成与保险，不是替代判断","今天只验证这一个变量：能设置包围张数与步长"],"pitfalls":["手持包围，合成时边缘错位"],"quiz":[{"q":"「包围曝光」的判断要点是什么？先说结论再谈理由。","a":"是为合成与保险，不是替代判断","why":"包围按设定连拍多档，常见三张正负一档、五张正负一档、七张正负三分之二档"},{"q":"有人说：手持包围，合成时边缘错位。这样对吗？","a":"不对。是为合成与保险，不是替代判断","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"设置正负一档三张，拍逆光场景比较取舍｜相机：手动模式，ISO 固定，每次只动一个参数；手机：专业模式锁 ISO、动曝光补偿","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：高光无溢出（直方图右端不堆积）、暗部保留细节（每项 5 分制，任一不达标记 3 分以下）","表达 25%：明暗关系服从主体，不是全图平均亮","规范 15%：未靠拉回高光硬救、未过度提亮暗部"]}},"M02-K12":{"title":"HDR 合成取舍","anchor":"是合成解决静态光比，不是万能","source":"参考：《理解曝光》第4版 · 曝光与测光（按目录对应）","sections":[{"h":"为什么是这样","p":"HDR 把多档曝光的亮暗信息合并，适合静态风光与建筑内景；有运动主体（云、树叶、行人）会产生重影或鬼影。替代方案是渐变镜压天空、补光提暗部、单张 RAW 拉回。合成后要控制局部对比，否则出现灰蒙的味精感。曝光判断的本质是哪一部分必须保住。保高光就压曝光，保暗部就提曝光，两者不可兼得时按表达取舍——高调片保高光、低调片保暗部。评价测光是把画面分块加权，遇到强逆光或大面积亮背景会误判，此时切点测光对主体测光更可靠。理解这一点，就不会总抱怨相机测光不准，而是知道什么时候该接管判断。"},{"h":"操作路径","p":"今天的练习：对同一风光做一次包围合成，观察云与树叶的重影。先用光圈优先拍一组并记录相机给的快门，再切手动用同一组参数回拍，比较两者差异，这是建立参数直觉最快的方法。逆光时先对主体点测光，再减 0.7 挡保住高光边缘。雪景加一挡、大面积深色减一挡，这两条只作起点，最终仍以直方图为准。拍完立刻看直方图右端贴不贴边，贴边就减，不贴边就保。"},{"h":"边界与代价","p":"典型翻车：有风的树叶做 HDR，出现重影。宽容度不是无限的，而且不同机身差异很大。同一场景用两种曝光各拍一张，后期各拉一挡对比，就能摸清自己机身的真实余量。另一个边界是场景动态：人的动作、水流形态、云的位置都在变，参数一旦为了画质牺牲快门，就会同时牺牲内容。宁可噪一点，不要糊一片。"},{"h":"怎么判断到位","p":"今天的判据：是合成解决静态光比，不是万能。自检三问：我保的是高光还是暗部，为什么？测光方式是相机替我选的还是我选的？机身余量我心里有数吗？"}],"points":["是合成解决静态光比，不是万能","今天只验证这一个变量：能判断何时该合成何时该补光"],"pitfalls":["有风的树叶做 HDR，出现重影"],"quiz":[{"q":"「HDR 合成取舍」的判断要点是什么？先说结论再谈理由。","a":"是合成解决静态光比，不是万能","why":"HDR 把多档曝光的亮暗信息合并，适合静态风光与建筑内景"},{"q":"有人说：有风的树叶做 HDR，出现重影。这样对吗？","a":"不对。是合成解决静态光比，不是万能","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"对同一风光做一次包围合成，观察云与树叶的重影｜相机：手动模式，ISO 固定，每次只动一个参数；手机：专业模式锁 ISO、动曝光补偿","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：高光无溢出（直方图右端不堆积）、暗部保留细节（每项 5 分制，任一不达标记 3 分以下）","表达 25%：明暗关系服从主体，不是全图平均亮","规范 15%：未靠拉回高光硬救、未过度提亮暗部"]}},"M02-K13":{"title":"灰卡与白平衡基准","anchor":"是灰卡既校色也定曝光","source":"参考：《理解曝光》第4版 · 曝光与测光（按目录对应）","sections":[{"h":"为什么是这样","p":"灰卡反射率百分之十八、中性无色偏。现场先拍一张灰卡，后期以此为白平衡基准，整组色彩统一；也可用它点测光确定曝光。混合光场景灰卡只能定一个基准，另一侧仍需局部校正。色彩管理是一条链：光源色温（拍）→ 白平衡与原始数据（存）→ 显示与软打样（看）→ 输出色彩空间（出）。任何一环错位，最后看到的颜色都不是真实的。白平衡的本质是告诉软件「什么颜色算白」，一旦定错，全图色偏且无法用单点校色完美救回。饱和度与明度是两件事：颜色发灰多半是明度不够而非饱和度不足，先提对比再谈饱和。同组照片的色彩一致性，比单张的惊艳更重要。"},{"h":"操作路径","p":"今天的练习：混合光下用灰卡拍一张，后期以此为基准统一整组。拍摄环节优先拍 RAW，白平衡可以先自动但要留一张灰卡或白纸参照，后期一次性同步到同组。后期先定白平衡，再调曝光与对比，最后才碰饱和度与 HSL；顺序颠倒会让每次调整都推翻前一步。同一场景分别用自动白平衡与手动白平衡各拍一张，回看时会立刻明白相机的判断逻辑。导出前确认色彩空间：屏幕看用 sRGB，印刷才考虑 Adobe RGB，混用会导致色彩发灰或过艳。"},{"h":"边界与代价","p":"典型翻车：靠自动白平衡拍完，一组照片忽冷忽热。色彩最大的代价出现在「过度」。饱和拉满会溢出成色块，肤色一变就假，天空一拉就出断层。冷暖对比好看，但两张照片冷暖打架会让组照散架。混合光源下不要指望一个白平衡值解决全部，需要分区处理，而这会牺牲一致性。也要接受有些场景就是脏——阴天加雾霾加路灯，硬调成通透反而违背现场，纪实类尤其如此。"},{"h":"怎么判断到位","p":"今天的判据：是灰卡既校色也定曝光。先问：这张的白平衡参照是什么，是相机猜的还是我定的？再问：肤色或已知中性色在画面里正常吗？最后问：把它和同组其他照片并排看，色彩是否是一个体系？色彩过关的标准是「成组一致、单张不脏」，而不是单张最艳。"}],"points":["是灰卡既校色也定曝光","今天只验证这一个变量：能用灰卡设定自定义白平衡"],"pitfalls":["靠自动白平衡拍完，一组照片忽冷忽热"],"quiz":[{"q":"「灰卡与白平衡基准」的判断要点是什么？先说结论再谈理由。","a":"是灰卡既校色也定曝光","why":"灰卡反射率百分之十八、中性无色偏"},{"q":"有人说：靠自动白平衡拍完，一组照片忽冷忽热。这样对吗？","a":"不对。是灰卡既校色也定曝光","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"混合光下用灰卡拍一张，后期以此为基准统一整组｜同一场景拍 RAW，白平衡分别设自动与手动各一张","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 50%：白平衡一致、肤色自然、无过饱和溢出（每项 5 分制，任一不达标记 3 分以下）","表达 30%：色调服务情绪，同组一致","规范 20%：色彩空间正确、未超出显示范围"]}},"M02-K14":{"title":"夜景曝光与噪点控制","anchor":"是上架降 ISO 拉长曝光，不是硬提 ISO","source":"参考：《理解曝光》第4版 · 曝光与测光（按目录对应）","sections":[{"h":"为什么是这样","p":"夜景优先上三脚架：低 ISO 加长曝光可获得干净画面与灯光拖影。手持时用安全快门加可接受 ISO，宁欠勿糊。长曝光的热噪点可开长曝降噪；路灯场景白平衡易偏黄，可手动设 3200-4000K 或后期统一。曝光判断的本质是哪一部分必须保住。保高光就压曝光，保暗部就提曝光，两者不可兼得时按表达取舍——高调片保高光、低调片保暗部。评价测光是把画面分块加权，遇到强逆光或大面积亮背景会误判，此时切点测光对主体测光更可靠。理解这一点，就不会总抱怨相机测光不准，而是知道什么时候该接管判断。"},{"h":"操作路径","p":"今天的练习：同机位拍 ISO3200 1/30 与 ISO200 4 秒两张对比。先用光圈优先拍一组并记录相机给的快门，再切手动用同一组参数回拍，比较两者差异，这是建立参数直觉最快的方法。逆光时先对主体点测光，再减 0.7 挡保住高光边缘。雪景加一挡、大面积深色减一挡，这两条只作起点，最终仍以直方图为准。拍完立刻看直方图右端贴不贴边，贴边就减，不贴边就保。"},{"h":"边界与代价","p":"典型翻车：手持硬拍，ISO 上万噪点糊成一片。宽容度不是无限的，而且不同机身差异很大。同一场景用两种曝光各拍一张，后期各拉一挡对比，就能摸清自己机身的真实余量。另一个边界是场景动态：人的动作、水流形态、云的位置都在变，参数一旦为了画质牺牲快门，就会同时牺牲内容。宁可噪一点，不要糊一片。"},{"h":"怎么判断到位","p":"今天的判据：是上架降 ISO 拉长曝光，不是硬提 ISO。自检三问：我保的是高光还是暗部，为什么？测光方式是相机替我选的还是我选的？机身余量我心里有数吗？"}],"points":["是上架降 ISO 拉长曝光，不是硬提 ISO","今天只验证这一个变量：能在夜景中平衡快门、ISO 与噪点"],"pitfalls":["手持硬拍，ISO 上万噪点糊成一片"],"quiz":[{"q":"「夜景曝光与噪点控制」的判断要点是什么？先说结论再谈理由。","a":"是上架降 ISO 拉长曝光，不是硬提 ISO","why":"夜景优先上三脚架：低 ISO 加长曝光可获得干净画面与灯光拖影"},{"q":"有人说：手持硬拍，ISO 上万噪点糊成一片。这样对吗？","a":"不对。是上架降 ISO 拉长曝光，不是硬提 ISO","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"同机位拍 ISO3200 1/30 与 ISO200 4 秒两张对比｜相机：手动模式，ISO 固定，每次只动一个参数；手机：专业模式锁 ISO、动曝光补偿","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 60%：高光无溢出（直方图右端不堆积）、暗部保留细节（每项 5 分制，任一不达标记 3 分以下）","表达 25%：明暗关系服从主体，不是全图平均亮","规范 15%：未靠拉回高光硬救、未过度提亮暗部"]}},"M03-K01":{"title":"光质：硬光与软光","anchor":"是光源相对面积决定软硬，不是灯的绝对大小","source":"参考：《美国摄影用光教程》第5版 · 光线与用光（按目录对应）","sections":[{"h":"为什么是这样","p":"软硬取决于光源相对被摄体的视角大小：太阳很大但极远，视角小所以是硬光，阴影边缘锐利、质感强；阴天整片天空是光源，所以是软光。要软化就靠近或加大发光面，要硬朗就拉远或用小光源。硬光显质感，软光显干净。光线决定画面的质感，参数只决定画面的亮度，这是两件事。要看的是四个属性：方向（顺、侧、逆、顶）、软硬（光源相对面积越大越软）、强度（决定能否压过环境光）、色温（决定冷暖关系）。软光过渡长、阴影边缘模糊，硬光过渡短、边缘锐利；同一个光源加上柔光布或贴近墙面反射，就从硬变软。绝大多数「高级感」来自光比被控制住，而不是来自器材或滤镜。"},{"h":"操作路径","p":"今天的练习：用裸灯与加柔光箱各拍一张人像，比阴影边缘。布光的第一步永远是定机位与主体位置，而不是先摆灯。定好机位后先看现场主光从哪来，再决定是顺着用、加反光板补暗部，还是逆着用把主体与背景分离。补光优先用白墙、泡沫板、白纸这类大面积被动反光，它比小灯更自然；确需人工光时，一盏灯加一块反光板往往胜过两盏灯对着打。每次只调一个量：先调光比，再调方向，最后才动色温。拍完保留现场照片备忘，方便复现。"},{"h":"边界与代价","p":"典型翻车：以为大灯就是软光。光线的代价主要在可控性与自然度之间。中午顶光不是不能用，但要接受眼窝阴影和地面反光，或用柔光布遮挡把硬光转软。逆光很美，但背景一亮主体就成剪影，要么补光要么索性把剪影做彻底。混合光源（窗光加暖色灯）最容易出脏色，处理方式是统一白平衡后局部修，而不是整图拉色温。别用滤镜掩盖光比失控——光比错了，滤镜只会让画面更假。"},{"h":"怎么判断到位","p":"今天的判据：是光源相对面积决定软硬，不是灯的绝对大小。先问：主光方向能一句话说清吗？再问：暗部还有细节吗，还是死黑一片？最后问：这个光比是我选的，还是现场刚好这样？三问答完，再看画面是否「好看」，因为好看常常是光对了的副产品。"}],"points":["是光源相对面积决定软硬，不是灯的绝对大小","今天只验证这一个变量：能按光质预判阴影边缘与质感"],"pitfalls":["以为大灯就是软光"],"quiz":[{"q":"「光质：硬光与软光」的判断要点是什么？先说结论再谈理由。","a":"是光源相对面积决定软硬，不是灯的绝对大小","why":"软硬取决于光源相对被摄体的视角大小：太阳很大但极远，视角小所以是硬光，阴影边缘锐利、质感强"},{"q":"有人说：以为大灯就是软光。这样对吗？","a":"不对。是光源相对面积决定软硬，不是灯的绝对大小","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"用裸灯与加柔光箱各拍一张人像，比阴影边缘｜机位固定（三脚架或靠墙），只移动光源 / 反光板 / 站位","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主光方向一致、暗部有细节、无双影（每项 5 分制，任一不达标记 3 分以下）","表达 35%：光比与软硬服从表达（是选择不是意外）","规范 20%：未用滤镜掩盖光比失控"]}},"M03-K02":{"title":"五种光位","anchor":"是光位决定立体感与情绪，不是越亮越好","source":"参考：《美国摄影用光教程》第5版 · 光线与用光（按目录对应）","sections":[{"h":"为什么是这样","p":"顺光平、颜色准、适合记录；四十五度侧光最常用，一侧亮一侧暗形成体积；九十度侧光反差大、戏剧性强；逆光出轮廓与氛围但脸易黑；顶光眼窝与鼻下阴影重，需补光或换时段。顺序是先选光位，再调强度。判断光线只要回答四个问题：从哪来、多硬、多亮、什么颜色。答案决定画面质感，也决定要不要补光。硬光的价值在质感与结构，软光的价值在过渡与包容；同一个太阳，正午是硬光，阴天变软光，树荫下是斑驳光。会看光的人先决定站哪、面向哪，再决定参数；顺序反了，就只能靠后期硬救。"},{"h":"操作路径","p":"今天的练习：同一人拍顺光、四十五度侧光、逆光、顶光各一张。一天之内同一场景拍四次：顺光、侧光、逆光、阴影里，同构图同参数，回家并排看，这是理解光线最快的路径。补光先用反光板或白墙，把暗部提亮一挡就够，别追求打平。逆光时用遮光罩避免眩光失控，或故意让光晕入画作为表达。室内混合光源先统一色温再考虑补光，否则两种光打架，后期很难圆。"},{"h":"边界与代价","p":"典型翻车：全程顺光，脸平无立体。光线的限制来自物理：光比过大必然丢细节，光源面积不够必然过渡生硬，色温混杂必然出脏色。解法只有三个——换时间、换位置、加遮挡或反光。别指望后期把硬光改成软光，它只能改明暗，改不了阴影的锐利程度。另外自然光不会等你，窗口常常只有二十分钟，到场就要能立刻拍。"},{"h":"怎么判断到位","p":"今天的判据：是光位决定立体感与情绪，不是越亮越好。自检三问：四个属性我都能答上来吗？补光是为了提亮还是为了改性质？这块光还剩多少时间？"}],"points":["是光位决定立体感与情绪，不是越亮越好","今天只验证这一个变量：能说出顺侧逆顶底五种光位的效果"],"pitfalls":["全程顺光，脸平无立体"],"quiz":[{"q":"「五种光位」的判断要点是什么？先说结论再谈理由。","a":"是光位决定立体感与情绪，不是越亮越好","why":"顺光平、颜色准、适合记录"},{"q":"有人说：全程顺光，脸平无立体。这样对吗？","a":"不对。是光位决定立体感与情绪，不是越亮越好","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"同一人拍顺光、四十五度侧光、逆光、顶光各一张｜机位固定（三脚架或靠墙），只移动光源 / 反光板 / 站位","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主光方向一致、暗部有细节、无双影（每项 5 分制，任一不达标记 3 分以下）","表达 35%：光比与软硬服从表达（是选择不是意外）","规范 20%：未用滤镜掩盖光比失控"]}},"M03-K03":{"title":"光比与立体感","anchor":"是光比决定明暗差，不是补得越平越好","source":"参考：《美国摄影用光教程》第5版 · 光线与用光（按目录对应）","sections":[{"h":"为什么是这样","p":"光比是亮面与暗面的亮度差，一比二约差一档、一比四差两档。人像常用一比二到一比三保留立体；一比一干净但平，一比八以上戏剧化。自然光下用反光板或白墙控制暗面，距离越近补得越亮。光线决定画面的质感，参数只决定画面的亮度，这是两件事。要看的是四个属性：方向（顺、侧、逆、顶）、软硬（光源相对面积越大越软）、强度（决定能否压过环境光）、色温（决定冷暖关系）。软光过渡长、阴影边缘模糊，硬光过渡短、边缘锐利；同一个光源加上柔光布或贴近墙面反射，就从硬变软。绝大多数「高级感」来自光比被控制住，而不是来自器材或滤镜。"},{"h":"操作路径","p":"今天的练习：同机位拍一比一、一比二、一比四三种光比的人像。布光的第一步永远是定机位与主体位置，而不是先摆灯。定好机位后先看现场主光从哪来，再决定是顺着用、加反光板补暗部，还是逆着用把主体与背景分离。补光优先用白墙、泡沫板、白纸这类大面积被动反光，它比小灯更自然；确需人工光时，一盏灯加一块反光板往往胜过两盏灯对着打。每次只调一个量：先调光比，再调方向，最后才动色温。拍完保留现场照片备忘，方便复现。"},{"h":"边界与代价","p":"典型翻车：反光板怼太近，脸平如证件照。光线的代价主要在可控性与自然度之间。中午顶光不是不能用，但要接受眼窝阴影和地面反光，或用柔光布遮挡把硬光转软。逆光很美，但背景一亮主体就成剪影，要么补光要么索性把剪影做彻底。混合光源（窗光加暖色灯）最容易出脏色，处理方式是统一白平衡后局部修，而不是整图拉色温。别用滤镜掩盖光比失控——光比错了，滤镜只会让画面更假。"},{"h":"怎么判断到位","p":"今天的判据：是光比决定明暗差，不是补得越平越好。先问：主光方向能一句话说清吗？再问：暗部还有细节吗，还是死黑一片？最后问：这个光比是我选的，还是现场刚好这样？三问答完，再看画面是否「好看」，因为好看常常是光对了的副产品。"}],"points":["是光比决定明暗差，不是补得越平越好","今天只验证这一个变量：能估计主辅光比并控制"],"pitfalls":["反光板怼太近，脸平如证件照"],"quiz":[{"q":"「光比与立体感」的判断要点是什么？先说结论再谈理由。","a":"是光比决定明暗差，不是补得越平越好","why":"光比是亮面与暗面的亮度差，一比二约差一档、一比四差两档"},{"q":"有人说：反光板怼太近，脸平如证件照。这样对吗？","a":"不对。是光比决定明暗差，不是补得越平越好","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"同机位拍一比一、一比二、一比四三种光比的人像｜机位固定（三脚架或靠墙），只移动光源 / 反光板 / 站位","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主光方向一致、暗部有细节、无双影（每项 5 分制，任一不达标记 3 分以下）","表达 35%：光比与软硬服从表达（是选择不是意外）","规范 20%：未用滤镜掩盖光比失控"]}},"M03-K04":{"title":"自然光时段","anchor":"是太阳高度决定光质，不是只看天气","source":"参考：《美国摄影用光教程》第5版 · 光线与用光（按目录对应）","sections":[{"h":"为什么是这样","p":"日出后与日落前约一小时为黄金时段，太阳低、色温暖、方向性好；日落后二十到四十分钟为蓝调，天空与灯光平衡；正午顶光硬、阴影重，适合建筑与强反差题材。阴天全天可拍人像，但天空发白缺层次。光线决定画面的质感，参数只决定画面的亮度，这是两件事。要看的是四个属性：方向（顺、侧、逆、顶）、软硬（光源相对面积越大越软）、强度（决定能否压过环境光）、色温（决定冷暖关系）。软光过渡长、阴影边缘模糊，硬光过渡短、边缘锐利；同一个光源加上柔光布或贴近墙面反射，就从硬变软。绝大多数「高级感」来自光比被控制住，而不是来自器材或滤镜。"},{"h":"操作路径","p":"今天的练习：同机位在正午、黄金时段、蓝调各拍一张。布光的第一步永远是定机位与主体位置，而不是先摆灯。定好机位后先看现场主光从哪来，再决定是顺着用、加反光板补暗部，还是逆着用把主体与背景分离。补光优先用白墙、泡沫板、白纸这类大面积被动反光，它比小灯更自然；确需人工光时，一盏灯加一块反光板往往胜过两盏灯对着打。每次只调一个量：先调光比，再调方向，最后才动色温。拍完保留现场照片备忘，方便复现。"},{"h":"边界与代价","p":"典型翻车：正午顶光拍人像，眼窝全黑。光线的代价主要在可控性与自然度之间。中午顶光不是不能用，但要接受眼窝阴影和地面反光，或用柔光布遮挡把硬光转软。逆光很美，但背景一亮主体就成剪影，要么补光要么索性把剪影做彻底。混合光源（窗光加暖色灯）最容易出脏色，处理方式是统一白平衡后局部修，而不是整图拉色温。别用滤镜掩盖光比失控——光比错了，滤镜只会让画面更假。"},{"h":"怎么判断到位","p":"今天的判据：是太阳高度决定光质，不是只看天气。先问：主光方向能一句话说清吗？再问：暗部还有细节吗，还是死黑一片？最后问：这个光比是我选的，还是现场刚好这样？三问答完，再看画面是否「好看」，因为好看常常是光对了的副产品。"}],"points":["是太阳高度决定光质，不是只看天气","今天只验证这一个变量：能按时段规划拍摄"],"pitfalls":["正午顶光拍人像，眼窝全黑"],"quiz":[{"q":"「自然光时段」的判断要点是什么？先说结论再谈理由。","a":"是太阳高度决定光质，不是只看天气","why":"日出后与日落前约一小时为黄金时段，太阳低、色温暖、方向性好"},{"q":"有人说：正午顶光拍人像，眼窝全黑。这样对吗？","a":"不对。是太阳高度决定光质，不是只看天气","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"同机位在正午、黄金时段、蓝调各拍一张｜机位固定（三脚架或靠墙），只移动光源 / 反光板 / 站位","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主光方向一致、暗部有细节、无双影（每项 5 分制，任一不达标记 3 分以下）","表达 35%：光比与软硬服从表达（是选择不是意外）","规范 20%：未用滤镜掩盖光比失控"]}},"M03-K05":{"title":"逆光轮廓与补光","anchor":"是先保高光再补脸，不是整体提亮","source":"参考：《美国摄影用光教程》第5版 · 光线与用光（按目录对应）","sections":[{"h":"为什么是这样","p":"逆光的价值是轮廓与氛围，代价是脸暗。做法是以背景高光为基准曝光或减三分之二档保住轮廓，再用反光板、白墙或闪灯给脸补一到两档。补光方向要与主光一致，避免双影。手机可开 HDR 但要防脸部合成发灰。光线决定画面的质感，参数只决定画面的亮度，这是两件事。要看的是四个属性：方向（顺、侧、逆、顶）、软硬（光源相对面积越大越软）、强度（决定能否压过环境光）、色温（决定冷暖关系）。软光过渡长、阴影边缘模糊，硬光过渡短、边缘锐利；同一个光源加上柔光布或贴近墙面反射，就从硬变软。绝大多数「高级感」来自光比被控制住，而不是来自器材或滤镜。"},{"h":"操作路径","p":"今天的练习：拍逆光人像：不补光、反光板、闪灯各一张对比。布光的第一步永远是定机位与主体位置，而不是先摆灯。定好机位后先看现场主光从哪来，再决定是顺着用、加反光板补暗部，还是逆着用把主体与背景分离。补光优先用白墙、泡沫板、白纸这类大面积被动反光，它比小灯更自然；确需人工光时，一盏灯加一块反光板往往胜过两盏灯对着打。每次只调一个量：先调光比，再调方向，最后才动色温。拍完保留现场照片备忘，方便复现。"},{"h":"边界与代价","p":"典型翻车：直接加曝光，背景全白轮廓消失。光线的代价主要在可控性与自然度之间。中午顶光不是不能用，但要接受眼窝阴影和地面反光，或用柔光布遮挡把硬光转软。逆光很美，但背景一亮主体就成剪影，要么补光要么索性把剪影做彻底。混合光源（窗光加暖色灯）最容易出脏色，处理方式是统一白平衡后局部修，而不是整图拉色温。别用滤镜掩盖光比失控——光比错了，滤镜只会让画面更假。"},{"h":"怎么判断到位","p":"今天的判据：是先保高光再补脸，不是整体提亮。先问：主光方向能一句话说清吗？再问：暗部还有细节吗，还是死黑一片？最后问：这个光比是我选的，还是现场刚好这样？三问答完，再看画面是否「好看」，因为好看常常是光对了的副产品。"}],"points":["是先保高光再补脸，不是整体提亮","今天只验证这一个变量：能在逆光下同时保住轮廓与脸部"],"pitfalls":["直接加曝光，背景全白轮廓消失"],"quiz":[{"q":"「逆光轮廓与补光」的判断要点是什么？先说结论再谈理由。","a":"是先保高光再补脸，不是整体提亮","why":"逆光的价值是轮廓与氛围，代价是脸暗"},{"q":"有人说：直接加曝光，背景全白轮廓消失。这样对吗？","a":"不对。是先保高光再补脸，不是整体提亮","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"拍逆光人像：不补光、反光板、闪灯各一张对比｜机位固定（三脚架或靠墙），只移动光源 / 反光板 / 站位","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主光方向一致、暗部有细节、无双影（每项 5 分制，任一不达标记 3 分以下）","表达 35%：光比与软硬服从表达（是选择不是意外）","规范 20%：未用滤镜掩盖光比失控"]}},"M03-K06":{"title":"阴天散射光","anchor":"是阴天等于巨型柔光箱，不是坏天气","source":"参考：《美国摄影用光教程》第5版 · 光线与用光（按目录对应）","sections":[{"h":"为什么是这样","p":"阴天光源是整片天空，光质柔、无硬阴影，适合人像与花卉，但方向性弱画面易平。做法是让主体靠近有方向的反射面（白墙、浅色地面），或用逆光加补光制造层次；避免在树荫下拍，绿叶反光会让肤色偏绿。判断光线只要回答四个问题：从哪来、多硬、多亮、什么颜色。答案决定画面质感，也决定要不要补光。硬光的价值在质感与结构，软光的价值在过渡与包容；同一个太阳，正午是硬光，阴天变软光，树荫下是斑驳光。会看光的人先决定站哪、面向哪，再决定参数；顺序反了，就只能靠后期硬救。"},{"h":"操作路径","p":"今天的练习：阴天在树下与空旷处各拍一张对比。一天之内同一场景拍四次：顺光、侧光、逆光、阴影里，同构图同参数，回家并排看，这是理解光线最快的路径。补光先用反光板或白墙，把暗部提亮一挡就够，别追求打平。逆光时用遮光罩避免眩光失控，或故意让光晕入画作为表达。室内混合光源先统一色温再考虑补光，否则两种光打架，后期很难圆。"},{"h":"边界与代价","p":"典型翻车：阴天在树下拍，脸发绿发暗。光线的限制来自物理：光比过大必然丢细节，光源面积不够必然过渡生硬，色温混杂必然出脏色。解法只有三个——换时间、换位置、加遮挡或反光。别指望后期把硬光改成软光，它只能改明暗，改不了阴影的锐利程度。另外自然光不会等你，窗口常常只有二十分钟，到场就要能立刻拍。"},{"h":"怎么判断到位","p":"今天的判据：是阴天等于巨型柔光箱，不是坏天气。自检三问：四个属性我都能答上来吗？补光是为了提亮还是为了改性质？这块光还剩多少时间？"}],"points":["是阴天等于巨型柔光箱，不是坏天气","今天只验证这一个变量：能利用阴天拍出干净人像"],"pitfalls":["阴天在树下拍，脸发绿发暗"],"quiz":[{"q":"「阴天散射光」的判断要点是什么？先说结论再谈理由。","a":"是阴天等于巨型柔光箱，不是坏天气","why":"阴天光源是整片天空，光质柔、无硬阴影，适合人像与花卉，但方向性弱画面易平"},{"q":"有人说：阴天在树下拍，脸发绿发暗。这样对吗？","a":"不对。是阴天等于巨型柔光箱，不是坏天气","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"阴天在树下与空旷处各拍一张对比｜机位固定（三脚架或靠墙），只移动光源 / 反光板 / 站位","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主光方向一致、暗部有细节、无双影（每项 5 分制，任一不达标记 3 分以下）","表达 35%：光比与软硬服从表达（是选择不是意外）","规范 20%：未用滤镜掩盖光比失控"]}},"M03-K07":{"title":"反光板与柔光","anchor":"是反光板当第二光源，不是越近越好","source":"参考：《美国摄影用光教程》第5版 · 光线与用光（按目录对应）","sections":[{"h":"为什么是这样","p":"白面柔和色中性；银面强、反差大、易出高光斑；金面暖但易偏黄。距离越近越亮。人像常用白面在暗侧四十五度、距脸一米左右，把暗部提到一比二。柔光罩的作用是把硬光变成大面积光源，面积越大越柔。光线决定画面的质感，参数只决定画面的亮度，这是两件事。要看的是四个属性：方向（顺、侧、逆、顶）、软硬（光源相对面积越大越软）、强度（决定能否压过环境光）、色温（决定冷暖关系）。软光过渡长、阴影边缘模糊，硬光过渡短、边缘锐利；同一个光源加上柔光布或贴近墙面反射，就从硬变软。绝大多数「高级感」来自光比被控制住，而不是来自器材或滤镜。"},{"h":"操作路径","p":"今天的练习：用白面与银面各补一次，比较强度与色偏。布光的第一步永远是定机位与主体位置，而不是先摆灯。定好机位后先看现场主光从哪来，再决定是顺着用、加反光板补暗部，还是逆着用把主体与背景分离。补光优先用白墙、泡沫板、白纸这类大面积被动反光，它比小灯更自然；确需人工光时，一盏灯加一块反光板往往胜过两盏灯对着打。每次只调一个量：先调光比，再调方向，最后才动色温。拍完保留现场照片备忘，方便复现。"},{"h":"边界与代价","p":"典型翻车：银色反光板贴脸，出现油光与硬斑。光线的代价主要在可控性与自然度之间。中午顶光不是不能用，但要接受眼窝阴影和地面反光，或用柔光布遮挡把硬光转软。逆光很美，但背景一亮主体就成剪影，要么补光要么索性把剪影做彻底。混合光源（窗光加暖色灯）最容易出脏色，处理方式是统一白平衡后局部修，而不是整图拉色温。别用滤镜掩盖光比失控——光比错了，滤镜只会让画面更假。"},{"h":"怎么判断到位","p":"今天的判据：是反光板当第二光源，不是越近越好。先问：主光方向能一句话说清吗？再问：暗部还有细节吗，还是死黑一片？最后问：这个光比是我选的，还是现场刚好这样？三问答完，再看画面是否「好看」，因为好看常常是光对了的副产品。"}],"points":["是反光板当第二光源，不是越近越好","今天只验证这一个变量：能用一块反光板改善脸部光比"],"pitfalls":["银色反光板贴脸，出现油光与硬斑"],"quiz":[{"q":"「反光板与柔光」的判断要点是什么？先说结论再谈理由。","a":"是反光板当第二光源，不是越近越好","why":"白面柔和色中性"},{"q":"有人说：银色反光板贴脸，出现油光与硬斑。这样对吗？","a":"不对。是反光板当第二光源，不是越近越好","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"用白面与银面各补一次，比较强度与色偏｜机位固定（三脚架或靠墙），只移动光源 / 反光板 / 站位","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主光方向一致、暗部有细节、无双影（每项 5 分制，任一不达标记 3 分以下）","表达 35%：光比与软硬服从表达（是选择不是意外）","规范 20%：未用滤镜掩盖光比失控"]}},"M03-K08":{"title":"单灯三种光型","anchor":"是灯位角度决定光型，不是换灯","source":"参考：《美国摄影用光教程》第5版 · 光线与用光（按目录对应）","sections":[{"h":"为什么是这样","p":"蝴蝶光是灯在正前上方四十五度，鼻下小蝴蝶影，显脸瘦；伦勃朗光是灯在侧四十五度上方，暗侧脸颊出现三角光斑，经典立体；分割光是灯在正侧九十度，半脸亮半脸暗，戏剧化。三种都要求暗侧有微弱补光，否则细节全失。光线决定画面的质感，参数只决定画面的亮度，这是两件事。要看的是四个属性：方向（顺、侧、逆、顶）、软硬（光源相对面积越大越软）、强度（决定能否压过环境光）、色温（决定冷暖关系）。软光过渡长、阴影边缘模糊，硬光过渡短、边缘锐利；同一个光源加上柔光布或贴近墙面反射，就从硬变软。绝大多数「高级感」来自光比被控制住，而不是来自器材或滤镜。"},{"h":"操作路径","p":"今天的练习：一灯同人，移动灯位拍出三种光型。布光的第一步永远是定机位与主体位置，而不是先摆灯。定好机位后先看现场主光从哪来，再决定是顺着用、加反光板补暗部，还是逆着用把主体与背景分离。补光优先用白墙、泡沫板、白纸这类大面积被动反光，它比小灯更自然；确需人工光时，一盏灯加一块反光板往往胜过两盏灯对着打。每次只调一个量：先调光比，再调方向，最后才动色温。拍完保留现场照片备忘，方便复现。"},{"h":"边界与代价","p":"典型翻车：灯一直在正前方，只有一种平光。光线的代价主要在可控性与自然度之间。中午顶光不是不能用，但要接受眼窝阴影和地面反光，或用柔光布遮挡把硬光转软。逆光很美，但背景一亮主体就成剪影，要么补光要么索性把剪影做彻底。混合光源（窗光加暖色灯）最容易出脏色，处理方式是统一白平衡后局部修，而不是整图拉色温。别用滤镜掩盖光比失控——光比错了，滤镜只会让画面更假。"},{"h":"怎么判断到位","p":"今天的判据：是灯位角度决定光型，不是换灯。先问：主光方向能一句话说清吗？再问：暗部还有细节吗，还是死黑一片？最后问：这个光比是我选的，还是现场刚好这样？三问答完，再看画面是否「好看」，因为好看常常是光对了的副产品。"}],"points":["是灯位角度决定光型，不是换灯","今天只验证这一个变量：能用一灯复现蝴蝶光、伦勃朗光、分割光"],"pitfalls":["灯一直在正前方，只有一种平光"],"quiz":[{"q":"「单灯三种光型」的判断要点是什么？先说结论再谈理由。","a":"是灯位角度决定光型，不是换灯","why":"蝴蝶光是灯在正前上方四十五度，鼻下小蝴蝶影，显脸瘦"},{"q":"有人说：灯一直在正前方，只有一种平光。这样对吗？","a":"不对。是灯位角度决定光型，不是换灯","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"一灯同人，移动灯位拍出三种光型｜机位固定（三脚架或靠墙），只移动光源 / 反光板 / 站位","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主光方向一致、暗部有细节、无双影（每项 5 分制，任一不达标记 3 分以下）","表达 35%：光比与软硬服从表达（是选择不是意外）","规范 20%：未用滤镜掩盖光比失控"]}},"M03-K09":{"title":"离机闪与同步速度","anchor":"是快门受同步速度限制，不是想多快就多快","source":"参考：《美国摄影用光教程》第5版 · 光线与用光（按目录对应）","sections":[{"h":"为什么是这样","p":"焦平面快门高速时缝隙扫过，闪光瞬间只照亮部分画面，出现黑边。普通同步速度约 1/160 到 1/250，超过需高速同步支持，代价是闪光功率大幅下降。离机用引闪器或光引闪，注意组别与频道设置。判断光线只要回答四个问题：从哪来、多硬、多亮、什么颜色。答案决定画面质感，也决定要不要补光。硬光的价值在质感与结构，软光的价值在过渡与包容；同一个太阳，正午是硬光，阴天变软光，树荫下是斑驳光。会看光的人先决定站哪、面向哪，再决定参数；顺序反了，就只能靠后期硬救。"},{"h":"操作路径","p":"今天的练习：查机身同步速度，用超过同步速度的快门拍一张看黑边。一天之内同一场景拍四次：顺光、侧光、逆光、阴影里，同构图同参数，回家并排看，这是理解光线最快的路径。补光先用反光板或白墙，把暗部提亮一挡就够，别追求打平。逆光时用遮光罩避免眩光失控，或故意让光晕入画作为表达。室内混合光源先统一色温再考虑补光，否则两种光打架，后期很难圆。"},{"h":"边界与代价","p":"典型翻车：用 1/2000 快门配普通闪光灯，画面下半黑。光线的限制来自物理：光比过大必然丢细节，光源面积不够必然过渡生硬，色温混杂必然出脏色。解法只有三个——换时间、换位置、加遮挡或反光。别指望后期把硬光改成软光，它只能改明暗，改不了阴影的锐利程度。另外自然光不会等你，窗口常常只有二十分钟，到场就要能立刻拍。"},{"h":"怎么判断到位","p":"今天的判据：是快门受同步速度限制，不是想多快就多快。自检三问：四个属性我都能答上来吗？补光是为了提亮还是为了改性质？这块光还剩多少时间？"}],"points":["是快门受同步速度限制，不是想多快就多快","今天只验证这一个变量：能设置离机闪并避免黑边"],"pitfalls":["用 1/2000 快门配普通闪光灯，画面下半黑"],"quiz":[{"q":"「离机闪与同步速度」的判断要点是什么？先说结论再谈理由。","a":"是快门受同步速度限制，不是想多快就多快","why":"焦平面快门高速时缝隙扫过，闪光瞬间只照亮部分画面，出现黑边"},{"q":"有人说：用 1/2000 快门配普通闪光灯，画面下半黑。这样对吗？","a":"不对。是快门受同步速度限制，不是想多快就多快","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"查机身同步速度，用超过同步速度的快门拍一张看黑边｜机位固定（三脚架或靠墙），只移动光源 / 反光板 / 站位","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主光方向一致、暗部有细节、无双影（每项 5 分制，任一不达标记 3 分以下）","表达 35%：光比与软硬服从表达（是选择不是意外）","规范 20%：未用滤镜掩盖光比失控"]}},"M03-K10":{"title":"混合光与色温冲突","anchor":"是统一或刻意对立，不是全靠自动白平衡","source":"参考：《美国摄影用光教程》第5版 · 光线与用光（按目录对应）","sections":[{"h":"为什么是这样","p":"混合光只有三条路：统一到一方（用滤色片把闪灯调到环境色，或关掉一种光源）、后期分区校正、刻意保留冷暖对比（蓝调时刻的蓝天配暖灯是经典）。拍 RAW 保留改白平衡的余地，是最省事的保险。光线决定画面的质感，参数只决定画面的亮度，这是两件事。要看的是四个属性：方向（顺、侧、逆、顶）、软硬（光源相对面积越大越软）、强度（决定能否压过环境光）、色温（决定冷暖关系）。软光过渡长、阴影边缘模糊，硬光过渡短、边缘锐利；同一个光源加上柔光布或贴近墙面反射，就从硬变软。绝大多数「高级感」来自光比被控制住，而不是来自器材或滤镜。"},{"h":"操作路径","p":"今天的练习：窗光加室内暖灯拍一张，分别按两侧设白平衡。布光的第一步永远是定机位与主体位置，而不是先摆灯。定好机位后先看现场主光从哪来，再决定是顺着用、加反光板补暗部，还是逆着用把主体与背景分离。补光优先用白墙、泡沫板、白纸这类大面积被动反光，它比小灯更自然；确需人工光时，一盏灯加一块反光板往往胜过两盏灯对着打。每次只调一个量：先调光比，再调方向，最后才动色温。拍完保留现场照片备忘，方便复现。"},{"h":"边界与代价","p":"典型翻车：自动白平衡折中，两边都不准。光线的代价主要在可控性与自然度之间。中午顶光不是不能用，但要接受眼窝阴影和地面反光，或用柔光布遮挡把硬光转软。逆光很美，但背景一亮主体就成剪影，要么补光要么索性把剪影做彻底。混合光源（窗光加暖色灯）最容易出脏色，处理方式是统一白平衡后局部修，而不是整图拉色温。别用滤镜掩盖光比失控——光比错了，滤镜只会让画面更假。"},{"h":"怎么判断到位","p":"今天的判据：是统一或刻意对立，不是全靠自动白平衡。先问：主光方向能一句话说清吗？再问：暗部还有细节吗，还是死黑一片？最后问：这个光比是我选的，还是现场刚好这样？三问答完，再看画面是否「好看」，因为好看常常是光对了的副产品。"}],"points":["是统一或刻意对立，不是全靠自动白平衡","今天只验证这一个变量：能识别并处理两种色温共存"],"pitfalls":["自动白平衡折中，两边都不准"],"quiz":[{"q":"「混合光与色温冲突」的判断要点是什么？先说结论再谈理由。","a":"是统一或刻意对立，不是全靠自动白平衡","why":"混合光只有三条路：统一到一方（用滤色片把闪灯调到环境色，或关掉一种光源）、后期分区校正、刻意保留冷暖对比（蓝调时刻的蓝天配暖灯是经典）"},{"q":"有人说：自动白平衡折中，两边都不准。这样对吗？","a":"不对。是统一或刻意对立，不是全靠自动白平衡","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"窗光加室内暖灯拍一张，分别按两侧设白平衡｜机位固定（三脚架或靠墙），只移动光源 / 反光板 / 站位","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主光方向一致、暗部有细节、无双影（每项 5 分制，任一不达标记 3 分以下）","表达 35%：光比与软硬服从表达（是选择不是意外）","规范 20%：未用滤镜掩盖光比失控"]}},"M03-K11":{"title":"偏振镜与反光控制","anchor":"是偏振只对非金属反光有效","source":"参考：《美国摄影用光教程》第5版 · 光线与用光（按目录对应）","sections":[{"h":"为什么是这样","p":"偏振镜过滤特定方向的反射光，对水面、玻璃、湿润叶面有效，能加深天空蓝；对金属反光无效。代价是减一到一点五档光，广角端可能出现天空不均匀。用法是对着主体慢慢旋转到反光最弱的位置，拍橱窗尤其有效。判断光线只要回答四个问题：从哪来、多硬、多亮、什么颜色。答案决定画面质感，也决定要不要补光。硬光的价值在质感与结构，软光的价值在过渡与包容；同一个太阳，正午是硬光，阴天变软光，树荫下是斑驳光。会看光的人先决定站哪、面向哪，再决定参数；顺序反了，就只能靠后期硬救。"},{"h":"操作路径","p":"今天的练习：转动偏振镜拍玻璃与水面，观察反光变化。一天之内同一场景拍四次：顺光、侧光、逆光、阴影里，同构图同参数，回家并排看，这是理解光线最快的路径。补光先用反光板或白墙，把暗部提亮一挡就够，别追求打平。逆光时用遮光罩避免眩光失控，或故意让光晕入画作为表达。室内混合光源先统一色温再考虑补光，否则两种光打架，后期很难圆。"},{"h":"边界与代价","p":"典型翻车：用偏振镜拍金属，毫无变化。光线的限制来自物理：光比过大必然丢细节，光源面积不够必然过渡生硬，色温混杂必然出脏色。解法只有三个——换时间、换位置、加遮挡或反光。别指望后期把硬光改成软光，它只能改明暗，改不了阴影的锐利程度。另外自然光不会等你，窗口常常只有二十分钟，到场就要能立刻拍。"},{"h":"怎么判断到位","p":"今天的判据：是偏振只对非金属反光有效。自检三问：四个属性我都能答上来吗？补光是为了提亮还是为了改性质？这块光还剩多少时间？"}],"points":["是偏振只对非金属反光有效","今天只验证这一个变量：能用偏振镜消除反光并知道代价"],"pitfalls":["用偏振镜拍金属，毫无变化"],"quiz":[{"q":"「偏振镜与反光控制」的判断要点是什么？先说结论再谈理由。","a":"是偏振只对非金属反光有效","why":"偏振镜过滤特定方向的反射光，对水面、玻璃、湿润叶面有效，能加深天空蓝"},{"q":"有人说：用偏振镜拍金属，毫无变化。这样对吗？","a":"不对。是偏振只对非金属反光有效","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"转动偏振镜拍玻璃与水面，观察反光变化｜机位固定（三脚架或靠墙），只移动光源 / 反光板 / 站位","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主光方向一致、暗部有细节、无双影（每项 5 分制，任一不达标记 3 分以下）","表达 35%：光比与软硬服从表达（是选择不是意外）","规范 20%：未用滤镜掩盖光比失控"]}},"M03-K12":{"title":"弱光与可用光","anchor":"是先找光再谈参数，不是硬拉 ISO","source":"参考：《美国摄影用光教程》第5版 · 光线与用光（按目录对应）","sections":[{"h":"为什么是这样","p":"弱光先找现成的光：窗户、门口、路灯、屏幕、蜡烛。让主体靠近光源而不是提高 ISO；用大光圈、降快门并找支撑（靠墙、桌面、呼吸控制）。高感噪点能后期降，氛围丢了补不回。手机开夜景模式并保持稳定。光线决定画面的质感，参数只决定画面的亮度，这是两件事。要看的是四个属性：方向（顺、侧、逆、顶）、软硬（光源相对面积越大越软）、强度（决定能否压过环境光）、色温（决定冷暖关系）。软光过渡长、阴影边缘模糊，硬光过渡短、边缘锐利；同一个光源加上柔光布或贴近墙面反射，就从硬变软。绝大多数「高级感」来自光比被控制住，而不是来自器材或滤镜。"},{"h":"操作路径","p":"今天的练习：室内只靠窗光拍一组，只移动主体位置不补光。布光的第一步永远是定机位与主体位置，而不是先摆灯。定好机位后先看现场主光从哪来，再决定是顺着用、加反光板补暗部，还是逆着用把主体与背景分离。补光优先用白墙、泡沫板、白纸这类大面积被动反光，它比小灯更自然；确需人工光时，一盏灯加一块反光板往往胜过两盏灯对着打。每次只调一个量：先调光比，再调方向，最后才动色温。拍完保留现场照片备忘，方便复现。"},{"h":"边界与代价","p":"典型翻车：一进暗处就开闪光灯，气氛全无。光线的代价主要在可控性与自然度之间。中午顶光不是不能用，但要接受眼窝阴影和地面反光，或用柔光布遮挡把硬光转软。逆光很美，但背景一亮主体就成剪影，要么补光要么索性把剪影做彻底。混合光源（窗光加暖色灯）最容易出脏色，处理方式是统一白平衡后局部修，而不是整图拉色温。别用滤镜掩盖光比失控——光比错了，滤镜只会让画面更假。"},{"h":"怎么判断到位","p":"今天的判据：是先找光再谈参数，不是硬拉 ISO。先问：主光方向能一句话说清吗？再问：暗部还有细节吗，还是死黑一片？最后问：这个光比是我选的，还是现场刚好这样？三问答完，再看画面是否「好看」，因为好看常常是光对了的副产品。"}],"points":["是先找光再谈参数，不是硬拉 ISO","今天只验证这一个变量：能在不补光的限制下拍到可用画面"],"pitfalls":["一进暗处就开闪光灯，气氛全无"],"quiz":[{"q":"「弱光与可用光」的判断要点是什么？先说结论再谈理由。","a":"是先找光再谈参数，不是硬拉 ISO","why":"弱光先找现成的光：窗户、门口、路灯、屏幕、蜡烛"},{"q":"有人说：一进暗处就开闪光灯，气氛全无。这样对吗？","a":"不对。是先找光再谈参数，不是硬拉 ISO","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"室内只靠窗光拍一组，只移动主体位置不补光｜机位固定（三脚架或靠墙），只移动光源 / 反光板 / 站位","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主光方向一致、暗部有细节、无双影（每项 5 分制，任一不达标记 3 分以下）","表达 35%：光比与软硬服从表达（是选择不是意外）","规范 20%：未用滤镜掩盖光比失控"]}},"M04-K01":{"title":"取景框与减法","anchor":"是构图先是排除，不是往里塞","source":"参考：《摄影师的视界》 · 构图与视觉语言（按目录对应）","sections":[{"h":"为什么是这样","p":"取景框是选择器，构图的第一个动作是排除：走两步、蹲下、换焦段，把电线、垃圾桶、路人移出画外。判断标准是这个元素对表达有没有帮助，没有就删。拍完再裁是补救，不是方法。构图的目的不是好看，是可读。一张照片应该在两秒内让人明白看什么、为什么看。做到这点靠三件事：主体的位置与体量、主体与背景的对比（明暗、色彩、虚实）、视线与线条的引导方向。三分法解决的是别总放中间，但画面本身缺少对比时，放哪都不成立。先确保有对比，再谈位置。"},{"h":"操作路径","p":"今天的练习：同一主体连拍五张，每张只减少一个干扰元素。同一场景至少拍三种构图再走：中心对称、偏侧留白、低角度或高角度，每种都先把画面四边检查一遍。用四角扫视法：上、下、左、右依次看有没有杂物。移动一步往往比变焦更有效——换机位改变的是透视，变焦只改变裁切。拍完当场删掉明显废片，减少后期判断负担。"},{"h":"边界与代价","p":"典型翻车：什么都想放进去，画面无重点。稳定与张力是一对取舍。对称、水平、居中都稳，但容易呆；对角、倾斜、切边都有张力，但容易乱。广角近拍有冲击力，代价是边缘拉伸与比例失真；长焦压缩背景好看，但会把前后景挤在一起，失去空间感。一组照片里所有画面同一构图，只能说明拍摄时没在看。"},{"h":"怎么判断到位","p":"今天的判据：是构图先是排除，不是往里塞。自检三问：两秒内能看出主体吗？三种方案里我是不是只试了一种？四边都扫过了吗？"}],"points":["是构图先是排除，不是往里塞","今天只验证这一个变量：能在拍摄前删掉画面里多余元素"],"pitfalls":["什么都想放进去，画面无重点"],"quiz":[{"q":"「取景框与减法」的判断要点是什么？先说结论再谈理由。","a":"是构图先是排除，不是往里塞","why":"取景框是选择器，构图的第一个动作是排除：走两步、蹲下、换焦段，把电线、垃圾桶、路人移出画外"},{"q":"有人说：什么都想放进去，画面无重点。这样对吗？","a":"不对。是构图先是排除，不是往里塞","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"同一主体连拍五张，每张只减少一个干扰元素｜同机位同焦段连拍，一次只改一个构图元素","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主体在预定视觉位、边缘无意外切割、地平线水平（每项 5 分制，任一不达标记 3 分以下）","表达 35%：视线与引导方向自洽，主体不被边缘挤","规范 20%：未裁掉主体关键部位、未过度重构"]}},"M04-K02":{"title":"三分法与黄金分割","anchor":"是交点放重点，不是必须三分","source":"参考：《摄影师的视界》 · 构图与视觉语言（按目录对应）","sections":[{"h":"为什么是这样","p":"三分法把画面分成三乘三，四个交点与四条线是视线停留较多处，适合有明确主体的场景；黄金分割约零点六一八更接近自然比例。两者只是起点：对称、中心、极简留白同样有效。判断依据是你想让观众先看哪里。构图的目的不是好看，是可读。一张照片应该在两秒内让人明白看什么、为什么看。做到这点靠三件事：主体的位置与体量、主体与背景的对比（明暗、色彩、虚实）、视线与线条的引导方向。三分法解决的是别总放中间，但画面本身缺少对比时，放哪都不成立。先确保有对比，再谈位置。"},{"h":"操作路径","p":"今天的练习：同一场景用中心构图与三分构图各拍一张比较。同一场景至少拍三种构图再走：中心对称、偏侧留白、低角度或高角度，每种都先把画面四边检查一遍。用四角扫视法：上、下、左、右依次看有没有杂物。移动一步往往比变焦更有效——换机位改变的是透视，变焦只改变裁切。拍完当场删掉明显废片，减少后期判断负担。"},{"h":"边界与代价","p":"典型翻车：无脑三分，主体永远在右下角。稳定与张力是一对取舍。对称、水平、居中都稳，但容易呆；对角、倾斜、切边都有张力，但容易乱。广角近拍有冲击力，代价是边缘拉伸与比例失真；长焦压缩背景好看，但会把前后景挤在一起，失去空间感。一组照片里所有画面同一构图，只能说明拍摄时没在看。"},{"h":"怎么判断到位","p":"今天的判据：是交点放重点，不是必须三分。自检三问：两秒内能看出主体吗？三种方案里我是不是只试了一种？四边都扫过了吗？"}],"points":["是交点放重点，不是必须三分","今天只验证这一个变量：能把主体放在视觉重点位上并说出理由"],"pitfalls":["无脑三分，主体永远在右下角"],"quiz":[{"q":"「三分法与黄金分割」的判断要点是什么？先说结论再谈理由。","a":"是交点放重点，不是必须三分","why":"三分法把画面分成三乘三，四个交点与四条线是视线停留较多处，适合有明确主体的场景"},{"q":"有人说：无脑三分，主体永远在右下角。这样对吗？","a":"不对。是交点放重点，不是必须三分","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"同一场景用中心构图与三分构图各拍一张比较｜同机位同焦段连拍，一次只改一个构图元素","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主体在预定视觉位、边缘无意外切割、地平线水平（每项 5 分制，任一不达标记 3 分以下）","表达 35%：视线与引导方向自洽，主体不被边缘挤","规范 20%：未裁掉主体关键部位、未过度重构"]}},"M04-K03":{"title":"中心构图与对称","anchor":"是中心适合稳定与对称，不是过时","source":"参考：《摄影师的视界》 · 构图与视觉语言（按目录对应）","sections":[{"h":"为什么是这样","p":"中心构图把主体放正中，稳定、正式，适合正面人像、建筑正面、静物；配合严格对称（水面倒影、镜面、走廊）能获得强秩序感。要求是精确：中线误差超过百分之一就显得随意，需要前期对齐或后期微调。构图的目的不是好看，是可读。一张照片应该在两秒内让人明白看什么、为什么看。做到这点靠三件事：主体的位置与体量、主体与背景的对比（明暗、色彩、虚实）、视线与线条的引导方向。三分法解决的是别总放中间，但画面本身缺少对比时，放哪都不成立。先确保有对比，再谈位置。"},{"h":"操作路径","p":"今天的练习：拍一张严格对称的建筑或静物，检查左右误差。同一场景至少拍三种构图再走：中心对称、偏侧留白、低角度或高角度，每种都先把画面四边检查一遍。用四角扫视法：上、下、左、右依次看有没有杂物。移动一步往往比变焦更有效——换机位改变的是透视，变焦只改变裁切。拍完当场删掉明显废片，减少后期判断负担。"},{"h":"边界与代价","p":"典型翻车：想拍对称却站歪，一眼看出斜。稳定与张力是一对取舍。对称、水平、居中都稳，但容易呆；对角、倾斜、切边都有张力，但容易乱。广角近拍有冲击力，代价是边缘拉伸与比例失真；长焦压缩背景好看，但会把前后景挤在一起，失去空间感。一组照片里所有画面同一构图，只能说明拍摄时没在看。"},{"h":"怎么判断到位","p":"今天的判据：是中心适合稳定与对称，不是过时。自检三问：两秒内能看出主体吗？三种方案里我是不是只试了一种？四边都扫过了吗？"}],"points":["是中心适合稳定与对称，不是过时","今天只验证这一个变量：能用中心构图与对称建立秩序"],"pitfalls":["想拍对称却站歪，一眼看出斜"],"quiz":[{"q":"「中心构图与对称」的判断要点是什么？先说结论再谈理由。","a":"是中心适合稳定与对称，不是过时","why":"中心构图把主体放正中，稳定、正式，适合正面人像、建筑正面、静物"},{"q":"有人说：想拍对称却站歪，一眼看出斜。这样对吗？","a":"不对。是中心适合稳定与对称，不是过时","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"拍一张严格对称的建筑或静物，检查左右误差｜同机位同焦段连拍，一次只改一个构图元素","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主体在预定视觉位、边缘无意外切割、地平线水平（每项 5 分制，任一不达标记 3 分以下）","表达 35%：视线与引导方向自洽，主体不被边缘挤","规范 20%：未裁掉主体关键部位、未过度重构"]}},"M04-K04":{"title":"引导线与视觉动线","anchor":"是线要有去向，不是有线条就行","source":"参考：《摄影师的视界》 · 构图与视觉语言（按目录对应）","sections":[{"h":"为什么是这样","p":"引导线（道路、铁轨、栏杆、光影边界、河流）能建立纵深并牵引视线。有效引导线的终点应落在主体或消失点上；把观众带出画面就是干扰。曲线比直线柔和，重复斜线产生节奏。拍前先问线从哪里来到哪里去。构图是把观看顺序强加给观者的技术。人眼在画面里寻找的第一样东西是高对比、高饱和、人脸与直线汇聚处，构图就是安排这些线索，让观者先看主体、再看陪体、最后离开画面或回到主体。三分法只是众多排布工具之一，它好用是因为把主体偏离中心能产生张力，但它不是法则。真正稳定画面的是层次：前景、中景、背景各司其职，以及画面四条边与四个角有没有被无意切断。"},{"h":"操作路径","p":"今天的练习：用道路或栏杆做引导线，检查线是否指向主体。构图练习必须同机位进行：架好机位、锁死焦段，一次只改一个元素——挪主体、换前景、压地平线、改留白方向，然后连拍一组并排对比。拍之前先做减法：画面里删掉所有与表达无关的东西，再考虑加。地平线与垂直线先校平，这是最廉价也最有效的品质提升。取景时把画面四个边扫一遍，检查有没有半截人手、半根电线杆、恰好压线的头部。留白不是空，是给视线留的呼吸区，方向要留给主体看向的那一侧。"},{"h":"边界与代价","p":"典型翻车：引导线把视线引出画面。构图的代价是自由度与信息量的冲突。极简画面干净，但可能空到没有内容；信息密集的画面丰富，但容易让主体淹没。对称构图稳，但缺张力；强对角动态足，但容易失衡。广角贴脸拍有冲击力，代价是边缘拉伸变形，人脸尤其明显。别把所有照片都套同一个模板——那说明你在套公式而不是在看。也别用后期大幅重构来弥补拍摄时的随意，裁切会损失分辨率并放大噪点。"},{"h":"怎么判断到位","p":"今天的判据：是线要有去向，不是有线条就行。先问：观者第一眼会看哪里，那是不是我想让他看的？再问：画面四个边缘有没有意外切割，地平线平不平？最后问：如果只删掉一个元素，画面会更好吗？如果答案是「会」，说明减法还没做完。"}],"points":["是线要有去向，不是有线条就行","今天只验证这一个变量：能用线条把视线引向主体"],"pitfalls":["引导线把视线引出画面"],"quiz":[{"q":"「引导线与视觉动线」的判断要点是什么？先说结论再谈理由。","a":"是线要有去向，不是有线条就行","why":"引导线（道路、铁轨、栏杆、光影边界、河流）能建立纵深并牵引视线"},{"q":"有人说：引导线把视线引出画面。这样对吗？","a":"不对。是线要有去向，不是有线条就行","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"用道路或栏杆做引导线，检查线是否指向主体｜同机位同焦段连拍，一次只改一个构图元素","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主体在预定视觉位、边缘无意外切割、地平线水平（每项 5 分制，任一不达标记 3 分以下）","表达 35%：视线与引导方向自洽，主体不被边缘挤","规范 20%：未裁掉主体关键部位、未过度重构"]}},"M04-K05":{"title":"前景中景背景","anchor":"是层次靠距离差，不是靠虚化","source":"参考：《摄影师的视界》 · 构图与视觉语言（按目录对应）","sections":[{"h":"为什么是这样","p":"前景、中景、背景三层能建立空间感。前景不必清晰，虚化的枝叶、窗框、栏杆都能增加纵深与氛围。做法是蹲下找低机位让近处物体进入画面边缘，或后退用长焦把远景拉近形成压缩。构图的目的不是好看，是可读。一张照片应该在两秒内让人明白看什么、为什么看。做到这点靠三件事：主体的位置与体量、主体与背景的对比（明暗、色彩、虚实）、视线与线条的引导方向。三分法解决的是别总放中间，但画面本身缺少对比时，放哪都不成立。先确保有对比，再谈位置。"},{"h":"操作路径","p":"今天的练习：同一主体拍有前景与无前景两张。同一场景至少拍三种构图再走：中心对称、偏侧留白、低角度或高角度，每种都先把画面四边检查一遍。用四角扫视法：上、下、左、右依次看有没有杂物。移动一步往往比变焦更有效——换机位改变的是透视，变焦只改变裁切。拍完当场删掉明显废片，减少后期判断负担。"},{"h":"边界与代价","p":"典型翻车：画面只有主体和远背景，扁平。稳定与张力是一对取舍。对称、水平、居中都稳，但容易呆；对角、倾斜、切边都有张力，但容易乱。广角近拍有冲击力，代价是边缘拉伸与比例失真；长焦压缩背景好看，但会把前后景挤在一起，失去空间感。一组照片里所有画面同一构图，只能说明拍摄时没在看。"},{"h":"怎么判断到位","p":"今天的判据：是层次靠距离差，不是靠虚化。自检三问：两秒内能看出主体吗？三种方案里我是不是只试了一种？四边都扫过了吗？"}],"points":["是层次靠距离差，不是靠虚化","今天只验证这一个变量：能用三层结构建立纵深"],"pitfalls":["画面只有主体和远背景，扁平"],"quiz":[{"q":"「前景中景背景」的判断要点是什么？先说结论再谈理由。","a":"是层次靠距离差，不是靠虚化","why":"前景、中景、背景三层能建立空间感"},{"q":"有人说：画面只有主体和远背景，扁平。这样对吗？","a":"不对。是层次靠距离差，不是靠虚化","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"同一主体拍有前景与无前景两张｜同机位同焦段连拍，一次只改一个构图元素","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主体在预定视觉位、边缘无意外切割、地平线水平（每项 5 分制，任一不达标记 3 分以下）","表达 35%：视线与引导方向自洽，主体不被边缘挤","规范 20%：未裁掉主体关键部位、未过度重构"]}},"M04-K06":{"title":"框架式构图","anchor":"是框要服务主体，不是为框而框","source":"参考：《摄影师的视界》 · 构图与视觉语言（按目录对应）","sections":[{"h":"为什么是这样","p":"框架（门、窗、树枝、拱门、人体）能聚焦视线并交代环境。要点是框的亮度与细节不能超过主体，否则喧宾夺主；框不必完整，部分遮挡更有临场感；框内主体要留足空间，避免被挤压。构图的目的不是好看，是可读。一张照片应该在两秒内让人明白看什么、为什么看。做到这点靠三件事：主体的位置与体量、主体与背景的对比（明暗、色彩、虚实）、视线与线条的引导方向。三分法解决的是别总放中间，但画面本身缺少对比时，放哪都不成立。先确保有对比，再谈位置。"},{"h":"操作路径","p":"今天的练习：用门框、窗框、树枝拍同一主体各一张。同一场景至少拍三种构图再走：中心对称、偏侧留白、低角度或高角度，每种都先把画面四边检查一遍。用四角扫视法：上、下、左、右依次看有没有杂物。移动一步往往比变焦更有效——换机位改变的是透视，变焦只改变裁切。拍完当场删掉明显废片，减少后期判断负担。"},{"h":"边界与代价","p":"典型翻车：框太抢眼，主体反而看不清。稳定与张力是一对取舍。对称、水平、居中都稳，但容易呆；对角、倾斜、切边都有张力，但容易乱。广角近拍有冲击力，代价是边缘拉伸与比例失真；长焦压缩背景好看，但会把前后景挤在一起，失去空间感。一组照片里所有画面同一构图，只能说明拍摄时没在看。"},{"h":"怎么判断到位","p":"今天的判据：是框要服务主体，不是为框而框。自检三问：两秒内能看出主体吗？三种方案里我是不是只试了一种？四边都扫过了吗？"}],"points":["是框要服务主体，不是为框而框","今天只验证这一个变量：能用门窗树枝形成框中框"],"pitfalls":["框太抢眼，主体反而看不清"],"quiz":[{"q":"「框架式构图」的判断要点是什么？先说结论再谈理由。","a":"是框要服务主体，不是为框而框","why":"框架（门、窗、树枝、拱门、人体）能聚焦视线并交代环境"},{"q":"有人说：框太抢眼，主体反而看不清。这样对吗？","a":"不对。是框要服务主体，不是为框而框","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"用门框、窗框、树枝拍同一主体各一张｜同机位同焦段连拍，一次只改一个构图元素","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主体在预定视觉位、边缘无意外切割、地平线水平（每项 5 分制，任一不达标记 3 分以下）","表达 35%：视线与引导方向自洽，主体不被边缘挤","规范 20%：未裁掉主体关键部位、未过度重构"]}},"M04-K07":{"title":"比例与尺度","anchor":"是需要参照物才有尺度","source":"参考：《摄影师的视界》 · 构图与视觉语言（按目录对应）","sections":[{"h":"为什么是这样","p":"尺度感需要参照物：人、车、房子、树。风光中放一个占画面百分之二到五的人影，能立刻体现宏大；建筑中的人物能说明层高。参照物放在三分点或引导线附近，不要居中挡住主体。构图的目的不是好看，是可读。一张照片应该在两秒内让人明白看什么、为什么看。做到这点靠三件事：主体的位置与体量、主体与背景的对比（明暗、色彩、虚实）、视线与线条的引导方向。三分法解决的是别总放中间，但画面本身缺少对比时，放哪都不成立。先确保有对比，再谈位置。"},{"h":"操作路径","p":"今天的练习：同一风光加与不加人物各拍一张比较。同一场景至少拍三种构图再走：中心对称、偏侧留白、低角度或高角度，每种都先把画面四边检查一遍。用四角扫视法：上、下、左、右依次看有没有杂物。移动一步往往比变焦更有效——换机位改变的是透视，变焦只改变裁切。拍完当场删掉明显废片，减少后期判断负担。"},{"h":"边界与代价","p":"典型翻车：拍大山大水，看不出到底多大。稳定与张力是一对取舍。对称、水平、居中都稳，但容易呆；对角、倾斜、切边都有张力，但容易乱。广角近拍有冲击力，代价是边缘拉伸与比例失真；长焦压缩背景好看，但会把前后景挤在一起，失去空间感。一组照片里所有画面同一构图，只能说明拍摄时没在看。"},{"h":"怎么判断到位","p":"今天的判据：是需要参照物才有尺度。自检三问：两秒内能看出主体吗？三种方案里我是不是只试了一种？四边都扫过了吗？"}],"points":["是需要参照物才有尺度","今天只验证这一个变量：能用人物或已知物体交代场景规模"],"pitfalls":["拍大山大水，看不出到底多大"],"quiz":[{"q":"「比例与尺度」的判断要点是什么？先说结论再谈理由。","a":"是需要参照物才有尺度","why":"尺度感需要参照物：人、车、房子、树"},{"q":"有人说：拍大山大水，看不出到底多大。这样对吗？","a":"不对。是需要参照物才有尺度","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"同一风光加与不加人物各拍一张比较｜同机位同焦段连拍，一次只改一个构图元素","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主体在预定视觉位、边缘无意外切割、地平线水平（每项 5 分制，任一不达标记 3 分以下）","表达 35%：视线与引导方向自洽，主体不被边缘挤","规范 20%：未裁掉主体关键部位、未过度重构"]}},"M04-K08":{"title":"重复与节奏","anchor":"是重复建立秩序，破一次出焦点","source":"参考：《摄影师的视界》 · 构图与视觉语言（按目录对应）","sections":[{"h":"为什么是这样","p":"重复的形状、颜色、排列形成节奏与秩序；在重复中放入一个例外（颜色不同、姿态不同、空缺一个）会产生强焦点。要点是重复数量足够（至少四到六个）且排列规律，例外位置避开正中心更有张力。构图的目的不是好看，是可读。一张照片应该在两秒内让人明白看什么、为什么看。做到这点靠三件事：主体的位置与体量、主体与背景的对比（明暗、色彩、虚实）、视线与线条的引导方向。三分法解决的是别总放中间，但画面本身缺少对比时，放哪都不成立。先确保有对比，再谈位置。"},{"h":"操作路径","p":"今天的练习：拍一组重复结构，其中放一个不同元素。同一场景至少拍三种构图再走：中心对称、偏侧留白、低角度或高角度，每种都先把画面四边检查一遍。用四角扫视法：上、下、左、右依次看有没有杂物。移动一步往往比变焦更有效——换机位改变的是透视，变焦只改变裁切。拍完当场删掉明显废片，减少后期判断负担。"},{"h":"边界与代价","p":"典型翻车：全是重复，没有落点。稳定与张力是一对取舍。对称、水平、居中都稳，但容易呆；对角、倾斜、切边都有张力，但容易乱。广角近拍有冲击力，代价是边缘拉伸与比例失真；长焦压缩背景好看，但会把前后景挤在一起，失去空间感。一组照片里所有画面同一构图，只能说明拍摄时没在看。"},{"h":"怎么判断到位","p":"今天的判据：是重复建立秩序，破一次出焦点。自检三问：两秒内能看出主体吗？三种方案里我是不是只试了一种？四边都扫过了吗？"}],"points":["是重复建立秩序，破一次出焦点","今天只验证这一个变量：能用重复元素建立节奏并打破"],"pitfalls":["全是重复，没有落点"],"quiz":[{"q":"「重复与节奏」的判断要点是什么？先说结论再谈理由。","a":"是重复建立秩序，破一次出焦点","why":"重复的形状、颜色、排列形成节奏与秩序"},{"q":"有人说：全是重复，没有落点。这样对吗？","a":"不对。是重复建立秩序，破一次出焦点","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"拍一组重复结构，其中放一个不同元素｜同机位同焦段连拍，一次只改一个构图元素","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主体在预定视觉位、边缘无意外切割、地平线水平（每项 5 分制，任一不达标记 3 分以下）","表达 35%：视线与引导方向自洽，主体不被边缘挤","规范 20%：未裁掉主体关键部位、未过度重构"]}},"M04-K09":{"title":"留白与呼吸感","anchor":"是空白也要有内容，不是大面积空","source":"参考：《摄影师的视界》 · 构图与视觉语言（按目录对应）","sections":[{"h":"为什么是这样","p":"留白给主体呼吸空间，强化孤独、安静、高级的情绪。有效留白需要有质感：天空渐变、墙面肌理、雾、水面；纯死白或死黑会显得空洞。主体在留白中的位置决定情绪方向：朝向侧留白多则舒展，背向侧多则压抑。构图的目的不是好看，是可读。一张照片应该在两秒内让人明白看什么、为什么看。做到这点靠三件事：主体的位置与体量、主体与背景的对比（明暗、色彩、虚实）、视线与线条的引导方向。三分法解决的是别总放中间，但画面本身缺少对比时，放哪都不成立。先确保有对比，再谈位置。"},{"h":"操作路径","p":"今天的练习：拍极简主体，让空白占画面六成以上。同一场景至少拍三种构图再走：中心对称、偏侧留白、低角度或高角度，每种都先把画面四边检查一遍。用四角扫视法：上、下、左、右依次看有没有杂物。移动一步往往比变焦更有效——换机位改变的是透视，变焦只改变裁切。拍完当场删掉明显废片，减少后期判断负担。"},{"h":"边界与代价","p":"典型翻车：主体贴边，看着憋。稳定与张力是一对取舍。对称、水平、居中都稳，但容易呆；对角、倾斜、切边都有张力，但容易乱。广角近拍有冲击力，代价是边缘拉伸与比例失真；长焦压缩背景好看，但会把前后景挤在一起，失去空间感。一组照片里所有画面同一构图，只能说明拍摄时没在看。"},{"h":"怎么判断到位","p":"今天的判据：是空白也要有内容，不是大面积空。自检三问：两秒内能看出主体吗？三种方案里我是不是只试了一种？四边都扫过了吗？"}],"points":["是空白也要有内容，不是大面积空","今天只验证这一个变量：能在画面中留出有效空白"],"pitfalls":["主体贴边，看着憋"],"quiz":[{"q":"「留白与呼吸感」的判断要点是什么？先说结论再谈理由。","a":"是空白也要有内容，不是大面积空","why":"留白给主体呼吸空间，强化孤独、安静、高级的情绪"},{"q":"有人说：主体贴边，看着憋。这样对吗？","a":"不对。是空白也要有内容，不是大面积空","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"拍极简主体，让空白占画面六成以上｜同机位同焦段连拍，一次只改一个构图元素","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主体在预定视觉位、边缘无意外切割、地平线水平（每项 5 分制，任一不达标记 3 分以下）","表达 35%：视线与引导方向自洽，主体不被边缘挤","规范 20%：未裁掉主体关键部位、未过度重构"]}},"M04-K10":{"title":"视线与朝向留空","anchor":"是朝向侧多留空间，不是居中对称","source":"参考：《摄影师的视界》 · 构图与视觉语言（按目录对应）","sections":[{"h":"为什么是这样","p":"主体有方向性（视线、运动、风的朝向）时，朝向侧要留出更多空间，画面才不憋；留空少会制造压迫或即将走出画面的紧张。静物与正面人像不受此限，用中心或对称更稳。口诀是给要去的地方留位置。构图是把观看顺序强加给观者的技术。人眼在画面里寻找的第一样东西是高对比、高饱和、人脸与直线汇聚处，构图就是安排这些线索，让观者先看主体、再看陪体、最后离开画面或回到主体。三分法只是众多排布工具之一，它好用是因为把主体偏离中心能产生张力，但它不是法则。真正稳定画面的是层次：前景、中景、背景各司其职，以及画面四条边与四个角有没有被无意切断。"},{"h":"操作路径","p":"今天的练习：同一人像在朝向侧留三分之一与贴边各拍一张。构图练习必须同机位进行：架好机位、锁死焦段，一次只改一个元素——挪主体、换前景、压地平线、改留白方向，然后连拍一组并排对比。拍之前先做减法：画面里删掉所有与表达无关的东西，再考虑加。地平线与垂直线先校平，这是最廉价也最有效的品质提升。取景时把画面四个边扫一遍，检查有没有半截人手、半根电线杆、恰好压线的头部。留白不是空，是给视线留的呼吸区，方向要留给主体看向的那一侧。"},{"h":"边界与代价","p":"典型翻车：人朝右看，右边没空间，像要撞墙。构图的代价是自由度与信息量的冲突。极简画面干净，但可能空到没有内容；信息密集的画面丰富，但容易让主体淹没。对称构图稳，但缺张力；强对角动态足，但容易失衡。广角贴脸拍有冲击力，代价是边缘拉伸变形，人脸尤其明显。别把所有照片都套同一个模板——那说明你在套公式而不是在看。也别用后期大幅重构来弥补拍摄时的随意，裁切会损失分辨率并放大噪点。"},{"h":"怎么判断到位","p":"今天的判据：是朝向侧多留空间，不是居中对称。先问：观者第一眼会看哪里，那是不是我想让他看的？再问：画面四个边缘有没有意外切割，地平线平不平？最后问：如果只删掉一个元素，画面会更好吗？如果答案是「会」，说明减法还没做完。"}],"points":["是朝向侧多留空间，不是居中对称","今天只验证这一个变量：能按主体朝向分配画面空间"],"pitfalls":["人朝右看，右边没空间，像要撞墙"],"quiz":[{"q":"「视线与朝向留空」的判断要点是什么？先说结论再谈理由。","a":"是朝向侧多留空间，不是居中对称","why":"主体有方向性（视线、运动、风的朝向）时，朝向侧要留出更多空间，画面才不憋"},{"q":"有人说：人朝右看，右边没空间，像要撞墙。这样对吗？","a":"不对。是朝向侧多留空间，不是居中对称","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"同一人像在朝向侧留三分之一与贴边各拍一张｜同机位同焦段连拍，一次只改一个构图元素","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主体在预定视觉位、边缘无意外切割、地平线水平（每项 5 分制，任一不达标记 3 分以下）","表达 35%：视线与引导方向自洽，主体不被边缘挤","规范 20%：未裁掉主体关键部位、未过度重构"]}},"M04-K11":{"title":"机位高度","anchor":"是机位高度改变背景与心理","source":"参考：《摄影师的视界》 · 构图与视觉语言（按目录对应）","sections":[{"h":"为什么是这样","p":"平视（与主体眼高齐）中性亲和；低机位仰拍显高大、压迫、腿长，但易露下巴与鼻孔；高机位俯拍显弱小、可爱，能压缩背景为地面。机位还决定背景内容：蹲下能把背景换成天空，站高能换成地面。构图的目的不是好看，是可读。一张照片应该在两秒内让人明白看什么、为什么看。做到这点靠三件事：主体的位置与体量、主体与背景的对比（明暗、色彩、虚实）、视线与线条的引导方向。三分法解决的是别总放中间，但画面本身缺少对比时，放哪都不成立。先确保有对比，再谈位置。"},{"h":"操作路径","p":"今天的练习：同一人用蹲拍、平视、举高各拍一张。同一场景至少拍三种构图再走：中心对称、偏侧留白、低角度或高角度，每种都先把画面四边检查一遍。用四角扫视法：上、下、左、右依次看有没有杂物。移动一步往往比变焦更有效——换机位改变的是透视，变焦只改变裁切。拍完当场删掉明显废片，减少后期判断负担。"},{"h":"边界与代价","p":"典型翻车：全程站立平视，背景永远是杂乱中景。稳定与张力是一对取舍。对称、水平、居中都稳，但容易呆；对角、倾斜、切边都有张力，但容易乱。广角近拍有冲击力，代价是边缘拉伸与比例失真；长焦压缩背景好看，但会把前后景挤在一起，失去空间感。一组照片里所有画面同一构图，只能说明拍摄时没在看。"},{"h":"怎么判断到位","p":"今天的判据：是机位高度改变背景与心理。自检三问：两秒内能看出主体吗？三种方案里我是不是只试了一种？四边都扫过了吗？"}],"points":["是机位高度改变背景与心理","今天只验证这一个变量：能用高低机位改变权力关系与背景"],"pitfalls":["全程站立平视，背景永远是杂乱中景"],"quiz":[{"q":"「机位高度」的判断要点是什么？先说结论再谈理由。","a":"是机位高度改变背景与心理","why":"平视（与主体眼高齐）中性亲和"},{"q":"有人说：全程站立平视，背景永远是杂乱中景。这样对吗？","a":"不对。是机位高度改变背景与心理","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"同一人用蹲拍、平视、举高各拍一张｜同机位同焦段连拍，一次只改一个构图元素","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主体在预定视觉位、边缘无意外切割、地平线水平（每项 5 分制，任一不达标记 3 分以下）","表达 35%：视线与引导方向自洽，主体不被边缘挤","规范 20%：未裁掉主体关键部位、未过度重构"]}},"M04-K12":{"title":"透视与压缩","anchor":"是透视由距离决定，焦段只决定裁切","source":"参考：《摄影师的视界》 · 构图与视觉语言（按目录对应）","sections":[{"h":"为什么是这样","p":"透视由相机与主体的距离决定：近则前景大背景小、夸张；远则前后比例接近、压缩。换焦段只是裁切，配合走位才改变透视。想背景更近更大就后退换长焦；想前景更夸张就贴近用广角。八十五毫米显脸瘦，是因为站得远。构图的目的不是好看，是可读。一张照片应该在两秒内让人明白看什么、为什么看。做到这点靠三件事：主体的位置与体量、主体与背景的对比（明暗、色彩、虚实）、视线与线条的引导方向。三分法解决的是别总放中间，但画面本身缺少对比时，放哪都不成立。先确保有对比，再谈位置。"},{"h":"操作路径","p":"今天的练习：同一主体走近用广角与后退用长焦，保持主体同大。同一场景至少拍三种构图再走：中心对称、偏侧留白、低角度或高角度，每种都先把画面四边检查一遍。用四角扫视法：上、下、左、右依次看有没有杂物。移动一步往往比变焦更有效——换机位改变的是透视，变焦只改变裁切。拍完当场删掉明显废片，减少后期判断负担。"},{"h":"边界与代价","p":"典型翻车：以为换长焦能把背景拉近。稳定与张力是一对取舍。对称、水平、居中都稳，但容易呆；对角、倾斜、切边都有张力，但容易乱。广角近拍有冲击力，代价是边缘拉伸与比例失真；长焦压缩背景好看，但会把前后景挤在一起，失去空间感。一组照片里所有画面同一构图，只能说明拍摄时没在看。"},{"h":"怎么判断到位","p":"今天的判据：是透视由距离决定，焦段只决定裁切。自检三问：两秒内能看出主体吗？三种方案里我是不是只试了一种？四边都扫过了吗？"}],"points":["是透视由距离决定，焦段只决定裁切","今天只验证这一个变量：能用距离与焦段控制透视关系"],"pitfalls":["以为换长焦能把背景拉近"],"quiz":[{"q":"「透视与压缩」的判断要点是什么？先说结论再谈理由。","a":"是透视由距离决定，焦段只决定裁切","why":"透视由相机与主体的距离决定：近则前景大背景小、夸张"},{"q":"有人说：以为换长焦能把背景拉近。这样对吗？","a":"不对。是透视由距离决定，焦段只决定裁切","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"同一主体走近用广角与后退用长焦，保持主体同大｜同机位同焦段连拍，一次只改一个构图元素","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主体在预定视觉位、边缘无意外切割、地平线水平（每项 5 分制，任一不达标记 3 分以下）","表达 35%：视线与引导方向自洽，主体不被边缘挤","规范 20%：未裁掉主体关键部位、未过度重构"]}},"M04-K13":{"title":"视觉重量与平衡","anchor":"是重物靠中心轻物可远，不是左右对称才平衡","source":"参考：《摄影师的视界》 · 构图与视觉语言（按目录对应）","sections":[{"h":"为什么是这样","p":"视觉重量来自面积、明暗、色彩饱和、人物视线、文字。大而暗的物体最重，小而亮次之。平衡不等于对称：左侧一块重色，右侧一个亮点或人物也能平衡。判断方法是眯眼看画面，感觉往哪边倒就往另一边补。构图的目的不是好看，是可读。一张照片应该在两秒内让人明白看什么、为什么看。做到这点靠三件事：主体的位置与体量、主体与背景的对比（明暗、色彩、虚实）、视线与线条的引导方向。三分法解决的是别总放中间，但画面本身缺少对比时，放哪都不成立。先确保有对比，再谈位置。"},{"h":"操作路径","p":"今天的练习：拍一张左重右空的画面，再在右侧加小元素找回平衡。同一场景至少拍三种构图再走：中心对称、偏侧留白、低角度或高角度，每种都先把画面四边检查一遍。用四角扫视法：上、下、左、右依次看有没有杂物。移动一步往往比变焦更有效——换机位改变的是透视，变焦只改变裁切。拍完当场删掉明显废片，减少后期判断负担。"},{"h":"边界与代价","p":"典型翻车：主体全挤在一侧，画面失衡。稳定与张力是一对取舍。对称、水平、居中都稳，但容易呆；对角、倾斜、切边都有张力，但容易乱。广角近拍有冲击力，代价是边缘拉伸与比例失真；长焦压缩背景好看，但会把前后景挤在一起，失去空间感。一组照片里所有画面同一构图，只能说明拍摄时没在看。"},{"h":"怎么判断到位","p":"今天的判据：是重物靠中心轻物可远，不是左右对称才平衡。自检三问：两秒内能看出主体吗？三种方案里我是不是只试了一种？四边都扫过了吗？"}],"points":["是重物靠中心轻物可远，不是左右对称才平衡","今天只验证这一个变量：能判断画面左右上下的重量分配"],"pitfalls":["主体全挤在一侧，画面失衡"],"quiz":[{"q":"「视觉重量与平衡」的判断要点是什么？先说结论再谈理由。","a":"是重物靠中心轻物可远，不是左右对称才平衡","why":"视觉重量来自面积、明暗、色彩饱和、人物视线、文字"},{"q":"有人说：主体全挤在一侧，画面失衡。这样对吗？","a":"不对。是重物靠中心轻物可远，不是左右对称才平衡","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"拍一张左重右空的画面，再在右侧加小元素找回平衡｜同机位同焦段连拍，一次只改一个构图元素","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主体在预定视觉位、边缘无意外切割、地平线水平（每项 5 分制，任一不达标记 3 分以下）","表达 35%：视线与引导方向自洽，主体不被边缘挤","规范 20%：未裁掉主体关键部位、未过度重构"]}},"M04-K14":{"title":"边缘管理与裁切","anchor":"是边缘决定成败，不是中心对了就行","source":"参考：《摄影师的视界》 · 构图与视觉语言（按目录对应）","sections":[{"h":"为什么是这样","p":"边缘是最容易失分的地方：切手指、切脚踝、切头顶、背景电线穿过头部、亮块贴边抢视线。拍摄时先扫一遍四条边再看主体。裁切原则上不切关节（肘、膝、踝），人像留少量头顶空间，除非刻意紧裁。构图是把观看顺序强加给观者的技术。人眼在画面里寻找的第一样东西是高对比、高饱和、人脸与直线汇聚处，构图就是安排这些线索，让观者先看主体、再看陪体、最后离开画面或回到主体。三分法只是众多排布工具之一，它好用是因为把主体偏离中心能产生张力，但它不是法则。真正稳定画面的是层次：前景、中景、背景各司其职，以及画面四条边与四个角有没有被无意切断。"},{"h":"操作路径","p":"今天的练习：拍人像检查四肢与头顶是否被切，逐张修。构图练习必须同机位进行：架好机位、锁死焦段，一次只改一个元素——挪主体、换前景、压地平线、改留白方向，然后连拍一组并排对比。拍之前先做减法：画面里删掉所有与表达无关的东西，再考虑加。地平线与垂直线先校平，这是最廉价也最有效的品质提升。取景时把画面四个边扫一遍，检查有没有半截人手、半根电线杆、恰好压线的头部。留白不是空，是给视线留的呼吸区，方向要留给主体看向的那一侧。"},{"h":"边界与代价","p":"典型翻车：手指被切掉一截，脚被裁在关节上。构图的代价是自由度与信息量的冲突。极简画面干净，但可能空到没有内容；信息密集的画面丰富，但容易让主体淹没。对称构图稳，但缺张力；强对角动态足，但容易失衡。广角贴脸拍有冲击力，代价是边缘拉伸变形，人脸尤其明显。别把所有照片都套同一个模板——那说明你在套公式而不是在看。也别用后期大幅重构来弥补拍摄时的随意，裁切会损失分辨率并放大噪点。"},{"h":"怎么判断到位","p":"今天的判据：是边缘决定成败，不是中心对了就行。先问：观者第一眼会看哪里，那是不是我想让他看的？再问：画面四个边缘有没有意外切割，地平线平不平？最后问：如果只删掉一个元素，画面会更好吗？如果答案是「会」，说明减法还没做完。"}],"points":["是边缘决定成败，不是中心对了就行","今天只验证这一个变量：能避免边缘切割主体与意外闯入"],"pitfalls":["手指被切掉一截，脚被裁在关节上"],"quiz":[{"q":"「边缘管理与裁切」的判断要点是什么？先说结论再谈理由。","a":"是边缘决定成败，不是中心对了就行","why":"边缘是最容易失分的地方：切手指、切脚踝、切头顶、背景电线穿过头部、亮块贴边抢视线"},{"q":"有人说：手指被切掉一截，脚被裁在关节上。这样对吗？","a":"不对。是边缘决定成败，不是中心对了就行","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"拍人像检查四肢与头顶是否被切，逐张修｜同机位同焦段连拍，一次只改一个构图元素","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 45%：主体在预定视觉位、边缘无意外切割、地平线水平（每项 5 分制，任一不达标记 3 分以下）","表达 35%：视线与引导方向自洽，主体不被边缘挤","规范 20%：未裁掉主体关键部位、未过度重构"]}},"M05-K01":{"title":"白平衡与色温色调","anchor":"是白平衡定基准偏色是表达","source":"参考：《数字摄影基础教程》 · 色彩与后期（按目录对应）","sections":[{"h":"为什么是这样","p":"色温控制蓝黄、色调控制绿品红，共同决定白平衡。数值越低越偏蓝（3200K 适合白炽灯），越高越偏黄（6500K 阴天）。日出日落故意用高色温强化暖调，夜景用低色温压黄光。拍 RAW 可后期统一，拍 JPEG 要先设对。色彩管理是一条链：光源色温（拍）→ 白平衡与原始数据（存）→ 显示与软打样（看）→ 输出色彩空间（出）。任何一环错位，最后看到的颜色都不是真实的。白平衡的本质是告诉软件「什么颜色算白」，一旦定错，全图色偏且无法用单点校色完美救回。饱和度与明度是两件事：颜色发灰多半是明度不够而非饱和度不足，先提对比再谈饱和。同组照片的色彩一致性，比单张的惊艳更重要。"},{"h":"操作路径","p":"今天的练习：同场景用自动、日光、阴天、白炽灯各拍一张。拍摄环节优先拍 RAW，白平衡可以先自动但要留一张灰卡或白纸参照，后期一次性同步到同组。后期先定白平衡，再调曝光与对比，最后才碰饱和度与 HSL；顺序颠倒会让每次调整都推翻前一步。同一场景分别用自动白平衡与手动白平衡各拍一张，回看时会立刻明白相机的判断逻辑。导出前确认色彩空间：屏幕看用 sRGB，印刷才考虑 Adobe RGB，混用会导致色彩发灰或过艳。"},{"h":"边界与代价","p":"典型翻车：一组照片色温不一致。色彩最大的代价出现在「过度」。饱和拉满会溢出成色块，肤色一变就假，天空一拉就出断层。冷暖对比好看，但两张照片冷暖打架会让组照散架。混合光源下不要指望一个白平衡值解决全部，需要分区处理，而这会牺牲一致性。也要接受有些场景就是脏——阴天加雾霾加路灯，硬调成通透反而违背现场，纪实类尤其如此。"},{"h":"怎么判断到位","p":"今天的判据：是白平衡定基准偏色是表达。先问：这张的白平衡参照是什么，是相机猜的还是我定的？再问：肤色或已知中性色在画面里正常吗？最后问：把它和同组其他照片并排看，色彩是否是一个体系？色彩过关的标准是「成组一致、单张不脏」，而不是单张最艳。"}],"points":["是白平衡定基准偏色是表达","今天只验证这一个变量：能按场景设白平衡并知道何时故意偏色"],"pitfalls":["一组照片色温不一致"],"quiz":[{"q":"「白平衡与色温色调」的判断要点是什么？先说结论再谈理由。","a":"是白平衡定基准偏色是表达","why":"色温控制蓝黄、色调控制绿品红，共同决定白平衡"},{"q":"有人说：一组照片色温不一致。这样对吗？","a":"不对。是白平衡定基准偏色是表达","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"同场景用自动、日光、阴天、白炽灯各拍一张｜同一场景拍 RAW，白平衡分别设自动与手动各一张","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 50%：白平衡一致、肤色自然、无过饱和溢出（每项 5 分制，任一不达标记 3 分以下）","表达 30%：色调服务情绪，同组一致","规范 20%：色彩空间正确、未超出显示范围"]}},"M05-K02":{"title":"色彩三属性","anchor":"是饱和度不是越高越好","source":"参考：《数字摄影基础教程》 · 色彩与后期（按目录对应）","sections":[{"h":"为什么是这样","p":"色相、饱和度、明度三属性独立可控。全局提饱和会让肤色先崩，正确做法是用 HSL 只调特定色相；降低整体饱和再局部提亮主体色，比整体加饱和更高级。判断标准是肤色自然、暗部不脏、亮部不溢出。色彩管理是一条链：光源色温（拍）→ 白平衡与原始数据（存）→ 显示与软打样（看）→ 输出色彩空间（出）。任何一环错位，最后看到的颜色都不是真实的。白平衡的本质是告诉软件「什么颜色算白」，一旦定错，全图色偏且无法用单点校色完美救回。饱和度与明度是两件事：颜色发灰多半是明度不够而非饱和度不足，先提对比再谈饱和。同组照片的色彩一致性，比单张的惊艳更重要。"},{"h":"操作路径","p":"今天的练习：同一张图做低饱和、正常、高饱和三版比较。拍摄环节优先拍 RAW，白平衡可以先自动但要留一张灰卡或白纸参照，后期一次性同步到同组。后期先定白平衡，再调曝光与对比，最后才碰饱和度与 HSL；顺序颠倒会让每次调整都推翻前一步。同一场景分别用自动白平衡与手动白平衡各拍一张，回看时会立刻明白相机的判断逻辑。导出前确认色彩空间：屏幕看用 sRGB，印刷才考虑 Adobe RGB，混用会导致色彩发灰或过艳。"},{"h":"边界与代价","p":"典型翻车：全局拉饱和，肤色发橙发脏。色彩最大的代价出现在「过度」。饱和拉满会溢出成色块，肤色一变就假，天空一拉就出断层。冷暖对比好看，但两张照片冷暖打架会让组照散架。混合光源下不要指望一个白平衡值解决全部，需要分区处理，而这会牺牲一致性。也要接受有些场景就是脏——阴天加雾霾加路灯，硬调成通透反而违背现场，纪实类尤其如此。"},{"h":"怎么判断到位","p":"今天的判据：是饱和度不是越高越好。先问：这张的白平衡参照是什么，是相机猜的还是我定的？再问：肤色或已知中性色在画面里正常吗？最后问：把它和同组其他照片并排看，色彩是否是一个体系？色彩过关的标准是「成组一致、单张不脏」，而不是单张最艳。"}],"points":["是饱和度不是越高越好","今天只验证这一个变量：能分别控制明度、纯度与色相"],"pitfalls":["全局拉饱和，肤色发橙发脏"],"quiz":[{"q":"「色彩三属性」的判断要点是什么？先说结论再谈理由。","a":"是饱和度不是越高越好","why":"色相、饱和度、明度三属性独立可控"},{"q":"有人说：全局拉饱和，肤色发橙发脏。这样对吗？","a":"不对。是饱和度不是越高越好","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"同一张图做低饱和、正常、高饱和三版比较｜同一场景拍 RAW，白平衡分别设自动与手动各一张","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 50%：白平衡一致、肤色自然、无过饱和溢出（每项 5 分制，任一不达标记 3 分以下）","表达 30%：色调服务情绪，同组一致","规范 20%：色彩空间正确、未超出显示范围"]}},"M05-K03":{"title":"互补色与邻近色","anchor":"是互补出冲击邻近出和谐","source":"参考：《数字摄影基础教程》 · 色彩与后期（按目录对应）","sections":[{"h":"为什么是这样","p":"互补色（红青、蓝橙、黄紫）对比强、冲击大，蓝橙是影视最常用配色；邻近色和谐柔和。要点是主色占七成以上，辅助色与点缀色递减，颜色超过四种就难统一。后期可用色温与 HSL 把杂色往主色靠。色彩管理是一条链：光源色温（拍）→ 白平衡与原始数据（存）→ 显示与软打样（看）→ 输出色彩空间（出）。任何一环错位，最后看到的颜色都不是真实的。白平衡的本质是告诉软件「什么颜色算白」，一旦定错，全图色偏且无法用单点校色完美救回。饱和度与明度是两件事：颜色发灰多半是明度不够而非饱和度不足，先提对比再谈饱和。同组照片的色彩一致性，比单张的惊艳更重要。"},{"h":"操作路径","p":"今天的练习：拍一张互补色（蓝橙）与一张邻近色（绿青）对比。拍摄环节优先拍 RAW，白平衡可以先自动但要留一张灰卡或白纸参照，后期一次性同步到同组。后期先定白平衡，再调曝光与对比，最后才碰饱和度与 HSL；顺序颠倒会让每次调整都推翻前一步。同一场景分别用自动白平衡与手动白平衡各拍一张，回看时会立刻明白相机的判断逻辑。导出前确认色彩空间：屏幕看用 sRGB，印刷才考虑 Adobe RGB，混用会导致色彩发灰或过艳。"},{"h":"边界与代价","p":"典型翻车：画面五六种颜色，看不出主色。色彩最大的代价出现在「过度」。饱和拉满会溢出成色块，肤色一变就假，天空一拉就出断层。冷暖对比好看，但两张照片冷暖打架会让组照散架。混合光源下不要指望一个白平衡值解决全部，需要分区处理，而这会牺牲一致性。也要接受有些场景就是脏——阴天加雾霾加路灯，硬调成通透反而违背现场，纪实类尤其如此。"},{"h":"怎么判断到位","p":"今天的判据：是互补出冲击邻近出和谐。先问：这张的白平衡参照是什么，是相机猜的还是我定的？再问：肤色或已知中性色在画面里正常吗？最后问：把它和同组其他照片并排看，色彩是否是一个体系？色彩过关的标准是「成组一致、单张不脏」，而不是单张最艳。"}],"points":["是互补出冲击邻近出和谐","今天只验证这一个变量：能配色相环做对比或和谐"],"pitfalls":["画面五六种颜色，看不出主色"],"quiz":[{"q":"「互补色与邻近色」的判断要点是什么？先说结论再谈理由。","a":"是互补出冲击邻近出和谐","why":"互补色（红青、蓝橙、黄紫）对比强、冲击大，蓝橙是影视最常用配色"},{"q":"有人说：画面五六种颜色，看不出主色。这样对吗？","a":"不对。是互补出冲击邻近出和谐","why":"这是该点最典型的失败形态，见到就要停下检查。"}],"task_card":{"setup":"拍一张互补色（蓝橙）与一张邻近色（绿青）对比｜同一场景拍 RAW，白平衡分别设自动与手动各一张","deliverable":"成片 1–3 张（含 1 张故意失败对照）+ 一句话说明今天只改了哪个变量","rubric":["技术 50%：白平衡一致、肤色自然、无过饱和溢出（每项 5 分制，任一不达标记 3 分以下）","表达 30%：色调服务情绪，同组一致","规范 20%：色彩空间正确、未超出显示范围"]}},"M05-K04":{"title":"色彩管理与色彩空间","anchor":"是网络用 sRGB 印刷用广色域","source":"参考：《数字摄影基础教程》 · 色彩与后期（按目录对应）","sections":[{"h":"为什么是这样","p":"sRGB 是网络与多数屏幕的通用空间，AdobeRGB 色域更广适合印刷。若用广色域拍摄却在未转换时发网络，浏览器按 sRGB 解释，颜色会变灰变淡。流程是拍 RAW、在广色域里修、导出时按用途转 sRGB 或保留原空间并嵌入配置文件。色彩管理是一条链：光源色温（拍）→ 白平衡与原始数据（存）→ 显示与软打样（看）→ 输出色彩空间（出）。任何一环错位，最后看到的颜色都不是真实的。白平衡的本质是告诉软件「什么颜色算白」，一旦定错，全图色偏且无法用单点校色完美救回。饱和度与明
